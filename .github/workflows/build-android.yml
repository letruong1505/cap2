name: Build Android apk

on:
  workflow_dispatch:
  # Kiểm tra biên dịch khi sửa phần Android trên nhánh làm việc. Chỉ chạy tay (workflow_dispatch) mới đẩy apk lên R2.
  push:
    branches: [thpt-1-0-0]
    paths:
      - 'mobile/**'
      - 'tools/build-mobile-www.js'
      - 'renderer/**'
      - 'core/**'
      - 'tools/build-ota.js'
      - 'product/**'
      - '.github/workflows/build-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Kiểm tra cầu nối Android và bản quyền
        run: node --test tests/mobile-bridge.test.js tests/mobile-ota.test.js tests/license.test.js

      - name: Đặt số bản
        run: |
          echo "NL_VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "NL_VERSION_NAME=1.0.${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Gói giao diện và nội dung (www)
        run: node tools/build-mobile-www.js --version "$NL_VERSION_NAME" --version-code "$NL_VERSION_CODE" --commit "${GITHUB_SHA::7}"

      # Gói cập nhật nội dung (OTA): máy đã cài apk có trang khởi động OTA sẽ tự tải gói này, không cần cài lại apk.
      # Chỉ đổi phần Android gốc (icon, quyền, plugin) mới bắt buộc cài apk mới: khi đó nâng số trong mobile/ota-min-native.txt
      # lên số build của apk đó để các máy cũ chuyển sang đường "có bản apk mới".
      - name: Đóng gói cập nhật nội dung (OTA)
        id: ota
        env:
          OTA_PRIVATE_KEY_BASE64: ${{ secrets.OTA_PRIVATE_KEY_BASE64 }}
        run: |
          if [ -z "$OTA_PRIVATE_KEY_BASE64" ]; then
            echo "Chưa cấu hình OTA_PRIVATE_KEY_BASE64: không tạo gói cập nhật nội dung."
            echo "ota=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node tools/build-ota.js --www mobile/www --out "$RUNNER_TEMP/ota.nlo" --build "$NL_VERSION_CODE" --version "$NL_VERSION_NAME"
          echo "ota=true" >> "$GITHUB_OUTPUT"

      - name: Cài Capacitor và đồng bộ vào dự án Android
        working-directory: mobile
        run: |
          npm ci --no-audit --no-fund
          npx cap sync android

      - name: Giải mã khóa ký (nếu đã cấu hình)
        id: sign
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ] || [ -z "$KS_ALIAS" ]; then
            echo "Chưa cấu hình khóa ký: chỉ build bản thử (debug), không đẩy lên R2."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/nl-release.jks"
          echo "NL_KEYSTORE_PATH=$RUNNER_TEMP/nl-release.jks" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build apk
        working-directory: mobile/android
        env:
          NL_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          NL_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          NL_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ "${{ steps.sign.outputs.signed }}" = "true" ]; then
            ./gradlew --no-daemon assembleRelease
            cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/nam-linh-educenter.apk"
          else
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/nam-linh-educenter.apk"
          fi
          ls -la "$RUNNER_TEMP/nam-linh-educenter.apk"

      - name: Kiểm tra chữ ký apk
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$RUNNER_TEMP/nam-linh-educenter.apk" | head -5

      - name: Upload apk
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.sign.outputs.signed == 'true' && 'nam-linh-educenter-apk' || 'nam-linh-educenter-apk-thu-nghiem' }}
          path: ${{ runner.temp }}/nam-linh-educenter.apk

      - name: Publish apk to Cloudflare R2
        if: steps.sign.outputs.signed == 'true' && github.event_name == 'workflow_dispatch'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          if [ -z "$R2_BUCKET" ] || [ -z "$R2_ACCOUNT_ID" ]; then echo "Chưa cấu hình R2, bỏ qua bước đẩy apk."; exit 0; fi
          EP="https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com"
          # Thứ tự: gói OTA, apk, rồi latest.json sau cùng để máy khách không thấy bản mới khi tệp chưa lên đủ.
          OTA_BUILD=0
          if [ "${{ steps.ota.outputs.ota }}" = "true" ]; then
            aws s3 cp "$RUNNER_TEMP/ota.nlo" "s3://$R2_BUCKET/educenter-android/ota/$NL_VERSION_CODE.nlo" --endpoint-url "$EP" --content-type text/plain
            OTA_BUILD="$NL_VERSION_CODE"
          fi
          aws s3 cp "$RUNNER_TEMP/nam-linh-educenter.apk" "s3://$R2_BUCKET/educenter-android/nam-linh-educenter.apk" --endpoint-url "$EP" --content-type application/vnd.android.package-archive
          NOTES=$(awk '/^## Bản mới/{f=1;next} /^## /{f=0} f' CHANGELOG.md | sed 's/^[-*] *//' | sed '/^$/d' | head -8)
          NL_NOTES="$NOTES" NL_OTA_BUILD="$OTA_BUILD" NL_MIN_NATIVE="$(tr -dc '0-9' < mobile/ota-min-native.txt)" node -e '
            const e = process.env;
            process.stdout.write(JSON.stringify({ version: e.NL_VERSION_NAME, versionCode: Number(e.NL_VERSION_CODE), apk: "nam-linh-educenter.apk", commit: e.GITHUB_SHA.slice(0, 7), otaBuild: Number(e.NL_OTA_BUILD), minNative: Number(e.NL_MIN_NATIVE || 0), notes: e.NL_NOTES || "" }) + "\n");
          ' > latest.json
          cat latest.json
          aws s3 cp latest.json "s3://$R2_BUCKET/educenter-android/latest.json" --endpoint-url "$EP" --cache-control "no-cache" --content-type application/json
