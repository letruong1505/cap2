name: Build Windows test exe

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate content
        run: npm run validate

      - name: Install dependencies
        run: npm install

      - name: Write build info
        env:
          RUN_NUMBER: ${{ github.run_number }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          node -e "const fs=require('fs'); const info={version:'1.0.'+process.env.RUN_NUMBER, commit:process.env.COMMIT_SHA.slice(0,7)}; fs.writeFileSync('main/build-info.json', JSON.stringify(info)); console.log(JSON.stringify(info))"

      - name: Build portable exe
        run: npm run dist:win

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: vung-bai-exe
          path: dist/*.exe
