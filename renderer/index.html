<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
  <title>Vững Bài</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">Vững Bài <span class="sub">Toán 7 · Bản thử</span></div>
    <nav id="breadcrumb"></nav>
  </header>

  <main id="app">
    <section id="home" class="panel" hidden></section>

    <section id="lesson" class="panel" hidden>
      <button id="btn-back" class="link" type="button">← Danh mục bài học</button>
      <h1 id="lesson-title"></h1>
      <p class="meta" id="lesson-meta"></p>

      <h2>Lý thuyết</h2>
      <div id="theory"></div>

      <h2>Ví dụ mẫu</h2>
      <div id="examples"></div>

      <h2>Luyện tập</h2>
      <div id="score" class="score"></div>
      <div id="quiz"></div>
    </section>

    <section id="empty" class="panel">
      <p>Đang tải bài học…</p>
    </section>
  </main>

  <script src="../core/rational.js"></script>
  <script src="app.js"></script>
</body>
</html>
