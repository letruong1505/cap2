<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 299" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="360.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Vùng Đông Nam Bộ</text><rect x="14.0" y="44.0" width="221.3" height="233.5" rx="8" fill="#e8f1fa" stroke="#4e79a7" stroke-width="2"/><path d="M14.0,44.0 h0.0 v0.0 h-0.0 z" fill="#4e79a7" opacity="0"/><rect x="14.0" y="44.0" width="221.3" height="36.0" rx="8" fill="#4e79a7" stroke="#4e79a7" stroke-width="2"/><text x="124.7" y="67.0" text-anchor="middle" font-size="14" font-weight="bold" fill="white">Điều kiện</text><text x="26.0" y="102.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">• Diện tích khoảng 23,5 nghìn</text><text x="26.0" y="119.5" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">  km²</text><text x="26.0" y="141.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">• Địa hình thoải, đất badan và</text><text x="26.0" y="158.5" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">  đất xám</text><text x="26.0" y="180.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">• Thềm lục địa giàu dầu khí</text><text x="26.0" y="201.5" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">• Dân cư đông, lao động có trình</text><text x="26.0" y="219.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">  độ</text><rect x="249.3" y="44.0" width="221.3" height="233.5" rx="8" fill="#fdf1e0" stroke="#f28e2b" stroke-width="2"/><path d="M249.3,44.0 h0.0 v0.0 h-0.0 z" fill="#f28e2b" opacity="0"/><rect x="249.3" y="44.0" width="221.3" height="36.0" rx="8" fill="#f28e2b" stroke="#f28e2b" stroke-width="2"/><text x="360.0" y="67.0" text-anchor="middle" font-size="14" font-weight="bold" fill="white">Kinh tế</text><text x="261.3" y="102.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">• Phát triển nhất cả nước</text><text x="261.3" y="123.5" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">• Công nghiệp: dầu khí, điện,</text><text x="261.3" y="141.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">  điện tử, cơ khí, hoá chất, chế</text><text x="261.3" y="158.5" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">  biến thực phẩm</text><text x="261.3" y="180.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">• Cao su lớn nhất cả nước, điều,</text><text x="261.3" y="197.5" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">  hồ tiêu</text><text x="261.3" y="219.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">• TP Hồ Chí Minh: trung tâm kinh</text><text x="261.3" y="236.5" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">  tế, tài chính, thương mại lớn</text><text x="261.3" y="254.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">  nhất</text><rect x="484.7" y="44.0" width="221.3" height="233.5" rx="8" fill="#e6f0df" stroke="#59a14f" stroke-width="2"/><path d="M484.7,44.0 h0.0 v0.0 h-0.0 z" fill="#59a14f" opacity="0"/><rect x="484.7" y="44.0" width="221.3" height="36.0" rx="8" fill="#59a14f" stroke="#59a14f" stroke-width="2"/><text x="595.3" y="67.0" text-anchor="middle" font-size="14" font-weight="bold" fill="white">Vấn đề</text><text x="496.7" y="102.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">• Ô nhiễm môi trường</text><text x="496.7" y="123.5" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">• Ùn tắc giao thông</text><text x="496.7" y="145.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">• Sức ép dân số đô thị</text></svg>