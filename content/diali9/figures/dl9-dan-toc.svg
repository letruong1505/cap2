<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 228" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="320.0" y="24.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d2733">Dân tộc và cơ cấu dân số theo tuổi</text><text x="30.0" y="50.0" text-anchor="start" font-size="13" font-weight="bold" fill="#1d2733">Dân tộc</text><rect x="30.0" y="56.0" width="493.0" height="38.0" rx="0" fill="#dbe7f3" stroke="#4e79a7" stroke-width="2"/><text x="276.5" y="80.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Kinh ≈ 85%</text><rect x="523.0" y="56.0" width="87.0" height="38.0" rx="0" fill="#fde3c4" stroke="#f28e2b" stroke-width="2"/><text x="566.5" y="73.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">Dân tộc khác</text><text x="566.5" y="88.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">≈ 15%</text><text x="30.0" y="124.0" text-anchor="start" font-size="13" font-weight="bold" fill="#1d2733">Nhóm tuổi</text><rect x="30.0" y="130.0" width="386.9" height="38.0" rx="0" fill="#dfe9d5" stroke="#59a14f" stroke-width="2"/><text x="223.4" y="154.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">15 – 64 tuổi ≈ 2/3</text><rect x="416.9" y="130.0" width="193.1" height="38.0" rx="0" fill="#eef1f4" stroke="#9aa5b1" stroke-width="2"/><text x="513.4" y="154.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Dưới 15 và từ 65 tuổi ≈ 1/3</text><text x="320.0" y="220.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#55606d">Số liệu "khoảng"; phần còn lại tính bù theo tổng 100%.</text></svg>