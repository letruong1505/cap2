<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 304" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="360.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Vùng Trung du và miền núi phía Bắc</text><rect x="14.0" y="44.0" width="339.0" height="216.0" rx="8" fill="#e8f1fa" stroke="#4e79a7" stroke-width="2"/><path d="M14.0,44.0 h0.0 v0.0 h-0.0 z" fill="#4e79a7" opacity="0"/><rect x="14.0" y="44.0" width="339.0" height="36.0" rx="8" fill="#4e79a7" stroke="#4e79a7" stroke-width="2"/><text x="183.5" y="67.0" text-anchor="middle" font-size="14" font-weight="bold" fill="white">Thế mạnh</text><text x="26.0" y="102.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">• Khai thác khoáng sản (than Quảng Ninh, a-pa-tít</text><text x="26.0" y="119.5" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">  Lào Cai)</text><text x="26.0" y="141.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">• Thuỷ điện trên sông Đà (Hoà Bình, Sơn La, Lai</text><text x="26.0" y="158.5" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">  Châu)</text><text x="26.0" y="180.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">• Cây cận nhiệt và ôn đới (chè), dược liệu, rau</text><text x="26.0" y="197.5" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">  quả</text><text x="26.0" y="219.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">• Chăn nuôi trâu, bò; du lịch; kinh tế biển Quảng</text><text x="26.0" y="236.5" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">  Ninh</text><rect x="367.0" y="44.0" width="339.0" height="216.0" rx="8" fill="#fdf1e0" stroke="#f28e2b" stroke-width="2"/><path d="M367.0,44.0 h0.0 v0.0 h-0.0 z" fill="#f28e2b" opacity="0"/><rect x="367.0" y="44.0" width="339.0" height="36.0" rx="8" fill="#f28e2b" stroke="#f28e2b" stroke-width="2"/><text x="536.5" y="67.0" text-anchor="middle" font-size="14" font-weight="bold" fill="white">Dân cư và khó khăn</text><text x="379.0" y="102.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">• Dân cư thưa, nhiều dân tộc ít người</text><text x="379.0" y="123.5" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">• Địa hình hiểm trở</text><text x="379.0" y="145.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">• Rét đậm, rét hại, lũ quét</text><text x="379.0" y="166.5" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">• Cơ sở hạ tầng còn hạn chế</text><text x="360.0" y="284.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a56a0">Diện tích khoảng 95 nghìn km², lớn nhất cả nước; gồm Đông Bắc và Tây Bắc.</text></svg>