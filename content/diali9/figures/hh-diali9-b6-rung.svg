<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 228" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="320.0" y="24.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d2733">Rừng nước ta</text><text x="30.0" y="50.0" text-anchor="start" font-size="13" font-weight="bold" fill="#1d2733">Độ che phủ rừng (năm 2023)</text><rect x="30.0" y="56.0" width="243.6" height="38.0" rx="0" fill="#dfe9d5" stroke="#59a14f" stroke-width="2"/><text x="151.8" y="80.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Rừng ≈ 42%</text><rect x="273.6" y="56.0" width="336.4" height="38.0" rx="0" fill="#eef1f4" stroke="#9aa5b1" stroke-width="2"/><text x="441.8" y="80.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Diện tích khác ≈ 58%</text><text x="30.0" y="124.0" text-anchor="start" font-size="13" font-weight="bold" fill="#1d2733">Ba loại rừng</text><rect x="30.0" y="130.0" width="193.3" height="38.0" rx="0" fill="#dbe7f3" stroke="#4e79a7" stroke-width="2"/><text x="126.7" y="154.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Rừng đặc dụng</text><rect x="223.3" y="130.0" width="193.3" height="38.0" rx="0" fill="#fde3c4" stroke="#f28e2b" stroke-width="2"/><text x="320.0" y="154.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Rừng phòng hộ</text><rect x="416.7" y="130.0" width="193.3" height="38.0" rx="0" fill="#dfe9d5" stroke="#59a14f" stroke-width="2"/><text x="513.3" y="154.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Rừng sản xuất</text><text x="320.0" y="220.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#55606d">Vùng có diện tích rừng lớn: Tây Nguyên, Bắc Trung Bộ, Trung du và miền núi phía Bắc.</text></svg>