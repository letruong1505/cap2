<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 304" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="345.0" y="24.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d2733">Một số ngành công nghiệp và địa điểm tiêu biểu</text><rect x="20.0" y="44.0" width="650.0" height="34.0" rx="0" fill="#dbe7f3" stroke="#1d2733" stroke-width="1.5"/><text x="30.0" y="66.0" text-anchor="start" font-size="14" font-weight="bold" fill="#1d2733">Ngành</text><text x="280.0" y="66.0" text-anchor="start" font-size="14" font-weight="bold" fill="#1d2733">Địa điểm</text><rect x="20.0" y="78.0" width="650.0" height="34.0" rx="0" fill="#eef1f4" stroke="#9aa5b1" stroke-width="1"/><text x="30.0" y="100.0" text-anchor="start" font-size="13" font-weight="normal" fill="#1d2733">Khai thác than</text><text x="280.0" y="100.0" text-anchor="start" font-size="13" font-weight="normal" fill="#1d2733">Quảng Ninh</text><rect x="20.0" y="112.0" width="650.0" height="34.0" rx="0" fill="white" stroke="#9aa5b1" stroke-width="1"/><text x="30.0" y="134.0" text-anchor="start" font-size="13" font-weight="normal" fill="#1d2733">Khai thác dầu khí</text><text x="280.0" y="134.0" text-anchor="start" font-size="13" font-weight="normal" fill="#1d2733">Bà Rịa – Vũng Tàu (thềm lục địa phía nam)</text><rect x="20.0" y="146.0" width="650.0" height="34.0" rx="0" fill="#eef1f4" stroke="#9aa5b1" stroke-width="1"/><text x="30.0" y="168.0" text-anchor="start" font-size="13" font-weight="normal" fill="#1d2733">Thuỷ điện</text><text x="280.0" y="168.0" text-anchor="start" font-size="13" font-weight="normal" fill="#1d2733">Hoà Bình, Sơn La, Lai Châu…</text><rect x="20.0" y="180.0" width="650.0" height="34.0" rx="0" fill="white" stroke="#9aa5b1" stroke-width="1"/><text x="30.0" y="202.0" text-anchor