<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 222" font-family="Arial,sans-serif" font-size="12"><rect width="480" height="222" fill="#fff"/><text x="240.0" y="18" text-anchor="middle" font-weight="bold" font-size="13" fill="#222">Các giai đoạn của công cuộc Đổi mới</text><rect x="14" y="32" width="96" height="52" rx="6" fill="#2e8b57"/><text x="62" y="62.0" text-anchor="middle" fill="#fff" font-weight="bold" font-size="13">1986–1995</text><rect x="114" y="32" width="352" height="52" rx="6" fill="#f3f4f6"/><text x="124" y="53" fill="#111" font-weight="bold" font-size="11.5">Đại hội VI (12-1986): mở đầu Đổi mới toàn diện</text><text x="124" y="71" fill="#333" font-size="11">Trọng tâm đổi mới kinh tế, ba chương trình kinh tế lớn</text><rect x="14" y="92" width="96" height="52" rx="6" fill="#e08a1e"/><text x="62" y="122.0" text-anchor="middle" fill="#fff" font-weight="bold" font-size="13">1996–2006</text><rect x="114" y="92" width="352" height="52" rx="6" fill="#f3f4f6"/><text x="124" y="113" fill="#111" font-weight="bold" font-size="11.5">Đại hội VIII (1996): đẩy mạnh CNH, HĐH</text><text x="124" y="131" fill="#333" font-size="11">Kinh tế thị trường định hướng xã hội chủ nghĩa, hội nhập</text><rect x="14" y="152" width="96" height="52" rx="6" fill="#3b6fb6"/><text x="62" y="182.0" text-anchor="middle" fill="#fff" font-weight="bold" font-size="13">2006–nay</text><rect x="114" y="152" width="352" height="52" rx="6" fill="#f3f4f6"/><text x="124" y="173" fill="#111" font-weight="bold" font-size="11.5">Đại hội X (2006): đẩy mạnh toàn diện Đổi mới</text><text x="124" y="191" fill="#333" font-size="11">Hoàn thiện thể chế, hội nhập quốc tế toàn diện, sâu rộng</text></svg>