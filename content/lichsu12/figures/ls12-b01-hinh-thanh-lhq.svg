<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 236" font-family="Arial,sans-serif" font-size="12"><rect width="480" height="236" fill="#fff"/><text x="240.0" y="18" text-anchor="middle" font-weight="bold" font-size="13" fill="#222">Quá trình hình thành Liên hợp quốc (1942 – 1945)</text><line x1="14" y1="120" x2="466" y2="120" stroke="#555" stroke-width="3"/><polygon points="466,114 476,120 466,126" fill="#555"/><circle cx="36.0" cy="120" r="6" fill="#3b6fb6" stroke="#fff" stroke-width="2"/><line x1="36.0" y1="114" x2="36.0" y2="94" stroke="#3b6fb6" stroke-width="1.5"/><text x="52.0" y="64" text-anchor="middle" fill="#3b6fb6" font-weight="bold" font-size="11.5">1-1-1942</text><text x="52.0" y="77" text-anchor="middle" fill="#222" font-weight="normal" font-size="10.5">26 nước kí Tuyên</text><text x="52.0" y="90" text-anchor="middle" fill="#222" font-weight="normal" font-size="10.5">bố về Liên hợp quốc</text><circle cx="138.0" cy="120" r="6" fill="#c0392b" stroke="#fff" stroke-width="2"/><line x1="138.0" y1="126" x2="138.0" y2="144" stroke="#c0392b" stroke-width="1.5"/><text x="138.0" y="158" text-anchor="middle" fill="#c0392b" font-weight="bold" font-size="11.5">28-11 – 1-12-1943</text><text x="138.0" y="171" text-anchor="middle" fill="#222" font-weight="normal" font-size="10.5">Hội nghị</text><text x="138.0" y="184" text-anchor="middle" fill="#222" font-weight="normal" font-size="10.5">Tê-hê-ran</text><circle cx="240.0" cy="120" r="6" fill="#3b6fb6" stroke="#fff" stroke-width="2"/><line x1="240.0" y1="114" x2="240.0" y2="94" stroke="#3b6fb6" stroke-width="1.5"/><text x="240.0" y="64" text-anchor="middle" fill="#3b6fb6" font-weight="bold" font-size="11.5">2-1945</text><text x="240.0" y="77" text-anchor="middle" fill="#222" font-weight="normal" font-size="10.5">Hội nghị I-an-ta</text><text x="240.0" y="90" text-anchor="middle" fill="#222" font-weight="normal" font-size="10.5">quyết định thành lập</text><circle cx="342.0" cy="120" r="6" fill="#c0392b" stroke="#fff" stroke-width="2"/><line x1="342.0" y1="126" x2="342.0" y2="144" stroke="#c0392b" stroke-width="1.5"/><text x="342.0" y="158" text-anchor="middle" fill="#c0392b" font-weight="bold" font-size="11.5">25-4 – 26-6-1945</text><text x="342.0" y="171" text-anchor="middle" fill="#222" font-weight="normal" font-size="10.5">Hội nghị Xan Phran-xi-</text><text x="342.0" y="184" text-anchor="middle" fill="#222" font-weight="normal" font-size="10.5">xcô thông qua Hiến chương</text><circle cx="444.0" cy="120" r="6" fill="#3b6fb6" stroke="#fff" stroke-width="2"/><line x1="444.0" y1="114" x2="444.0" y2="94" stroke="#3b6fb6" stroke-width="1.5"/><text x="428.0" y="64" text-anchor="middle" fill="#3b6fb6" font-weight="bold" font-size="11.5">24-10-1945</text><text x="428.0" y="77" text-anchor="middle" fill="#222" font-weight="normal" font-size="10.5">Liên hợp quốc thành lập</text><text x="428.0" y="90" text-anchor="middle" fill="#222" font-weight="normal" font-size="10.5">(51 nước thành viên)</text></svg>