<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 276" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="380.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Phản ứng của hợp chất carbonyl</text><rect x="300.0" y="44.0" width="160.0" height="40.0" rx="8" fill="#dfe9d5" stroke="#1d2733" stroke-width="2"/><text x="380.0" y="69.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2733">&gt;C=O</text><rect x="20.0" y="118.0" width="230.0" height="58.0" rx="8" fill="#fbf0c9" stroke="#1d2733" stroke-width="2"/><text x="135.0" y="136.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#1d2733">Khử [H] (NaBH₄):</text><text x="135.0" y="150.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#1d2733">aldehyde → alcohol I</text><text x="135.0" y="164.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#1d2733">ketone → alcohol II</text><rect x="275.0" y="118.0" width="230.0" height="58.0" rx="8" fill="#dbe7f3" stroke="#1d2733" stroke-width="2"/><text x="390.0" y="143.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#1d2733">Cộng HCN</text><text x="390.0" y="157.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#1d2733">→ cyanohydrin</text><rect x="530.0" y="118.0" width="230.0" height="58.0" rx="8" fill="#f7d4d4" stroke="#1d2733" stroke-width="2"/><text x="645.0" y="143.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#1d2733">Chỉ aldehyde: Br₂, Tollens (Ag↓),</text><text x="645.0" y="157.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#1d2733">Cu(OH)₂ (Cu₂O đỏ gạch)</text><rect x="20.0" y="196.0" width="230.0" height="58.0" rx="8" fill="#cfe8c2" stroke="#1d2733" stroke-width="2"/><text x="135.0" y="221.0" text-anchor=