<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 256" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="380.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Phân loại hợp chất hữu cơ</text><rect x="280.0" y="44.0" width="200.0" height="40.0" rx="8" fill="#dfe9d5" stroke="#1d2733" stroke-width="2"/><text x="380.0" y="69.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2733">Hợp chất hữu cơ</text><line x1="340.0" y1="86.0" x2="190.0" y2="120.0" stroke="#1d2733" stroke-width="2.4" marker-end="url(#ar)"/><line x1="420.0" y1="86.0" x2="580.0" y2="120.0" stroke="#1d2733" stroke-width="2.4" marker-end="url(#ar)"/><rect x="40.0" y="122.0" width="300.0" height="44.0" rx="8" fill="#fbf0c9" stroke="#1d2733" stroke-width="2"/><text x="190.0" y="149.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Hydrocarbon (chỉ C và H)</text><rect x="420.0" y="122.0" width="300.0" height="44.0" rx="8" fill="#f7d4d4" stroke="#1d2733" stroke-width="2"/><text x="570.0" y="149.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Dẫn xuất của hydrocarbon</text><text x="190.0" y="196.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">CH₄, CH₂=CH₂, CH≡CH, C₆H₆</text><text x="570.0" y="196.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">CH₃Cl, C₂H₅OH, CH₃COOH, CH₃NH₂...</text><text x="380.0" y="238.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#3b4856" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Dẫn xuất: thay H bằng nguyên tử hoặc nhóm