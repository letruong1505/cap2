<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 176" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="380.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Hai phản ứng của dẫn xuất halogen</text><rect x="20.0" y="60.0" width="200.0" height="44.0" rx="8" fill="#fbf0c9" stroke="#1d2733" stroke-width="2"/><text x="120.0" y="87.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2733">R–X</text><line x1="222.0" y1="70.0" x2="300.0" y2="52.0" stroke="#1d2733" stroke-width="2.4" marker-end="url(#ar)"/><line x1="222.0" y1="96.0" x2="300.0" y2="118.0" stroke="#1d2733" stroke-width="2.4" marker-end="url(#ar)"/><rect x="302.0" y="28.0" width="440.0" height="52.0" rx="8" fill="#dbe7f3" stroke="#1d2733" stroke-width="2"/><text x="522.0" y="49.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">Thế: R–X + NaOH → R–OH + NaX</text><text x="522.0" y="64.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">(nước, đun nóng) tạo alcohol</text><rect x="302.0" y="96.0" width="440.0" height="60.0" rx="8" fill="#cfe8c2" stroke="#1d2733" stroke-width="2"/><text x="522.0" y="121.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">Tách HX: NaOH/C₂H₅OH, t° → alkene</text><text x="522.0" y="136.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">Zaitsev: tách H ở C bên cạnh bậc cao hơn</text></svg>