<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 316" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="380.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Phản ứng của benzene và toluene</text><rect x="15.0" y="50.0" width="160.0" height="48.0" rx="8" fill="#fbf0c9" stroke="#1d2733" stroke-width="2"/><text x="95.0" y="79.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Halogen hoá</text><rect x="180.0" y="50.0" width="565.0" height="48.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="192.0" y="80.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">C₆H₆ + Br₂ → C₆H₅Br + HBr (xúc tác FeBr₃)</text><rect x="15.0" y="110.0" width="160.0" height="48.0" rx="8" fill="#dbe7f3" stroke="#1d2733" stroke-width="2"/><text x="95.0" y="139.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Nitro hoá</text><rect x="180.0" y="110.0" width="565.0" height="48.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="192.0" y="140.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">C₆H₆ + HNO₃ đặc → C₆H₅NO₂ + H₂O (H₂SO₄ đặc)</text><rect x="15.0" y="170.0" width="160.0" height="48.0" rx="8" fill="#cfe8c2" stroke="#1d2733" stroke-width="2"/><text x="95.0" y="199.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Cộng H₂</text><rect x="180.0" y="170.0" width="565.0" height="48.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="192.0" y="200.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">C₆H₆ + 3H₂ → C₆H₁₂ (Ni, t°, p)</text><rect x="15.0" y="230.0" width="160.0" height="48.0" rx="8" fill="#f7d4d4" stroke="#1d2733" stroke-width="2"/><text x="95.0" y="259.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Oxi hoá nhóm alkyl</text><rect x="180.0" y="230.0" width="565.0" height="48.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="192.0" y="260.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">C₆H₅CH₃ + KMnO₄ → C₆H₅COOK (đun nóng)</text><text x="380.0" y="300.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#3b4856" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Nhóm alkyl hoạt hoá vòng: thế ưu tiên ở vị trí ortho và para; benzene không làm mất màu KMnO₄</text></svg>