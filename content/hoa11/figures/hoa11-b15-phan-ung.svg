<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 298" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="380.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Các phản ứng của alkane</text><rect x="15.0" y="50.0" width="160.0" height="48.0" rx="8" fill="#fbf0c9" stroke="#1d2733" stroke-width="2"/><text x="95.0" y="79.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Thế halogen</text><rect x="180.0" y="50.0" width="565.0" height="48.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="192.0" y="80.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">CH₄ + Cl₂ → CH₃Cl + HCl (ánh sáng hoặc đun nóng)</text><rect x="15.0" y="110.0" width="160.0" height="48.0" rx="8" fill="#dbe7f3" stroke="#1d2733" stroke-width="2"/><text x="95.0" y="139.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Cracking</text><rect x="180.0" y="110.0" width="565.0" height="48.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="192.0" y="140.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">alkane mạch dài → alkane ngắn + alkene (nhiệt độ cao, xúc tác)</text><rect x="15.0" y="170.0" width="160.0" height="48.0" rx="8" fill="#cfe8c2" stroke="#1d2733" stroke-width="2"/><text x="95.0" y="199.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Reforming</text><rect x="180.0" y="170.0" width="565.0" height="48.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="192.0" y="200.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">alkane thẳng → alkane nhánh, arene (không đổi số C)</text><rect x="15.0" y="230.0" width="160.0" height="48.0" rx="8" fill="#f7d4d4" stroke="#1d2733" stroke-width="2"/><text x="95.0" y="259.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Cháy</text><rect x="180.0" y="230.0" width="565.0" height="48.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="192.0" y="260.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">CₙH₂ₙ₊₂ + (3n+1)/2 O₂ → nCO₂ + (n+1)H₂O, toả nhiều nhiệt</text></svg>