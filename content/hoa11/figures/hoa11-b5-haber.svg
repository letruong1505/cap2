<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="380.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Điều kiện tổng hợp ammonia: N₂ + 3H₂ ⇌ 2NH₃, ΔH = −91,8 kJ</text><rect x="15.0" y="52.0" width="280.0" height="50.0" rx="8" fill="#dbe7f3" stroke="#1d2733" stroke-width="2"/><text x="155.0" y="82.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">Áp suất cao (150–200 bar)</text><line x1="297.0" y1="77.0" x2="327.0" y2="77.0" stroke="#1d2733" stroke-width="2" marker-end="url(#ar)"/><rect x="330.0" y="52.0" width="415.0" height="50.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="342.0" y="83.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">chiều thuận giảm số mol khí (4 → 2)</text><rect x="15.0" y="114.0" width="280.0" height="50.0" rx="8" fill="#f7d4d4" stroke="#1d2733" stroke-width="2"/><text x="155.0" y="144.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">Nhiệt độ vừa phải (400–450 °C)</text><line x1="297.0" y1="139.0" x2="327.0" y2="139.0" stroke="#1d2733" stroke-width="2" marker-end="url(#ar)"/><rect x="330.0" y="114.0" width="415.0" height="50.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="342.0" y="145.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">phản ứng toả nhiệt nhưng cần đủ nhanh</text><rect x="15.0" y="176.0" width="280.0" height="50.0" rx="8" fill="#fbf0c9" stroke="#1d2733" stroke-width="2"/><text x="155.0" y="206.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">Xúc tác Fe</text><line x1="297.0" y1="201.0" x2="327.0" y2="201.0" stroke="#1d2733" stroke-width="2" marker-end="url(#ar)"/><rect x="330.0" y="176.0" width="415.0" height="50.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="342.0" y="207.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">tăng tốc độ, rút ngắn thời gian đạt cân bằng</text><rect x="15.0" y="238.0" width="280.0" height="50.0" rx="8" fill="#cfe8c2" stroke="#1d2733" stroke-width="2"/><text x="155.0" y="268.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">Lấy NH₃ ra liên tục</text><line x1="297.0" y1="263.0" x2="327.0" y2="263.0" stroke="#1d2733" stroke-width="2" marker-end="url(#ar)"/><rect x="330.0" y="238.0" width="415.0" height="50.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="342.0" y="269.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">giảm [NH₃], cân bằng chuyển theo chiều thuận</text></svg>