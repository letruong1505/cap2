<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 196" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="380.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Đồng phân và đồng đẳng</text><rect x="30.0" y="50.0" width="330.0" height="40.0" rx="8" fill="#fbf0c9" stroke="#1d2733" stroke-width="2"/><text x="195.0" y="75.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Đồng phân: cùng CTPT, khác cấu tạo</text><rect x="400.0" y="50.0" width="330.0" height="40.0" rx="8" fill="#dbe7f3" stroke="#1d2733" stroke-width="2"/><text x="565.0" y="75.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Đồng đẳng: hơn kém nhau n nhóm CH₂</text><text x="195.0" y="120.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">C₂H₆O: C₂H₅OH (alcohol) và CH₃OCH₃ (ether)</text><text x="195.0" y="146.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">C₄H₁₀: CH₃CH₂CH₂CH₃ và CH₃CH(CH₃)CH₃</text><text x="195.0" y="172.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#3b4856" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">khác tính chất vật lí và hoá học</text><text x="565.0" y="120.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">CH₄, C₂H₆, C₃H₈ (alkane CₙH₂ₙ₊₂)</text><text x="565.0" y="146.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">CH₃OH, C₂H₅OH, C₃H₇OH</text><text x="565.0" y="172.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#3b4856" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">tính chất hoá học tương tự nhau</text></svg>