<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="380.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Các bước kết tinh</text><rect x="15.0" y="60.0" width="165.0" height="100.0" rx="8" fill="#fbf0c9" stroke="#1d2733" stroke-width="2"/><text x="97.5" y="98.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">Bước 1</text><text x="97.5" y="113.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">Hoà tan trong</text><text x="97.5" y="128.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">dung môi nóng</text><line x1="182.0" y1="110.0" x2="198.0" y2="110.0" stroke="#1d2733" stroke-width="2.4" marker-end="url(#ar)"/><rect x="200.0" y="60.0" width="165.0" height="100.0" rx="8" fill="#dbe7f3" stroke="#1d2733" stroke-width="2"/><text x="282.5" y="98.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">Bước 2</text><text x="282.5" y="113.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">Lọc nóng bỏ</text><text x="282.5" y="128.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">chất không tan</text><line x1="367.0" y1="110.0" x2="383.0" y2="110.0" stroke="#1d2733" stroke-width="2.4" marker-end="url(#ar)"/><rect x="385.0" y="60.0" width="165.0" height="100.0" rx="8" fill="#cfe8c2" stroke="#1d2733" stroke-width="2"/><text x="467.5" y="98.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">Bước 3</text><text x="467.5" y="113.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">Để nguội, làm lạnh:</text><text x="467.5" y="128.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">chất kết tinh</text><line x1="552.0" y1="110.0" x2="568.0" y2="110.0" stroke="#1d2733" stroke-width="2.4" marker-end="url(#ar)"/><rect x="570.0" y="60.0" width="165.0" height="100.0" rx="8" fill="#f7d4d4" stroke="#1d2733" stroke-width="2"/><text x="652.5" y="98.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">Bước 4</text><text x="652.5" y="113.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">Lọc lấy</text><text x="652.5" y="128.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">tinh thể</text><text x="380.0" y="200.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#3b4856" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Dung môi: hoà tan tốt chất cần tinh chế khi nóng, kém khi lạnh</text></svg>