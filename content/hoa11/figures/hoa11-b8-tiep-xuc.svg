<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="380.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Sản xuất sulfuric acid bằng phương pháp tiếp xúc</text><rect x="15.0" y="50.0" width="150.0" height="58.0" rx="8" fill="#fbf0c9" stroke="#1d2733" stroke-width="2"/><text x="90.0" y="84.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2733">Giai đoạn 1</text><rect x="170.0" y="50.0" width="575.0" height="58.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="182.0" y="85.0" text-anchor="start" font-size="13" font-weight="normal" fill="#1d2733">S + O₂ → SO₂ hoặc 4FeS₂ + 11O₂ → 2Fe₂O₃ + 8SO₂</text><line x1="90.0" y1="110.0" x2="90.0" y2="126.0" stroke="#1d2733" stroke-width="2" marker-end="url(#ar)"/><rect x="15.0" y="128.0" width="150.0" height="58.0" rx="8" fill="#dbe7f3" stroke="#1d2733" stroke-width="2"/><text x="90.0" y="162.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2733">Giai đoạn 2</text><rect x="170.0" y="128.0" width="575.0" height="58.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="182.0" y="163.0" text-anchor="start" font-size="13" font-weight="normal" fill="#1d2733">2SO₂ + O₂ ⇌ 2SO₃ (450 °C, xúc tác V₂O₅)</text><line x1="90.0" y1="188.0" x2="90.0" y2="204.0" stroke="#1d2733" stroke-width="2" marker-end="url(#ar)"/><rect x="15.0" y="206.0" width="150.0" height="58.0" rx="8" fill="#cfe8c2" stroke="#1d2733" stroke-width="2"/><text x="90.0" y="240.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2733">Giai đoạn 3</text><rect x="170.0" y="206.0" width="575.0" height="58.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="182.0" y="241.0" text-anchor="start" font-size="13" font-weight="normal" fill="#1d2733">SO₃ + H₂SO₄ đặc → oleum; pha loãng oleum thành H₂SO₄</text></svg>