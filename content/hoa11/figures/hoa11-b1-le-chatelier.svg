<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 326" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="380.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Nguyên lí Le Chatelier: cân bằng chống lại tác động</text><rect x="15.0" y="50.0" width="250.0" height="44.0" rx="8" fill="#fbf0c9" stroke="#1d2733" stroke-width="2"/><text x="140.0" y="77.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Tăng nồng độ một chất</text><line x1="267.0" y1="72.0" x2="297.0" y2="72.0" stroke="#1d2733" stroke-width="2" marker-end="url(#ar)"/><rect x="300.0" y="50.0" width="445.0" height="44.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="312.0" y="77.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">chuyển dịch theo chiều làm giảm nồng độ chất đó</text><rect x="15.0" y="104.0" width="250.0" height="44.0" rx="8" fill="#f7d4d4" stroke="#1d2733" stroke-width="2"/><text x="140.0" y="131.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Tăng nhiệt độ</text><line x1="267.0" y1="126.0" x2="297.0" y2="126.0" stroke="#1d2733" stroke-width="2" marker-end="url(#ar)"/><rect x="300.0" y="104.0" width="445.0" height="44.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="312.0" y="131.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">chuyển dịch theo chiều thu nhiệt (ΔH &gt; 0)</text><rect x="15.0" y="158.0" width="250.0" height="44.0" rx="8" fill="#dbe7f3" stroke="#1d2733" stroke-width="2"/><text x="140.0" y="185.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Giảm nhiệt độ</text><line x1="267.0" y1="180.0" x2="297.0" y2="180.0" stroke="#1d2733" stroke-width="2" marker-end="url(#ar)"/><rect x="300.0" y="158.0" width="445.0" height="44.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="312.0" y="185.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">chuyển dịch theo chiều toả nhiệt (ΔH &lt; 0)</text><rect x="15.0" y="212.0" width="250.0" height="44.0" rx="8" fill="#cfe8c2" stroke="#1d2733" stroke-width="2"/><text x="140.0" y="239.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Tăng áp suất</text><line x1="267.0" y1="234.0" x2="297.0" y2="234.0" stroke="#1d2733" stroke-width="2" marker-end="url(#ar)"/><rect x="300.0" y="212.0" width="445.0" height="44.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="312.0" y="239.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">chuyển dịch theo chiều giảm số mol khí</text><rect x="15.0" y="266.0" width="250.0" height="44.0" rx="8" fill="#eef1f4" stroke="#1d2733" stroke-width="2"/><text x="140.0" y="293.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Chất xúc tác</text><line x1="267.0" y1="288.0" x2="297.0" y2="288.0" stroke="#1d2733" stroke-width="2" marker-end="url(#ar)"/><rect x="300.0" y="266.0" width="445.0" height="44.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="312.0" y="293.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">không làm chuyển dịch, chỉ rút ngắn thời gian đạt cân bằng</text></svg>