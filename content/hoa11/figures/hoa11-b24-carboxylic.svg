<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 206" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="380.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Carboxylic acid: nhóm –COOH và liên kết hydrogen</text><rect x="20.0" y="56.0" width="330.0" height="60.0" rx="8" fill="#fbf0c9" stroke="#1d2733" stroke-width="2"/><text x="185.0" y="81.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">R–COOH</text><text x="185.0" y="96.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">O–H phân cực mạnh (nhóm C=O hút e)</text><rect x="400.0" y="56.0" width="340.0" height="60.0" rx="8" fill="#dbe7f3" stroke="#1d2733" stroke-width="2"/><text x="570.0" y="81.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">Dimer qua 2 liên kết hydrogen</text><text x="570.0" y="96.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">→ t° sôi cao hơn alcohol, aldehyde</text><rect x="20.0" y="140.0" width="240.0" height="52.0" rx="8" fill="#f7d4d4" stroke="#1d2733" stroke-width="2"/><text x="140.0" y="162.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#1d2733">Làm quỳ tím</text><text x="140.0" y="176.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#1d2733">hoá đỏ nhạt</text><rect x="270.0" y="140.0" width="240.0" height="52.0" rx="8" fill="#cfe8c2" stroke="#1d2733" stroke-width="2"/><text x="390.0" y="162.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#1d2733">Tác dụng kim loại, oxide base,</text><text x="390.0" y="176.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#1d2733">base, muối carbonate</text><rect x="520.0" y="140.0" width="240.0" height="52.0" rx="8" fill="#eef1f4" stroke="#1d2733" stroke-width="2"/><text x="640.0" y="162.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#1d2733">Ester hoá với alcohol</text><text x="640.0" y="176.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#1d2733">(H₂SO₄ đặc, thuận nghịch)</text></svg>