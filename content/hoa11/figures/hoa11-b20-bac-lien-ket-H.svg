<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 192" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="380.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Bậc của alcohol và liên kết hydrogen</text><rect x="15.0" y="50.0" width="158.0" height="36.0" rx="8" fill="#fbf0c9" stroke="#1d2733" stroke-width="2"/><text x="94.0" y="73.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2733">Bậc I</text><rect x="15.0" y="90.0" width="158.0" height="56.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="94.0" y="112.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">R–CH₂–OH</text><text x="94.0" y="134.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#3b4856" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">CH₃CH₂OH</text><rect x="185.0" y="50.0" width="158.0" height="36.0" rx="8" fill="#dbe7f3" stroke="#1d2733" stroke-width="2"/><text x="264.0" y="73.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2733">Bậc II</text><rect x="185.0" y="90.0" width="158.0" height="56.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="264.0" y="112.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">R–CH(OH)–R′</text><text x="264.0" y="134.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#3b4856" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">CH₃CH(OH)CH₃</text><rect x="355.0" y="50.0" width="158.0" height="36.0" rx="8" fill="#f7d4d4" stroke="#1d2733" stroke-width="2"/><text x="434.0" y="7