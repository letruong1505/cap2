<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 198" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="380.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Quy tắc Markovnikov: H cộng vào C nhiều H hơn</text><rect x="30.0" y="70.0" width="190.0" height="44.0" rx="8" fill="#fbf0c9" stroke="#1d2733" stroke-width="2"/><text x="125.0" y="97.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">CH₃–CH=CH₂ + HBr</text><line x1="222.0" y1="92.0" x2="300.0" y2="60.0" stroke="#1d2733" stroke-width="2.4" marker-end="url(#ar)"/><line x1="222.0" y1="92.0" x2="300.0" y2="130.0" stroke="#1d2733" stroke-width="2.4" marker-end="url(#ar)"/><rect x="302.0" y="36.0" width="280.0" height="44.0" rx="8" fill="#cfe8c2" stroke="#1d2733" stroke-width="2"/><text x="442.0" y="63.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">CH₃–CHBr–CH₃ (sản phẩm chính)</text><rect x="302.0" y="108.0" width="280.0" height="44.0" rx="8" fill="#eef1f4" stroke="#1d2733" stroke-width="2"/><text x="442.0" y="135.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">CH₃–CH₂–CH₂Br (sản phẩm phụ)</text><text x="380.0" y="180.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#3b4856" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">H gắn vào C có nhiều H hơn (CH₂=), Br gắn vào C có ít H hơn (–CH=)</text></svg>