<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 182" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="380.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Phenol: ảnh hưởng qua lại giữa –OH và vòng benzene</text><rect x="20.0" y="60.0" width="220.0" height="60.0" rx="8" fill="#fbf0c9" stroke="#1d2733" stroke-width="2"/><text x="130.0" y="85.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">C₆H₅OH</text><text x="130.0" y="100.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">liên kết O–H phân cực mạnh</text><line x1="242.0" y1="80.0" x2="300.0" y2="56.0" stroke="#1d2733" stroke-width="2.4" marker-end="url(#ar)"/><line x1="242.0" y1="100.0" x2="300.0" y2="128.0" stroke="#1d2733" stroke-width="2.4" marker-end="url(#ar)"/><rect x="302.0" y="28.0" width="440.0" height="56.0" rx="8" fill="#dbe7f3" stroke="#1d2733" stroke-width="2"/><text x="522.0" y="51.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">Tính acid yếu: + NaOH → C₆H₅ONa + H₂O</text><text x="522.0" y="66.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">(không đổi màu quỳ; yếu hơn H₂CO₃)</text><rect x="302.0" y="100.0" width="440.0" height="62.0" rx="8" fill="#cfe8c2" stroke="#1d2733" stroke-width="2"/><text x="522.0" y="126.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">Thế vòng dễ hơn benzene (ortho, para):</text><text x="522.0" y="141.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">+ 3Br₂ (nước) → 2,4,6-tribromophenol ↓ trắng</text></svg>