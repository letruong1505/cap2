<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 194" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="380.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Aldehyde và ketone: nhóm carbonyl C=O</text><rect x="30.0" y="56.0" width="340.0" height="50.0" rx="8" fill="#fbf0c9" stroke="#1d2733" stroke-width="2"/><text x="200.0" y="86.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Aldehyde: R–CHO (CH₃CHO, HCHO)</text><rect x="390.0" y="56.0" width="340.0" height="50.0" rx="8" fill="#dbe7f3" stroke="#1d2733" stroke-width="2"/><text x="560.0" y="86.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Ketone: R–CO–R′ (CH₃COCH₃)</text><text x="200.0" y="136.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">tên: alkane bỏ e + "al" (ethanal, propanal)</text><text x="560.0" y="136.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">tên: alkane bỏ e + vị trí + "one" (propanone)</text><text x="380.0" y="176.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#3b4856" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">C=O phân cực (Cδ⁺ = Oδ⁻) → t° sôi cao hơn hydrocarbon; mạch ngắn tan tốt trong nước</text></svg>