<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 278" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="380.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Các phản ứng của alcohol</text><rect x="300.0" y="48.0" width="160.0" height="44.0" rx="8" fill="#fbf0c9" stroke="#1d2733" stroke-width="2"/><text x="380.0" y="75.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2733">R–CH₂–OH</text><rect x="20.0" y="120.0" width="220.0" height="48.0" rx="8" fill="#dbe7f3" stroke="#1d2733" stroke-width="2"/><text x="130.0" y="149.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#1d2733">Na → RONa + ½H₂</text><rect x="280.0" y="120.0" width="220.0" height="48.0" rx="8" fill="#dfe9d5" stroke="#1d2733" stroke-width="2"/><text x="390.0" y="149.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#1d2733">H₂SO₄ đặc, 140 °C → ROR (ether)</text><rect x="540.0" y="120.0" width="220.0" height="48.0" rx="8" fill="#f7d4d4" stroke="#1d2733" stroke-width="2"/><text x="650.0" y="149.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#1d2733">H₂SO₄ đặc, 170 °C → alkene</text><rect x="20.0" y="190.0" width="220.0" height="48.0" rx="8" fill="#cfe8c2" stroke="#1d2733" stroke-width="2"/><text x="130.0" y="219.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#1d2733">CuO, t°: bậc I → aldehyde</text><rect x="280.0" y="190.0" width="220.0" height="48.0" rx="8" fill="#fbf0c9" stroke="#1d2733" stroke-width="2"/><text x="390.0" y="219.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#1d2733">CuO, t°: bậc II → ketone</text><rect x="540.0" y="190.0" width="220.0" height="48.0" rx="8" fill="#eef1f4" stroke="#1d2733" stroke-width="2"/><text x="650.0" y="219.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#1d2733">O₂ → CO₂ + H₂O (cháy)</text><line x1="380.0" y1="94.0" x2="130.0" y2="118.0" stroke="#1d2733" stroke-width="1.6" marker-end="url(#ar)"/><line x1="380.0" y1="94.0" x2="390.0" y2="118.0" stroke="#1d2733" stroke-width="1.6" marker-end="url(#ar)"/><line x1="380.0" y1="94.0" x2="650.0" y2="118.0" stroke="#1d2733" stroke-width="1.6" marker-end="url(#ar)"/><text x="380.0" y="262.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#3b4856" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Polyalcohol có –OH liền kề (glycerol) + Cu(OH)₂ → dung dịch xanh lam</text></svg>