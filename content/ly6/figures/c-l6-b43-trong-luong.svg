<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 362" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="360.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Vật khối lượng 6 kg: trên Trái Đất và trên Mặt Trăng</text><path d="M70.0,340.0 A170,170 0 0 1 310.0,340.0 Z" fill="#4e9be0" stroke="#1d2733" stroke-width="2.4"/><circle cx="190.0" cy="118.0" r="16.0" fill="#f7c58a" stroke="#1d2733" stroke-width="2.2"/><line x1="190.0" y1="118.0" x2="190.0" y2="268.0" stroke="#e15759" stroke-width="2.6" marker-end="url(#ar)"/><text x="216.0" y="199.0" text-anchor="start" font-size="17" font-weight="bold" fill="#e15759" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">P</text><text x="164.0" y="124.0" text-anchor="end" font-size="14" font-weight="bold" fill="#1d2733">6 kg</text><text x="190.0" y="44.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d2733">Trên Trái Đất</text><text x="190.0" y="66.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#e15759">P = 10·6 = 60 N</text><path d="M410.0,340.0 A100,100 0 0 1 650.0,340.0 Z" fill="#b9bfc7" stroke="#1d2733" stroke-width="2.4"/><circle cx="530.0" cy="118.0" r="16.0" fill="#f7c58a" stroke="#1d2733" stroke-width="2.2"/><line x1="530.0" y1="118.0" x2="530.0" y2="143.0" stroke="#e15759" stroke-width="2.6" marker-end="url(#ar)"/><text x="556.0" y="136.5" text-anchor="start" font-size="17" font-weight="bold" fill="#e15759" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">P</text><text x="504.0" y="124.0" text-anchor="end" font-size="14" font-weight="bold" fill="#1d2733">6 kg</text><text x="530.0" y="44.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d2733">Trên Mặt Trăng</text><text 