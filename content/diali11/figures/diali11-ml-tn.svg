<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 370" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="380.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Điều kiện tự nhiên và tài nguyên của Mỹ La-tinh</text><rect x="15.0" y="50.0" width="170.0" height="52.0" rx="8" fill="#eef1f4" stroke="#1d2733" stroke-width="2"/><text x="100.0" y="81.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Địa hình</text><rect x="190.0" y="50.0" width="555.0" height="52.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="202.0" y="81.0" text-anchor="start" font-size="11" font-weight="normal" fill="#1d2733">Phía tây núi cao An-đét; phía đông sơn nguyên, đồng bằng (La Plata, A-ma-dôn)</text><rect x="15.0" y="112.0" width="170.0" height="52.0" rx="8" fill="#fbf0c9" stroke="#1d2733" stroke-width="2"/><text x="100.0" y="143.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Khí hậu</text><rect x="190.0" y="112.0" width="555.0" height="52.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="202.0" y="143.0" text-anchor="start" font-size="11" font-weight="normal" fill="#1d2733">Chủ yếu nóng ẩm, phân hoá nhiều đới và kiểu khí hậu; bão, lũ ở Ca-ri-bê và Trung Mỹ</text><rect x="15.0" y="174.0" width="170.0" height="52.0" rx="8" fill="#dbe7f3" stroke="#1d2733" stroke-width="2"/><text x="100.0" y="205.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Sông, hồ</text><rect x="190.0" y="174.0" width="555.0" height="52.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="202.0" y="205.0" text-anchor="start" font-size="11" font-weight="normal" fill="#1d2733">Sông nhiều nước quanh năm (A-ma-dôn, Ô-ri-nô-cô) có giá trị thuỷ điện, giao thông</text><rect x="15.0" y="236.0" width="170.0" height="52.0" rx="8" fill="#dfe9d5" stroke="#1d2733" stroke-width="2"/><text x="100.0" y="267.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Khoáng sản</text><rect x="190.0" y="236.0" width="555.0" height="52.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="202.0" y="267.0" text-anchor="start" font-size="11" font-weight="normal" fill="#1d2733">Sắt (Bra-xin), đồng (Chi-lê), bạc, chì – kẽm, dầu mỏ và khí tự nhiên</text><rect x="15.0" y="298.0" width="170.0" height="52.0" rx="8" fill="#f7d4d4" stroke="#1d2733" stroke-width="2"/><text x="100.0" y="329.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Rừng</text><rect x="190.0" y="298.0" width="555.0" height="52.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="202.0" y="329.0" text-anchor="start" font-size="11" font-weight="normal" fill="#1d2733">Rừng A-ma-dôn rộng hơn 5 triệu km², được gọi là "lá phổi xanh" của Trái Đất</text></svg>