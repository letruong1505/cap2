<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="380.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Toàn cầu hoá và khu vực hoá kinh tế</text><rect x="15.0" y="50.0" width="355.0" height="34.0" rx="8" fill="#dbe7f3" stroke="#1d2733" stroke-width="2"/><text x="192.5" y="72.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Toàn cầu hoá</text><rect x="15.0" y="88.0" width="355.0" height="130.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="192.5" y="110.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Liên kết các nước trên toàn thế giới</text><text x="192.5" y="127.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Hàng hoá, vốn, lao động, tri thức</text><text x="192.5" y="144.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">tự do dịch chuyển</text><text x="192.5" y="161.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Công ty đa quốc gia chi phối chuỗi giá trị</text><rect x="380.0" y="50.0" width="355.0" height="34.0" rx="8" fill="#dfe9d5" stroke="#1d2733" stroke-width="2"/><text x="557.5" y="72.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Khu vực hoá</text><rect x="380.0" y="88.0" width="355.0" height="130.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="557.5" y="110.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Liên kết các nước trong cùng khu vực</text><text x="557.5" y="127.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Cùng địa lí, văn hoá, mục tiêu</text><text x="557.5" y="144.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Hình thành tổ chức khu vực</text><text x="557.5" y="161.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Tạo thị trường rộng lớn, rào cản bên ngoài</text></svg>