<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="380.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Các cơ quan thể chế của EU</text><rect x="15.0" y="50.0" width="172.5" height="34.0" rx="8" fill="#dbe7f3" stroke="#1d2733" stroke-width="2"/><text x="101.2" y="72.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Hội đồng châu Âu</text><rect x="15.0" y="88.0" width="172.5" height="130.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="101.2" y="110.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">27 nguyên thủ các nước</text><text x="101.2" y="127.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Họp 4 lần/năm</text><text x="101.2" y="144.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Đường lối chính trị</text><rect x="197.5" y="50.0" width="172.5" height="34.0" rx="8" fill="#fbf0c9" stroke="#1d2733" stroke-width="2"/><text x="283.8" y="72.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Nghị viện châu Âu</text><rect x="197.5" y="88.0" width="172.5" height="130.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="283.8" y="110.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Đại diện công dân EU</text><text x="283.8" y="127.0" text-anchor="middle" font-size="12" font-weight="nor