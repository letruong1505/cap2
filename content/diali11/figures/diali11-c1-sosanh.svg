<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 316" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="380.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">So sánh nhóm nước phát triển và đang phát triển</text><rect x="15.0" y="50.0" width="170.0" height="54.0" rx="8" fill="#dbe7f3" stroke="#1d2733" stroke-width="2"/><text x="100.0" y="82.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Kinh tế</text><rect x="190.0" y="50.0" width="555.0" height="54.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="202.0" y="82.0" text-anchor="start" font-size="11" font-weight="normal" fill="#1d2733">Phát triển: quy mô GDP lớn, tăng trưởng ổn định. Đang phát triển: quy mô nhỏ, tăng trưởng nhanh</text><rect x="15.0" y="114.0" width="170.0" height="54.0" rx="8" fill="#fbf0c9" stroke="#1d2733" stroke-width="2"/><text x="100.0" y="146.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Cơ cấu kinh tế</text><rect x="190.0" y="114.0" width="555.0" height="54.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="202.0" y="146.0" text-anchor="start" font-size="11" font-weight="normal" fill="#1d2733">Phát triển: dịch vụ chiếm nhiều nhất. Đang phát triển: công nghiệp và dịch vụ tăng dần</text><rect x="15.0" y="178.0" width="170.0" height="54.0" rx="8" fill="#dfe9d5" stroke="#1d2733" stroke-width="2"/><text x="100.0" y="210.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Dân số</text><rect x="190.0" y="178.0" width="555.0" height="54.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="202.0" y="210.0" text-anchor="start" font-size="11" font-weight="normal" fill="#1d2733">Phát triển: tự nhiên thấp, già hoá, đô thị hoá sớm. Đang phát triển: còn cao, dân số trẻ, đô thị hoá nhanh</text><rect x="15.0" y="242.0" width="170.0" height="54.0" rx="8" fill="#f7d4d4" stroke="#1d2733" stroke-width="2"/><text x="100.0" y="274.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Đời sống</text><rect x="190.0" y="242.0" width="555.0" height="54.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="202.0" y="274.0" text-anchor="start" font-size="11" font-weight="normal" fill="#1d2733">Phát triển: y tế, giáo dục tốt, tuổi thọ cao. Đang phát triển: đang được cải thiện</text></svg>