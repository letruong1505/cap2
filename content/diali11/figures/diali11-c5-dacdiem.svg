<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="380.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Nền kinh tế tri thức: đặc trưng và lợi thế</text><rect x="15.0" y="50.0" width="355.0" height="34.0" rx="8" fill="#dbe7f3" stroke="#1d2733" stroke-width="2"/><text x="192.5" y="72.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Đặc trưng</text><rect x="15.0" y="88.0" width="355.0" height="120.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="192.5" y="110.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Tri thức là lực lượng sản xuất trực tiếp</text><text x="192.5" y="127.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Sản xuất công nghệ là hình thức quan trọng nhất</text><text x="192.5" y="144.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Lao động tri thức chiếm tỉ trọng cao</text><rect x="380.0" y="50.0" width="355.0" height="34.0" rx="8" fill="#dfe9d5" stroke="#1d2733" stroke-width="2"/><text x="557.5" y="72.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Lợi thế</text><rect x="380.0" y="88.0" width="355.0" height="120.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="557.5" y="110.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Sản phẩm sạch, ít ô nhiễm</text><text x="557.5" y="127.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Cân bằng cung – cầu, hạn chế tồn kho</text><text x="557.5" y="144.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Sáng tạo liên tục, ứng dụng thực tế – ảo</text></svg>