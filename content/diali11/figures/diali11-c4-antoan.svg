<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="380.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Các vấn đề an ninh toàn cầu tiêu biểu</text><rect x="15.0" y="50.0" width="172.5" height="34.0" rx="8" fill="#dfe9d5" stroke="#1d2733" stroke-width="2"/><text x="101.2" y="72.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">An ninh lương thực</text><rect x="15.0" y="88.0" width="172.5" height="130.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="101.2" y="110.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Đảm bảo tiếp cận lương thực đủ, an toàn</text><text x="101.2" y="127.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Thiên tai, xung đột làm gián đoạn</text><rect x="197.5" y="50.0" width="172.5" height="34.0" rx="8" fill="#fbf0c9" stroke="#1d2733" stroke-width="2"/><text x="283.8" y="72.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">An ninh năng lượng</text><rect x="197.5" y="88.0" width="172.5" height="130.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="283.8" y="110.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Đảm bảo năng lượng cho sản xuất, sinh hoạt</text><text x="283.8" y="127.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Tiết kiệm, phát triển năng lượng tái tạo</text><rect x="380.0" y="50.0" width="172.5" height="34.0" rx="8" fill="#dbe7f3" stroke="#1d2733" stroke-width="2"/><text x="466.2" y="72.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">An ninh nguồn nước</text><rect x="380.0" y="88.0" width="172.5" height="130.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="466.2" y="110.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Đủ số lượng, chất lượng nước</text><text x="466.2" y="127.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Ứng phó thiên tai, ô nhiễm, biến đổi khí hậu</text><rect x="562.5" y="50.0" width="172.5" height="34.0" rx="8" fill="#f7d4d4" stroke="#1d2733" stroke-width="2"/><text x="648.8" y="72.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">An ninh mạng</text><rect x="562.5" y="88.0" width="172.5" height="130.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="648.8" y="110.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Hoạt động trên không gian mạng an toàn</text><text x="648.8" y="127.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Chống tấn công, tội phạm mạng</text></svg>