<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 200" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="380.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Hệ quả và ảnh hưởng của toàn cầu hoá kinh tế</text><rect x="15.0" y="50.0" width="170.0" height="60.0" rx="8" fill="#dfe9d5" stroke="#1d2733" stroke-width="2"/><text x="100.0" y="85.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Tích cực</text><rect x="190.0" y="50.0" width="555.0" height="60.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="202.0" y="85.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">Thúc đẩy tăng trưởng, chuyên môn hoá, thu hút vốn, công nghệ, khai thác lợi thế cạnh tranh</text><rect x="15.0" y="120.0" width="170.0" height="60.0" rx="8" fill="#f7d4d4" stroke="#1d2733" stroke-width="2"/><text x="100.0" y="155.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Tiêu cực</text><rect x="190.0" y="120.0" width="555.0" height="60.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="202.0" y="155.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">Tăng phân hoá giàu nghèo; phụ thuộc lẫn nhau; ô nhiễm môi trường, rác thải nhựa</text></svg>