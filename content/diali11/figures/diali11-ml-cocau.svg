<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="380.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Chuyển dịch cơ cấu kinh tế Mỹ La-tinh (1990–2020)</text><rect x="15.0" y="50.0" width="233.3" height="34.0" rx="8" fill="#dfe9d5" stroke="#1d2733" stroke-width="2"/><text x="131.7" y="72.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Nông nghiệp</text><rect x="15.0" y="88.0" width="233.3" height="120.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="131.7" y="110.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Tỉ trọng giảm dần</text><text x="131.7" y="127.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Vẫn đa dạng: lương thực,</text><text x="131.7" y="144.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">công nghiệp, cây ăn quả</text><rect x="258.3" y="50.0" width="233.3" height="34.0" rx="8" fill="#fbf0c9" stroke="#1d2733" stroke-width="2"/><text x="375.0" y="72.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Công nghiệp</text><rect x="258.3" y="88.0" width="233.3" height="120.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="375.0" y="110.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Khai khoáng mạnh;</text><text x="375.0" y="127.0" text-anchor="middle" font-size="1