<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="380.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Điều kiện tự nhiên và tài nguyên Hoa Kỳ</text><rect x="15.0" y="50.0" width="170.0" height="56.0" rx="8" fill="#eef1f4" stroke="#1d2733" stroke-width="2"/><text x="100.0" y="83.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Địa hình</text><rect x="190.0" y="50.0" width="555.0" height="56.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="202.0" y="83.0" text-anchor="start" font-size="11" font-weight="normal" fill="#1d2733">Tây: núi Coóc-đi-e; giữa: đồng bằng Trung tâm, Lớn; đông: A-pa-lát</text><rect x="15.0" y="116.0" width="170.0" height="56.0" rx="8" fill="#fbf0c9" stroke="#1d2733" stroke-width="2"/><text x="100.0" y="149.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Khí hậu</text><rect x="190.0" y="116.0" width="555.0" height="56.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="202.0" y="149.0" text-anchor="start" font-size="11" font-weight="normal" fill="#1d2733">Bắc ôn đới, nam cận nhiệt; A-la-xca cận cực; Ha-oai nhiệt đới</text><rect x="15.0" y="182.0" width="170.0" height="56.0" rx="8" fill="#dbe7f3" stroke="#1d2733" stroke-width="2"/><text x="100.0" y="215.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Sông, hồ</text><rect x="190.0" y="182.0" width="555.0" height="56.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="202.0" y="215.0" text-anchor="start" font-size="11" font-weight="normal" fill="#1d2733">Mi-xi-xi-pi, Mit-xu-ri; hệ thống Ngũ Hồ giáp Ca-na-đa</text><rect x="15.0" y="248.0" width="170.0" height="56.0" rx="8" fi