<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="380.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Bốn quyền tự do của EU và các chính sách chung</text><rect x="15.0" y="50.0" width="172.5" height="34.0" rx="8" fill="#dbe7f3" stroke="#1d2733" stroke-width="2"/><text x="101.2" y="72.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Tự do đi chuyển</text><rect x="15.0" y="88.0" width="172.5" height="120.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="101.2" y="110.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Công dân sinh sống,</text><text x="101.2" y="127.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">làm việc ở bất kì</text><text x="101.2" y="144.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">đâu trong EU</text><rect x="197.5" y="50.0" width="172.5" height="34.0" rx="8" fill="#fbf0c9" stroke="#1d2733" stroke-width="2"/><text x="283.8" y="72.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Tự do dịch vụ</text><rect x="197.5" y="88.0" width="172.5" height="120.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="283.8" y="110.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Dịch vụ lưu thông</text><text x="283.8" y="127.0" text-anchor="middle" font-size="12" font-weigh