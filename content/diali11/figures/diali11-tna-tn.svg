<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="380.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Điều kiện tự nhiên và tài nguyên Tây Nam Á</text><rect x="15.0" y="50.0" width="170.0" height="54.0" rx="8" fill="#eef1f4" stroke="#1d2733" stroke-width="2"/><text x="100.0" y="82.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Địa hình</text><rect x="190.0" y="50.0" width="555.0" height="54.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="202.0" y="82.0" text-anchor="start" font-size="11" font-weight="normal" fill="#1d2733">Núi, sơn nguyên (Cáp-ca, Hin-đu Cúc, I-ran, A-na-tô-li) và đồng bằng Lưỡng Hà màu mỡ</text><rect x="15.0" y="114.0" width="170.0" height="54.0" rx="8" fill="#fbf0c9" stroke="#1d2733" stroke-width="2"/><text x="100.0" y="146.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Khí hậu</text><rect x="190.0" y="114.0" width="555.0" height="54.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="202.0" y="146.0" text-anchor="start" font-size="11" font-weight="normal" fill="#1d2733">Khô nóng mùa hè, khô lạnh mùa đông; mưa ít (100–300 mm ở phía nam, khoảng 500 mm ven Địa Trung Hải)</text><rect x="15.0" y="178.0" width="170.0" height="54.0" rx="8" fill="#dbe7f3" stroke="#1d2733" stroke-width="2"/><text x="100.0" y="210.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Sông, hồ</text><rect x="190.0" y="178.0" width="555.0" height="54.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="202.0" y="210.0" text-anchor="start" font-size="11" font-weight="normal" fill="#1d2733">Sông Ti-grơ, Ơ-phrát bồi đắp đồng bằng Lưỡng Hà; Biển Chết có độ mặn cao nhất thế giới</text><rect x="15.0" y="242.0" width="170.0" height="54.0" rx="8" fill="#dfe9d5" stroke="#1d2733" stroke-width="2"/><text x="100.0" y="274.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Khoáng sản</text><rect x="190.0" y="242.0" width="555.0" height="54.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="202.0" y="274.0" text-anchor="start" font-size="11" font-weight="normal" fill="#1d2733">Dầu mỏ, khí tự nhiên tập trung quanh vịnh Péc-xích; ngoài ra có than, sắt, crôm, phốt phát</text><rect x="15.0" y="306.0" width="170.0" height="54.0" rx="8" fill="#f7d4d4" stroke="#1d2733" stroke-width="2"/><text x="100.0" y="338.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Sinh vật</text><rect x="190.0" y="306.0" width="555.0" height="54.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="202.0" y="338.0" text-anchor="start" font-size="11" font-weight="normal" fill="#1d2733">Nghèo nàn, chủ yếu hoang mạc và bán hoang mạc; ven Địa Trung Hải có rừng lá cứng</text></svg>