<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="380.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Các vấn đề xã hội cần giải quyết ở Bra-xin</text><rect x="15.0" y="50.0" width="233.3" height="34.0" rx="8" fill="#f7d4d4" stroke="#1d2733" stroke-width="2"/><text x="131.7" y="72.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Chênh lệch giàu nghèo</text><rect x="15.0" y="88.0" width="233.3" height="130.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="131.7" y="110.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">10% giàu nhất chiếm hơn 40% GDP</text><text x="131.7" y="127.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">10% nghèo nhất chỉ khoảng 1% GDP</text><rect x="258.3" y="50.0" width="233.3" height="34.0" rx="8" fill="#fbf0c9" stroke="#1d2733" stroke-width="2"/><text x="375.0" y="72.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Phân hoá vùng</text><rect x="258.3" y="88.0" width="233.3" height="130.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="375.0" y="110.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Vùng Đông Nam: trên 40% dân số,</text><text x="375.0" y="127.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">trên 60% GDP</text><text x="375.0" y="144.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Trung Tây và Bắc: nhỏ hơn nhiều</text><rect x="501.7" y="50.0" width="233.3" height="34.0" rx="8" fill="#eef1f4" stroke="#1d2733" stroke-width="2"/><text x="618.3" y="72.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Đô thị hoá tự phát</text><rect x="501.7" y="88.0" width="233.3" height="130.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="618.3" y="110.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Dân thành thị 87% (2020)</text><text x="618.3" y="127.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Thất nghiệp, khu "ổ chuột",</text><text x="618.3" y="144.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">ô nhiễm môi trường</text></svg>