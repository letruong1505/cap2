<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 200" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="380.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Phân biệt an ninh truyền thống và phi truyền thống</text><rect x="15.0" y="50.0" width="170.0" height="60.0" rx="8" fill="#eef1f4" stroke="#1d2733" stroke-width="2"/><text x="100.0" y="85.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Truyền thống</text><rect x="190.0" y="50.0" width="555.0" height="60.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="202.0" y="85.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">Chính trị, quân sự: khủng bố, xung đột vũ trang, chiến tranh cục bộ</text><rect x="15.0" y="120.0" width="170.0" height="60.0" rx="8" fill="#fbf0c9" stroke="#1d2733" stroke-width="2"/><text x="100.0" y="155.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Phi truyền thống</text><rect x="190.0" y="120.0" width="555.0" height="60.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="202.0" y="155.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">Kinh tế, lương thực, năng lượng, nguồn nước, mạng; xuất hiện trong vài thập niên gần đây</text></svg>