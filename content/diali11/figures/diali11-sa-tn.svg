<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="380.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Điều kiện tự nhiên và tài nguyên Cộng hoà Nam Phi</text><rect x="15.0" y="50.0" width="170.0" height="56.0" rx="8" fill="#eef1f4" stroke="#1d2733" stroke-width="2"/><text x="100.0" y="83.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Địa hình</text><rect x="190.0" y="50.0" width="555.0" height="56.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="202.0" y="83.0" text-anchor="start" font-size="11" font-weight="normal" fill="#1d2733">Cao nguyên khoảng 2 000 m; dãy Đrê-ken-béc ngăn với duyên hải</text><rect x="15.0" y="116.0" width="170.0" height="56.0" rx="8" fill="#fbf0c9" stroke="#1d2733" stroke-width="2"/><text x="100.0" y="149.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Khí hậu</text><rect x="190.0" y="116.0" width="555.0" height="56.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="202.0" y="149.0" text-anchor="start" font-size="11" font-weight="normal" fill="#1d2733">Nội địa khô hạn; chỉ khoảng 1/3 diện tích đủ mưa để trồng trọt</text><rect x="15.0" y="182.0" width="170.0" height="56.0" rx="8" fill="#dbe7f3" stroke="#1d2733" stroke-width="2"/><text x="100.0" y="215.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Sông, hồ</text><rect x="190.0" y="182.0" width="555.0" height="56.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="202.0" y="215.0" text-anchor="start" font-size="11" font-weight="normal" fill="#1d2733">Sông ngắn, dốc; O-ran-giơ, Lim-pô-pô; ít hồ tự nhiên</text><rect x="15.0" y="248.0" width="170.0" height="56.0" rx="8" fill="#dfe9d5" stroke="#1d2733" stroke-width="2"/><text x="100.0" y="281.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Sinh vật</text><rect x="190.0" y="248.0" width="555.0" height="56.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="202.0" y="281.0" text-anchor="start" font-size="11" font-weight="normal" fill="#1d2733">Xa van chiếm 34,3% diện tích; nhiều loài đặc hữu</text><rect x="15.0" y="314.0" width="170.0" height="56.0" rx="8" fill="#f7d4d4" stroke="#1d2733" stroke-width="2"/><text x="100.0" y="347.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Khoáng sản</text><rect x="190.0" y="314.0" width="555.0" height="56.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="202.0" y="347.0" text-anchor="start" font-size="11" font-weight="normal" fill="#1d2733">Kim loại quý, năng lượng tập trung ở cao nguyên nội địa</text></svg>