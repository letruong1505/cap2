<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" font-family="Arial,sans-serif" font-size="13"><rect width="320" height="240" fill="#fff"/><line x1="30" y1="200" x2="300" y2="200" stroke="#333"/><line x1="60" y1="230" x2="60" y2="20" stroke="#333"/><text x="288" y="218">x</text><text x="68" y="30">y</text><text x="48" y="214">O</text><polygon points="60,200 60,80 140,120 220,200" fill="#bbf7d0" opacity="0.8"/><line x1="40" y1="70" x2="180" y2="140" stroke="#15803d" stroke-width="2"/><line x1="100" y1="60" x2="250" y2="230" stroke="#b91c1c" stroke-width="2"/><text x="70" y="170" fill="#166534" font-weight="bold">miền nghiệm</text><text x="150" y="70" fill="#15803d" font-size="12">x + 2y = 6</text><text x="215" y="150" fill="#b91c1c" font-size="12">x + y = 4</text><circle cx="140" cy="120" r="3.5" fill="#000"/><text x="146" y="114" font-size="12">(2; 2)</text><circle cx="60" cy="80" r="3" fill="#000"/><circle cx="220" cy="200" r="3" fill="#000"/><text x="214" y="216" font-size="12">4</text><text x="42" y="84" font-size="12">3</text></svg>