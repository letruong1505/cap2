<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 284" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="360.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Các bước tìm hiểu sinh vật ngoài thiên nhiên</text><rect x="20.0" y="56.0" width="160.0" height="90.0" rx="10" fill="#e7f1df" stroke="#1d2733" stroke-width="2.2"/><circle cx="42.0" cy="78.0" r="13.0" fill="#4e79a7" stroke="#1d2733" stroke-width="1.6"/><text x="42.0" y="83.0" text-anchor="middle" font-size="15" font-weight="bold" fill="white">1</text><text x="102.0" y="104.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Quan sát sinh vật</text><text x="102.0" y="122.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">ở môi trường sống</text><line x1="182.0" y1="101.0" x2="186.0" y2="101.0" stroke="#4e79a7" stroke-width="2.6" marker-end="url(#ar)"/><rect x="190.0" y="56.0" width="160.0" height="90.0" rx="10" fill="#e7f1df" stroke="#1d2733" stroke-width="2.2"/><circle cx="212.0" cy="78.0" r="13.0" fill="#4e79a7" stroke="#1d2733" stroke-width="1.6"/><text x="212.0" y="83.0" text-anchor="middle" font-size="15" font-weight="bold" fill="white">2</text><text x="272.0" y="104.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Chụp ảnh, ghi chép</text><text x="272.0" y="122.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">đặc điểm</text><line x1="352.0" y1="101.0" x2="356.0" y2="101.0" stroke="#4e79a7" stroke-width="2.6" marker-end="url(#ar)"/><rect x="360.0" y="56.0" width="160.0" height="90.0" rx="10" fill="#e7f1df" stroke="#1d2733" stroke-width="2.2"/><circle cx="382.0" cy="78.0" r="13.0" fill="#4e79a7" stroke="#1d2733" stroke-width="1.6"/><text x="382.0" y="83.0" text-anchor="middle" font-size="15" font-weight="bold" fill="white">3</text><text x="442.0" y="104.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Nhận biết, phân loại</text><text x="442.0" y="122.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">(khoá lưỡng phân)</text><line x1="522.0" y1="101.0" x2="526.0" y2="101.0" stroke="#4e79a7" stroke-width="2.6" marker-end="url(#ar)"/><rect x="530.0" y="56.0" width="160.0" height="90.0" rx="10" fill="#e7f1df" stroke="#1d2733" stroke-width="2.2"/><circle cx="552.0" cy="78.0" r="13.0" fill="#4e79a7" stroke="#1d2733" stroke-width="1.6"/><text x="552.0" y="83.0" text-anchor="middle" font-size="15" font-weight="bold" fill="white">4</text><text x="612.0" y="112.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Làm báo cáo</text><rect x="20.0" y="170.0" width="330.0" height="96.0" rx="10" fill="#eef1f4" stroke="#9aa5b1" stroke-width="1.4"/><text x="185.0" y="192.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2733">Dụng cụ</text><text x="185.0" y="214.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">kính lúp, ống nhòm, máy ảnh, vợt bắt côn trùng,</text><text x="185.0" y="231.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">kẹp, lọ đựng mẫu, sổ ghi chép</text><rect x="370.0" y="170.0" width="330.0" height="96.0" rx="10" fill="#fdecea" stroke="#e15759" stroke-width="1.6"/><text x="535.0" y="192.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#e15759">An toàn và bảo vệ môi trường</text><text x="535.0" y="214.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">không tự ý tách đoàn; không bắt, chạm sinh vật lạ,</text><text x="535.0" y="231.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">độc; không phá cây, bắt động vật bừa bãi</text></svg>