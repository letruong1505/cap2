<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="360.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Khoảng biến thiên và khoảng tứ phân vị</text><line x1="70.0" y1="112.0" x2="230.0" y2="112.0" stroke="#1d2733" stroke-width="2.2"/><line x1="500.0" y1="112.0" x2="650.0" y2="112.0" stroke="#1d2733" stroke-width="2.2"/><line x1="70.0" y1="98.0" x2="70.0" y2="126.0" stroke="#1d2733" stroke-width="2.2"/><line x1="650.0" y1="98.0" x2="650.0" y2="126.0" stroke="#1d2733" stroke-width="2.2"/><rect x="230.0" y="88.0" width="270.0" height="48.0" rx="0" fill="#dbe7f3" stroke="#4e79a7" stroke-width="2.2"/><line x1="330.0" y1="88.0" x2="330.0" y2="136.0" stroke="#4e79a7" stroke-width="2.6"/><text x="70.0" y="74.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2733">a₁</text><text x="230.0" y="74.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2733">Q₁</text><text x="330.0" y="74.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2733">Q₂</text><text x="500.0" y="74.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2733">Q₃</text><text x="650.0" y="74.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2733">a<tspan dy="4" font-size="11">k+1</tspan><tspan dy="-4">&#8203;</tspan></text><line x1="230.0" y1="170.0" x2="500.0" y2="170.0" stroke="#f28e2b" stroke-width="2.5"/><line x1="230.0" y1="162.0" x2="230.0" y2="178.0" stroke="#f28e2b" stroke-width="2.5"/><line x1="500.0" y1="162.0" x2="500.0" y2="178.0" stroke="#f28e2b" stroke-width="2.5"/><text x="365.0" y="194.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#b3601a">Khoảng tứ phân vị  Δ<tspan dy="4" font-size="11">Q</tspan><tspan dy="-4">&#8203;</tspan> = Q₃ − Q₁</text><line x1="70.0" y1="218.0" x2="650.0" y2="218.0" stroke="#59a14f" stroke-width="2.5"/><line x1="70.0" y1="210.0" x2="70.0" y2="226.0" stroke="#59a14f" stroke-width="2.5"/><line x1="650.0" y1="210.0" x2="650.0" y2="226.0" stroke="#59a14f" stroke-width="2.5"/><text x="360.0" y="240.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f6b2a">Khoảng biến thiên  R = a<tspan dy="4" font-size="11">k+1</tspan><tspan dy="-4">&#8203;</tspan> − a₁</text><text x="360.0" y="264.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#5b6773">Sơ đồ minh hoạ vị trí các giá trị; khoảng cách không theo tỉ lệ. Δ_Q chỉ phụ thuộc nửa giữa của mẫu.</text></svg>