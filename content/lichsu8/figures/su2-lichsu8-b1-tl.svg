<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="360.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Cách mạng tư sản Anh và chiến tranh giành độc lập ở Bắc Mỹ</text><line x1="30.0" y1="178.0" x2="690.0" y2="178.0" stroke="#1d2733" stroke-width="3" marker-end="url(#ar)"/><circle cx="103.0" cy="178.0" r="7.0" fill="#e15759" stroke="#1d2733" stroke-width="1.6"/><line x1="103.0" y1="171.0" x2="103.0" y2="150.0" stroke="#9aa5b1" stroke-width="1.4"/><rect x="8.0" y="88.0" width="190.0" height="62.0" rx="8" fill="#e8f1fa" stroke="#1d2733" stroke-width="1.5"/><text x="103.0" y="108.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#e15759">Năm 1642</text><text x="103.0" y="126.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1d2733">Bắt đầu cách mạng</text><text x="103.0" y="142.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1d2733">tư sản Anh</text><circle cx="205.8" cy="178.0" r="7.0" fill="#e15759" stroke="#1d2733" stroke-width="1.6"/><line x1="205.8" y1="185.0" x2="205.8" y2="206.0" stroke="#9aa5b1" stroke-width="1.4"/><rect x="110.8" y="206.0" width="190.0" height="62.0" rx="8" fill="#fdf1e0" stroke="#1d2733" stroke-width="1.5"/><text x="205.8" y="226.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#e15759">Năm 1649</text><text x="205.8" y="244.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1d2733">Vua Sác-lơ I bị xử tử,</text><text x="205.8" y="260.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1d2733">Anh thành cộng hoà</text><circle cx="308.6" cy="178.0" r="7.0" fill="#e15759" stroke="#1d2733" stroke-width="1.6"/><line x1="308.6" y1="171.0" x2="308.6" y2="150.0" stroke="#9aa5b1" stroke-width="1.4"/><rect x="213.6" y="88.0" width="190.0" height="62.0" rx="8" fill="#e8f1fa" stroke="#1d2733" stroke-width="1.5"/><text x="308.6" y="108.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#e15759">Năm 1688</text><text x="308.6" y="126.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1d2733">“Cách mạng vinh quang”,</text><text x="308.6" y="142.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1d2733">quân chủ lập hiến</text><circle cx="411.4" cy="178.0" r="7.0" fill="#e15759" stroke="#1d2733" stroke-width="1.6"/><line x1="411.4" y1="185.0" x2="411.4" y2="206.0" stroke="#9aa5b1" stroke-width="1.4"/><rect x="316.4" y="206.0" width="190.0" height="62.0" rx="8" fill="#fdf1e0" stroke="#1d2733" stroke-width="1.5"/><text x="411.4" y="226.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#e15759">Năm 1775</text><text x="411.4" y="244.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1d2733">Bắt đầu chiến tranh giành</text><text x="411.4" y="260.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1d2733">độc lập ở Bắc Mỹ</text><circle cx="514.2" cy="178.0" r="7.0" fill="#e15759" stroke="#1d2733" stroke-width="1.6"/><line x1="514.2" y1="171.0" x2="514.2" y2="150.0" stroke="#9aa5b1" stroke-width="1.4"/><rect x="419.2" y="88.0" width="190.0" height="62.0" rx="8" fill="#e8f1fa" stroke="#1d2733" stroke-width="1.5"/><text x="514.2" y="108.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#e15759">4/7/1776</text><text x="514.2" y="126.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1d2733">Thông qua Tuyên ngôn</text><text x="514.2" y="142.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1d2733">Độc lập</text><circle cx="617.0" cy="178.0" r="7.0" fill="#e15759" stroke="#1d2733" stroke-width="1.6"/><line x1="617.0" y1="185.0" x2="617.0" y2="206.0" stroke="#9aa5b1" stroke-width="1.4"/><rect x="522.0" y="206.0" width="190.0" height="62.0" rx="8" fill="#fdf1e0" stroke="#1d2733" stroke-width="1.5"/><text x="617.0" y="226.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#e15759">Năm 1783</text><text x="617.0" y="244.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1d2733">Anh công nhận độc lập</text><text x="617.0" y="260.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1d2733">của Hợp chúng quốc Mỹ</text></svg>