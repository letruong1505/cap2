<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 280" font-family="Arial,sans-serif" font-size="13"><rect width="520" height="280" fill="#fff"/><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#6b7280"/></marker></defs><rect x="40" y="20" width="400" height="200" rx="60" fill="#fef9c3" stroke="#374151" stroke-width="2"/><rect x="40" y="20" width="400" height="200" rx="60" fill="none" stroke="#b45309" stroke-width="6"/><ellipse cx="170" cy="120" rx="70" ry="45" fill="#e0e7ff" stroke="#4338ca" stroke-dasharray="4 3"/><text x="170" y="124" fill="#111" font-size="10" text-anchor="middle">Vùng nhân (DNA vòng)</text><circle cx="300" cy="70" r="6" fill="#f97316"/><circle cx="330" cy="110" r="6" fill="#f97316"/><circle cx="300" cy="160" r="6" fill="#f97316"/><circle cx="340" cy="170" r="6" fill="#f97316"/><circle cx="280" cy="130" r="6" fill="#f97316"/><text x="300" y="95" fill="#111" font-size="12" text-anchor="start"></text><text x="330" y="200" fill="#111" font-size="10" text-anchor="middle">Ribosome</text><path d="M440,120 q30,-20 60,0 t60,0" fill="none" stroke="#6b7280" stroke-width="3"/><text x="470" y="108" fill="#111" font-size="10" text-anchor="middle">Roi</text><text x="240" y="260" fill="#111" font-size="11" text-anchor="middle">Thành tế bào – màng tế bào – tế bào chất – vùng nhân; không có màng nhân và bào quan có màng bao</text></svg>