<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 140" font-family="Arial,sans-serif" font-size="13"><rect width="500" height="140" fill="#fff"/><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#6b7280"/></marker></defs><rect x="20" y="40" width="130" height="46" rx="8" fill="#dbeafe" stroke="#374151"/><text x="85.0" y="67.0" fill="#111" font-size="10" text-anchor="middle" font-weight="bold">Hấp phụ (gai glycoprotein)</text><line x1="150" y1="63" x2="170" y2="63" stroke="#6b7280" stroke-width="2" marker-end="url(#ar)"/><rect x="170" y="40" width="130" height="46" rx="8" fill="#fde68a" stroke="#374151"/><text x="235.0" y="67.0" fill="#111" font-size="10" text-anchor="middle" font-weight="bold">Enzyme phiên mã ngược: RNA→DNA</text><line x1="300" y1="63" x2="320" y2="63" stroke="#6b7280" stroke-width="2" marker-end="url(#ar)"/><rect x="320" y="40" width="150" height="46" rx="8" fill="#bbf7d0" stroke="#374151"/><text x="395.0" y="67.0" fill="#111" font-size="10" text-anchor="middle" font-weight="bold">DNA tích hợp vào hệ gene người</text><text x="240" y="25" fill="#111" font-size="12" text-anchor="middle" font-weight="bold">Nhân lên của HIV trong tế bào bạch cầu</text><text x="240" y="120" fill="#111" font-size="10" text-anchor="middle">Cúm: RNA không tích hợp, nhân lên theo chu kì sinh tan</text></svg>