<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 220" font-family="Arial,sans-serif" font-size="13"><rect width="500" height="220" fill="#fff"/><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#6b7280"/></marker></defs><rect x="20" y="30" width="220" height="60" rx="8" fill="#f1f5f9" stroke="#334155"/><text x="130" y="66" fill="#111" font-size="11" text-anchor="middle">Trực tiếp (qua cầu nối)</text><rect x="260" y="30" width="220" height="60" rx="8" fill="#f1f5f9" stroke="#334155"/><text x="370" y="66" fill="#111" font-size="11" text-anchor="middle">Cận tiết (tế bào liền kề)</text><rect x="20" y="110" width="220" height="60" rx="8" fill="#f1f5f9" stroke="#334155"/><text x="130" y="146" fill="#111" font-size="11" text-anchor="middle">Nội tiết (hormone vào máu)</text><rect x="260" y="110" width="220" height="60" rx="8" fill="#f1f5f9" stroke="#334155"/><text x="370" y="146" fill="#111" font-size="11" text-anchor="middle">Qua synapse (thần kinh)</text><text x="240" y="200" fill="#111" font-size="11" text-anchor="middle">Tín hiệu chủ yếu là chất hoá học: amino acid, peptide, protein, nucleotide, hormone, NO</text></svg>