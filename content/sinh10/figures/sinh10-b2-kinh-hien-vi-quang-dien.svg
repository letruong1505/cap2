<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 160" font-family="Arial,sans-serif" font-size="13"><rect width="480" height="160" fill="#fff"/><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#6b7280"/></marker></defs><rect x="20" y="30" width="200" height="60" rx="8" fill="#dbeafe" stroke="#374151"/><text x="120.0" y="64.0" fill="#111" font-size="12" text-anchor="middle" font-weight="bold">Kính quang học</text><rect x="260" y="30" width="200" height="60" rx="8" fill="#ede9fe" stroke="#374151"/><text x="360.0" y="64.0" fill="#111" font-size="12" text-anchor="middle" font-weight="bold">Kính điện tử</text><text x="120" y="110" fill="#111" font-size="11" text-anchor="middle">Nguồn sáng: ánh sáng</text><text x="120" y="126" fill="#111" font-size="11" text-anchor="middle">Phóng đại tối đa ≈ 1 500 lần</text><text x="120" y="142" fill="#111" font-size="11" text-anchor="middle">Phân giải ≈ 200 nm</text><text x="360" y="110" fill="#111" font-size="11" text-anchor="middle">Nguồn sáng: chùm electron</text><text x="360" y="126" fill="#111" font-size="11" text-anchor="middle">Phóng đại tới ≈ 50 triệu lần</text><text x="360" y="142" fill="#111" font-size="11" text-anchor="middle">Phân giải nhỏ hơn 1 Å</text></svg>