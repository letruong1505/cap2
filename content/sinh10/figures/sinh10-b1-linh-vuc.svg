<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" font-family="Arial,sans-serif" font-size="13"><rect width="480" height="200" fill="#fff"/><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#6b7280"/></marker></defs><rect x="170" y="14" width="160" height="40" rx="8" fill="#1e3a8a" stroke="#374151"/><text x="250.0" y="38.0" fill="#fff" font-size="14" text-anchor="middle" font-weight="bold">Sinh học</text><line x1="250" y1="54" x2="110" y2="100" stroke="#6b7280" stroke-width="2" marker-end="url(#ar)"/><line x1="250" y1="54" x2="250" y2="100" stroke="#6b7280" stroke-width="2" marker-end="url(#ar)"/><line x1="250" y1="54" x2="390" y2="100" stroke="#6b7280" stroke-width="2" marker-end="url(#ar)"/><rect x="20" y="100" width="180" height="46" rx="8" fill="#bfdbfe" stroke="#374151"/><text x="110.0" y="127.0" fill="#111" font-size="12" text-anchor="middle" font-weight="bold">Nghiên cứu cơ bản</text><rect x="160" y="100" width="180" height="46" rx="8" fill="#bbf7d0" stroke="#374151"/><text x="250.0" y="127.0" fill="#111" font-size="12" text-anchor="middle" font-weight="bold">Ứng dụng</text><rect x="300" y="100" width="180" height="46" rx="8" fill="#fde68a" stroke="#374151"/><text x="390.0" y="127.0" fill="#111" font-size="12" text-anchor="middle" font-weight="bold">Vai trò xã hội</text><text x="110" y="170" fill="#111" font-size="11" text-anchor="middle">Cấu trúc, phân loại,</text><text x="110" y="184" fill="#111" font-size="11" text-anchor="middle">tiến hoá của sự sống</text><text x="250" y="170" fill="#111" font-size="11" text-anchor="middle">Y - dược, nông lâm ngư,</text><text x="250" y="184" fill="#111" font-size="11" text-anchor="middle">công nghệ, bảo vệ môi trường</text><text x="390" y="170" fill="#111" font-size="11" text-anchor="middle">Phát triển bền vững,</text><text x="390" y="184" fill="#111" font-size="11" text-anchor="middle">đạo đức và kinh tế</text></svg>