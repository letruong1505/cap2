<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 150" font-family="Arial,sans-serif" font-size="13"><rect width="500" height="150" fill="#fff"/><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#6b7280"/></marker></defs><rect x="20" y="40" width="100" height="50" rx="8" fill="#dbeafe" stroke="#374151"/><text x="70.0" y="69.0" fill="#111" font-size="10" text-anchor="middle" font-weight="bold">Thu thập thông tin</text><line x1="120" y1="65" x2="138" y2="65" stroke="#6b7280" stroke-width="2" marker-end="url(#ar)"/><rect x="140" y="40" width="100" height="50" rx="8" fill="#dbeafe" stroke="#374151"/><text x="190.0" y="69.0" fill="#111" font-size="10" text-anchor="middle" font-weight="bold">Điều tra vật trung gian</text><line x1="240" y1="65" x2="258" y2="65" stroke="#6b7280" stroke-width="2" marker-end="url(#ar)"/><rect x="260" y="40" width="100" height="50" rx="8" fill="#dbeafe" stroke="#374151"/><text x="310.0" y="69.0" fill="#111" font-size="10" text-anchor="middle" font-weight="bold">Viết báo cáo</text><line x1="360" y1="65" x2="378" y2="65" stroke="#6b7280" stroke-width="2" marker-end="url(#ar)"/><rect x="380" y="40" width="100" height="50" rx="8" fill="#dbeafe" stroke="#374151"/><text x="430.0" y="69.0" fill="#111" font-size="10" text-anchor="middle" font-weight="bold">Thiết kế tờ rơi</text><text x="240" y="25" fill="#111" font-size="11" text-anchor="middle" font-weight="bold">Quy trình điều tra bệnh do virus và tuyên truyền phòng chống</text><text x="240" y="130" fill="#111" font-size="10" text-anchor="middle">Ví dụ: muỗi vằn Aedes aegypti truyền virus sốt xuất huyết, đẻ trứng ở nước sinh hoạt</text></svg>