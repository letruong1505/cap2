<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 220" font-family="Arial,sans-serif" font-size="13"><rect width="500" height="220" fill="#fff"/><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#6b7280"/></marker></defs><rect x="20" y="40" width="140" height="46" rx="8" fill="#e5e7eb" stroke="#374151"/><text x="90.0" y="67.0" fill="#111" font-size="11" text-anchor="middle" font-weight="bold">Tinh bột → glucose</text><line x1="160" y1="63" x2="190" y2="63" stroke="#6b7280" stroke-width="2" marker-end="url(#ar)"/><rect x="190" y="40" width="140" height="46" rx="8" fill="#fde68a" stroke="#374151"/><text x="260.0" y="67.0" fill="#111" font-size="11" text-anchor="middle" font-weight="bold">Nấm men → ethanol + CO₂</text><text x="260" y="110" fill="#111" font-size="10" text-anchor="middle">Bánh mì, bia, rượu</text><rect x="20" y="130" width="140" height="46" rx="8" fill="#e5e7eb" stroke="#374151"/><text x="90.0" y="157.0" fill="#111" font-size="11" text-anchor="middle" font-weight="bold">Glucose → lactic acid</text><line x1="160" y1="153" x2="190" y2="153" stroke="#6b7280" stroke-width="2" marker-end="url(#ar)"/><rect x="190" y="130" width="140" height="46" rx="8" fill="#bbf7d0" stroke="#374151"/><text x="260.0" y="157.0" fill="#111" font-size="11" text-anchor="middle" font-weight="bold">Vi khuẩn lactic</text><text x="260" y="200" fill="#111" font-size="10" text-anchor="middle">Sữa chua, dưa chua</text></svg>