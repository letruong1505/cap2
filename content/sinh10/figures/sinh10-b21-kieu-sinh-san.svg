<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 150" font-family="Arial,sans-serif" font-size="13"><rect width="500" height="150" fill="#fff"/><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#6b7280"/></marker></defs><rect x="20" y="40" width="150" height="90" rx="10" fill="#f1f5f9" stroke="#334155"/><text x="95" y="68" fill="#111" font-size="11" text-anchor="middle" font-weight="bold">Phân đôi</text><text x="95" y="100" fill="#111" font-size="9" text-anchor="middle">1 tế bào → 2 tế bào giống nhau</text><rect x="185" y="40" width="150" height="90" rx="10" fill="#f1f5f9" stroke="#334155"/><text x="260" y="68" fill="#111" font-size="11" text-anchor="middle" font-weight="bold">Sinh sản bằng bào tử</text><text x="260" y="100" fill="#111" font-size="9" text-anchor="middle">Bào tử đính, đốt, tiếp hợp</text><rect x="350" y="40" width="150" height="90" rx="10" fill="#f1f5f9" stroke="#334155"/><text x="425" y="68" fill="#111" font-size="11" text-anchor="middle" font-weight="bold">Nảy chồi</text><text x="425" y="100" fill="#111" font-size="9" text-anchor="middle">Cá thể con mọc từ cơ thể mẹ</text><text x="240" y="25" fill="#111" font-size="12" text-anchor="middle" font-weight="bold">Ba hình thức sinh sản chính của vi sinh vật</text></svg>