<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 150" font-family="Arial,sans-serif" font-size="13"><rect width="430" height="150" fill="#fff"/><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#6b7280"/></marker></defs><rect x="20" y="40" width="170" height="60" rx="8" fill="#fde68a" stroke="#374151"/><text x="105.0" y="74.0" fill="#111" font-size="11" text-anchor="middle" font-weight="bold">Pha sáng (màng thylakoid)</text><text x="105" y="125" fill="#111" font-size="10" text-anchor="middle">H₂O → O₂ + electron, H⁺; tạo ATP, NADPH</text><line x1="190" y1="70" x2="230" y2="70" stroke="#6b7280" stroke-width="2" marker-end="url(#ar)"/><rect x="230" y="40" width="170" height="60" rx="8" fill="#bbf7d0" stroke="#374151"/><text x="315.0" y="74.0" fill="#111" font-size="11" text-anchor="middle" font-weight="bold">Pha tối (chu trình Calvin, chất nền)</text><text x="315" y="125" fill="#111" font-size="10" text-anchor="middle">CO₂ + ATP + NADPH → G3P → glucose</text><text x="260" y="25" fill="#111" font-size="12" text-anchor="middle" font-weight="bold">Quang hợp ở thực vật</text></svg>