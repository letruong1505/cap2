<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 180" font-family="Arial,sans-serif" font-size="13"><rect width="480" height="180" fill="#fff"/><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#6b7280"/></marker></defs><rect x="20" y="30" width="190" height="60" rx="8" fill="#e5e7eb" stroke="#374151"/><text x="115.0" y="64.0" fill="#111" font-size="12" text-anchor="middle" font-weight="bold">Lô đối chứng</text><rect x="270" y="30" width="190" height="60" rx="8" fill="#bbf7d0" stroke="#374151"/><text x="365.0" y="64.0" fill="#111" font-size="12" text-anchor="middle" font-weight="bold">Lô thí nghiệm</text><text x="115" y="108" fill="#111" font-size="11" text-anchor="middle">Giống nhau về số lượng, giống</text><text x="115" y="124" fill="#111" font-size="11" text-anchor="middle">cá thể, môi trường nuôi dưỡng</text><text x="365" y="108" fill="#111" font-size="11" text-anchor="middle">Giống đối chứng, chỉ khác yếu tố</text><text x="365" y="124" fill="#111" font-size="11" text-anchor="middle">cần nghiên cứu (biến thí nghiệm)</text><text x="240" y="160" fill="#111" font-size="12" text-anchor="middle" font-weight="bold">So sánh kết quả hai lô → ảnh hưởng của yếu tố</text></svg>