<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 150" font-family="Arial,sans-serif" font-size="13"><rect width="520" height="150" fill="#fff"/><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#6b7280"/></marker></defs><rect x="20" y="40" width="150" height="56" rx="8" fill="#dbeafe" stroke="#374151"/><text x="95.0" y="72.0" fill="#111" font-size="11" text-anchor="middle" font-weight="bold">Đường phân (tế bào chất)</text><line x1="170" y1="68" x2="183" y2="68" stroke="#6b7280" stroke-width="2" marker-end="url(#ar)"/><rect x="185" y="40" width="150" height="56" rx="8" fill="#fde68a" stroke="#374151"/><text x="260.0" y="72.0" fill="#111" font-size="11" text-anchor="middle" font-weight="bold">Chu trình Krebs (chất nền ti thể)</text><line x1="335" y1="68" x2="348" y2="68" stroke="#6b7280" stroke-width="2" marker-end="url(#ar)"/><rect x="350" y="40" width="150" height="56" rx="8" fill="#bbf7d0" stroke="#374151"/><text x="425.0" y="72.0" fill="#111" font-size="11" text-anchor="middle" font-weight="bold">Chuỗi truyền electron (màng ti thể)</text><text x="95" y="120" fill="#111" font-size="10" text-anchor="middle">Glucose → 2 pyruvate; 2 ATP; 2 NADH</text><text x="260" y="120" fill="#111" font-size="10" text-anchor="middle">Pyruvate → CO₂; 2 ATP; NADH, FADH₂</text><text x="430" y="120" fill="#111" font-size="10" text-anchor="middle">NADH, FADH₂ → ATP và H₂O (giai đoạn tạo nhiều ATP nhất)</text><text x="260" y="25" fill="#111" font-size="12" text-anchor="middle" font-weight="bold">Hô hấp tế bào hiếu khí</text></svg>