<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 180" font-family="Arial,sans-serif" font-size="13"><rect width="480" height="180" fill="#fff"/><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#6b7280"/></marker></defs><rect x="20" y="40" width="200" height="100" rx="12" fill="#dcfce7" stroke="#15803d"/><text x="120" y="30" fill="#111" font-size="12" text-anchor="middle" font-weight="bold">U lành tính</text><circle cx="120" cy="90" r="30" fill="#86efac" stroke="#15803d"/><text x="120" y="160" fill="#111" font-size="10" text-anchor="middle">Khối u ở một vị trí, không di căn</text><rect x="260" y="40" width="200" height="100" rx="12" fill="#fee2e2" stroke="#b91c1c"/><text x="360" y="30" fill="#111" font-size="12" text-anchor="middle" font-weight="bold">U ác tính (ung thư)</text><circle cx="300" cy="70" r="10" fill="#f87171" stroke="#991b1b"/><circle cx="340" cy="100" r="10" fill="#f87171" stroke="#991b1b"/><circle cx="380" cy="70" r="10" fill="#f87171" stroke="#991b1b"/><circle cx="320" cy="120" r="10" fill="#f87171" stroke="#991b1b"/><circle cx="400" cy="120" r="10" fill="#f87171" stroke="#991b1b"/><text x="360" y="160" fill="#111" font-size="10" text-anchor="middle">Tế bào xâm lấn, di căn đến nơi khác</text></svg>