<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200" font-family="Arial,sans-serif" font-size="13"><rect width="500" height="200" fill="#fff"/><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#6b7280"/></marker></defs><rect x="20" y="40" width="130" height="90" rx="6" fill="#fef3c7" stroke="#92400e"/><text x="85" y="30" fill="#111" font-size="11" text-anchor="middle" font-weight="bold">Khuếch tán đơn giản</text><rect x="20" y="75" width="130" height="8" fill="#f59e0b"/><circle cx="60" cy="60" r="5" fill="#16a34a"/><circle cx="110" cy="62" r="5" fill="#16a34a"/><text x="85" y="150" fill="#111" font-size="10" text-anchor="middle">O₂, CO₂, không phân cực</text><rect x="180" y="40" width="130" height="90" rx="6" fill="#dbeafe" stroke="#1e40af"/><text x="245" y="30" fill="#111" font-size="11" text-anchor="middle" font-weight="bold">Khuếch tán tăng cường</text><rect x="180" y="75" width="130" height="8" fill="#f59e0b"/><rect x="225" y="60" width="18" height="30" fill="#60a5fa" stroke="#1e3a8a"/><circle cx="234" cy="50" r="5" fill="#dc2626"/><text x="245" y="150" fill="#111" font-size="10" text-anchor="middle">Ion, chất phân cực qua kênh</text><rect x="340" y="40" width="130" height="90" rx="6" fill="#fce7f3" stroke="#9d174d"/><text x="405" y="30" fill="#111" font-size="11" text-anchor="middle" font-weight="bold">Vận chuyển chủ động</text><rect x="340" y="75" width="130" height="8" fill="#f59e0b"/><rect x="385" y="55" width="30" height="40" rx="5" fill="#f472b6"/><text x="405" y="150" fill="#111" font-size="10" text-anchor="middle">Bơm Na⁺–K⁺, dùng ATP</text><text x="240" y="185" fill="#111" font-size="11" text-anchor="middle">Trên trục: chiều gradient nồng độ (xuôi → không cần năng lượng; ngược → cần ATP)</text></svg>