<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 150" font-family="Arial,sans-serif" font-size="13"><rect width="500" height="150" fill="#fff"/><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#6b7280"/></marker></defs><rect x="20" y="40" width="140" height="46" rx="8" fill="#fde68a" stroke="#374151"/><text x="90.0" y="67.0" fill="#111" font-size="11" text-anchor="middle" font-weight="bold">Giảm phân → giao tử n</text><line x1="160" y1="63" x2="190" y2="63" stroke="#6b7280" stroke-width="2" marker-end="url(#ar)"/><rect x="190" y="40" width="140" height="46" rx="8" fill="#dbeafe" stroke="#374151"/><text x="260.0" y="67.0" fill="#111" font-size="11" text-anchor="middle" font-weight="bold">Thụ tinh → hợp tử 2n</text><line x1="330" y1="63" x2="360" y2="63" stroke="#6b7280" stroke-width="2" marker-end="url(#ar)"/><rect x="360" y="40" width="120" height="46" rx="8" fill="#bbf7d0" stroke="#374151"/><text x="420.0" y="67.0" fill="#111" font-size="11" text-anchor="middle" font-weight="bold">Nguyên phân → cơ thể</text><text x="240" y="25" fill="#111" font-size="11" text-anchor="middle" font-weight="bold">Giảm phân + thụ tinh + nguyên phân: nền tảng sinh sản hữu tính</text><text x="240" y="130" fill="#111" font-size="11" text-anchor="middle">Duy trì bộ NST 2n đặc trưng và tạo biến dị tổ hợp</text></svg>