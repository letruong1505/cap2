<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260" font-family="Arial,sans-serif" font-size="13"><rect width="480" height="260" fill="#fff"/><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#6b7280"/></marker></defs><rect x="120" y="40" width="120" height="50" rx="10" fill="#dbeafe" stroke="#374151"/><text x="180" y="70" fill="#111" font-size="12" text-anchor="middle" font-weight="bold">G₁</text><rect x="300" y="40" width="120" height="50" rx="10" fill="#fde68a" stroke="#374151"/><text x="360" y="70" fill="#111" font-size="12" text-anchor="middle" font-weight="bold">S</text><rect x="300" y="160" width="120" height="50" rx="10" fill="#bbf7d0" stroke="#374151"/><text x="360" y="190" fill="#111" font-size="12" text-anchor="middle" font-weight="bold">G₂</text><rect x="120" y="160" width="120" height="50" rx="10" fill="#fbcfe8" stroke="#374151"/><text x="180" y="190" fill="#111" font-size="12" text-anchor="middle" font-weight="bold">M (nguyên phân)</text><line x1="240" y1="65" x2="298" y2="65" stroke="#6b7280" stroke-width="2" marker-end="url(#ar)"/><line x1="360" y1="92" x2="360" y2="158" stroke="#6b7280" stroke-width="2" marker-end="url(#ar)"/><line x1="298" y1="185" x2="242" y2="185" stroke="#6b7280" stroke-width="2" marker-end="url(#ar)"/><line x1="120" y1="160" x2="120" y2="92" stroke="#6b7280" stroke-width="2" marker-end="url(#ar)"/><text x="240" y="25" fill="#111" font-size="11" text-anchor="middle">Kì trung gian: G₁ – S – G₂; M: nguyên phân</text><text x="240" y="240" fill="#111" font-size="10" text-anchor="middle">Điểm kiểm soát G₁/S, G₂/M, thoi phân bào</text></svg>