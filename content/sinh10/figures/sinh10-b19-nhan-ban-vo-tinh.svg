<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 150" font-family="Arial,sans-serif" font-size="13"><rect width="500" height="150" fill="#fff"/><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#6b7280"/></marker></defs><rect x="20" y="40" width="140" height="50" rx="8" fill="#fde68a" stroke="#374151"/><text x="90.0" y="69.0" fill="#111" font-size="10" text-anchor="middle" font-weight="bold">Tế bào tuyến vú cừu A (nhân)</text><line x1="160" y1="65" x2="190" y2="65" stroke="#6b7280" stroke-width="2" marker-end="url(#ar)"/><rect x="190" y="40" width="130" height="50" rx="8" fill="#dbeafe" stroke="#374151"/><text x="255.0" y="69.0" fill="#111" font-size="10" text-anchor="middle" font-weight="bold">Chuyển nhân vào trứng đã bỏ nhân</text><line x1="320" y1="65" x2="350" y2="65" stroke="#6b7280" stroke-width="2" marker-end="url(#ar)"/><rect x="350" y="40" width="130" height="50" rx="8" fill="#bbf7d0" stroke="#374151"/><text x="415.0" y="69.0" fill="#111" font-size="10" text-anchor="middle" font-weight="bold">Phôi → cấy vào tử cung → cừu nhân bản</text><text x="240" y="130" fill="#111" font-size="11" text-anchor="middle">Quy trình nhân bản vô tính động vật (ví dụ cừu Dolly, 1996)</text></svg>