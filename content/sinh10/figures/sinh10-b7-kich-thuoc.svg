<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 260" font-family="Arial,sans-serif" font-size="13"><rect width="520" height="260" fill="#fff"/><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#6b7280"/></marker></defs><rect x="200" y="30" width="6" height="26" fill="#9ca3af" rx="4"/><text x="190" y="48" fill="#111" font-size="11" text-anchor="end">Virus</text><text x="216" y="48" fill="#111" font-size="10" text-anchor="start">~0.02 μm</text><rect x="200" y="82" width="6" height="26" fill="#22c55e" rx="4"/><text x="190" y="100" fill="#111" font-size="11" text-anchor="end">Vi khuẩn (nhân sơ)</text><text x="216" y="100" fill="#111" font-size="10" text-anchor="start">~2 μm</text><rect x="200" y="134" width="60" height="26" fill="#3b82f6" rx="4"/><text x="190" y="152" fill="#111" font-size="11" text-anchor="end">Tế bào nhân thực</text><text x="270" y="152" fill="#111" font-size="10" text-anchor="start">~20 μm</text><rect x="200" y="186" width="300" height="26" fill="#f59e0b" rx="4"/><text x="190" y="204" fill="#111" font-size="11" text-anchor="end">Tế bào trứng người</text><text x="510" y="204" fill="#111" font-size="10" text-anchor="start">~100 μm</text><text x="20" y="240" fill="#111" font-size="11" text-anchor="start">Tế bào nhân sơ thường 1–5 μm, nhỏ hơn tế bào nhân thực khoảng 10 lần.</text></svg>