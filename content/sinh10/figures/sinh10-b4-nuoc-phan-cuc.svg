<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 200" font-family="Arial,sans-serif" font-size="13"><rect width="460" height="200" fill="#fff"/><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#6b7280"/></marker></defs><circle cx="150" cy="100" r="30" fill="#ef4444"/><text x="150" y="105" fill="#fff" font-size="14" text-anchor="middle" font-weight="bold">O</text><circle cx="90" cy="150" r="20" fill="#60a5fa"/><text x="90" y="155" fill="#fff" font-size="12" text-anchor="middle" font-weight="bold">H</text><circle cx="210" cy="150" r="20" fill="#60a5fa"/><text x="210" y="155" fill="#fff" font-size="12" text-anchor="middle" font-weight="bold">H</text><line x1="135" y1="120" x2="100" y2="140" stroke="#111" stroke-width="3"/><line x1="165" y1="120" x2="200" y2="140" stroke="#111" stroke-width="3"/><text x="150" y="70" fill="#b91c1c" font-size="14" text-anchor="middle" font-weight="bold">δ−</text><text x="70" y="185" fill="#1d4ed8" font-size="13" text-anchor="middle" font-weight="bold">δ+</text><text x="210" y="185" fill="#1d4ed8" font-size="13" text-anchor="middle" font-weight="bold">δ+</text><line x1="210" y1="60" x2="270" y2="60" stroke="#15803d" stroke-width="2" stroke-dasharray="5 4"/><text x="240" y="50" fill="#15803d" font-size="11" text-anchor="middle">liên kết</text><text x="240" y="66" fill="#15803d" font-size="11" text-anchor="middle">hydrogen</text><text x="320" y="100" fill="#111" font-size="12" text-anchor="start" font-weight="bold">Phân tử phân cực:</text><text x="320" y="120" fill="#111" font-size="11" text-anchor="start">O hút electron mạnh hơn H</text><text x="320" y="138" fill="#111" font-size="11" text-anchor="start">→ vùng O mang δ−, vùng H mang δ+</text></svg>