<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 160" font-family="Arial,sans-serif" font-size="13"><rect width="500" height="160" fill="#fff"/><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#6b7280"/></marker></defs><rect x="20" y="40" width="110" height="50" rx="8" fill="#dbeafe" stroke="#374151"/><text x="75.0" y="69.0" fill="#111" font-size="10" text-anchor="middle" font-weight="bold">Tế bào 2n (NST kép)</text><line x1="130" y1="65" x2="150" y2="65" stroke="#6b7280" stroke-width="2" marker-end="url(#ar)"/><rect x="150" y="40" width="120" height="50" rx="8" fill="#fde68a" stroke="#374151"/><text x="210.0" y="69.0" fill="#111" font-size="10" text-anchor="middle" font-weight="bold">Giảm phân I (giảm NST)</text><line x1="270" y1="65" x2="290" y2="65" stroke="#6b7280" stroke-width="2" marker-end="url(#ar)"/><rect x="290" y="40" width="120" height="50" rx="8" fill="#fde68a" stroke="#374151"/><text x="350.0" y="69.0" fill="#111" font-size="10" text-anchor="middle" font-weight="bold">Giảm phân II</text><line x1="410" y1="65" x2="430" y2="65" stroke="#6b7280" stroke-width="2" marker-end="url(#ar)"/><rect x="430" y="40" width="50" height="50" rx="8" fill="#bbf7d0" stroke="#374151"/><text x="455.0" y="69.0" fill="#111" font-size="10" text-anchor="middle" font-weight="bold">4 n</text><text x="240" y="130" fill="#111" font-size="11" text-anchor="middle">Kết quả: 4 tế bào n, khác nhau về tổ hợp NST; sau giảm phân → giao tử</text><text x="240" y="25" fill="#111" font-size="12" text-anchor="middle" font-weight="bold">Sơ đồ tổng quát của giảm phân</text></svg>