<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 210" font-family="Arial,sans-serif" font-size="13"><rect width="460" height="210" fill="#fff"/><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#6b7280"/></marker></defs><text x="20" y="20" fill="#111" font-size="11" text-anchor="start" font-weight="bold">Bậc 1: trình tự amino acid</text><polyline points="30,60 60,40 90,60 120,40 150,60 180,40 210,60" fill="none" stroke="#1d4ed8" stroke-width="3"/><text x="20" y="100" fill="#111" font-size="11" text-anchor="start" font-weight="bold">Bậc 2: xoắn α, gấp nếp β</text><path d="M30,140 q15,-25 30,0 t30,0 t30,0 t30,0 t30,0" fill="none" stroke="#15803d" stroke-width="3"/><text x="260" y="20" fill="#111" font-size="11" text-anchor="start" font-weight="bold">Bậc 3: cuộn gấp ba chiều</text><circle cx="340" cy="75" r="40" fill="none" stroke="#7c3aed" stroke-width="3"/><circle cx="320" cy="60" r="6" fill="#7c3aed"/><text x="260" y="140" fill="#111" font-size="11" text-anchor="start" font-weight="bold">Bậc 4: nhiều chuỗi polypeptide</text><circle cx="320" cy="170" r="14" fill="#b45309"/><circle cx="360" cy="170" r="14" fill="#b45309"/><circle cx="340" cy="195" r="14" fill="#b45309"/></svg>