<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 190" font-family="Arial,sans-serif" font-size="13"><rect width="480" height="190" fill="#fff"/><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#6b7280"/></marker></defs><rect x="190" y="10" width="100" height="36" rx="8" fill="#fde68a" stroke="#374151"/><text x="240.0" y="32.0" fill="#111" font-size="12" text-anchor="middle" font-weight="bold">Glycerol</text><line x1="240" y1="46" x2="100" y2="80" stroke="#6b7280" stroke-width="2" marker-end="url(#ar)"/><rect x="40" y="80" width="120" height="36" rx="8" fill="#bfdbfe" stroke="#374151"/><text x="100.0" y="102.0" fill="#111" font-size="12" text-anchor="middle" font-weight="bold">Acid béo 1</text><line x1="240" y1="46" x2="250" y2="80" stroke="#6b7280" stroke-width="2" marker-end="url(#ar)"/><rect x="190" y="80" width="120" height="36" rx="8" fill="#bbf7d0" stroke="#374151"/><text x="250.0" y="102.0" fill="#111" font-size="12" text-anchor="middle" font-weight="bold">Acid béo 2</text><line x1="240" y1="46" x2="400" y2="80" stroke="#6b7280" stroke-width="2" marker-end="url(#ar)"/><rect x="340" y="80" width="120" height="36" rx="8" fill="#fecaca" stroke="#374151"/><text x="400.0" y="102.0" fill="#111" font-size="12" text-anchor="middle" font-weight="bold">Acid béo 3</text><text x="240" y="150" fill="#111" font-size="12" text-anchor="middle" font-weight="bold">Triglyceride = 1 glycerol + 3 acid béo (loại 3 phân tử nước)</text><text x="240" y="172" fill="#111" font-size="11" text-anchor="middle">Acid béo no → mỡ (thể rắn); acid béo không no → dầu (thể lỏng)</text></svg>