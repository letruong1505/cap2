<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 190" font-family="Arial,sans-serif" font-size="13"><rect width="500" height="190" fill="#fff"/><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#6b7280"/></marker></defs><rect x="20" y="30" width="140" height="50" rx="8" fill="#e5e7eb" stroke="#374151"/><text x="90.0" y="59.0" fill="#111" font-size="10" text-anchor="middle" font-weight="bold">Ống 1: nước (đối chứng)</text><rect x="180" y="30" width="140" height="50" rx="8" fill="#fde68a" stroke="#374151"/><text x="250.0" y="59.0" fill="#111" font-size="10" text-anchor="middle" font-weight="bold">Ống 2: nước vôi trong</text><rect x="340" y="30" width="140" height="50" rx="8" fill="#fecaca" stroke="#374151"/><text x="410.0" y="59.0" fill="#111" font-size="10" text-anchor="middle" font-weight="bold">Ống 3: đun sôi 10 phút</text><rect x="20" y="100" width="140" height="50" rx="8" fill="#bfdbfe" stroke="#374151"/><text x="90.0" y="129.0" fill="#111" font-size="10" text-anchor="middle" font-weight="bold">Ống 4: nước đá</text><text x="240" y="115" fill="#111" font-size="10" text-anchor="middle">Thêm dịch enzyme (lõi dứa/đu đủ, dịch mầm lúa), rồi lòng trắng trứng hoặc tinh bột</text><text x="240" y="170" fill="#111" font-size="10" text-anchor="middle">So sánh thời gian và mức thay đổi; ảnh hưởng của pH, nhiệt độ đến hoạt tính enzyme</text></svg>