<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="360.0" y="26.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d2733">Dân số châu Á so với thế giới (2020)</text><circle cx="220" cy="170" r="82" fill="none" stroke="#e3e8ee" stroke-width="32"/><circle cx="220" cy="170" r="82" fill="none" stroke="#e15759" stroke-width="32" stroke-dasharray="306.6 208.7" transform="rotate(-90 220 170)"/><text x="220.0" y="176.0" text-anchor="middle" font-size="24" font-weight="bold" fill="#1d2733">59,5%</text><text x="520.0" y="120.0" text-anchor="start" font-size="14" font-weight="normal" fill="#1d2733">Châu Á: 4 641,1 triệu người,</text><text x="520.0" y="136.0" text-anchor="start" font-size="14" font-weight="normal" fill="#1d2733">chiếm 59,5% dân số thế giới.</text><text x="520.0" y="190.0" text-anchor="start" font-size="14" font-weight="normal" fill="#1d2733">Châu Á là châu lục đông dân</text><text x="520.0" y="206.0" text-anchor="start" font-size="14" font-weight="normal" fill="#1d2733">nhất thế giới.</text></svg>