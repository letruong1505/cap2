<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 310" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="360.0" y="26.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d2733">Liên minh châu Âu trong nền kinh tế thế giới</text><circle cx="190" cy="160" r="72" fill="none" stroke="#e3e8ee" stroke-width="26"/><circle cx="190" cy="160" r="72" fill="none" stroke="#4e79a7" stroke-width="26" stroke-dasharray="81.0 371.4" transform="rotate(-90 190 160)"/><text x="190.0" y="166.0" text-anchor="middle" font-size="22" font-weight="bold" fill="#1d2733">17,9%</text><text x="190.0" y="268.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">Tỉ trọng GDP của EU trong GDP toàn</text><text x="190.0" y="284.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">thế giới (GDP EU 15 192,6 tỉ USD;</text><text x="190.0" y="300.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">thế giới 84 705,4 tỉ USD)</text><circle cx="540" cy="160" r="72" fill="none" stroke="#e3e8ee" stroke-width="26"/><circle cx="540" cy="160" r="72" fill="none" stroke="#f28e2b" stroke-width="26" stroke-dasharray="140.2 312.1" transform="rotate(-90 540 160)"/><text x="540.0" y="166.0" text-anchor="middle" font-size="20" font-weight="bold" fill="#1d2733">Trên 31%</text><text x="540.0" y="268.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">Tỉ trọng EU trong xuất khẩu hàng</text><text x="540.0" y="284.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">hoá của thế giới</text></svg>