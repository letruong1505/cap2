<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 194" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="360.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Hai giai đoạn của xã hội nguyên thuỷ</text><rect x="14.0" y="50.0" width="324.0" height="126.0" rx="10" fill="#e8f1fa" stroke="#4e79a7" stroke-width="2.5"/><text x="176.0" y="76.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2733">Bầy người nguyên thuỷ</text><text x="176.0" y="100.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#3b4856">Thời Người tối cổ</text><text x="176.0" y="118.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#3b4856">Sống theo bầy, có người đứng đầu</text><line x1="344.0" y1="113.0" x2="376.0" y2="113.0" stroke="#1d2733" stroke-width="3" marker-end="url(#ar)"/><rect x="382.0" y="50.0" width="324.0" height="126.0" rx="10" fill="#fdf1e0" stroke="#f28e2b" stroke-width="2.5"/><text x="544.0" y="76.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2733">Công xã thị tộc</text><text x="544.0" y="100.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#3b4856">Thời Người tinh khôn</text><text x="544.0" y="118.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#3b4856">Gồm các gia đình có quan hệ huyết thống</text><text x="544.0" y="136.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#3b4856">Nhiều thị tộc hợp thành bộ lạc</text><text x="544.0" y="154.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#3b4856">Làm chung, hưởng chung</text></svg>