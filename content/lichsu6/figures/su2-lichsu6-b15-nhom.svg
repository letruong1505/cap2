<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 208" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="360.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Chính sách cai trị của phương Bắc (từ năm 179 TCN đến năm 938)</text><rect x="14.0" y="44.0" width="221.3" height="142.0" rx="8" fill="#e8f1fa" stroke="#4e79a7" stroke-width="2"/><path d="M14.0,44.0 h0.0 v0.0 h-0.0 z" fill="#4e79a7" opacity="0"/><rect x="14.0" y="44.0" width="221.3" height="36.0" rx="8" fill="#4e79a7" stroke="#4e79a7" stroke-width="2"/><text x="124.7" y="67.0" text-anchor="middle" font-size="14" font-weight="bold" fill="white">Chính trị</text><text x="26.0" y="102.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">• Chia nước ta thành các quận,</text><text x="26.0" y="119.5" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">  huyện</text><text x="26.0" y="141.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">• Sáp nhập vào lãnh thổ Trung</text><text x="26.0" y="158.5" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">  Quốc</text><rect x="249.3" y="44.0" width="221.3" height="142.0" rx="8" fill="#fdf1e0" stroke="#f28e2b" stroke-width="2"/><path d="M249.3,44.0 h0.0 v0.0 h-0.0 z" fill="#f28e2b" opacity="0"/><rect x="249.3" y="44.0" width="221.3" height="36.0" rx="8" fill="#f28e2b" stroke="#f28e2b" stroke-width="2"/><text x="360.0" y="67.0" text-anchor="middle" font-size="14" font-weight="bold" fill="white">Kinh tế</text><text x="261.3" y="102.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">• Bóc lột nặng nề bằng tô thuế</text><text x="261.3" y="123.5" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">• Cống nạp sản vật quý</text><text x="261.3" y="145.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">• Nắm độc quyền muối, sắt</text><rect x="484.7" y="44.0" width="221.3" height="142.0" rx="8" fill="#e6f0df" stroke="#59a14f" stroke-width="2"/><path d="M484.7,44.0 h0.0 v0.0 h-0.0 z" fill="#59a14f" opacity="0"/><rect x="484.7" y="44.0" width="221.3" height="36.0" rx="8" fill="#59a14f" stroke="#59a14f" stroke-width="2"/><text x="595.3" y="67.0" text-anchor="middle" font-size="14" font-weight="bold" fill="white">Văn hoá</text><text x="496.7" y="102.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">• Đưa người Hán sang ở</text><text x="496.7" y="123.5" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">• Truyền bá Nho giáo, chữ Hán</text><text x="496.7" y="145.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">• Truyền bá phong tục Hán nhằm</text><text x="496.7" y="162.5" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">  đồng hoá</text></svg>