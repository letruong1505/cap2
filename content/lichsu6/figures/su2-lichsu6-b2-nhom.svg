<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 226" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="360.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Các loại tư liệu lịch sử</text><rect x="14.0" y="44.0" width="221.3" height="138.0" rx="8" fill="#e8f1fa" stroke="#4e79a7" stroke-width="2"/><path d="M14.0,44.0 h0.0 v0.0 h-0.0 z" fill="#4e79a7" opacity="0"/><rect x="14.0" y="44.0" width="221.3" height="36.0" rx="8" fill="#4e79a7" stroke="#4e79a7" stroke-width="2"/><text x="124.7" y="67.0" text-anchor="middle" font-size="14" font-weight="bold" fill="white">Tư liệu truyền miệng</text><text x="26.0" y="102.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">• Lời kể truyền từ đời này sang</text><text x="26.0" y="119.5" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">  đời khác</text><text x="26.0" y="141.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">• Truyền thuyết, ca dao, tục ngữ</text><rect x="249.3" y="44.0" width="221.3" height="138.0" rx="8" fill="#fdf1e0" stroke="#f28e2b" stroke-width="2"/><path d="M249.3,44.0 h0.0 v0.0 h-0.0 z" fill="#f28e2b" opacity="0"/><rect x="249.3" y="44.0" width="221.3" height="36.0" rx="8" fill="#f28e2b" stroke="#f28e2b" stroke-width="2"/><text x="360.0" y="67.0" text-anchor="middle" font-size="14" font-weight="bold" fill="white">Tư liệu hiện vật</text><text x="261.3" y="102.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">• Di tích, đồ vật người xưa để</text><text x="261.3" y="119.5" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">  lại trong lòng đất hay trên</text><text x="261.3" y="137.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">  mặt đất</text><text x="261.3" y="158.5" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">• Trống đồng, đồ gốm, công cụ đá</text><rect x="484.7" y="44.0" width="221.3" height="138.0" rx="8" fill="#e6f0df" stroke="#59a14f" stroke-width="2"/><path d="M484.7,44.0 h0.0 v0.0 h-0.0 z" fill="#59a14f" opacity="0"/><rect x="484.7" y="44.0" width="221.3" height="36.0" rx="8" fill="#59a14f" stroke="#59a14f" stroke-width="2"/><text x="595.3" y="67.0" text-anchor="middle" font-size="14" font-weight="bold" fill="white">Tư liệu chữ viết</text><text x="496.7" y="102.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">• Bản ghi, sách in, khắc, chép</text><text x="496.7" y="119.5" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">  tay còn lưu lại</text><text x="496.7" y="141.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">• Bia đá, sắc phong, sách sử</text><text x="360.0" y="206.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a56a0">Tư liệu gốc: ra đời vào thời điểm sự kiện diễn ra, là nguồn đáng tin cậy nhất.</text></svg>