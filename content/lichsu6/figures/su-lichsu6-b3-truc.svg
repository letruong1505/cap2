<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 285" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="360.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Trục thời gian: trước Công nguyên và Công nguyên</text><line x1="30.0" y1="130.0" x2="690.0" y2="130.0" stroke="#1d2733" stroke-width="3" marker-end="url(#ar)"/><line x1="360.0" y1="108.0" x2="360.0" y2="152.0" stroke="#e15759" stroke-width="3"/><text x="360.0" y="100.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#e15759">Năm 1 CN</text><text x="200.0" y="100.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a56a0">Trước Công nguyên (TCN)</text><text x="540.0" y="100.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a56a0">Công nguyên (CN)</text><text x="200.0" y="176.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#3b4856">← càng xa, năm TCN càng lớn</text><text x="540.0" y="176.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#3b4856">năm càng lớn → càng gần hiện tại</text><text x="360.0" y="210.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#e15759">Không có năm 0</text><text x="360.0" y="240.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#3b4856">Thế kỉ I: năm 1 – 100; thế kỉ XXI: năm 2001 – 2100</text><text x="360.0" y="258.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#3b4856">1 thập kỉ = 10 năm; 1 thế kỉ = 100 năm; 1 thiên niên kỉ = 1 000 năm</text></svg>