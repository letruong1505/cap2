<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 176" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="360.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Quá trình tiến hoá của loài người</text><rect x="14.0" y="50.0" width="201.3" height="108.0" rx="10" fill="#e8f1fa" stroke="#4e79a7" stroke-width="2.5"/><text x="114.7" y="76.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2733">Vượn người</text><text x="114.7" y="100.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#3b4856">Cách đây khoảng 5 – 6 triệu</text><text x="114.7" y="118.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#3b4856">năm</text><line x1="221.3" y1="104.0" x2="253.3" y2="104.0" stroke="#1d2733" stroke-width="3" marker-end="url(#ar)"/><rect x="259.3" y="50.0" width="201.3" height="108.0" rx="10" fill="#fdf1e0" stroke="#f28e2b" stroke-width="2.5"/><text x="360.0" y="76.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2733">Người tối cổ</text><text x="360.0" y="100.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#3b4856">Khoảng 4 triệu năm trước</text><text x="360.0" y="118.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#3b4856">Đi bằng hai chân, biết chế</text><text x="360.0" y="136.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#3b4856">tạo công cụ</text><line x1="466.7" y1="104.0" x2="498.7" y2="104.0" stroke="#1d2733" stroke-width="3" marker-end="url(#ar)"/><rect x="504.7" y="50.0" width="201.3" height="108.0" rx="10" fill="#e6f0df" stroke="#59a14f" stroke-width="2.5"/><text x="605.3" y="76.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2733">Người tinh khôn</text><text x="605.3" y="100.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#3b4856">Khoảng 150 000 năm trước</text><text x="605.3" y="118.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#3b4856">Cơ thể như người ngày nay</text></svg>