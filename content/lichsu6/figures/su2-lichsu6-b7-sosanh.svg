<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 243" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="360.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Ai Cập và Lưỡng Hà cổ đại</text><rect x="14.0" y="44.0" width="110.0" height="32.0" rx="0" fill="#dbe7f3" stroke="#1d2733" stroke-width="1.2"/><text x="69.0" y="65.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2733"></text><rect x="124.0" y="44.0" width="290.0" height="32.0" rx="0" fill="#4e79a7" stroke="#1d2733" stroke-width="1.2"/><text x="269.0" y="65.0" text-anchor="middle" font-size="14" font-weight="bold" fill="white">Ai Cập</text><rect x="414.0" y="44.0" width="290.0" height="32.0" rx="0" fill="#4e79a7" stroke="#1d2733" stroke-width="1.2"/><text x="559.0" y="65.0" text-anchor="middle" font-size="14" font-weight="bold" fill="white">Lưỡng Hà</text><rect x="14.0" y="76.0" width="110.0" height="29.5" rx="0" fill="#eef1f4" stroke="#9aa5b1" stroke-width="1"/><text x="22.0" y="94.0" text-anchor="start" font-size="12" font-weight="bold" fill="#1d2733">Vị trí</text><rect x="124.0" y="76.0" width="290.0" height="29.5" rx="0" fill="#f7fafd" stroke="#9aa5b1" stroke-width="1"/><text x="132.0" y="94.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">Đông Bắc châu Phi, có sông Nin</text><rect x="414.0" y="76.0" width="290.0" height="29.5" rx="0" fill="#f7fafd" stroke="#9aa5b1" stroke-width="1"/><text x="422.0" y="94.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">Giữa sông Ơ-phrát và sông Ti-grơ (Tây Á)</text><rect x="14.0" y="105.5" width="110.0" height="47.0" rx="0" fill="#eef1f4" stroke="#9aa5b1" stroke-width="1"/><text x="22.0" y="123.5" text-anchor="start" font-size="12" font-weight="bold" fill="#1d2733">Nhà nước</text><rect x="124.0" y="105.5" width="290.0" height="47.0" rx="0" fill="white" stroke="#9aa5b1" stroke-width="1"/><text x="132.0" y="123.5" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">Khoảng năm 3200 TCN vua Mê-nét thống nhất;</text><text x="132.0" y="141.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">người đứng đầu là Pha-ra-ông</text><rect x="414.0" y="105.5" width="290.0" height="47.0" rx="0" fill="white" stroke="#9aa5b1" stroke-width="1"/><text x="422.0" y="123.5" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">Người Xu-me lập các thành bang khoảng</text><text x="422.0" y="141.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">thiên niên kỉ IV TCN; đứng đầu là En-xi</text><rect x="14.0" y="152.5" width="110.0" height="29.5" rx="0" fill="#eef1f4" stroke="#9aa5b1" stroke-width="1"/><text x="22.0" y="170.5" text-anchor="start" font-size="12" font-weight="bold" fill="#1d2733">Chữ viết</text><rect x="124.0" y="152.5" width="290.0" height="29.5" rx="0" fill="#f7fafd" stroke="#9aa5b1" stroke-width="1"/><text x="132.0" y="170.5" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">Chữ tượng hình, viết trên giấy pa-pi-rút</text><rect x="414.0" y="152.5" width="290.0" height="29.5" rx="0" fill="#f7fafd" stroke="#9aa5b1" stroke-width="1"/><text x="422.0" y="170.5" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">Chữ hình nêm trên đất sét</text><rect x="14.0" y="182.0" width="110.0" height="47.0" rx="0" fill="#eef1f4" stroke="#9aa5b1" stroke-width="1"/><text x="22.0" y="200.0" text-anchor="start" font-size="12" font-weight="bold" fill="#1d2733">Thành tựu</text><rect x="124.0" y="182.0" width="290.0" height="47.0" rx="0" fill="white" stroke="#9aa5b1" stroke-width="1"/><text x="132.0" y="200.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">Hình học, hệ đếm thập phân, kim tự tháp,</text><text x="132.0" y="217.5" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">ướp xác</text><rect x="414.0" y="182.0" width="290.0" height="47.0" rx="0" fill="white" stroke="#9aa5b1" stroke-width="1"/><text x="422.0" y="200.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">Hệ đếm 60, lịch âm, vườn treo Ba-bi-lon,</text><text x="422.0" y="217.5" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">Bộ luật Ham-mu-ra-bi</text></svg>