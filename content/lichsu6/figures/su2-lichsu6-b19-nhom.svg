<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 234" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="360.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Vương quốc Chăm-pa</text><rect x="14.0" y="44.0" width="339.0" height="146.0" rx="8" fill="#e8f1fa" stroke="#4e79a7" stroke-width="2"/><path d="M14.0,44.0 h0.0 v0.0 h-0.0 z" fill="#4e79a7" opacity="0"/><rect x="14.0" y="44.0" width="339.0" height="36.0" rx="8" fill="#4e79a7" stroke="#4e79a7" stroke-width="2"/><text x="183.5" y="67.0" text-anchor="middle" font-size="14" font-weight="bold" fill="white">Kinh tế</text><text x="26.0" y="102.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">• Trồng lúa nước trên ruộng bậc thang, làm guồng</text><text x="26.0" y="119.5" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">  nước</text><text x="26.0" y="141.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">• Khai thác lâm sản (trầm hương, ngà voi)</text><text x="26.0" y="162.5" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">• Đánh cá, buôn bán đường biển, làm gốm</text><rect x="367.0" y="44.0" width="339.0" height="146.0" rx="8" fill="#fdf1e0" stroke="#f28e2b" stroke-width="2"/><path d="M367.0,44.0 h0.0 v0.0 h-0.0 z" fill="#f28e2b" opacity="0"/><rect x="367.0" y="44.0" width="339.0" height="36.0" rx="8" fill="#f28e2b" stroke="#f28e2b" stroke-width="2"/><text x="536.5" y="67.0" text-anchor="middle" font-size="14" font-weight="bold" fill="white">Văn hoá</text><text x="379.0" y="102.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">• Chữ viết bắt nguồn từ chữ Phạn</text><text x="379.0" y="123.5" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">• Hin-đu giáo và Phật giáo</text><text x="379.0" y="145.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">• Đền tháp (Mỹ Sơn, tháp Pô Na-ga)</text><text x="379.0" y="166.5" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">• Tục hoả táng người chết</text><text x="360.0" y="214.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a56a0">Năm 192: Khu Liên lập nước Lâm Ấp, sau đổi là Chăm-pa.</text></svg>