<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="360.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">3/5 của 20 là 12  —  và ngược lại, 3/5 của số nào là 12?</text><rect x="60.0" y="70.0" width="120.0" height="44.0" rx="0" fill="#6fbf5a" stroke="#1d2733" stroke-width="1.4"/><rect x="180.0" y="70.0" width="120.0" height="44.0" rx="0" fill="#6fbf5a" stroke="#1d2733" stroke-width="1.4"/><rect x="300.0" y="70.0" width="120.0" height="44.0" rx="0" fill="#6fbf5a" stroke="#1d2733" stroke-width="1.4"/><rect x="420.0" y="70.0" width="120.0" height="44.0" rx="0" fill="white" stroke="#1d2733" stroke-width="1.4"/><rect x="540.0" y="70.0" width="120.0" height="44.0" rx="0" fill="white" stroke="#1d2733" stroke-width="1.4"/><text x="120.0" y="98.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d2733">4</text><text x="240.0" y="98.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d2733">4</text><text x="360.0" y="98.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d2733">4</text><text x="480.0" y="98.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d2733">4</text><text x="600.0" y="98.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d2733">4</text><text x="360.0" y="62.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#3b4856">Cả thanh = 20 (chia 5 phần, mỗi phần 4)</text><text x="240.0" y="140.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f6b2a">3 phần = 12</text><text x="360.0" y="190.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a56a0">20 · 3/5 = 12   (tìm m/n của số a: a · m/n)</text><text x="360.0" y="218.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a56a0">12 : 3/5 = 20   (biết m/n của số đó bằng b: b : m/n)</text></svg>