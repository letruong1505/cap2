<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 228" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="360.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Quy tắc dấu ngoặc</text><rect x="30.0" y="56.0" width="320.0" height="150.0" rx="10" fill="#eaf5e4" stroke="#1d2733" stroke-width="1.6"/><text x="190.0" y="82.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Dấu "+" đứng trước: giữ nguyên dấu</text><text x="190.0" y="124.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d2733">a + (b − c) = a + b − c</text><text x="190.0" y="166.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#3b4856">10 + (3 − 1) = 10 + 3 − 1 = 12</text><rect x="370.0" y="56.0" width="320.0" height="150.0" rx="10" fill="#fdecec" stroke="#1d2733" stroke-width="1.6"/><text x="530.0" y="82.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Dấu "−" đứng trước: đổi dấu tất cả</text><text x="530.0" y="124.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d2733">a − (b − c) = a − b + c</text><text x="530.0" y="166.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#3b4856">10 − (3 − 1) = 10 − 3 + 1 = 8</text></svg>