<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 332" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="360.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Dấu hiệu chia hết cho 2, 5, 3, 9 (ví dụ 135 và 246)</text><rect x="30.0" y="52.0" width="150.0" height="50.0" rx="8" fill="#e8f1fa" stroke="#1d2733" stroke-width="1.6"/><text x="105.0" y="83.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2733">Chia hết cho 2</text><rect x="186.0" y="52.0" width="250.0" height="50.0" rx="8" fill="white" stroke="#1d2733" stroke-width="1.4"/><text x="311.0" y="82.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">chữ số tận cùng chẵn (0, 2, 4, 6, 8)</text><rect x="442.0" y="52.0" width="250.0" height="50.0" rx="8" fill="#fbf0c9" stroke="#1d2733" stroke-width="1.4"/><text x="567.0" y="82.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">246 ✓   135 ✗</text><rect x="30.0" y="114.0" width="150.0" height="50.0" rx="8" fill="#e8f1fa" stroke="#1d2733" stroke-width="1.6"/><text x="105.0" y="145.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2733">Chia hết cho 5</text><rect x="186.0" y="114.0" width="250.0" height="50.0" rx="8" fill="white" stroke="#1d2733" stroke-width="1.4"/><text x="311.0" y="144.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">chữ số tận cùng là 0 hoặc 5</text><rect x="442.0" y="114.0" width="250.0" height="50.0" rx="8" fill="#fbf0c9" stroke="#1d2733" stroke-width="1.4"/><text x="567.0" y="144.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">135 ✓   246 ✗</text><rect x="30.0" y="176.0" width="150.0" height="50.0" rx="8" fill="#e8f1fa" stroke="#1d2733" stroke-width="1.6"/><text x="105.