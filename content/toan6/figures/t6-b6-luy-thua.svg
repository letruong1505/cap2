<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 264" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="360.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Luỹ thừa: bình phương và lập phương</text><text x="180.0" y="58.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2733">3² = 3 · 3 = 9</text><rect x="120.0" y="78.0" width="32.0" height="32.0" rx="0" fill="#8fc1ee" stroke="#1d2733" stroke-width="1.4"/><rect x="156.0" y="78.0" width="32.0" height="32.0" rx="0" fill="#8fc1ee" stroke="#1d2733" stroke-width="1.4"/><rect x="192.0" y="78.0" width="32.0" height="32.0" rx="0" fill="#8fc1ee" stroke="#1d2733" stroke-width="1.4"/><rect x="120.0" y="114.0" width="32.0" height="32.0" rx="0" fill="#8fc1ee" stroke="#1d2733" stroke-width="1.4"/><rect x="156.0" y="114.0" width="32.0" height="32.0" rx="0" fill="#8fc1ee" stroke="#1d2733" stroke-width="1.4"/><rect x="192.0" y="114.0" width="32.0" height="32.0" rx="0" fill="#8fc1ee" stroke="#1d2733" stroke-width="1.4"/><rect x="120.0" y="150.0" width="32.0" height="32.0" rx="0" fill="#8fc1ee" stroke="#1d2733" stroke-width="1.4"/><rect x="156.0" y="150.0" width="32.0" height="32.0" rx="0" fill="#8fc1ee" stroke="#1d2733" stroke-width="1.4"/><rect x="192.0" y="150.0" width="32.0" height="32.0" rx="0" fill="#8fc1ee" stroke="#1d2733" stroke-width="1.4"/><text x="180.0" y="205.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#3b4856">hình vuông cạnh 3 có 9 ô</text><text x="500.0" y="58.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2733">2³ = 2 · 2 · 2 = 8</text><rect x="430.0" y="100.0" width="28.0" height="28.0" rx="0" fill="#8fc1ee" stroke="#1d2733" stroke-width="1.4"/><rect x="460.0" y="100.0" width="28.0" height="28.0" rx="0" fill="#8fc1ee" stroke="#1d2733" stroke-width="1.4"/><rect x="430.0" y="130.0" width="28.0" height="28.0" rx="0" fill="#8fc1ee" stroke="#1d2733" stroke-width="1.4"/><rect x="460.0" y="130.0" width="28.0" height="28.0" rx="0" fill="#8fc1ee" stroke="#1d2733" stroke-width="1.4"/><rect x="526.0" y="100.0" width="28.0" height="28.0" rx="0" fill="#f2a33a" stroke="#1d2733" stroke-width="1.4"/><rect x="556.0" y="100.0" width="28.0" height="28.0" rx="0" fill="#f2a33a" stroke="#1d2733" stroke-width="1.4"/><rect x="526.0" y="130.0" width="28.0" height="28.0" rx="0" fill="#f2a33a" stroke="#1d2733" stroke-width="1.4"/><rect x="556.0" y="130.0" width="28.0" height="28.0" rx="0" fill="#f2a33a" stroke="#1d2733" stroke-width="1.4"/><text x="517.0" y="128.0" text-anchor="middle" font-size="22" font-weight="bold" fill="#1d2733">+</text><text x="520.0" y="205.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#3b4856">khối lập phương cạnh 2: 2 lớp, mỗi lớp 4 khối = 8</text><text x="360.0" y="244.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a56a0">aⁿ = a · a · … · a (n thừa số a);  a là cơ số, n là số mũ</text></svg>