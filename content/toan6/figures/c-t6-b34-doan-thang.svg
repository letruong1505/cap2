<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 228" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="360.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Đoạn thẳng và độ dài đoạn thẳng</text><line x1="70.0" y1="100.0" x2="650.0" y2="100.0" stroke="#1d2733" stroke-width="3"/><circle cx="70.0" cy="100.0" r="5.0" fill="#1d2733" stroke="#1d2733" stroke-width="1"/><text x="70.0" y="86.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d2733">A</text><circle cx="298.0" cy="100.0" r="5.0" fill="#1d2733" stroke="#1d2733" stroke-width="1"/><text x="298.0" y="86.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d2733">M</text><circle cx="650.0" cy="100.0" r="5.0" fill="#1d2733" stroke="#1d2733" stroke-width="1"/><text x="650.0" y="86.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d2733">B</text><polyline points="70.0,122.0 70.0,130.0 298.0,130.0 298.0,122.0" fill="none" stroke="#1d2733" stroke-width="1.5" stroke-linejoin="round"/><text x="184.0" y="152.0" text-anchor="middle" font-size="14" font-weight="normal" fill="#1d2733">AM = 3 cm</text><polyline points="298.0,122.0 298.0,130.0 650.0,130.0 650.0,122.0" fill="none" stroke="#1d2733" stroke-width="1.5" stroke-linejoin="round"/><text x="474.0" y="152.0" text-anchor="middle" font-size="14" font-weight="normal" fill="#1d2733">MB = 5 cm</text><polyline points="70.0,170.0 70.0,178.0 650.0,178.0 650.0,170.0" fill="none" stroke="#1d2733" stroke-width="1.5" stroke-linejoin="round"/><text x="360.0" y="200.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2733">AB = AM + MB = 3 + 5 = 8 cm</text></svg>