<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 266" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="360.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Công thức chu vi và diện tích một số tứ giác</text><polygon points="20.0,60.0 100.0,60.0 100.0,140.0 20.0,140.0" fill="#eaf1f8" stroke="#1d2733" stroke-width="2.2" stroke-linejoin="round"/><text x="60.0" y="54.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2733">a</text><text x="112.0" y="105.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2733">a</text><text x="60.0" y="172.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">Hình vuông</text><text x="60.0" y="189.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">S = a²</text><text x="60.0" y="206.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">C = 4a</text><polygon points="150.0,70.0 270.0,70.0 270.0,140.0 150.0,140.0" fill="#eaf1f8" stroke="#1d2733" stroke-width="2.2" stroke-linejoin="round"/><text x="210.0" y="62.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2733">a</text><text x="282.0" y="109.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2733">b</text><text x="210.0" y="172.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">Hình chữ nhật</text><text x="210.0" y="189.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">S = a · b</text><text x="210.0" y="206.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">C = 2(a + b)</text><polygon points="320.0,140.0 440.0,140.0 415.0,70.0 350.0,70.0" fill="#eaf1f8" stroke="#1d2733" stroke-width="2.2" stroke-linejoin="round"/><line x1="375.0" y1="70.0" x2="375.0" y2="140.0" stroke="#e15759" stroke-width="1.5" stroke-dasharray="4 3"/><polyline points="383.0,140.0 383.0,132.0 375.0,132.0" fill="none" stroke="#1d2733" stroke-width="1.5" stroke-linejoin="round"/><text x="383.0" y="62.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2733">a</text><text x="380.0" y="158.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2733">b</text><text x="381.0" y="108.0" text-anchor="start" font-size="14" font-weight="bold" fill="#1d2733">h</text><text x="380.0" y="185.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">Hình thang</text><text x="380.0" y="202.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">S = (a + b) · h : 2</text><polygon points="470.0,140.0 570.0,140.0 600.0,70.0 500.0,70.0" fill="#eaf1f8" stroke="#1d2733" stroke-width="2.2" stroke-linejoin="round"/><line x1="500.0" y1="70.0" x2="500.0" y2="140.0" stroke="#e15759" stroke-width="1.5" stroke-dasharray="4 3"/><polyline points="508.0,140.0 508.0,132.0 500.0,132.0" fill="none" stroke="#1d2733" stroke-width="1.5" stroke-linejoin="round"/><text x="520.0" y="160.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2733">a</text><text x="490.0" y="108.0" text-anchor="end" font-size="14" font-weight="bold" fill="#1d2733">h</text><text x="535.0" y="185.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">Hình bình hành</text><text x="535.0" y="202.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">S = a · h</text><polygon points="665.0,65.0 710.0,105.0 665.0,145.0 620.0,105.0" fill="#eaf1f8" stroke="#1d2733" stroke-width="2.2" stroke-linejoin="round"/><line x1="665.0" y1="65.0" x2="665.0" y2="145.0" stroke="#e15759" stroke-width="1.5" stroke-dasharray="4 3"/><line x1="710.0" y1="105.0" x2="620.0" y2="105.0" stroke="#e15759" stroke-width="1.5" stroke-dasharray="4 3"/><text x="673.0" y="93.0" text-anchor="start" font-size="14" font-weight="bold" fill="#1d2733">n</text><text x="687.0" y="123.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2733">m</text><text x="665.0" y="185.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">Hình thoi</text><text x="665.0" y="202.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">S = m · n : 2</text><text x="360.0" y="250.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#444">Chu vi hình bình hành, hình thang, hình thoi bằng tổng độ dài các cạnh.</text></svg>