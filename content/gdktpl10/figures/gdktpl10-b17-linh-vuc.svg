<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 230" font-family="Arial,sans-serif" font-size="13"><defs><pattern id="grid-gdktpl10b17linhvuc" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#cbd5e1" stroke-width="0.8"/></pattern></defs><rect width="500" height="230" fill="#f8fafc"/><rect width="500" height="230" fill="url(#grid-gdktpl10b17linhvuc)"/><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#6b7280"/></marker></defs><text x="240" y="20" fill="#111" font-size="12" text-anchor="middle" font-weight="bold">Hiến pháp 2013 về các lĩnh vực</text><rect x="10" y="40" width="150" height="76" rx="8" fill="#dbeafe" stroke="#374151"/><text x="85.0" y="68.0" fill="#111" font-size="9" text-anchor="middle" font-weight="bold">Kinh tế</text><text x="85.0" y="81.0" fill="#111" font-size="9" text-anchor="middle">Thị trường định hướng XHCN,</text><text x="85.0" y="94.0" fill="#111" font-size="9" text-anchor="middle">kinh tế nhà nước giữ vai trò chủ đạo</text><rect x="170" y="40" width="150" height="76" rx="8" fill="#dcfce7" stroke="#374151"/><text x="245.0" y="68.0" fill="#111" font-size="9" text-anchor="middle" font-weight="bold">Văn hoá – xã hội</text><text x="245.0" y="81.0" fill="#111" font-size="9" text-anchor="middle">An sinh, việc làm,</text><text x="245.0" y="94.0" fill="#111" font-size="9" text-anchor="middle">bảo hiểm y tế toàn dân</text><rect x="330" y="40" width="150" height="76" rx="8" fill="#fde68a" stroke="#374151"/><text x="405.0" y="68.0" fill="#111" font-size="9" text-anchor="middle" font-weight="bold">Giáo dục</text><text x="405.0" y="81.0" fill="#111" font-size="9" text-anchor="middle">Quốc sách hàng đầu,</text><text x="405.0" y="94.0" fill="#111" font-size="9" text-anchor="middle">tiểu học bắt buộc, không thu học phí</text><rect x="10" y="130" width="150" height="76" rx="8" fill="#fbcfe8" stroke="#374151"/><text x="85.0" y="158.0" fill="#111" font-size="9" text-anchor="middle" font-weight="bold">Khoa học – công nghệ</text><text x="85.0" y="171.0" fill="#111" font-size="9" text-anchor="middle">Quốc sách hàng đầu,</text><text x="85.0" y="184.0" fill="#111" font-size="9" text-anchor="middle">bảo hộ sở hữu trí tuệ</text><rect x="170" y="130" width="150" height="76" rx="8" fill="#e9d5ff" stroke="#374151"/><text x="245.0" y="158.0" fill="#111" font-size="9" text-anchor="middle" font-weight="bold">Môi trường</text><text x="245.0" y="171.0" fill="#111" font-size="9" text-anchor="middle">Bảo vệ môi trường,</text><text x="245.0" y="184.0" fill="#111" font-size="9" text-anchor="middle">phòng chống thiên tai, ứng phó biến đổi khí hậu</text></svg>