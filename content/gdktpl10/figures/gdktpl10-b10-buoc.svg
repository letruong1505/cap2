<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 150" font-family="Arial,sans-serif" font-size="13"><defs><pattern id="grid-gdktpl10b10buoc" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#cbd5e1" stroke-width="0.8"/></pattern></defs><rect width="500" height="150" fill="#f8fafc"/><rect width="500" height="150" fill="url(#grid-gdktpl10b10buoc)"/><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#6b7280"/></marker></defs><text x="240" y="20" fill="#111" font-size="12" text-anchor="middle" font-weight="bold">Bốn bước lập kế hoạch tài chính cá nhân</text><rect x="10" y="40" width="110" height="60" rx="8" fill="#dbeafe" stroke="#374151"/><text x="65.0" y="73.0" fill="#111" font-size="9" text-anchor="middle" font-weight="bold">1. Xác định mục tiêu</text><line x1="120" y1="70" x2="130" y2="70" stroke="#6b7280" stroke-width="2" marker-end="url(#ar)"/><rect x="130" y="40" width="110" height="60" rx="8" fill="#dcfce7" stroke="#374151"/><text x="185.0" y="73.0" fill="#111" font-size="9" text-anchor="middle" font-weight="bold">2. Theo dõi, kiểm soát thu chi</text><line x1="240" y1="70" x2="250" y2="70" stroke="#6b7280" stroke-width="2" marker-end="url(#ar)"/><rect x="250" y="40" width="110" height="60" rx="8" fill="#fde68a" stroke="#374151"/><text x="305.0" y="73.0" fill="#111" font-size="9" text-anchor="middle" font-weight="bold">3. Thiết lập quy tắc thu chi</text><line x1="360" y1="70" x2="370" y2="70" stroke="#6b7280" stroke-width="2" marker-end="url(#ar)"/><rect x="370" y="40" width="110" height="60" rx="8" fill="#fbcfe8" stroke="#374151"/><text x="425.0" y="73.0" fill="#111" font-size="9" text-anchor="middle" font-weight="bold">4. Tuân thủ và điều chỉnh</text><text x="240" y="130" fill="#111" font-size="10" text-anchor="middle">Quy tắc 80/13/7: 80% thiết yếu, 13% phát sinh, 7% tiết kiệm</text></svg>