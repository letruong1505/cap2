<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 160" font-family="Arial,sans-serif" font-size="13"><defs><pattern id="grid-gdktpl10b4uunhuoc" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#cbd5e1" stroke-width="0.8"/></pattern></defs><rect width="480" height="160" fill="#f8fafc"/><rect width="480" height="160" fill="url(#grid-gdktpl10b4uunhuoc)"/><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#6b7280"/></marker></defs><text x="240" y="20" fill="#111" font-size="12" text-anchor="middle" font-weight="bold">Cơ chế thị trường: ưu điểm và nhược điểm</text><rect x="20" y="40" width="200" height="100" rx="8" fill="#dcfce7" stroke="#374151"/><text x="120.0" y="65.33333333333333" fill="#111" font-size="10" text-anchor="middle" font-weight="bold">Ưu điểm</text><text x="120.0" y="79.33333333333333" fill="#111" font-size="10" text-anchor="middle">Kích thích năng động, sáng tạo</text><text x="120.0" y="93.33333333333333" fill="#111" font-size="10" text-anchor="middle">Phân bổ lại nguồn lực</text><text x="120.0" y="107.33333333333333" fill="#111" font-size="10" text-anchor="middle">Đáp ứng nhu cầu tốt hơn</text><text x="120.0" y="121.33333333333333" fill="#111" font-size="10" text-anchor="middle">Thúc đẩy tiến bộ xã hội</text><rect x="260" y="40" width="200" height="100" rx="8" fill="#fecaca" stroke="#374151"/><text x="360.0" y="65.33333333333333" fill="#111" font-size="10" text-anchor="middle" font-weight="bold">Nhược điểm</text><text x="360.0" y="79.33333333333333" fill="#111" font-size="10" text-anchor="middle">Tiềm ẩn rủi ro, khủng hoảng</text><text x="360.0" y="93.33333333333333" fill="#111" font-size="10" text-anchor="middle">Cạnh tranh không lành mạnh</text><text x="360.0" y="107.33333333333333" fill="#111" font-size="10" text-anchor="middle">Phân hoá giàu – nghèo</text><text x="360.0" y="121.33333333333333" fill="#111" font-size="10" text-anchor="middle">Cần Nhà nước quản lí vĩ mô</text></svg>