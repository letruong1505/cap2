<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 150" font-family="Arial,sans-serif" font-size="13"><defs><pattern id="grid-gdktpl10b23chinhquyen" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#cbd5e1" stroke-width="0.8"/></pattern></defs><rect width="480" height="150" fill="#f8fafc"/><rect width="480" height="150" fill="url(#grid-gdktpl10b23chinhquyen)"/><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#6b7280"/></marker></defs><text x="240" y="20" fill="#111" font-size="12" text-anchor="middle" font-weight="bold">Chính quyền địa phương</text><rect x="20" y="40" width="200" height="70" rx="8" fill="#dbeafe" stroke="#374151"/><text x="120.0" y="64.33333333333333" fill="#111" font-size="10" text-anchor="middle" font-weight="bold">Hội đồng nhân dân</text><text x="120.0" y="78.33333333333333" fill="#111" font-size="10" text-anchor="middle">Cơ quan quyền lực nhà nước ở địa phương</text><text x="120.0" y="92.33333333333333" fill="#111" font-size="10" text-anchor="middle">Thường trực HĐND và các Ban</text><rect x="260" y="40" width="200" height="70" rx="8" fill="#dcfce7" stroke="#374151"/><text x="360.0" y="64.33333333333333" fill="#111" font-size="10" text-anchor="middle" font-weight="bold">Uỷ ban nhân dân</text><text x="360.0" y="78.33333333333333" fill="#111" font-size="10" text-anchor="middle">Cơ quan hành chính nhà nước ở địa phương</text><text x="360.0" y="92.33333333333333" fill="#111" font-size="10" text-anchor="middle">Chủ tịch, Phó Chủ tịch, Uỷ viên</text><text x="240" y="130" fill="#111" font-size="10" text-anchor="middle">UBND do HĐND cùng cấp bầu, chịu trách nhiệm trước HĐND và cơ quan cấp trên</text></svg>