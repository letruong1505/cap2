<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 160" font-family="Arial,sans-serif" font-size="13"><defs><pattern id="grid-gdktpl10b2nhanuoc" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#cbd5e1" stroke-width="0.8"/></pattern></defs><rect width="480" height="160" fill="#f8fafc"/><rect width="480" height="160" fill="url(#grid-gdktpl10b2nhanuoc)"/><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#6b7280"/></marker></defs><text x="240" y="20" fill="#111" font-size="12" text-anchor="middle" font-weight="bold">Vai trò của Nhà nước trong nền kinh tế</text><rect x="20" y="40" width="130" height="60" rx="8" fill="#e9d5ff" stroke="#374151"/><text x="85.0" y="66.33333333333333" fill="#111" font-size="10" text-anchor="middle" font-weight="bold">Tạo môi trường</text><text x="85.0" y="80.33333333333333" fill="#111" font-size="10" text-anchor="middle">pháp lí, ổn định</text><rect x="175" y="40" width="130" height="60" rx="8" fill="#e9d5ff" stroke="#374151"/><text x="240.0" y="66.33333333333333" fill="#111" font-size="10" text-anchor="middle" font-weight="bold">Xây dựng chiến lược,</text><text x="240.0" y="80.33333333333333" fill="#111" font-size="10" text-anchor="middle">kết cấu hạ tầng</text><rect x="330" y="40" width="130" height="60" rx="8" fill="#e9d5ff" stroke="#374151"/><text x="395.0" y="66.33333333333333" fill="#111" font-size="10" text-anchor="middle" font-weight="bold">Khắc phục khủng hoảng,</text><text x="395.0" y="80.33333333333333" fill="#111" font-size="10" text-anchor="middle">thất nghiệp, lạm phát</text><text x="240" y="140" fill="#111" font-size="11" text-anchor="middle" font-weight="bold">Tăng trưởng gắn với tiến bộ và công bằng xã hội</text></svg>