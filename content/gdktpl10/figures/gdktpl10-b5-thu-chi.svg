<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 160" font-family="Arial,sans-serif" font-size="13"><defs><pattern id="grid-gdktpl10b5thuchi" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#cbd5e1" stroke-width="0.8"/></pattern></defs><rect width="480" height="160" fill="#f8fafc"/><rect width="480" height="160" fill="url(#grid-gdktpl10b5thuchi)"/><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#6b7280"/></marker></defs><text x="240" y="20" fill="#111" font-size="12" text-anchor="middle" font-weight="bold">Ngân sách nhà nước: thu và chi</text><rect x="20" y="40" width="190" height="70" rx="8" fill="#dcfce7" stroke="#374151"/><text x="115.0" y="57.333333333333336" fill="#111" font-size="10" text-anchor="middle" font-weight="bold">THU</text><text x="115.0" y="71.33333333333334" fill="#111" font-size="10" text-anchor="middle">Thuế, phí, lệ phí</text><text x="115.0" y="85.33333333333334" fill="#111" font-size="10" text-anchor="middle">Thu từ xuất nhập khẩu</text><text x="115.0" y="99.33333333333334" fill="#111" font-size="10" text-anchor="middle">Thu viện trợ, thu khác</text><rect x="270" y="40" width="190" height="70" rx="8" fill="#fbcfe8" stroke="#374151"/><text x="365.0" y="57.333333333333336" fill="#111" font-size="10" text-anchor="middle" font-weight="bold">CHI</text><text x="365.0" y="71.33333333333334" fill="#111" font-size="10" text-anchor="middle">Chi thường xuyên (bộ máy)</text><text x="365.0" y="85.33333333333334" fill="#111" font-size="10" text-anchor="middle">Chi đầu tư phát triển</text><text x="365.0" y="99.33333333333334" fill="#111" font-size="10" text-anchor="middle">Chi an sinh, trả nợ</text><text x="240" y="140" fill="#111" font-size="10" text-anchor="middle" font-weight="bold">Ngân sách nhà nước là quỹ tiền tệ tập trung lớn nhất của quốc gia</text></svg>