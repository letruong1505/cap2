<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 150" font-family="Arial,sans-serif" font-size="13"><defs><pattern id="grid-gdktpl10b15chedo" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#cbd5e1" stroke-width="0.8"/></pattern></defs><rect width="480" height="150" fill="#f8fafc"/><rect width="480" height="150" fill="url(#grid-gdktpl10b15chedo)"/><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#6b7280"/></marker></defs><text x="240" y="20" fill="#111" font-size="12" text-anchor="middle" font-weight="bold">Chế độ chính trị theo Hiến pháp 2013</text><rect x="20" y="40" width="200" height="60" rx="8" fill="#dbeafe" stroke="#374151"/><text x="120.0" y="60.0" fill="#111" font-size="9" text-anchor="middle" font-weight="bold">Chính thể: Cộng hoà xã hội chủ nghĩa</text><text x="120.0" y="73.0" fill="#111" font-size="9" text-anchor="middle">Chủ quyền, lãnh thổ bao gồm đất liền,</text><text x="120.0" y="86.0" fill="#111" font-size="9" text-anchor="middle">hải đảo, vùng biển, vùng trời</text><rect x="240" y="40" width="220" height="60" rx="8" fill="#dcfce7" stroke="#374151"/><text x="350.0" y="60.0" fill="#111" font-size="9" text-anchor="middle" font-weight="bold">Bản chất: Nhà nước pháp quyền XHCN</text><text x="350.0" y="73.0" fill="#111" font-size="9" text-anchor="middle">của Nhân dân, do Nhân dân, vì Nhân dân</text><text x="350.0" y="86.0" fill="#111" font-size="9" text-anchor="middle">Đảng lãnh đạo, nguyên tắc tập trung dân chủ</text><text x="240" y="130" fill="#111" font-size="10" text-anchor="middle">Đường lối đối ngoại: độc lập, tự chủ, hoà bình, hữu nghị, hợp tác và phát triển</text></svg>