<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 292" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="360.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Tính tan của một số muối trong nước</text><text x="130.0" y="56.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#555">Loại muối</text><text x="340.0" y="56.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#555">Tính tan</text><text x="570.0" y="56.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#555">Ngoại lệ</text><rect x="20.0" y="66.0" width="220.0" height="46.0" rx="6" fill="#eef1f4" stroke="#1d2733" stroke-width="2"/><text x="130.0" y="95.0" text-anchor="middle" font-size="14" font-weight="normal" fill="#1d2733">Muối nitrate (–NO₃)</text><rect x="246.0" y="66.0" width="190.0" height="46.0" rx="6" fill="#dfe9d5" stroke="#1d2733" stroke-width="2"/><text x="341.0" y="95.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2733">Đều tan</text><rect x="442.0" y="66.0" width="258.0" height="46.0" rx="6" fill="#ffffff" stroke="#1d2733" stroke-width="1.5"/><text x="571.0" y="95.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">Không có</text><rect x="20.0" y="120.0" width="220.0" height="46.0" rx="6" fill="#eef1f4" stroke="#1d2733" stroke-width="2"/><text x="130.0" y="149.0" text-anchor="middle" font-size="14" font-weight="normal" fill="#1d2733">Muối chloride (–Cl)</text><rect x="246.0" y="120.0" width="190.0" height="46.0" rx="6" fill="#dfe9d5" stroke="#1d2733" stroke-width="2"/><text x="341.0" y="149.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2733">Phần lớn tan</text><rect x="442.0" y="120.0" width="258.0" height="46.0" rx="6" fill="#ffffff" stroke="#1d2733" stroke-width="1.5"/><text x