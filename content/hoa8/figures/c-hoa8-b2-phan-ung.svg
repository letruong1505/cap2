<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 285" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="360.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Phản ứng hoá học: các nguyên tử sắp xếp lại (2H₂ + O₂ → 2H₂O)</text><rect x="20.0" y="50.0" width="300.0" height="140.0" rx="8" fill="#eef1f4" stroke="#1d2733" stroke-width="2"/><rect x="400.0" y="50.0" width="300.0" height="140.0" rx="8" fill="#eef1f4" stroke="#1d2733" stroke-width="2"/><text x="170.0" y="72.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2733">Chất phản ứng</text><text x="550.0" y="72.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2733">Sản phẩm</text><circle cx="62.0" cy="120.0" r="8.0" fill="#cfd8e3" stroke="#1d2733" stroke-width="1.5"/><circle cx="78.0" cy="120.0" r="8.0" fill="#cfd8e3" stroke="#1d2733" stroke-width="1.5"/><circle cx="62.0" cy="160.0" r="8.0" fill="#cfd8e3" stroke="#1d2733" stroke-width="1.5"/><circle cx="78.0" cy="160.0" r="8.0" fill="#cfd8e3" stroke="#1d2733" stroke-width="1.5"/><circle cx="207.0" cy="140.0" r="13.0" fill="#e15759" stroke="#1d2733" stroke-width="1.5"/><circle cx="233.0" cy="140.0" r="13.0" fill="#e15759" stroke="#1d2733" stroke-width="1.5"/><text x="70.0" y="182.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#1d2733">2H₂</text><text x="220.0" y="182.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#1d2733">O₂</text><line x1="480.0" y1="105.0" x2="466.0" y2="122.0" stroke="#9aa5b1" stroke-width="1.5"/><line x1="480.0" y1="105.0" x2="494.0" y2="122.0" stroke="#9aa5b1" stroke-width="1.5"/><circle cx="480.0" cy="105.0" r="13.0" fill="#e15759" stroke="#1d2733" stroke-width="1.5"/><circle cx="466.0" cy="122.0" r="8.0" fill="#cfd8e3" stroke="#1d2733" stroke-width="1.5"/><circle cx="494.0" cy="122.0" r="8.0" fill="#cfd8e3" stroke="#1d2733" stroke-width="1.5"/><line x1="600.0" y1="105.0" x2="586.0" y2="122.0" stroke="#9aa5b1" stroke-width="1.5"/><line x1="600.0" y1="105.0" x2="614.0" y2="122.0" stroke="#9aa5b1" stroke-width="1.5"/><circle cx="600.0" cy="105.0" r="13.0" fill="#e15759" stroke="#1d2733" stroke-width="1.5"/><circle cx="586.0" cy="122.0" r="8.0" fill="#cfd8e3" stroke="#1d2733" stroke-width="1.5"/><circle cx="614.0" cy="122.0" r="8.0" fill="#cfd8e3" stroke="#1d2733" stroke-width="1.5"/><text x="540.0" y="182.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#1d2733">2H₂O</text><line x1="330.0" y1="120.0" x2="392.0" y2="120.0" stroke="#1d2733" stroke-width="2" marker-end="url(#ar)"/><text x="361.0" y="108.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">Phản ứng</text><text x="360.0" y="220.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#444">Liên kết trong phân tử chất đầu bị phá vỡ, các nguyên tử sắp xếp lại tạo liên kết mới.</text><text x="360.0" y="237.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#444">Trước và sau phản ứng đều có 4 nguyên tử H và 2 nguyên tử O.</text><circle cx="40.0" cy="262.0" r="8.0" fill="#cfd8e3" stroke="#1d2733" stroke-width="1.5"/><text x="54.0" y="267.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">: hydrogen</text><circle cx="160.0" cy="262.0" r="13.0" fill="#e15759" stroke="#1d2733" stroke-width="1.5"/><text x="178.0" y="267.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">: oxygen</text></svg>