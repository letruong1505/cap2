<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 292" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="360.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Các loại phân bón hoá học thông dụng</text><rect x="10.0" y="44.0" width="168.0" height="210.0" rx="8" fill="#dfe9d5" stroke="#1d2733" stroke-width="2"/><text x="94.0" y="70.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d2733">Phân đạm</text><circle cx="94.0" cy="112.0" r="28.0" fill="#ffffff" stroke="#1d2733" stroke-width="1.5"/><text x="94.0" y="119.0" text-anchor="middle" font-size="20" font-weight="bold" fill="#1d2733">N</text><text x="94.0" y="168.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">Cung cấp nitrogen</text><text x="94.0" y="186.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">Thân, rễ, lá phát triển</text><line x1="24.0" y1="222.0" x2="164.0" y2="222.0" stroke="#9aa5b1" stroke-width="1"/><text x="94.0" y="242.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">Urea, NH₄NO₃</text><rect x="187.0" y="44.0" width="168.0" height="210.0" rx="8" fill="#f4d9d9" stroke="#1d2733" stroke-width="2"/><text x="271.0" y="70.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d2733">Phân lân</text><circle cx="271.0" cy="112.0" r="28.0" fill="#ffffff" stroke="#1d2733" stroke-width="1.5"/><text x="271.0" y="119.0" text-anchor="middle" font-size="20" font-weight="bold" fill="#1d2733">P</text><text x="271.0" y="168.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">Cung cấp phosphorus</text><text x="271.0" y="186.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">Rễ phát triển, nở hoa,</text><text x="271.0" y="202.0" text-anchor="middle" fo