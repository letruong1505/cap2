<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="360.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Chuyển đổi giữa khối lượng, số mol và thể tích khí</text><rect x="30.0" y="80.0" width="140.0" height="80.0" rx="10" fill="#fbf0c9" stroke="#1d2733" stroke-width="2"/><text x="100.0" y="114.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2733">Khối lượng m</text><text x="100.0" y="136.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#444">(gam)</text><rect x="290.0" y="80.0" width="140.0" height="80.0" rx="10" fill="#fbf0c9" stroke="#1d2733" stroke-width="2"/><text x="360.0" y="114.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2733">Số mol n</text><text x="360.0" y="136.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#444">(mol)</text><rect x="550.0" y="80.0" width="140.0" height="80.0" rx="10" fill="#fbf0c9" stroke="#1d2733" stroke-width="2"/><text x="620.0" y="114.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2733">Thể tích khí V</text><text x="620.0" y="136.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#444">(lít, 25 °C, 1 bar)</text><line x1="176.0" y1="100.0" x2="284.0" y2="100.0" stroke="#1d2733" stroke-width="2" marker-end="url(#ar)"/><text x="230.0" y="92.0" text-anchor="middle" font-size="14" font-weight="normal" fill="#1d2733">n = m / M</text><line x1="284.0" y1="140.0" x2="176.0" y2="140.0" stroke="#1d2733" stroke-width="2" marker-end="url(#ar)"/><text x="230.0" y="160.0" text-anchor="middle" font-size="14" font-weight="normal" fill="#1d2733">m = n · M</text><line x1="436.0" y1="100.0" x2="544.0" y2="100.0" stroke="#1d2733" stroke-width="2" marker-end="url(#ar)"/><text x="490.0" y="92.0" text-anchor="middle" font-size="14" font-weight="normal" fill="#1d2733">V = 24,79 · n</text><line x1="544.0" y1="140.0" x2="436.0" y2="140.0" stroke="#1d2733" stroke-width="2" marker-end="url(#ar)"/><text x="490.0" y="160.0" text-anchor="middle" font-size="14" font-weight="normal" fill="#1d2733">n = V / 24,79</text><text x="360.0" y="205.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#444">M: khối lượng mol (g/mol).  1 mol chứa 6,022·10²³ hạt (số Avogadro).</text><text x="360.0" y="222.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#444">Ở 25 °C và 1 bar, 1 mol khí bất kì chiếm 24,79 lít.</text></svg>