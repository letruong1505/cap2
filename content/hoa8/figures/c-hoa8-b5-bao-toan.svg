<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 262" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="360.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Định luật bảo toàn khối lượng: 4Al + 3O₂ → 2Al₂O₃</text><rect x="40.0" y="70.0" width="130.0" height="70.0" rx="10" fill="#fbf0c9" stroke="#1d2733" stroke-width="2"/><text x="105.0" y="96.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Al</text><text x="105.0" y="116.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#1d2733">4 · 27 = 108 g</text><text x="105.0" y="132.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#555">(tính theo gam)</text><rect x="220.0" y="70.0" width="130.0" height="70.0" rx="10" fill="#fbf0c9" stroke="#1d2733" stroke-width="2"/><text x="285.0" y="96.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">O₂</text><text x="285.0" y="116.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#1d2733">3 · 32 = 96 g</text><text x="285.0" y="132.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#555">(tính theo gam)</text><rect x="500.0" y="70.0" width="130.0" height="70.0" rx="10" fill="#dfe9d5" stroke="#1d2733" stroke-width="2"/><text x="565.0" y="96.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Al₂O₃</text><text x="565.0" y="116.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#1d2733">2 · 102 = 204 g</text><text x="565.0" y="132.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#555">(tính theo gam)</text><text x="190.0" y="112.0" text-anchor="middle" font-size="24" font-weight="bold" fill="#1d2733">+</text><line x1="360.0" y1="105.0" x2="490.0" y2="105.0" stroke="#1d2733" stroke-width="2" marker-end="url(#ar)"/><text x="425.0" y="96.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">phản ứng</text><text x="360.0" y="180.0" text-anchor="middle" font-size="14" font-weight="normal" fill="#1d2733">Tổng khối lượng chất tham gia: 108 + 96 = 204 g</text><text x="360.0" y="198.0" text-anchor="middle" font-size="14" font-weight="normal" fill="#1d2733">Khối lượng sản phẩm: 204 g</text><text x="360.0" y="232.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#444">Tỉ lệ khối lượng Al : O₂ : Al₂O₃ = 108 : 96 : 204 = 9 : 8 : 17</text><text x="360.0" y="249.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#444">Tỉ lệ số mol (cũng là tỉ lệ hệ số): 4 : 3 : 2</text></svg>