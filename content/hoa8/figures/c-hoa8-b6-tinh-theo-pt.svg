<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 262" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="360.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Các bước tính theo phương trình hoá học (ví dụ Zn + 2HCl → ZnCl₂ + H₂)</text><rect x="14.0" y="50.0" width="164.0" height="100.0" rx="10" fill="#fbf0c9" stroke="#1d2733" stroke-width="2"/><text x="96.0" y="80.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2733">1. Viết và cân bằng</text><text x="96.0" y="102.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#1d2733">phương trình</text><rect x="14.0" y="160.0" width="164.0" height="56.0" rx="8" fill="#ffffff" stroke="#1d2733" stroke-width="1.5"/><text x="96.0" y="183.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">Zn + 2HCl → ZnCl₂ + H₂</text><line x1="179.0" y1="100.0" x2="191.0" y2="100.0" stroke="#1d2733" stroke-width="2" marker-end="url(#ar)"/><rect x="192.0" y="50.0" width="164.0" height="100.0" rx="10" fill="#fbf0c9" stroke="#1d2733" stroke-width="2"/><text x="274.0" y="80.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2733">2. Đổi ra số mol</text><text x="274.0" y="102.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#1d2733">n = m / M</text><rect x="192.0" y="160.0" width="164.0" height="56.0" rx="8" fill="#ffffff" stroke="#1d2733" stroke-width="1.5"/><text x="274.0" y="183.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">n(Zn) =</text><text x="274.0" y="200.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">0,65 / 65 = 0,01 mol</text><line x1="357.0" y1="100.0" x2="369.0" y2="100.0" stroke="#1d2733" stroke-width="2" marker-end="url(#ar)"/><rect x="370.0" y="50.0" width="164.0" height="100.0" rx="10" fill="#fbf0c9" stroke="#1d2733" stroke-width="2"/><text x="452.0" y="80.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2733">3. Tỉ lệ hệ số</text><text x="452.0" y="102.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#1d2733">số mol chất cần tính</text><rect x="370.0" y="160.0" width="164.0" height="56.0" rx="8" fill="#ffffff" stroke="#1d2733" stroke-width="1.5"/><text x="452.0" y="183.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">n(ZnCl₂) =</text><text x="452.0" y="200.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">n(Zn) = 0,01 mol</text><line x1="535.0" y1="100.0" x2="547.0" y2="100.0" stroke="#1d2733" stroke-width="2" marker-end="url(#ar)"/><rect x="548.0" y="50.0" width="164.0" height="100.0" rx="10" fill="#fbf0c9" stroke="#1d2733" stroke-width="2"/><text x="630.0" y="80.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2733">4. Đổi ra khối lượng</text><text x="630.0" y="102.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#1d2733">m = n · M</text><rect x="548.0" y="160.0" width="164.0" height="56.0" rx="8" fill="#ffffff" stroke="#1d2733" stroke-width="1.5"/><text x="630.0" y="183.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">m(ZnCl₂) =</text><text x="630.0" y="200.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">0,01 · 136 = 1,36 g</text><text x="360.0" y="244.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#444">Nếu hiệu suất H &lt; 100%, lượng sản phẩm thực tế nhỏ hơn lượng tính theo phương trình.</text></svg>