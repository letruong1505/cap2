<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" font-family="Arial,sans-serif" font-size="13"><rect width="320" height="240" fill="#fff"/><text x="20" y="30" font-size="12" font-weight="bold">Trước va chạm</text><line x1="20" y1="90" x2="300" y2="90" stroke="#9ca3af"/><rect x="40" y="60" width="50" height="30" fill="#bfdbfe" stroke="#1d4ed8"/><text x="56" y="80">m₁</text><line x1="90" y1="75" x2="150" y2="75" stroke="#1d4ed8" stroke-width="2.5"/><polygon points="150,75 140.8,78.9 140.8,71.1" fill="#1d4ed8"/><text x="110" y="66" fill="#1d4ed8">→v₁</text><rect x="200" y="60" width="50" height="30" fill="#fecaca" stroke="#b91c1c"/><text x="216" y="80">m₂</text><text x="200" y="54" font-size="11">đứng yên</text><text x="20" y="130" font-size="12" font-weight="bold">Sau va chạm mềm</text><line x1="20" y1="190" x2="300" y2="190" stroke="#9ca3af"/><rect x="120" y="160" width="50" height="30" fill="#bfdbfe" stroke="#1d4ed8"/><rect x="170" y="160" width="50" height="30" fill="#fecaca" stroke="#b91c1c"/><line x1="220" y1="175" x2="280" y2="175" stroke="#15803d" stroke-width="2.5"/><polygon points="280,175 270.8,178.9 270.8,171.1" fill="#15803d"/><text x="240" y="166" fill="#15803d">→v</text><text x="20" y="228" font-size="12">m₁v₁ = (m₁ + m₂)·v</text></svg>