<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="360.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Đại lượng tỉ lệ thuận: y = k · x</text><text x="190.0" y="58.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a56a0">Ví dụ: y = 4x</text><rect x="30.0" y="76.0" width="60.0" height="36.0" rx="0" fill="#e8f1fa" stroke="#1d2733" stroke-width="1.6"/><text x="60.0" y="99.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2733">x</text><rect x="90.0" y="76.0" width="80.0" height="36.0" rx="0" fill="white" stroke="#1d2733" stroke-width="1.6"/><text x="130.0" y="99.0" text-anchor="middle" font-size="15" font-weight="normal" fill="#1d2733">3</text><rect x="170.0" y="76.0" width="80.0" height="36.0" rx="0" fill="white" stroke="#1d2733" stroke-width="1.6"/><text x="210.0" y="99.0" text-anchor="middle" font-size="15" font-weight="normal" fill="#1d2733">5</text><rect x="30.0" y="112.0" width="60.0" height="36.0" rx="0" fill="#e8f1fa" stroke="#1d2733" stroke-width="1.6"/><text x="60.0" y="135.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2733">y</text><rect x="90.0" y="112.0" width="80.0" height="36.0" rx="0" fill="white" stroke="#1d2733" stroke-width="1.6"/><text x="130.0" y="135.0" text-anchor="middle" font-size="15" font-weight="normal" fill="#1d2733">12</text><rect x="170.0" y="112.0" width="80.0" height="36.0" rx="0" fill="white" stroke="#1d2733" stroke-width="1.6"/><text x="210.0" y="135.0" text-anchor="middle" font-size="15" font-weight="normal" fill="#1d2733">20</text><text x="190.0" y="176.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2733">y/x = 12/3 = 20/5 = 4 = k</text><text x="190.0" y="204.0" text-anchor="middle" font-size="14" font-weight="normal" fill="#1d2733">Tỉ số y₁/y₂ = x₁/x₂:  12/20 = 3/5</text><text x="190.0" y="240.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#5b6773">x tăng bao nhiêu lần thì y</text><text x="190.0" y="258.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#5b6773">tăng bấy nhiêu lần</text><text x="555.0" y="58.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a56a0">Đồ thị y = 4x (đi qua gốc O)</text><line x1="416.0" y1="270.0" x2="698.0" y2="270.0" stroke="#1d2733" stroke-width="2" marker-end="url(#ar)"/><line x1="420.0" y1="274.0" x2="420.0" y2="56.0" stroke="#1d2733" stroke-width="2" marker-end="url(#ar)"/><text x="698.0" y="288.0" text-anchor="middle" font-size="14" font-weight="normal" fill="#1d2733">x</text><text x="432.0" y="58.0" text-anchor="middle" font-size="14" font-weight="normal" fill="#1d2733">y</text><text x="412.0" y="287.0" text-anchor="end" font-size="13" font-weight="normal" fill="#1d2733">O</text><polyline points="420.0,270.0 681.3,79.8" fill="none" stroke="#4e79a7" stroke-width="3" stroke-linejoin="round"/><line x1="550.6" y1="174.9" x2="550.6" y2="270.0" stroke="#9aa5b1" stroke-width="1.3" stroke-dasharray="4 3"/><line x1="550.6" y1="174.9" x2="420.0" y2="174.9" stroke="#9aa5b1" stroke-width="1.3" stroke-dasharray="4 3"/><circle cx="550.6" cy="174.9" r="5.0" fill="#e15759" stroke="#e15759" stroke-width="1"/><text x="550.6" y="287.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#1d2733">3</text><text x="414.0" y="179.9" text-anchor="end" font-size="13" font-weight="normal" fill="#1d2733">12</text><line x1="637.7" y1="111.5" x2="637.7" y2="270.0" stroke="#9aa5b1" stroke-width="1.3" stroke-dasharray="4 3"/><line x1="637.7" y1="111.5" x2="420.0" y2="111.5" stroke="#9aa5b1" stroke-width="1.3" stroke-dasharray="4 3"/><circle cx="637.7" cy="111.5" r="5.0" fill="#e15759" stroke="#e15759" stroke-width="1"/><text x="637.7" y="287.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#1d2733">5</text><text x="414.0" y="116.5" text-anchor="end" font-size="13" font-weight="normal" fill="#1d2733">20</text><text x="555.0" y="302.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#5b6773">Hai điểm (3; 12) và (5; 20)</text><text x="555.0" y="318.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#5b6773">cùng nằm trên một đường thẳng qua O</text></svg>