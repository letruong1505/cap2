<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 392" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="390.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Phân loại dữ liệu</text><rect x="310.0" y="44.0" width="160.0" height="40.0" rx="8" fill="#efe6f3" stroke="#b07aa1" stroke-width="2"/><text x="390.0" y="69.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2733">Dữ liệu</text><line x1="390.0" y1="84.0" x2="200.0" y2="124.0" stroke="#9aa5b1" stroke-width="2"/><line x1="390.0" y1="84.0" x2="570.0" y2="124.0" stroke="#9aa5b1" stroke-width="2"/><rect x="65.0" y="124.0" width="270.0" height="82.0" rx="8" fill="#fdf1e0" stroke="#f28e2b" stroke-width="2"/><text x="200.0" y="151.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Dữ liệu là số</text><text x="200.0" y="170.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#1d2733">(định lượng)</text><text x="200.0" y="189.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#1d2733">vd: cân nặng, số giờ</text><rect x="435.0" y="124.0" width="270.0" height="82.0" rx="8" fill="#e8f1fa" stroke="#4e79a7" stroke-width="2"/><text x="570.0" y="160.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Dữ liệu không là số</text><text x="570.0" y="179.5" text-anchor="middle" font-size="13" font-weight="normal" fill="#1d2733">(định tính)</text><line x1="570.0" y1="206.0" x2="455.0" y2="246.0" stroke="#9aa5b1" stroke-width="2"/><line x1="570.0" y1="206.0" x2="672.0" y2="246.0" stroke="#9aa5b1" stroke-width="2"/><rect x="352.0" y="246.0" width="206.0" height="82.0" rx="8" fill="#e6f0df" stroke="#59a14f" stroke-width="2"/><text x="455.0" y="282.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">Không sắp thứ tự được</text><text x="455.0" y="301.5" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">vd: tên tỉnh</text><rect x="569.0" y="246.0" width="206.0" height="82.0" rx="8" fill="#e6f0df" stroke="#59a14f" stroke-width="2"/><text x="672.0" y="273.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">Sắp thứ tự được</text><text x="672.0" y="292.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">vd: Rất tốt, Tốt,</text><text x="672.0" y="311.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">Trung bình, Kém</text><rect x="14.0" y="246.0" width="300.0" height="96.0" rx="8" fill="#fdf1e0" stroke="#f28e2b" stroke-width="2"/><text x="164.0" y="280.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">Lưu ý về mã số</text><text x="164.0" y="299.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">Số hiệu tuyến xe buýt chỉ là nhãn,</text><text x="164.0" y="318.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">không phải dữ liệu số</text><text x="390.0" y="372.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#5b6773">Muốn kết luận cho cả tập thể, cần khảo sát mẫu ngẫu nhiên đủ rộng (tính đại diện).</text></svg>