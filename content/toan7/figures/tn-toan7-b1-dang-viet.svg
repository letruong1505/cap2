<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="360.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Số hữu tỉ: các dạng viết quen thuộc</text><rect x="20.0" y="50.0" width="270.0" height="58.0" rx="8" fill="#e8f1fa" stroke="#4e79a7" stroke-width="2"/><text x="155.0" y="74.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2733">Số nguyên</text><text x="155.0" y="96.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a56a0">3 = 3/1</text><line x1="292.0" y1="79.0" x2="426.0" y2="118.0" stroke="#1d2733" stroke-width="2" marker-end="url(#ar)"/><rect x="20.0" y="122.0" width="270.0" height="58.0" rx="8" fill="#fdf1e0" stroke="#f28e2b" stroke-width="2"/><text x="155.0" y="146.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2733">Số thập phân hữu hạn</text><text x="155.0" y="168.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a56a0">−1,2 = −6/5</text><line x1="292.0" y1="151.0" x2="426.0" y2="148.0" stroke="#1d2733" stroke-width="2" marker-end="url(#ar)"/><rect x="20.0" y="194.0" width="270.0" height="58.0" rx="8" fill="#e6f0df" stroke="#59a14f" stroke-width="2"/><text x="155.0" y="218.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2733">Hỗn số</text><text x="155.0" y="240.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a56a0">1 4/5 = 9/5</text><line x1="292.0" y1="223.0" x2="426.0" y2="178.0" stroke="#1d2733" stroke-width="2" marker-end="url(#ar)"/><rect x="430.0" y="88.0" width="274.0" height="120.0" rx="10" fill="#efe6f3" stroke="#b07aa1" stroke-width="2.5"/><text x="567.0" y="118.0" text-anchor="middle" font-size="14" font-weight="normal" fill="#1d2733">Số hữu tỉ</text><text x="567.0" y="142.0" text-anchor="middle" font-size="14" font-weight="normal" fill="#1d2733">viết được dưới dạng a/b</text><text x="567.0" y="166.0" text-anchor="middle" font-size="14" font-weight="normal" fill="#1d2733">a, b là số nguyên, b ≠ 0</text><text x="567.0" y="190.0" text-anchor="middle" font-size="14" font-weight="normal" fill="#1d2733">Kí hiệu: ℚ</text></svg>