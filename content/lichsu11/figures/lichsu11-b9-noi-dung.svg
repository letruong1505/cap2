<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 258" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="380.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Nội dung cải cách của Hồ Quý Ly và triều Hồ</text><rect x="15.0" y="50.0" width="170.0" height="56.0" rx="8" fill="#fbf0c9" stroke="#1d2733" stroke-width="2"/><text x="100.0" y="83.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Kinh tế – xã hội</text><rect x="190.0" y="50.0" width="555.0" height="56.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="202.0" y="75.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">Hạn điền (thứ dân tối đa 10 mẫu), hạn nô; phát hành</text><text x="202.0" y="91.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">tiền giấy; cải cách thuế khoá; thống nhất đo lường</text><rect x="15.0" y="116.0" width="170.0" height="56.0" rx="8" fill="#dbe7f3" stroke="#1d2733" stroke-width="2"/><text x="100.0" y="149.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Quân sự</text><rect x="190.0" y="116.0" width="555.0" height="56.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="202.0" y="141.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">Lập sổ nhân khẩu từ 2 tuổi để tăng quân; xây thành</text><text x="202.0" y="157.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">Tây Đô, Đa Bang; chế súng thần cơ, đóng thuyền chiến</text><rect x="15.0" y="182.0" width="170.0" height="56.0" rx="8" fill="#dfe9d5" stroke="#1d2733" stroke-width="2"/><text x="100.0" y="215.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Văn hoá – giáo dục</text><rect x="190.0" y="182.0" width="555.0" height="56.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="202.0" y="207.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">Sư dưới 50 tuổi hoàn tục; chấn chỉnh thi cử (2 kì thi,</text><text x="202.0" y="223.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">gần 200 người đỗ); đề cao chữ Nôm, dịch sách Hán sang Nôm</text></svg>