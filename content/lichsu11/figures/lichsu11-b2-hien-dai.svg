<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 200" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="380.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Chủ nghĩa tư bản hiện đại: tiềm năng và thách thức</text><rect x="15.0" y="50.0" width="355.0" height="34.0" rx="8" fill="#dfe9d5" stroke="#1d2733" stroke-width="2"/><text x="192.5" y="72.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Tiềm năng</text><rect x="15.0" y="88.0" width="355.0" height="100.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="192.5" y="110.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Kinh tế, khoa học – công nghệ</text><text x="192.5" y="127.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">kinh nghiệm quản lí</text><text x="192.5" y="144.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">tự điều chỉnh để tồn tại</text><text x="192.5" y="161.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">trung tâm kinh tế – tài chính</text><rect x="380.0" y="50.0" width="355.0" height="34.0" rx="8" fill="#f7d4d4" stroke="#1d2733" stroke-width="2"/><text x="557.5" y="72.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Thách thức</text><rect x="380.0" y="88.0" width="355.0" height="100.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="557.5" y="110.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Khủng hoảng kinh tế, tài chính</text><text x="557.5" y="127.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">toàn cầu (dầu mỏ 1973...)</text><text x="557.5" y="144.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">bất an, bạo lực, phân biệt</text><text x="557.5" y="161.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">chênh lệch giàu nghèo ("99 vs 1")</text></svg>