<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 324" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="380.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Tái thiết và phát triển sau độc lập</text><rect x="15.0" y="50.0" width="170.0" height="56.0" rx="8" fill="#f7d4d4" stroke="#1d2733" stroke-width="2"/><text x="100.0" y="83.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Ảnh hưởng thực dân</text><rect x="190.0" y="50.0" width="555.0" height="56.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="202.0" y="75.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">Kinh tế nông nghiệp lạc hậu, lệ thuộc; "chia để trị" gây xung đột</text><text x="202.0" y="91.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">sắc tộc, tôn giáo; văn hoá ngoại lai; nhưng có thêm hạ tầng, hải cảng</text><rect x="15.0" y="116.0" width="170.0" height="56.0" rx="8" fill="#fbf0c9" stroke="#1d2733" stroke-width="2"/><text x="100.0" y="149.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Giai đoạn đầu</text><rect x="190.0" y="116.0" width="555.0" height="56.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="202.0" y="149.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">Công nghiệp hoá thay thế nhập khẩu (In-đô, Ma-lai, Phi-líp-pin, Xin-ga-po từ giữa 1950s)</text><rect x="15.0" y="182.0" width="170.0" height="56.0" rx="8" fill="#dbe7f3" stroke="#1d2733" stroke-width="2"/><text x="100.0" y="215.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Giai đoạn sau</text><rect x="190.0" y="182.0" width="555.0" height="56.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="202.0" y="207.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">Công nghiệp hoá hướng về xuất khẩu; Việt Nam, Lào, Cam-pu-chia</text><text x="202.0" y="223.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">chuyển sang kinh tế thị trường (cuối 1980s – 1990s)</text><rect x="15.0" y="248.0" width="170.0" height="56.0" rx="8" fill="#dfe9d5" stroke="#1d2733" stroke-width="2"/><text x="100.0" y="281.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Thành tựu</text><rect x="190.0" y="248.0" width="555.0" height="56.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="202.0" y="273.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">ASEAN (8-8-1967, Băng Cốc) 10 thành viên; GDP khoảng 3 000 tỉ USD (2018),</text><text x="202.0" y="289.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">nền kinh tế lớn thứ năm thế giới</text></svg>