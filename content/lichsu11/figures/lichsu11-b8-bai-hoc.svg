<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 258" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="380.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Bài học lịch sử của khởi nghĩa và chiến tranh giải phóng</text><rect x="15.0" y="50.0" width="170.0" height="56.0" rx="8" fill="#fbf0c9" stroke="#1d2733" stroke-width="2"/><text x="100.0" y="83.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Xây dựng lực lượng</text><rect x="190.0" y="50.0" width="555.0" height="56.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="202.0" y="83.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">Hội thề Lũng Nhai; Quang Trung duyệt binh, tuyển quân ở Nghệ An, Thanh Hoá</text><rect x="15.0" y="116.0" width="170.0" height="56.0" rx="8" fill="#dbe7f3" stroke="#1d2733" stroke-width="2"/><text x="100.0" y="149.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Đại đoàn kết toàn dân</text><rect x="190.0" y="116.0" width="555.0" height="56.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="202.0" y="141.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">"Lấy nhân nghĩa thắng hung tàn"; bộ chỉ huy Lam Sơn đủ thành phần:</text><text x="202.0" y="157.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">nho sĩ, quý tộc, thương nhân, dân nghèo, thủ lĩnh dân tộc thiểu số</text><rect x="15.0" y="182.0" width="170.0" height="56.0" rx="8" fill="#dfe9d5" stroke="#1d2733" stroke-width="2"/><text x="100.0" y="215.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Nghệ thuật quân sự</text><rect x="190.0" y="182.0" width="555.0" height="56.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="202.0" y="207.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">"Dùng đoản binh chế trường trận" (Trần Quốc Tuấn); tuỳ thời</text><text x="202.0" y="223.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">tạo thế, đánh nhanh thắng nhanh (Quang Trung)</text></svg>