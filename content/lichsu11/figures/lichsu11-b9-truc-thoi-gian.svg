<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 268" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="380.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Bối cảnh và kết cục của triều Hồ</text><line x1="30.0" y1="144.0" x2="740.0" y2="144.0" stroke="#1d2733" stroke-width="3" marker-end="url(#ar)"/><circle cx="60.0" cy="144.0" r="7.0" fill="#f7d4d4" stroke="#1d2733" stroke-width="2"/><text x="60.0" y="128.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Nửa sau TK XIV</text><line x1="60.0" y1="136.0" x2="60.0" y2="114.0" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="3 3"/><rect x="6.0" y="48.0" width="150.0" height="66.0" rx="8" fill="#f7d4d4" stroke="#1d2733" stroke-width="2"/><text x="81.0" y="69.5" text-anchor="middle" font-size="11" font-weight="normal" fill="#1d2733">Nhà Trần suy yếu;</text><text x="81.0" y="84.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1d2733">mất mùa, nông dân</text><text x="81.0" y="98.5" text-anchor="middle" font-size="11" font-weight="normal" fill="#1d2733">nổi dậy (Ngô Bệ...)</text><circle cx="220.0" cy="144.0" r="7.0" fill="#fbf0c9" stroke="#1d2733" stroke-width="2"/><text x="220.0" y="172.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">1400</text><line x1="220.0" y1="152.0" x2="220.0" y2="182.0" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="3 3"/><rect x="145.0" y="182.0" width="150.0" height="50.0" rx="8" fill="#fbf0c9" stroke="#1d2733" stroke-width="2"/><text x="220.0" y="202.8" text-anchor="middle" font-size="11" font-weight="normal" fill="#1d