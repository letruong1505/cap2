<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 196" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="380.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Từ tự do cạnh tranh sang độc quyền</text><rect x="20.0" y="60.0" width="220.0" height="56.0" rx="8" fill="#fbf0c9" stroke="#1d2733" stroke-width="2"/><text x="130.0" y="83.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">Tự do cạnh tranh</text><text x="130.0" y="98.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">(thời kì xác lập CNTB)</text><line x1="242.0" y1="88.0" x2="300.0" y2="88.0" stroke="#1d2733" stroke-width="2.4" marker-end="url(#ar)"/><text x="271.0" y="76.0" text-anchor="middle" font-size="10" font-weight="normal" fill="#3b4856" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">cạnh tranh gay gắt</text><rect x="302.0" y="60.0" width="220.0" height="56.0" rx="8" fill="#dfe9d5" stroke="#1d2733" stroke-width="2"/><text x="412.0" y="83.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">Xí nghiệp nhỏ phá sản,</text><text x="412.0" y="98.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">xí nghiệp khổng lồ xuất hiện</text><line x1="524.0" y1="88.0" x2="580.0" y2="88.0" stroke="#1d2733" stroke-width="2.4" marker-end="url(#ar)"/><rect x="582.0" y="60.0" width="160.0" height="56.0" rx="8" fill="#f7d4d4" stroke="#1d2733" stroke-width="2"/><text x="662.0" y="83.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Tổ chức</text><text x="662.0" y="99.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">độc quyền</text><text x="380.0" y="150.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Hình thức: các-ten, xanh-đi-ca (Đức, Pháp); tơ-rớt (Mỹ)</text><text x="380.0" y="176.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#3b4856" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Đầu TK XX: chỉ ~1% số xí nghiệp nhưng chiếm 3/4 máy hơi nước, động cơ điện và gần 1/2 sản phẩm</text></svg>