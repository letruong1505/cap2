<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 308" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="380.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Nguyên nhân sụp đổ mô hình CNXH ở Đông Âu và Liên Xô</text><rect x="15.0" y="50.0" width="170.0" height="52.0" rx="8" fill="#fbf0c9" stroke="#1d2733" stroke-width="2"/><text x="100.0" y="81.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Thứ nhất</text><rect x="190.0" y="50.0" width="555.0" height="52.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="202.0" y="73.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">Đường lối chủ quan, duy ý chí; áp dụng máy móc mô hình</text><text x="202.0" y="89.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">kinh tế tập trung, quan liêu, bao cấp; chậm đổi mới</text><rect x="15.0" y="112.0" width="170.0" height="52.0" rx="8" fill="#dbe7f3" stroke="#1d2733" stroke-width="2"/><text x="100.0" y="143.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Thứ hai</text><rect x="190.0" y="112.0" width="555.0" height="52.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="202.0" y="135.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">Không áp dụng kịp thời thành tựu KH-CN; năng suất</text><text x="202.0" y="151.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">suy giảm, trì trệ kéo dài, khủng hoảng lòng tin</text><rect x="15.0" y="174.0" width="170.0" height="52.0" rx="8" fill="#f7d4d4" stroke="#1d2733" stroke-width="2"/><text x="100.0" y="205.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Thứ ba</text><rect x="190.0" y="174.0" width="555.0" height="52.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="202.0" y="197.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">Cải cách, cải tổ phạm sai lầm nghiêm trọng; xoá bỏ</text><text x="202.0" y="213.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">vai trò lãnh đạo của Đảng Cộng sản</text><rect x="15.0" y="236.0" width="170.0" height="52.0" rx="8" fill="#eef1f4" stroke="#1d2733" stroke-width="2"/><text x="100.0" y="267.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Thứ tư</text><rect x="190.0" y="236.0" width="555.0" height="52.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="202.0" y="267.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">Hoạt động chống phá của các thế lực thù địch trong và ngoài nước</text></svg>