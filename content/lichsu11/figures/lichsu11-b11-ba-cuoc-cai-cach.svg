<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 268" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="390.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Ba cuộc cải cách lớn trước năm 1858</text><line x1="30.0" y1="144.0" x2="760.0" y2="144.0" stroke="#1d2733" stroke-width="3" marker-end="url(#ar)"/><circle cx="60.0" cy="144.0" r="7.0" fill="#fbf0c9" stroke="#1d2733" stroke-width="2"/><text x="60.0" y="128.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">1400–1407</text><line x1="60.0" y1="136.0" x2="60.0" y2="114.0" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="3 3"/><rect x="6.0" y="48.0" width="150.0" height="66.0" rx="8" fill="#fbf0c9" stroke="#1d2733" stroke-width="2"/><text x="81.0" y="69.5" text-anchor="middle" font-size="11" font-weight="normal" fill="#1d2733">Hồ Quý Ly và triều Hồ:</text><text x="81.0" y="84.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1d2733">hạn điền, hạn nô,</text><text x="81.0" y="98.5" text-anchor="middle" font-size="11" font-weight="normal" fill="#1d2733">tiền giấy, Tây Đô</text><circle cx="390.0" cy="144.0" r="7.0" fill="#dbe7f3" stroke="#1d2733" stroke-width="2"/><text x="390.0" y="172.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">1460–1497</text><line x1="390.0" y1="152.0" x2="390.0" y2="182.0" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="3 3"/><rect x="315.0" y="182.0" width="150.0" height="66.0" rx="8" fill="#dbe7f3" stroke="#1d2733" stroke-width="2"/><text x="390.0" y="203.5" text-anchor="middle" font-size="11" font-weight="normal" fill="#1d2733">Lê Thánh Tông:</text><text x="390.0" y="218.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1d2733">hành chính, Luật</text><text x="390.0" y="232.5" text-anchor="middle" font-size="11" font-weight="normal" fill="#1d2733">Hồng Đức (1483)</text><circle cx="720.0" cy="144.0" r="7.0" fill="#dfe9d5" stroke="#1d2733" stroke-width="2"/><text x="720.0" y="128.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">1820–1841</text><line x1="720.0" y1="136.0" x2="720.0" y2="114.0" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="3 3"/><rect x="624.0" y="48.0" width="150.0" height="66.0" rx="8" fill="#dfe9d5" stroke="#1d2733" stroke-width="2"/><text x="699.0" y="69.5" text-anchor="middle" font-size="11" font-weight="normal" fill="#1d2733">Minh Mạng:</text><text x="699.0" y="84.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1d2733">Nội các, Cơ mật viện,</text><text x="699.0" y="98.5" text-anchor="middle" font-size="11" font-weight="normal" fill="#1d2733">30 tỉnh (1831–1832)</text></svg>