<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 324" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="380.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Lãnh đạo – động lực – mục tiêu của cách mạng tư sản</text><rect x="15.0" y="50.0" width="170.0" height="56.0" rx="8" fill="#fbf0c9" stroke="#1d2733" stroke-width="2"/><text x="100.0" y="83.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Mục tiêu</text><rect x="190.0" y="50.0" width="555.0" height="56.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="202.0" y="83.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">Xoá bỏ rào cản kìm hãm kinh tế TBCN, mở đường cho CNTB phát triển</text><rect x="15.0" y="116.0" width="170.0" height="56.0" rx="8" fill="#dbe7f3" stroke="#1d2733" stroke-width="2"/><text x="100.0" y="149.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Nhiệm vụ</text><rect x="190.0" y="116.0" width="555.0" height="56.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="202.0" y="141.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">Dân tộc: xoá cát cứ, thống nhất thị trường (hoặc giải phóng dân tộc)</text><text x="202.0" y="157.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">Dân chủ: xoá chế độ phong kiến chuyên chế, lập dân chủ tư sản</text><rect x="15.0" y="182.0" width="170.0" height="56.0" rx="8" fill="#dfe9d5" stroke="#1d2733" stroke-width="2"/><text x="100.0" y="215.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Lãnh đạo</text><rect x="190.0" y="182.0" width="555.0" height="56.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="202.0" y="215.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">Giai cấp tư sản; quý tộc mới (Anh); chủ nô (Bắc Mỹ)</text><rect x="15.0" y="248.0" width="170.0" height="56.0" rx="8" fill="#f7d4d4" stroke="#1d2733" stroke-width="2"/><text x="100.0" y="281.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Động lực</text><rect x="190.0" y="248.0" width="555.0" height="56.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="202.0" y="281.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">Giai cấp lãnh đạo + quần chúng nhân dân (nông dân, thợ thủ công, công nhân)</text></svg>