<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 200" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="380.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Bốn tiền đề của cách mạng tư sản</text><rect x="15.0" y="50.0" width="172.5" height="34.0" rx="8" fill="#fbf0c9" stroke="#1d2733" stroke-width="2"/><text x="101.2" y="72.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Kinh tế</text><rect x="15.0" y="88.0" width="172.5" height="100.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="101.2" y="110.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Kinh tế TBCN ra đời</text><text x="101.2" y="127.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">trong lòng chế độ</text><text x="101.2" y="144.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">phong kiến/thuộc địa</text><text x="101.2" y="161.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">nhưng bị kìm hãm</text><rect x="197.5" y="50.0" width="172.5" height="34.0" rx="8" fill="#f7d4d4" stroke="#1d2733" stroke-width="2"/><text x="283.8" y="72.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Chính trị</text><rect x="197.5" y="88.0" width="172.5" height="100.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="283.8" y="110.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Nhà nước phong kiến,</text><text x="283.8" y="127.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">thực dân cai trị</text><text x="283.8" y="144.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">chuyên chế, hà khắc</text><text x="283.8" y="161.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">→ bất mãn</text><rect x="380.0" y="50.0" width="172.5" height="34.0" rx="8" fill="#dfe9d5" stroke="#1d2733" stroke-width="2"/><text x="466.2" y="72.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Xã hội</text><rect x="380.0" y="88.0" width="172.5" height="100.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="466.2" y="110.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Tư sản giàu nhưng</text><text x="466.2" y="127.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">không có quyền lực;</text><text x="466.2" y="144.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">nông dân, công nhân</text><text x="466.2" y="161.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">khổ cực</text><rect x="562.5" y="50.0" width="172.5" height="34.0" rx="8" fill="#dbe7f3" stroke="#1d2733" stroke-width="2"/><text x="648.8" y="72.0" text-anchor="middle" font-size="13" font-weigh