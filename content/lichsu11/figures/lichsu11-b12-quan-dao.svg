<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 212" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="380.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Quần đảo Hoàng Sa và quần đảo Trường Sa</text><rect x="15.0" y="50.0" width="233.3" height="34.0" rx="8" fill="#fbf0c9" stroke="#1d2733" stroke-width="2"/><text x="131.7" y="72.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Hoàng Sa</text><rect x="15.0" y="88.0" width="233.3" height="112.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="131.7" y="110.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">phía bắc Biển Đông</text><text x="131.7" y="127.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">khoảng 111°Đ – 113°Đ,</text><text x="131.7" y="144.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">15°45'B – 17°15'B</text><text x="131.7" y="161.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">đảo Phú Lâm, Lin Côn,</text><text x="131.7" y="178.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Tri Tôn, Hoàng Sa</text><rect x="258.3" y="50.0" width="233.3" height="34.0" rx="8" fill="#dbe7f3" stroke="#1d2733" stroke-width="2"/><text x="375.0" y="72.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Trường Sa</text><rect x="258.3" y="88.0" width="233.3" height="112.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="375.0" y="110.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">phía đông nam bờ biển VN</text><text x="375.0" y="127.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">hơn 100 đảo, đá, bãi</text><text x="375.0" y="144.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">6°30'B – 12°B, 111°30'Đ – 117°20'Đ</text><text x="375.0" y="161.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Ba Bình lớn nhất (0,6 km²),</text><text x="375.0" y="178.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Song Tử Tây cao nhất; 8 cụm</text><rect x="501.7" y="50.0" width="233.3" height="34.0" rx="8" fill="#dfe9d5" stroke="#1d2733" stroke-width="2"/><text x="618.3" y="72.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Tầm quan trọng</text><rect x="501.7" y="88.0" width="233.3" height="112.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="618.3" y="110.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">án ngữ tuyến hàng hải</text><text x="618.3" y="127.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">quốc tế; quốc phòng –</text><text x="618.3" y="144.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">an ninh; ngư trường</text><text x="618.3" y="161.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">khổng lồ; dầu khí,</text><text x="618.3" y="178.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">băng cháy; du lịch</text></svg>