<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 212" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="380.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Biển Đông: vị trí và tầm quan trọng chiến lược</text><rect x="15.0" y="50.0" width="172.5" height="34.0" rx="8" fill="#dbe7f3" stroke="#1d2733" stroke-width="2"/><text x="101.2" y="72.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Vị trí</text><rect x="15.0" y="88.0" width="172.5" height="112.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="101.2" y="110.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Thuộc Thái Bình Dương</text><text x="101.2" y="127.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">khoảng 3°N – 26°B,</text><text x="101.2" y="144.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">100°Đ – 121°Đ</text><text x="101.2" y="161.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">diện tích ~3,5 triệu km²</text><text x="101.2" y="178.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">dài ~3 000 km, biển kín</text><rect x="197.5" y="50.0" width="172.5" height="34.0" rx="8" fill="#fbf0c9" stroke="#1d2733" stroke-width="2"/><text x="283.8" y="72.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Giao thông</text><rect x="197.5" y="88.0" width="172.5" height="112.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="283.8" y="110.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">5/10 tuyến vận tải biển</text><text x="283.8" y="127.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">trọng yếu thế giới</text><text x="283.8" y="144.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">nhộn nhịp thứ 2 thế giới</text><text x="283.8" y="161.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">eo Ma-lắc-ca, Đài Loan,</text><text x="283.8" y="178.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Ba-si, Ga-xpa...</text><rect x="380.0" y="50.0" width="172.5" height="34.0" rx="8" fill="#dfe9d5" stroke="#1d2733" stroke-width="2"/><text x="466.2" y="72.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Địa bàn chiến lược</text><rect x="380.0" y="88.0" width="172.5" height="112.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="466.2" y="110.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">đường ngắn nhất nối</text><text x="466.2" y="127.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Thái Bình Dương –</text><text x="466.2" y="144.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Ấn Độ Dương; cảng</text><text x="466.2" y="161.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Xin-ga-po, Ma-ni-la,</text><text x="466.2" y="178.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Đà Nẵng, Hồng Công</text><rect x="562.5" y="50.0" width="172.5" height="34.0" rx="8" fill="#f7d4d4" stroke="#1d2733" stroke-width="2"/><text x="648.8" y="72.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Tài nguyên</text><rect x="562.5" y="88.0" width="172.5" height="112.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="648.8" y="110.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">12 000 loài sinh vật,</text><text x="648.8" y="127.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">2 040 loài cá; sản lượng</text><text x="648.8" y="144.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">6 triệu tấn (10% thế giới);</text><text x="648.8" y="161.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">dầu khí, ti-tan, thiếc;</text><text x="648.8" y="178.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">băng cháy</text></svg>