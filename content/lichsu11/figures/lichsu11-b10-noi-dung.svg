<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 370" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="380.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Nội dung cải cách của Lê Thánh Tông</text><rect x="15.0" y="50.0" width="170.0" height="52.0" rx="8" fill="#fbf0c9" stroke="#1d2733" stroke-width="2"/><text x="100.0" y="81.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Hành chính</text><rect x="190.0" y="50.0" width="555.0" height="52.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="202.0" y="73.0" text-anchor="start" font-size="11" font-weight="normal" fill="#1d2733">Bỏ chức đại thần quyền lớn; hoàn thiện lục Bộ, đặt lục Tự, lục Khoa;</text><text x="202.0" y="89.0" text-anchor="start" font-size="11" font-weight="normal" fill="#1d2733">1466 bỏ 5 đạo, lập 12 (sau 13) đạo thừa tuyên; tuyển quan qua khoa cử</text><rect x="15.0" y="112.0" width="170.0" height="52.0" rx="8" fill="#dbe7f3" stroke="#1d2733" stroke-width="2"/><text x="100.0" y="143.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Pháp luật</text><rect x="190.0" y="112.0" width="555.0" height="52.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="202.0" y="135.0" text-anchor="start" font-size="11" font-weight="normal" fill="#1d2733">1483: Quốc triều hình luật (Luật Hồng Đức, 722 điều)</text><text x="202.0" y="151.0" text-anchor="start" font-size="11" font-weight="normal" fill="#1d2733">bảo vệ phụ nữ, người già, trẻ em, sản xuất nông nghiệp</text><rect x="15.0" y="174.0" width="170.0" height="52.0" rx="8" fill="#dfe9d5" stroke="#1d2733" stroke-width="2"/><text x="100.0" y="205.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Quân đội</text><rect x="190.0" y="174.0" width="555.0" height="52.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="202.0" y="197.0" text-anchor="start" font-size="11" font-weight="normal" fill="#1d2733">1466 cải tổ: cấm binh (kinh thành), ngoại binh (các đạo)</text><text x="202.0" y="213.0" text-anchor="start" font-size="11" font-weight="normal" fill="#1d2733">duyệt binh hằng năm, thi võ nghệ 3 năm/lần</text><rect x="15.0" y="236.0" width="170.0" height="52.0" rx="8" fill="#f7d4d4" stroke="#1d2733" stroke-width="2"/><text x="100.0" y="267.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Kinh tế</text><rect x="190.0" y="236.0" width="555.0" height="52.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="202.0" y="259.0" text-anchor="start" font-size="11" font-weight="normal" fill="#1d2733">Lộc điền: ban ruộng cho quý tộc, quan tứ phẩm trở lên</text><text x="202.0" y="275.0" text-anchor="start" font-size="11" font-weight="normal" fill="#1d2733">Quân điền: chia ruộng công của xã cho mọi tầng lớp</text><rect x="15.0" y="298.0" width="170.0" height="52.0" rx="8" fill="#eef1f4" stroke="#1d2733" stroke-width="2"/><text x="100.0" y="329.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Văn hoá – giáo dục</text><rect x="190.0" y="298.0" width="555.0" height="52.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="202.0" y="321.0" text-anchor="start" font-size="11" font-weight="normal" fill="#1d2733">Biên soạn quốc sử; xây lại Văn Miếu, mở Thái Học viện</text><text x="202.0" y="337.0" text-anchor="start" font-size="11" font-weight="normal" fill="#1d2733">dựng bia Tiến sĩ; lấy đỗ hơn 500 Tiến sĩ</text></svg>