<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 228" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="320.0" y="24.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d2733">Sông ngòi và chế độ nước ở Việt Nam</text><text x="30.0" y="50.0" text-anchor="start" font-size="13" font-weight="bold" fill="#1d2733">Trong 2 360 con sông dài trên 10 km</text><rect x="30.0" y="56.0" width="539.4" height="38.0" rx="0" fill="#dbe7f3" stroke="#4e79a7" stroke-width="2"/><text x="299.7" y="80.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Sông nhỏ, ngắn: 93%</text><rect x="569.4" y="56.0" width="40.6" height="38.0" rx="0" fill="#eef1f4" stroke="#9aa5b1" stroke-width="2"/><text x="589.7" y="80.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">7%</text><text x="30.0" y="124.0" text-anchor="start" font-size="13" font-weight="bold" fill="#1d2733">Lượng nước cả năm</text><rect x="30.0" y="130.0" width="406.0" height="38.0" rx="0" fill="#dbe7f3" stroke="#4e79a7" stroke-width="2"/><text x="233.0" y="154.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Mùa lũ: 70%</text><rect x="436.0" y="130.0" width="58.0" height="38.0" rx="0" fill="#fde3c4" stroke="#f28e2b" stroke-width="2"/><text x="465.0" y="154.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">→ 80%</text><rect x="494.0" y="130.0" width="116.0" height="38.0" rx="0" fill="#eef1f4" stroke="#9aa5b1" stroke-width="2"/><text x="552.0" y="147.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">Mùa cạn</text><text x="552.0" y="162.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">20 – 30%</text><text x="320.0" y="220.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#55606d">Mùa lũ chiếm từ 70% đến 80% lượng nước cả năm; phần còn lại là mùa cạn.</text></svg>