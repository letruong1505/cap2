<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 228" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="320.0" y="24.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d2733">Địa hình Việt Nam</text><text x="30.0" y="50.0" text-anchor="start" font-size="13" font-weight="bold" fill="#1d2733">Theo diện tích</text><rect x="30.0" y="56.0" width="435.0" height="38.0" rx="0" fill="#dfe9d5" stroke="#59a14f" stroke-width="2"/><text x="247.5" y="80.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Đồi núi ≈ 3/4 diện tích</text><rect x="465.0" y="56.0" width="145.0" height="38.0" rx="0" fill="#dbe7f3" stroke="#4e79a7" stroke-width="2"/><text x="537.5" y="80.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Đồng bằng ≈ 1/4</text><text x="30.0" y="124.0" text-anchor="start" font-size="13" font-weight="bold" fill="#1d2733">Theo độ cao</text><rect x="30.0" y="130.0" width="493.0" height="38.0" rx="0" fill="#dfe9d5" stroke="#59a14f" stroke-width="2"/><text x="276.5" y="154.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Dưới 1 000 m ≈ 85%</text><rect x="523.0" y="130.0" width="87.0" height="38.0" rx="0" fill="#fde3c4" stroke="#f28e2b" stroke-width="2"/><text x="566.5" y="147.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">Từ 1 000 m</text><text x="566.5" y="162.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">trở lên ≈ 15%</text><text x="320.0" y="220.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#55606d">Trong đó núi cao trên 2 000 m chỉ chiếm khoảng 1% diện tích lãnh thổ.</text></svg>