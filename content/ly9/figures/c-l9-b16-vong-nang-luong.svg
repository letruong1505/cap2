<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 256" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="360.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Vòng năng lượng: từ Mặt Trời đến nhiên liệu hoá thạch</text><rect x="10.0" y="90.0" width="130.0" height="70.0" rx="8" fill="#ffe9a8" stroke="#1d2733" stroke-width="2.2"/><text x="75.0" y="125.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2733">Mặt Trời</text><rect x="190.0" y="90.0" width="130.0" height="70.0" rx="8" fill="#dfe9d5" stroke="#1d2733" stroke-width="2.2"/><text x="255.0" y="125.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2733">Thực vật</text><rect x="370.0" y="90.0" width="130.0" height="70.0" rx="8" fill="#c8ccd2" stroke="#1d2733" stroke-width="2.2"/><text x="435.0" y="117.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2733">Nhiên liệu</text><text x="435.0" y="135.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2733">hoá thạch</text><rect x="550.0" y="90.0" width="130.0" height="70.0" rx="8" fill="#fbe3d0" stroke="#1d2733" stroke-width="2.2"/><text x="615.0" y="117.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2733">Nhiệt, điện,</text><text x="615.0" y="135.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2733">động lực</text><line x1="142.0" y1="125.0" x2="188.0" y2="125.0" stroke="#4e79a7" stroke-width="2.4" marker-end="url(#ar)"/><text x="165.0" y="76.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#4e79a7">quang hợp</text><line x1="322.0" y1="125.0" x2="368.0" y2="125.0" stroke="#4e79a7" stroke-width="2.4" marker-end="url(#ar)"/><text x="345.0" y="76.0" text-anchor="middle" font-size="12" font-weight="norm