<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 292" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="360.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Khúc xạ ánh sáng: n₁ = 1 (không khí), n₂ = 1,5 (thuỷ tinh)</text><rect x="40.0" y="150.0" width="480.0" height="130.0" rx="0" fill="#dff0fa" stroke="none" stroke-width="0"/><line x1="40.0" y1="150.0" x2="520.0" y2="150.0" stroke="#1d2733" stroke-width="2.4"/><line x1="280.0" y1="40.0" x2="280.0" y2="270.0" stroke="#9aa5b1" stroke-width="1.6" stroke-dasharray="6 4"/><text x="288.0" y="52.0" text-anchor="start" font-size="12" font-weight="normal" fill="#9aa5b1">pháp tuyến</text><line x1="195.1" y1="65.1" x2="280.0" y2="150.0" stroke="#e15759" stroke-width="2.6" marker-end="url(#ar)"/><line x1="280.0" y1="150.0" x2="331.9" y2="247.0" stroke="#4e79a7" stroke-width="2.6" marker-end="url(#ar)"/><line x1="280.0" y1="150.0" x2="343.6" y2="86.4" stroke="#9aa5b1" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ar)"/><path d="M280.0,104.0 A46.0,46.0 0 0 0 280.0,104.0" fill="none" stroke="#e15759" stroke-width="0"/><path d="M280.0,98.0 A52.0,52.0 0 0 0 243.2,113.2" fill="none" stroke="#e15759" stroke-width="1.8"/><text x="250.0" y="88.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#e15759" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">i</text><path d="M253.6,199.4 A56.0,56.0 0 0 0 280.0,206.0" fill="none" stroke="#4e79a7" stroke-width="1.8"/><text x="302.0" y="224.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#4e79a7" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">r</text><text x="70.0" y="76.0" text-anchor="start" font-size="13" font-weight="bold" fill="#1d2733">Môi trường 1 (n₁ = 1)</text><text x="70.0" y="262.0" text-anchor="start" font-size="13" font-weight="bold" fill="#1d2733">Môi trường 2 (n₂ = 1,5)</text><text x="199.1" y="57.1" text-anchor="start" font-size="13" font-weight="bold" fill="#e15759" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">tia tới</text><text x="339.9" y="247.0" text-anchor="start" font-size="13" font-weight="bold" fill="#4e79a7" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">tia khúc xạ</text><rect x="545.0" y="80.0" width="170.0" height="211.0" rx="8" fill="#eef1f4" stroke="#9aa5b1" stroke-width="1.2"/><text x="559.0" y="110.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">n₁·sin i = n₂·sin r</text><text x="559.0" y="131.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733"></text><text x="559.0" y="152.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">i = 45°:</text><text x="559.0" y="173.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">sin r = sin 45° : 1,5</text><text x="559.0" y="194.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">≈ 0,471</text><text x="559.0" y="215.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">r ≈ 28,1° &lt; i</text><text x="559.0" y="236.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733"></text><text x="559.0" y="257.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">Tia khúc xạ lệch</text><text x="559.0" y="278.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">lại gần pháp tuyến.</text></svg>