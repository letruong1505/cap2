<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 296" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="360.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Biến đổi thức ăn ở từng đoạn của ống tiêu hoá</text><rect x="10.0" y="50.0" width="166.0" height="200.0" rx="10" fill="#f9d9d6" stroke="#1d2733" stroke-width="2"/><text x="93.0" y="78.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d2733">Miệng</text><line x1="24.0" y1="90.0" x2="162.0" y2="90.0" stroke="#1d2733" stroke-width="1"/><text x="93.0" y="114.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">Cơ học: nhai, nghiền,</text><text x="93.0" y="135.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">đảo trộn thức ăn</text><text x="93.0" y="156.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">Hoá học: enzyme amylase</text><text x="93.0" y="177.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">biến đổi một phần</text><text x="93.0" y="198.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">tinh bột chín</text><line x1="178.0" y1="150.0" x2="186.0" y2="150.0" stroke="#1d2733" stroke-width="2.4" marker-end="url(#ar)"/><rect x="188.0" y="50.0" width="166.0" height="200.0" rx="10" fill="#fbe3c8" stroke="#1d2733" stroke-width="2"/><text x="271.0" y="78.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d2733">Dạ dày</text><line x1="202.0" y1="90.0" x2="340.0" y2="90.0" stroke="#1d2733" stroke-width="1"/><text x="271.0" y="114.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">Co bóp dạ dày</text><text x="271.0" y="135.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">Dịch vị: hydrochloric</text><text x="271.0" y="156.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">acid, pepsin, lipase</text><text x="271.0" y="177.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">biến đổi một phần</text><text x="271.0" y="198.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">protein</text><line x1="356.0" y1="150.0" x2="364.0" y2="150.0" stroke="#1d2733" stroke-width="2.4" marker-end="url(#ar)"/><rect x="366.0" y="50.0" width="166.0" height="200.0" rx="10" fill="#dcebc9" stroke="#1d2733" stroke-width="2"/><text x="449.0" y="78.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d2733">Ruột non</text><line x1="380.0" y1="90.0" x2="518.0" y2="90.0" stroke="#1d2733" stroke-width="1"/><text x="449.0" y="114.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">Dịch tuỵ, dịch mật,</text><text x="449.0" y="135.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">dịch ruột biến đổi</text><text x="449.0" y="156.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">chất dinh dưỡng thành</text><text x="449.0" y="177.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">chất đơn giản</text><text x="449.0" y="198.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">Hấp thụ chủ yếu ở đây</text><line x1="534.0" y1="150.0" x2="542.0" y2="150.0" stroke="#1d2733" stroke-width="2.4" marker-end="url(#ar)"/><rect x="544.0" y="50.0" width="166.0" height="200.0" rx="10" fill="#e2d6f0" stroke="#1d2733" stroke-width="2"/><text x="627.0" y="78.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d2733">Ruột già</text><line x1="558.0" y1="90.0" x2="696.0" y2="90.0" stroke="#1d2733" stroke-width="1"/><text x="627.0" y="114.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">Hấp thụ lại nước</text><text x="627.0" y="135.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">Tạo phân</text><text x="360.0" y="278.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#9aa5b1">Thức ăn đi theo ống tiêu hoá từ miệng đến hậu môn</text></svg>