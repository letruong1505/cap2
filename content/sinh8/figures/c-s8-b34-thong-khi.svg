<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 362" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="360.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Cử động hô hấp làm thay đổi thể tích lồng ngực</text><rect x="125.0" y="70.0" width="130.0" height="130.0" rx="24" fill="#fbf0c9" stroke="#1d2733" stroke-width="3"/><rect x="135.0" y="78.0" width="110.0" height="104.0" rx="18" fill="#f4c6c6" stroke="#1d2733" stroke-width="2"/><path d="M121,196 Q190,208 259,196" fill="none" stroke="#8a5a2b" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><line x1="190.0" y1="36.0" x2="190.0" y2="88.0" stroke="#4e79a7" stroke-width="3.2" marker-end="url(#ar)"/><line x1="115.0" y1="135.0" x2="85.0" y2="135.0" stroke="#f28e2b" stroke-width="3" marker-end="url(#ar)"/><line x1="265.0" y1="135.0" x2="295.0" y2="135.0" stroke="#f28e2b" stroke-width="3" marker-end="url(#ar)"/><line x1="190.0" y1="214.0" x2="190.0" y2="250.0" stroke="#f28e2b" stroke-width="3" marker-end="url(#ar)"/><text x="190.0" y="139.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2733">phổi</text><text x="190.0" y="250.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d2733">Hít vào</text><rect x="478.0" y="70.0" width="104.0" height="108.0" rx="24" fill="#fbf0c9" stroke="#1d2733" stroke-width="3"/><rect x="488.0" y="78.0" width="84.0" height="78.0" rx="18" fill="#f4c6c6" stroke="#1d2733" stroke-width="2"/><path d="M474,182 Q530,152 586,182" fill="none" stroke="#8a5a2b" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><line x1="530.0" y1="88.0" x2="530.0" y2="36.0" stroke="#e15759" stroke-width="3.2" marker-end="url(#ar)"/><line x1="438.0" y1="124.0" x2="468.0" y2="124.0" stroke="#f28e2b" stroke-width="3" marker-end="url(#ar)"/><line x1="622.0" y1="124.0" x2="592.0" y2="124.0" stroke="#f28e2b" stroke-width="3" marker-end="url(#ar)"/><line x1="530.0" y1="228.0" x2="530.0" y2="190.0" stroke="#f28e2b" stroke-width="3" marker-end="url(#ar)"/><text x="530.0" y="128.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2733">phổi</text><text x="530.0" y="250.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d2733">Thở ra</text><text x="190.0" y="276.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">Cơ liên sườn co: xương sườn nâng lên;</text><text x="190.0" y="294.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">cơ hoành co: hạ xuống → thể tích lồng ngực tăng,</text><text x="190.0" y="312.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">không khí vào phổi</text><text x="530.0" y="276.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">Cơ liên sườn dãn: xương sườn hạ xuống;</text><text x="530.0" y="294.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">cơ hoành dãn: vòm lên → thể tích lồng ngực giảm,</text><text x="530.0" y="312.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">không khí ra khỏi phổi</text><text x="20.0" y="70.0" text-anchor="middle" font-size="1" font-weight="normal" fill="#1d2733"></text><text x="360.0" y="344.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#9aa5b1">Đường nâu ở đáy: cơ hoành. Mũi tên cam: lồng ngực nở rộng (hít vào) hoặc thu hẹp (thở ra)</text></svg>