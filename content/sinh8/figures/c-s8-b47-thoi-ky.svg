<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 254" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="360.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Tác động của con người đến môi trường qua các thời kì</text><line x1="40.0" y1="70.0" x2="680.0" y2="70.0" stroke="#1d2733" stroke-width="3" marker-end="url(#ar)"/><circle cx="100.0" cy="70.0" r="8.0" fill="#4e79a7" stroke="#1d2733" stroke-width="1.8"/><rect x="20.0" y="96.0" width="160.0" height="112.0" rx="10" fill="#dcebc9" stroke="#1d2733" stroke-width="2"/><text x="100.0" y="122.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2733">Nguyên thuỷ</text><line x1="34.0" y1="132.0" x2="166.0" y2="132.0" stroke="#1d2733" stroke-width="1"/><text x="100.0" y="156.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">hái lượm, săn bắn,</text><text x="100.0" y="174.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">dùng lửa</text><circle cx="276.0" cy="70.0" r="8.0" fill="#4e79a7" stroke="#1d2733" stroke-width="1.8"/><rect x="196.0" y="96.0" width="160.0" height="112.0" rx="10" fill="#f6efc9" stroke="#1d2733" stroke-width="2"/><text x="276.0" y="122.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2733">Xã hội nông nghiệp</text><line x1="210.0" y1="132.0" x2="342.0" y2="132.0" stroke="#1d2733" stroke-width="1"/><text x="276.0" y="156.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">trồng trọt, chăn nuôi,</text><text x="276.0" y="174.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">định cư, thuỷ lợi</text><circle cx="452.0" cy="70.0" r="8.0" fill="#4e79a7" stroke="#1d2733" stroke-width="1.8"/><rect x="372.0" y="96.0" width="160.0" height="112.0" rx="10" fill="#f9d9d6" stroke="#1d2733" stroke-width="2"/><text x="452.0" y="122.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2733">Công nghiệp</text><line x1="386.0" y1="132.0" x2="518.0" y2="132.0" stroke="#1d2733" stroke-width="1"/><text x="452.0" y="156.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">cơ giới hoá, khai thác</text><text x="452.0" y="174.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">khoáng sản, khí thải tăng</text><circle cx="628.0" cy="70.0" r="8.0" fill="#4e79a7" stroke="#1d2733" stroke-width="1.8"/><rect x="548.0" y="96.0" width="160.0" height="112.0" rx="10" fill="#d6e4f3" stroke="#1d2733" stroke-width="2"/><text x="628.0" y="122.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2733">Hậu công nghiệp</text><line x1="562.0" y1="132.0" x2="694.0" y2="132.0" stroke="#1d2733" stroke-width="1"/><text x="628.0" y="156.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">công nghệ thông tin</text><text x="628.0" y="174.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">giúp tiết kiệm tài nguyên</text><text x="360.0" y="236.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#9aa5b1">Mức tác động đến môi trường thay đổi theo từng thời kì phát triển của xã hội</text></svg>