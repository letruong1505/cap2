<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 308" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="360.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Môi trường sống và nhân tố sinh thái</text><rect x="10.0" y="46.0" width="166.0" height="54.0" rx="10" fill="#e7f1df" stroke="#1d2733" stroke-width="2"/><text x="93.0" y="70.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">Môi trường</text><text x="93.0" y="90.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2733">trên cạn</text><rect x="188.0" y="46.0" width="166.0" height="54.0" rx="10" fill="#d3e8f3" stroke="#1d2733" stroke-width="2"/><text x="271.0" y="70.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">Môi trường</text><text x="271.0" y="90.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2733">dưới nước</text><rect x="366.0" y="46.0" width="166.0" height="54.0" rx="10" fill="#e6d3bb" stroke="#1d2733" stroke-width="2"/><text x="449.0" y="70.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">Môi trường</text><text x="449.0" y="90.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2733">trong đất</text><rect x="544.0" y="46.0" width="166.0" height="54.0" rx="10" fill="#f3d8e3" stroke="#1d2733" stroke-width="2"/><text x="627.0" y="70.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">Môi trường</text><text x="627.0" y="90.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2733">sinh vật</text><text x="360.0" y="128.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2733">Nhân tố sinh thái: các nhân tố trong môi trường ảnh hưởng đến sinh vật</text><polyline points="360.0,134.0 360.0,150.0 190.0,150.0 190.0,166.0" fill="none" stroke="#1d2733" stroke-width="2" stroke-linejoin="round"/><polyline points="360.0,150.0 530.0,150.0 530.0,166.0" fill="none" stroke="#1d2733" stroke-width="2" stroke-linejoin="round"/><rect x="40.0" y="166.0" width="300.0" height="46.0" rx="10" fill="#fbf0c9" stroke="#1d2733" stroke-width="2.2"/><text x="190.0" y="195.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2733">Nhân tố vô sinh</text><rect x="380.0" y="166.0" width="300.0" height="46.0" rx="10" fill="#dcebc9" stroke="#1d2733" stroke-width="2.2"/><text x="530.0" y="195.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2733">Nhân tố hữu sinh</text><text x="190.0" y="240.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#1d2733">ánh sáng, nhiệt độ,</text><text x="190.0" y="258.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#1d2733">độ ẩm, nước, đất,…</text><text x="530.0" y="240.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#1d2733">các sinh vật khác và con người</text><text x="530.0" y="258.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#1d2733">(con người ảnh hưởng lớn nhất)</text><text x="360.0" y="290.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#9aa5b1">Các sinh vật có quan hệ hỗ trợ hoặc cạnh tranh</text></svg>