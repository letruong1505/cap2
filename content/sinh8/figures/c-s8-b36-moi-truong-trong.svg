<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="360.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Môi trường trong của cơ thể: máu, nước mô và bạch huyết</text><rect x="20.0" y="120.0" width="680.0" height="120.0" rx="14" fill="#e4f1f7" stroke="none" stroke-width="0"/><text x="28.0" y="140.0" text-anchor="start" font-size="14" font-weight="bold" fill="#4e79a7">Nước mô</text><rect x="20.0" y="52.0" width="680.0" height="46.0" rx="23" fill="#f2b5b5" stroke="#1d2733" stroke-width="2.4"/><text x="360.0" y="82.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2733">Máu (trong mao mạch máu)</text><ellipse cx="120.0" cy="215.0" rx="46.0" ry="26.0" fill="#f6e7c8" stroke="#1d2733" stroke-width="2.2"/><ellipse cx="120.0" cy="215.0" rx="12.0" ry="9.0" fill="#c9b6e4" stroke="#1d2733" stroke-width="1.4"/><ellipse cx="250.0" cy="215.0" rx="46.0" ry="26.0" fill="#f6e7c8" stroke="#1d2733" stroke-width="2.2"/><ellipse cx="250.0" cy="215.0" rx="12.0" ry="9.0" fill="#c9b6e4" stroke="#1d2733" stroke-width="1.4"/><ellipse cx="380.0" cy="215.0" rx="46.0" ry="26.0" fill="#f6e7c8" stroke="#1d2733" stroke-width="2.2"/><ellipse cx="380.0" cy="215.0" rx="12.0" ry="9.0" fill="#c9b6e4" stroke="#1d2733" stroke-width="1.4"/><text x="250.0" y="262.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">tế bào</text><rect x="480.0" y="180.0" width="220.0" height="40.0" rx="20" fill="#cfe6c4" stroke="#1d2733" stroke-width="2.2"/><text x="590.0" y="205.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2733">Bạch huyết</text><line x1="150.0" y1="98.0" x2="150.0" y2="168.0" stroke="#f28e2b" stroke-width="3" marker-end="url(#ar)"/><text x="160.0" y="126.0" text-anchor="start" font-size="12" font-weight="normal" fill="#9a5d10">chất dinh dưỡng, O₂</text><line x1="330.0" y1="168.0" x2="330.0" y2="98.0" stroke="#4e79a7" stroke-width="3" marker-end="url(#ar)"/><text x="340.0" y="126.0" text-anchor="start" font-size="12" font-weight="normal" fill="#4e79a7">chất thải, CO₂</text><line x1="440.0" y1="180.0" x2="478.0" y2="195.0" stroke="#59a14f" stroke-width="3" marker-end="url(#ar)"/><text x="560.0" y="156.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#2f6b2a">nước mô → bạch huyết</text><text x="360.0" y="290.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#3b4856">Các chất trao đổi giữa máu và tế bào qua nước mô;</text><text x="360.0" y="308.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#3b4856">môi trường trong liên hệ với môi trường ngoài qua tiêu hoá, hô hấp, bài tiết, tuần hoàn</text></svg>