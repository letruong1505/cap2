<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 376" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="360.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Kháng nguyên – kháng thể: cơ chế chìa khoá – ổ khoá</text><line x1="180.0" y1="262.0" x2="180.0" y2="206.0" stroke="#4e79a7" stroke-width="9"/><line x1="180.0" y1="206.0" x2="150.0" y2="172.0" stroke="#4e79a7" stroke-width="9"/><path d="M136,174 L136,156 L144,156 L150,166 L156,156 L164,156 L164,174 Z" fill="#4e79a7" stroke="#1d2733" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><line x1="180.0" y1="206.0" x2="210.0" y2="172.0" stroke="#4e79a7" stroke-width="9"/><path d="M196,174 L196,156 L204,156 L210,166 L216,156 L224,156 L224,174 Z" fill="#4e79a7" stroke="#1d2733" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><rect x="106.0" y="110.0" width="148.0" height="46.0" rx="16" fill="#e9c6d5" stroke="#1d2733" stroke-width="2.2"/><text x="180.0" y="138.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">mầm bệnh</text><polygon points="142.0,156.0 158.0,156.0 150.0,166.0" fill="#e15759" stroke="#1d2733" stroke-width="1.6" stroke-linejoin="round"/><polygon points="202.0,156.0 218.0,156.0 210.0,166.0" fill="#e15759" stroke="#1d2733" stroke-width="1.6" stroke-linejoin="round"/><text x="180.0" y="286.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#59a14f">Kháng nguyên vừa khít với kháng thể</text><text x="180.0" y="304.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#3b4856">→ có liên kết, tiêu diệt mầm bệnh</text><text x="236.0" y="236.0" text-anchor="start" font-size="13" font-weight="bold" fill="#4e79a7">kháng thể</text><line x1="540.0" y1="262.0" x2="540.0" y2="206.0" stroke="#4e79a7" stroke-width="9"/><line x1="540.0" y1="206.0" x2="510.0" y2="172.0" stroke="#4e79a7" stroke-width="9"/><path d="M496,174 L496,156 L504,156 L510,166 L516,156 L524,156 L524,174 Z" fill="#4e79a7" stroke="#1d2733" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><line x1="540.0" y1="206.0" x2="570.0" y2="172.0" stroke="#4e79a7" stroke-width="9"/><path d="M556,174 L556,156 L564,156 L570,166 L576,156 L584,156 L584,174 Z" fill="#4e79a7" stroke="#1d2733" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><rect x="466.0" y="92.0" width="148.0" height="46.0" rx="16" fill="#e9c6d5" stroke="#1d2733" stroke-width="2.2"/><text x="540.0" y="120.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">mầm bệnh</text><rect x="502.0" y="140.0" width="16.0" height="14.0" rx="0" fill="#8e6fc4" stroke="#1d2733" stroke-width="1.6"/><rect x="562.0" y="140.0" width="16.0" height="14.0" rx="0" fill="#8e6fc4" stroke="#1d2733" stroke-width="1.6"/><text x="540.0" y="286.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#e15759">Kháng nguyên không khớp với kháng thể</text><text x="540.0" y="304.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#3b4856">→ không liên kết được</text><text x="596.0" y="236.0" text-anchor="start" font-size="13" font-weight="bold" fill="#4e79a7">kháng thể</text><line x1="360.0" y1="50.0" x2="360.0" y2="312.0" stroke="#9aa5b1" stroke-width="1.2" stroke-dasharray="4 4"/><text x="360.0" y="334.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#9aa5b1">Kháng thể (protein do tế bào lympho B tạo ra) chỉ liên kết với kháng nguyên tương ứng</text><text x="360.0" y="352.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#9aa5b1">Tế bào lympho B nhớ giúp cơ thể đáp ứng nhanh khi mầm bệnh xâm nhập lại</text></svg>