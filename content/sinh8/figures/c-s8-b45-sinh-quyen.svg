<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="360.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Sinh quyển: gồm các lớp đất, nước và không khí có sinh vật sống</text><rect x="40.0" y="50.0" width="640.0" height="70.0" rx="10" fill="#e6f2fb" stroke="#1d2733" stroke-width="2.2"/><text x="360.0" y="82.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2733">Khí quyển (lớp không khí)</text><text x="360.0" y="104.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#3b4856">sinh vật sống ở lớp thấp: chim, côn trùng, vi sinh vật,…</text><rect x="40.0" y="124.0" width="320.0" height="90.0" rx="10" fill="#e6d3bb" stroke="#1d2733" stroke-width="2.2"/><text x="200.0" y="160.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2733">Thạch quyển (lớp đất)</text><text x="200.0" y="184.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#3b4856">sinh vật sống trên và trong đất</text><rect x="364.0" y="124.0" width="316.0" height="90.0" rx="10" fill="#cfe6f1" stroke="#1d2733" stroke-width="2.2"/><text x="522.0" y="160.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2733">Thuỷ quyển (lớp nước đại dương)</text><text x="522.0" y="184.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#3b4856">sinh vật sống trong nước</text><text x="360.0" y="250.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#4e79a7">Sinh quyển = toàn bộ sinh vật + các nhân tố vô sinh của môi trường</text><text x="360.0" y="272.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#9aa5b1">Là hệ sinh thái khổng lồ trên Trái Đất</text></svg>