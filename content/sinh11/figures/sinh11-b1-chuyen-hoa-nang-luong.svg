<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 366" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="380.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Sơ đồ chuyển hoá năng lượng trong sinh giới</text><rect x="20.0" y="60.0" width="130.0" height="56.0" rx="8" fill="#fbf0c9" stroke="#1d2733" stroke-width="2"/><text x="85.0" y="83.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Năng lượng</text><text x="85.0" y="99.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">ánh sáng mặt trời</text><rect x="220.0" y="40.0" width="210.0" height="96.0" rx="8" fill="#cfe8c2" stroke="#1d2733" stroke-width="2"/><text x="325.0" y="67.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">1. TỔNG HỢP</text><text x="325.0" y="83.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">quang hợp ở sinh vật</text><text x="325.0" y="99.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">tự dưỡng: quang năng →</text><text x="325.0" y="115.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">hoá năng (chất hữu cơ)</text><rect x="260.0" y="190.0" width="190.0" height="80.0" rx="8" fill="#fbf0c9" stroke="#1d2733" stroke-width="2"/><text x="355.0" y="225.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Chất hữu cơ</text><text x="355.0" y="241.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">(thức ăn, nguồn dự trữ)</text><rect x="500.0" y="40.0" width="230.0" height="96.0" rx="8" fill="#dbe7f3" stroke="#1d2733" stroke-width="2"/><text x="615.0" y="67.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">2. PHÂN GIẢI</text><text x="615.0" y="83.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">hô hấp tế bào: chất hữu cơ</text><text x="615.0" y="99.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">phân giải, tạo ATP, NADH</text><text x="615.0" y="115.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">(thế năng → động năng)</text><rect x="500.0" y="190.0" width="230.0" height="80.0" rx="8" fill="#f7d4d4" stroke="#1d2733" stroke-width="2"/><text x="615.0" y="217.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">3. HUY ĐỘNG NĂNG LƯỢNG</text><text x="615.0" y="233.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">ATP cho vận động, sinh sản,</text><text x="615.0" y="249.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">cảm ứng, sinh trưởng...</text><rect x="300.0" y="300.0" width="160.0" height="50.0" rx="8" fill="#eef1f4" stroke="#1d2733" stroke-width="2"/><text x="380.0" y="320.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Nhiệt năng</text><text x="380.0" y="336.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">toả ra môi trường</text><line x1="150.0" y1="88.0" x2="218.0" y2="88.0" stroke="#1d2733" stroke-width="2.4" marker-end="url(#ar)"/><line x1="325.0" y1="138.0" x2="345.0" y2="188.0" stroke="#1d2733" stroke-width="2.4" marker-end="url(#ar)"/><line x1="450.0" y1="230.0" x2="500.0" y2="105.0" stroke="#1d2733" stroke-width="2.4" marker-end="url(#ar)"/><line x1="615.0" y1="138.0" x2="615.0" y2="188.0" stroke="#1d2733" stroke-width="2.4" marker-end="url(#ar)"/><line x1="560.0" y1="272.0" x2="440.0" y2="322.0" stroke="#1d2733" stroke-width="2.4" stroke-dasharray="6 4" marker-end="url(#ar)"/><line x1="500.0" y1="262.0" x2="460.0" y2="322.0" stroke="#9aa5b1" stroke-width="2.4" stroke-dasharray="6 4" marker-end="url(#ar)"/><text x="142.0" y="178.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#3b4856" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">sinh vật dị dưỡng lấy</text><text x="142.0" y="194.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#3b4856" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">chất hữu cơ có sẵn</text></svg>