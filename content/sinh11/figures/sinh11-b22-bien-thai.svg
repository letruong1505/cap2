<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 246" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="380.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Phát triển không qua biến thái và qua biến thái</text><rect x="260.0" y="44.0" width="240.0" height="36.0" rx="8" fill="#eef1f4" stroke="#1d2733" stroke-width="2"/><text x="380.0" y="67.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2733">Phát triển của động vật</text><rect x="15.0" y="120.0" width="230.0" height="56.0" rx="8" fill="#dfe9d5" stroke="#1d2733" stroke-width="2"/><text x="130.0" y="137.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#1d2733">Không qua biến thái</text><text x="130.0" y="151.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#1d2733">con non giống con trưởng</text><text x="130.0" y="165.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#1d2733">thành (người, chim, thú)</text><rect x="265.0" y="120.0" width="230.0" height="56.0" rx="8" fill="#fbf0c9" stroke="#1d2733" stroke-width="2"/><text x="380.0" y="137.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#1d2733">Biến thái hoàn toàn</text><text x="380.0" y="151.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#1d2733">ấu trùng rất khác con trưởng</text><text x="380.0" y="165.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#1d2733">thành, qua giai đoạn nhộng</text><rect x="515.0" y="120.0" width="230.0" height="56.0" rx="8" fill="#dbe7f3" stroke="#1d2733" stroke-width="2"/><text x="630.0" y="137.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#1d2733">Biến thái không hoàn toàn</text><text x="630.0" y="151.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#1d2733">ấu trùng giống con trưởng</text><text x="630.0" y="165.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#1d2733">thành, lột xác nhiều lần</text><line x1="380.0" y1="82.0" x2="130.0" y2="118.0" stroke="#1d2733" stroke-width="1.8" marker-end="url(#ar)"/><line x1="380.0" y1="82.0" x2="380.0" y2="118.0" stroke="#1d2733" stroke-width="1.8" marker-end="url(#ar)"/><line x1="380.0" y1="82.0" x2="630.0" y2="118.0" stroke="#1d2733" stroke-width="1.8" marker-end="url(#ar)"/><text x="380.0" y="208.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#3b4856" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Hoàn toàn: bướm, ruồi, ong, ếch (trứng → ấu trùng → nhộng → trưởng thành)</text><text x="380.0" y="228.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#3b4856" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Không hoàn toàn: châu chấu, gián, ve sầu, tôm, cua (trứng → ấu trùng → trưởng thành)</text></svg>