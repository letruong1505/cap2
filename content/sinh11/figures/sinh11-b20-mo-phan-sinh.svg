ng, phát sinh bì)</text><text x="520.0" y="270.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#3b4856" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Sinh trưởng thứ cấp: tăng đường kính, vòng gỗ (cây 2 lá mầm thân gỗ)</text><rect x="300.0" y="80.0" width="140.0" height="70.0" rx="8" fill="#fbf0c9" stroke="#1d2733" stroke-width="2"/><text x="370.0" y="104.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#1d2733">Cây 1 lá mầm và</text><text x="370.0" y="118.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#1d2733">thân thảo: chỉ sinh</text><text x="370.0" y="132.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#1d2733">trưởng sơ cấp</text></svg>