<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 316" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="360.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Các phương thức trao đổi chất: tự dưỡng và dị dưỡng</text><rect x="255.0" y="44.0" width="210.0" height="40.0" rx="8" fill="#eef1f4" stroke="#1d2733" stroke-width="2"/><text x="360.0" y="69.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2733">Sinh vật</text><rect x="40.0" y="130.0" width="260.0" height="44.0" rx="8" fill="#cfe8c2" stroke="#1d2733" stroke-width="2"/><text x="170.0" y="157.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Tự dưỡng (tự tổng hợp chất hữu cơ)</text><rect x="430.0" y="130.0" width="260.0" height="44.0" rx="8" fill="#f7d4d4" stroke="#1d2733" stroke-width="2"/><text x="560.0" y="157.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Dị dưỡng (lấy chất hữu cơ có sẵn)</text><line x1="330.0" y1="86.0" x2="170.0" y2="128.0" stroke="#1d2733" stroke-width="2.4" marker-end="url(#ar)"/><line x1="390.0" y1="86.0" x2="560.0" y2="128.0" stroke="#1d2733" stroke-width="2.4" marker-end="url(#ar)"/><rect x="10.0" y="220.0" width="160.0" height="74.0" rx="8" fill="#dfe9d5" stroke="#1d2733" stroke-width="2"/><text x="90.0" y="245.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">Quang tự dưỡng</text><text x="90.0" y="260.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">dùng ánh sáng, CO₂, nước</text><text x="90.0" y="275.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">VD: thực vật, tảo</text><rect x="180.0" y="220.0" width="160.0" height="74.0" rx="8" fill="#dfe9d5" stroke="#1d2733" stroke-width="2"/><text x="260.0" y="245.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">Hoá tự dưỡng</text><text x="260.0" y="260.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">dùng năng lượng của chất vô cơ</text><text x="260.0" y="275.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">(H₂S, NH₃...) VD: một số VK</text><line x1="120.0" y1="176.0" x2="90.0" y2="218.0" stroke="#1d2733" stroke-width="2.4" marker-end="url(#ar)"/><line x1="220.0" y1="176.0" x2="260.0" y2="218.0" stroke="#1d2733" stroke-width="2.4" marker-end="url(#ar)"/><rect x="440.0" y="220.0" width="240.0" height="74.0" rx="8" fill="#f7d4d4" stroke="#1d2733" stroke-width="2"/><text x="560.0" y="245.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">Tiêu hoá, hấp thụ, đồng hoá</text><text x="560.0" y="260.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">chất hữu cơ từ sinh vật khác</text><text x="560.0" y="275.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">VD: động vật</text><line x1="560.0" y1="176.0" x2="560.0" y2="218.0" stroke="#1d2733" stroke-width="2.4" marker-end="url(#ar)"/></svg>