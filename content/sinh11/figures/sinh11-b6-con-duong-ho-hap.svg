<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="380.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Các con đường hô hấp ở thực vật</text><rect x="290.0" y="40.0" width="180.0" height="40.0" rx="8" fill="#fbf0c9" stroke="#1d2733" stroke-width="2"/><text x="380.0" y="65.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2733">Glucose (6C)</text><rect x="255.0" y="110.0" width="250.0" height="50.0" rx="8" fill="#dbe7f3" stroke="#1d2733" stroke-width="2"/><text x="380.0" y="130.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">ĐƯỜNG PHÂN (tế bào chất)</text><text x="380.0" y="145.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">2 pyruvate, 2 ATP, 2 NADH</text><line x1="380.0" y1="82.0" x2="380.0" y2="108.0" stroke="#1d2733" stroke-width="2.4" marker-end="url(#ar)"/><rect x="20.0" y="210.0" width="330.0" height="100.0" rx="8" fill="#cfe8c2" stroke="#1d2733" stroke-width="2"/><text x="185.0" y="240.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">HÔ HẤP HIẾU KHÍ (có O₂)</text><text x="185.0" y="255.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">Oxy hoá pyruvate + chu trình Krebs</text><text x="185.0" y="270.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">(chất nền ti thể)</text><text x="185.0" y="285.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">Chuỗi truyền electron (màng trong ti thể)</text><rect x="410.0" y="210.0" width="330.0" height="100.0" rx="8" fill="#f7d4d4" stroke="#1d2733" stroke-width="2"/><text x="575.0" y="240.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">LÊN MEN (không có O₂)</text><text x="575.0" y="255.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">pyruvate → ethanol + CO₂</text><text x="575.0" y="270.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">hoặc lactate</text><text x="575.0" y="285.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">chỉ thêm 0 ATP, tổng 2 ATP</text><line x1="330.0" y1="162.0" x2="190.0" y2="208.0" stroke="#1d2733" stroke-width="2.4" marker-end="url(#ar)"/><line x1="430.0" y1="162.0" x2="570.0" y2="208.0" stroke="#1d2733" stroke-width="2.4" marker-end="url(#ar)"/><rect x="20.0" y="335.0" width="330.0" height="36.0" rx="8" fill="#dfe9d5" stroke="#1d2733" stroke-width="2"/><text x="185.0" y="358.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">30 – 32 ATP + 6CO₂ + 6H₂O</text><rect x="410.0" y="335.0" width="330.0" height="36.0" rx="8" fill="#eef1f4" stroke="#1d2733" stroke-width="2"/><text x="575.0" y="358.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">2 ATP (ít năng lượng)</text><line x1="185.0" y1="312.0" x2="185.0" y2="334.0" stroke="#1d2733" stroke-width="2.4" marker-end="url(#ar)"/><line x1="575.0" y1="312.0" x2="575.0" y2="334.0" stroke="#1d2733" stroke-width="2.4" marker-end="url(#ar)"/></svg>