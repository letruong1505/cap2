<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 392" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="380.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Nguồn nitrogen và sự đồng hoá ở thực vật</text><rect x="280.0" y="40.0" width="200.0" height="44.0" rx="8" fill="#dbe7f3" stroke="#1d2733" stroke-width="2"/><text x="380.0" y="67.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">N₂ trong khí quyển</text><rect x="40.0" y="150.0" width="190.0" height="54.0" rx="8" fill="#eef1f4" stroke="#1d2733" stroke-width="2"/><text x="135.0" y="172.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">Chất hữu cơ chứa N</text><text x="135.0" y="187.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">(xác sinh vật)</text><rect x="280.0" y="150.0" width="200.0" height="54.0" rx="8" fill="#cfe8c2" stroke="#1d2733" stroke-width="2"/><text x="380.0" y="172.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">NH₄⁺ và NO₃⁻</text><text x="380.0" y="188.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">(dạng cây hấp thụ)</text><rect x="530.0" y="150.0" width="190.0" height="54.0" rx="8" fill="#fbf0c9" stroke="#1d2733" stroke-width="2"/><text x="625.0" y="172.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">Phân bón</text><text x="625.0" y="187.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">(vô cơ, hữu cơ)</text><line x1="380.0" y1="86.0" x2="380.0" y2="148.0" stroke="#1d2733" stroke-width="2.4" marker-end="url(#ar)"/><text x="470.0" y="120.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">sấm sét, vi khuẩn cố định N₂</text><line x1="230.0" y1="177.0" x2="278.0" y2="177.0" stroke="#1d2733" stroke-width="2.4" marker-end="url(#ar)"/><line x1="530.0" y1="177.0" x2="482.0" y2="177.0" stroke="#1d2733" stroke-width="2.4" marker-end="url(#ar)"/><rect x="190.0" y="250.0" width="380.0" height="40.0" rx="8" fill="#f7d4d4" stroke="#1d2733" stroke-width="2"/><text x="380.0" y="275.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Cây hấp thụ NH₄⁺, NO₃⁻ qua rễ</text><line x1="380.0" y1="206.0" x2="380.0" y2="248.0" stroke="#1d2733" stroke-width="2.4" marker-end="url(#ar)"/><rect x="40.0" y="318.0" width="300.0" height="56.0" rx="8" fill="#dbe7f3" stroke="#1d2733" stroke-width="2"/><text x="190.0" y="341.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">Khử nitrate: NO₃⁻ → NO₂⁻ → NH₄⁺</text><text x="190.0" y="356.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">enzyme nitrate/nitrite reductase</text><rect x="420.0" y="318.0" width="300.0" height="56.0" rx="8" fill="#dbe7f3" stroke="#1d2733" stroke-width="2"/><text x="570.0" y="341.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">Đồng hoá NH₄⁺ + keto acid →</text><text x="570.0" y="356.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">amino acid; tạo amide giải độc</text><line x1="330.0" y1="292.0" x2="190.0" y2="316.0" stroke="#1d2733" stroke-width="2.4" marker-end="url(#ar)"/><line x1="430.0" y1="292.0" x2="570.0" y2="316.0" stroke="#1d2733" stroke-width="2.4" marker-end="url(#ar)"/></svg>