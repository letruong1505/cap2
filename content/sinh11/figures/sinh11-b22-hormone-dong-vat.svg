<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="380.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Hormone ảnh hưởng đến sinh trưởng và phát triển ở người</text><rect x="20.0" y="50.0" width="220.0" height="52.0" rx="8" fill="#fbf0c9" stroke="#1d2733" stroke-width="2"/><text x="130.0" y="81.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Hormone sinh trưởng (GH)</text><rect x="250.0" y="50.0" width="490.0" height="52.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="262.0" y="81.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">tuyến yên: phân chia, tăng kích thước tế bào, xương dài và to</text><rect x="20.0" y="112.0" width="220.0" height="52.0" rx="8" fill="#dbe7f3" stroke="#1d2733" stroke-width="2"/><text x="130.0" y="143.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Thyroxine</text><rect x="250.0" y="112.0" width="490.0" height="52.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="262.0" y="143.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">tuyến giáp: kích thích chuyển hoá, phát triển hệ thần kinh</text><rect x="20.0" y="174.0" width="220.0" height="52.0" rx="8" fill="#cfe8c2" stroke="#1d2733" stroke-width="2"/><text x="130.0" y="205.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Testosterone</text><rect x="250.0" y="174.0" width="490.0" height="52.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="262.0" y="205.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">tinh hoàn: phát triển cơ quan sinh dục nam, cơ bắp, xương</text><rect x="20.0" y="236.0" width="220.0" height="52.0" rx="8" fill="#f7d4d4" stroke="#1d2733" stroke-width="2"/><text x="130.0" y="267.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Estrogen</text><rect x="250.0" y="236.0" width="490.0" height="52.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="262.0" y="267.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">buồng trứng: phát triển cơ quan sinh dục nữ, dậy thì ở nữ</text></svg>