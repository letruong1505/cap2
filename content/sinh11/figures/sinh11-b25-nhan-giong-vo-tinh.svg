<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 306" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="380.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Các hình thức nhân giống vô tính ở thực vật</text><rect x="20.0" y="50.0" width="220.0" height="52.0" rx="8" fill="#dfe9d5" stroke="#1d2733" stroke-width="2"/><text x="130.0" y="81.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Giâm cành</text><rect x="250.0" y="50.0" width="490.0" height="52.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="262.0" y="81.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">cành bánh tẻ ra rễ: hoa hồng, mía, sắn</text><rect x="20.0" y="112.0" width="220.0" height="52.0" rx="8" fill="#fbf0c9" stroke="#1d2733" stroke-width="2"/><text x="130.0" y="143.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Chiết cành</text><rect x="250.0" y="112.0" width="490.0" height="52.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="262.0" y="143.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">khoanh vỏ, bó bầu: bưởi, cam, nhãn</text><rect x="20.0" y="174.0" width="220.0" height="52.0" rx="8" fill="#dbe7f3" stroke="#1d2733" stroke-width="2"/><text x="130.0" y="205.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Ghép</text><rect x="250.0" y="174.0" width="490.0" height="52.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="262.0" y="205.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">cành/mắt ghép lên gốc ghép khoẻ: cam, hồng</text><rect x="20.0" y="236.0" width="220.0" height="52.0" rx="8" fill="#f7d4d4" stroke="#1d2733" stroke-width="2"/><text x="130.0" y="267.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Nuôi cấy mô (in vitro)</text><rect x="250.0" y="236.0" width="490.0" height="52.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="262.0" y="267.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">mô, tế bào → cây hoàn chỉnh: lan, chuối</text></svg>