<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="380.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Cơ chế cảm ứng ở sinh vật</text><rect x="20.0" y="70.0" width="160.0" height="100.0" rx="8" fill="#fbf0c9" stroke="#1d2733" stroke-width="2"/><text x="100.0" y="107.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Tiếp nhận</text><text x="100.0" y="123.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">kích thích</text><text x="100.0" y="139.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">thụ thể</text><line x1="182.0" y1="120.0" x2="203.0" y2="120.0" stroke="#1d2733" stroke-width="2.4" marker-end="url(#ar)"/><rect x="205.0" y="70.0" width="160.0" height="100.0" rx="8" fill="#dbe7f3" stroke="#1d2733" stroke-width="2"/><text x="285.0" y="107.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Dẫn truyền</text><text x="285.0" y="123.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">thông tin</text><text x="285.0" y="139.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">(xung thần kinh / hoá chất)</text><line x1="367.0" y1="120.0" x2="388.0" y2="120.0" stroke="#1d2733" stroke-width="2.4" marker-end="url(#ar)"/><rect x="390.0" y="70.0" width="160.0" height="100.0" rx="8" fill="#cfe8c2" stroke="#1d2733" stroke-width="2"/><text x="470.0" y="107.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Xử lí</text><text x="470.0" y="123.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">thông tin</text><text x="470.0" y="139.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">(TW thần kinh/ tế bào)</text><line x1="552.0" y1="120.0" x2="573.0" y2="120.0" stroke="#1d2733" stroke-width="2.4" marker-end="url(#ar)"/><rect x="575.0" y="70.0" width="160.0" height="100.0" rx="8" fill="#f7d4d4" stroke="#1d2733" stroke-width="2"/><text x="655.0" y="107.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Đáp ứng</text><text x="655.0" y="123.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">cơ, tuyến /</text><text x="655.0" y="139.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">cơ quan đáp ứng</text><text x="380.0" y="200.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#3b4856" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Thực vật: thụ thể màng → dòng điện tử/ hoá chất → xử lí và đáp ứng ở rễ, thân, lá</text><text x="380.0" y="220.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#3b4856" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Động vật có hệ thần kinh: cung phản xạ (thụ thể → TW → cơ quan đáp ứng)</text></svg>