<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 276" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="380.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Sinh sản vô tính và sinh sản hữu tính</text><rect x="20.0" y="50.0" width="340.0" height="40.0" rx="8" fill="#dfe9d5" stroke="#1d2733" stroke-width="2"/><text x="190.0" y="75.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2733">Sinh sản vô tính</text><rect x="400.0" y="50.0" width="340.0" height="40.0" rx="8" fill="#f7d4d4" stroke="#1d2733" stroke-width="2"/><text x="570.0" y="75.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2733">Sinh sản hữu tính</text><rect x="20.0" y="96.0" width="340.0" height="160.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="34.0" y="124.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">Một cá thể, không có giao tử kết hợp</text><text x="34.0" y="154.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">Con giống mẹ (nguyên phân)</text><text x="34.0" y="184.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">Nhanh, nhiều con, ít tốn năng lượng</text><text x="34.0" y="214.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">Hạn chế: ít đa dạng, dễ bị dịch bệnh</text><text x="34.0" y="244.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">Điều hoà: chu kì tế bào</text><rect x="400.0" y="96.0" width="340.0" height="160.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="414.0" y="124.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">Giao tử đực + giao tử cái → hợp tử</text><text x="414.0" y="154.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">Con khác bố mẹ (giảm phân, thụ tinh)</text><text x="414.0" y="184.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">Đa dạng di truyền, thích nghi cao</text><text x="414.0" y="214.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">Hạn chế: tốn năng lượng, chậm hơn</text><text x="414.0" y="244.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">Điều hoà: hormone</text></svg>