<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="360.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Tách chiết sắc tố bằng sắc kí giấy</text><rect x="60.0" y="60.0" width="200.0" height="230.0" rx="8" fill="#f6f9fc" stroke="#1d2733" stroke-width="2.4"/><rect x="62.0" y="230.0" width="196.0" height="58.0" rx="0" fill="#b7e2c3" stroke="none" stroke-width="0"/><rect x="130.0" y="70.0" width="60.0" height="200.0" rx="0" fill="white" stroke="#1d2733" stroke-width="1.8"/><rect x="138.0" y="103.0" width="44.0" height="14.0" rx="7" fill="#f1c40f" stroke="none" stroke-width="0"/><text x="200.0" y="115.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Carotene</text><rect x="138.0" y="133.0" width="44.0" height="14.0" rx="7" fill="#e0b400" stroke="none" stroke-width="0"/><text x="200.0" y="145.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Xanthophyll</text><rect x="138.0" y="163.0" width="44.0" height="14.0" rx="7" fill="#6fbf5a" stroke="none" stroke-width="0"/><text x="200.0" y="175.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Diệp lục a</text><rect x="138.0" y="191.0" width="44.0" height="14.0" rx="7" fill="#3f8f4a" stroke="none" stroke-width="0"/><text x="200.0" y="203.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Diệp lục b</text><line x1="130.0" y1="240.0" x2="190.0" y2="240.0" stroke="#8a8a8a" stroke-width="1.4" stroke-dasharray="3 3"/><text x="70.0" y="245.0" text-anchor="start" font-size="11" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">vệt chấm</text><text x="160.0" y="308.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Bình sắc kí</text><rect x="330.0" y="70.0" width="360.0" height="64.0" rx="8" fill="#dbe7f3" stroke="#1d2733" stroke-width="2"/><text x="510.0" y="97.5" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">Dung môi: petroleum ether : ethanol = 14 : 1</text><text x="510.0" y="112.5" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">Dung dịch sắc tố chiết bằng acetone 80%</text><rect x="330.0" y="150.0" width="360.0" height="64.0" rx="8" fill="#fbf0c9" stroke="#1d2733" stroke-width="2"/><text x="510.0" y="177.5" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">Sắc tố tan tốt trong dung môi, ít bám giấy</text><text x="510.0" y="192.5" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">đi xa hơn: carotene xa nhất, diệp lục b gần nhất</text><rect x="330.0" y="230.0" width="360.0" height="60.0" rx="8" fill="#cfe8c2" stroke="#1d2733" stroke-width="2"/><text x="510.0" y="255.5" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">Sau ~10 phút tách thành 4 vệt màu:</text><text x="510.0" y="270.5" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">vàng cam, vàng, xanh lục, xanh lục đậm</text></svg>