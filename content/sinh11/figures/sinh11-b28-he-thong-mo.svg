<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="380.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Cơ thể là hệ thống mở, tự điều chỉnh</text><rect x="250.0" y="70.0" width="260.0" height="120.0" rx="14" fill="#dfe9d5" stroke="#1d2733" stroke-width="2.4"/><text x="380.0" y="120.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">CƠ THỂ SINH VẬT</text><text x="380.0" y="148.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">trao đổi chất, năng lượng</text><text x="380.0" y="168.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">tự điều chỉnh</text><line x1="60.0" y1="110.0" x2="248.0" y2="110.0" stroke="#1d2733" stroke-width="2.4" marker-end="url(#ar)"/><text x="150.0" y="98.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">vào: O₂, nước, thức ăn</text><line x1="512.0" y1="110.0" x2="700.0" y2="110.0" stroke="#1d2733" stroke-width="2.4" marker-end="url(#ar)"/><text x="610.0" y="98.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">ra: CO₂, chất thải</text><line x1="380.0" y1="192.0" x2="380.0" y2="232.0" stroke="#e15759" stroke-width="2" marker-end="url(#ar)"/><text x="380.0" y="252.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#3b4856" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Môi trường thay đổi → điều chỉnh → hoạt động sống ổn định</text></svg>