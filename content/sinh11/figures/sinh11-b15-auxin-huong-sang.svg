<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 312" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="360.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Hướng sáng: auxin phân bố không đều làm thân cong</text><rect x="110.0" y="70.0" width="28.0" height="180.0" rx="0" fill="#9bd37f" stroke="#1d2733" stroke-width="2"/><rect x="106.0" y="250.0" width="36.0" height="16.0" rx="0" fill="#e6d3b3" stroke="none" stroke-width="0"/><rect x="110.0" y="70.0" width="14.0" height="180.0" rx="0" fill="#c9b7ee" stroke="none" stroke-width="0"/><text x="100.0" y="160.0" text-anchor="end" font-size="11" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">auxin nhiều</text><line x1="40.0" y1="40.0" x2="100.0" y2="80.0" stroke="#f28e2b" stroke-width="3" marker-end="url(#ar)"/><text x="24.0" y="34.0" text-anchor="start" font-size="11" font-weight="bold" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">ánh sáng</text><path d="M 390 266 Q 392 160 450 92" fill="none" stroke="#9bd37f" stroke-width="26" stroke-linejoin="round" stroke-linecap="round"/><line x1="240.0" y1="160.0" x2="340.0" y2="160.0" stroke="#1d2733" stroke-width="2" marker-end="url(#ar)"/><rect x="500.0" y="80.0" width="200.0" height="58.0" rx="8" fill="#fbf0c9" stroke="#1d2733" stroke-width="2"/><text x="600.0" y="104.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">Phía tối: auxin tăng,</text><text x="600.0" y="119.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">tế bào dài ra nhanh</text><rect x="500.0" y="156.0" width="200.0" height="58.0" rx="8" fill="#cfe8c2" stroke="#1d2733" stroke-width="2"/><text x="600.0" y="180.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">Phía sáng: auxin giảm,</text><text x="600.0" y="195.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">dài chậm → thân cong về sáng</text><text x="360.0" y="292.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#3b4856" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Rễ nhạy với auxin hơn thân: auxin cao ức chế dài tế bào rễ, nên rễ cong ngược hướng so với thân</text></svg>