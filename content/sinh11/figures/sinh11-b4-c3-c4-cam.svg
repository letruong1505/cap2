<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="380.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Ba con đường cố định CO₂: C₃, C₄ và CAM</text><rect x="20.0" y="50.0" width="230.0" height="40.0" rx="8" fill="#cfe8c2" stroke="#1d2733" stroke-width="2"/><text x="135.0" y="75.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">C₃ (lúa, khoai, đậu...)</text><rect x="20.0" y="96.0" width="230.0" height="160.0" rx="8" fill="#ffffff" stroke="#1d2733" stroke-width="1.6"/><text x="32.0" y="124.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">Cố định CO₂ ban ngày</text><text x="32.0" y="152.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">Chất nhận: RuBP (5C)</text><text x="32.0" y="180.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">Sản phẩm đầu tiên: 3-PGA (3C)</text><text x="32.0" y="208.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">Chỉ chu trình Calvin</text><text x="32.0" y="236.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">Ở mô giậu</text><rect x="270.0" y="50.0" width="230.0" height="40.0" rx="8" fill="#fbf0c9" stroke="#1d2733" stroke-width="2"/><text x="385.0" y="75.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">C₄ (ngô, mía, rau dền...)</text><rect x="270.0" y="96.0" width="230.0" height="160.0" rx="8" fill="#ffffff" stroke="#1d2733" stroke-width="1.6"/><text x="282.0" y="124.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">Cố định CO₂ ban ngày</text><text x="282.0" y="152.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">Chất nhận: PEP (3C) ở mô giậu</text><text x="282.0" y="180.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">Sản phẩm đầu tiên: OAA (4C)</text><text x="282.0" y="208.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">Thêm chu trình C₄ rồi Calvin</text><text x="282.0" y="236.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">Tế bào bao bó mạch</text><rect x="520.0" y="50.0" width="230.0" height="40.0" rx="8" fill="#f7d4d4" stroke="#1d2733" stroke-width="2"/><text x="635.0" y="75.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">CAM (xương rồng, dứa...)</text><rect x="520.0" y="96.0" width="230.0" height="160.0" rx="8" fill="#ffffff" stroke="#1d2733" stroke-width="1.6"/><text x="532.0" y="124.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">Khí khổng mở ban đêm,</text><text x="532.0" y="152.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">đóng ban ngày</text><text x="532.0" y="180.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">Ban đêm: CO₂ → acid hữu cơ</text><text x="532.0" y="208.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">Ban ngày: giải phóng CO₂</text><text x="532.0" y="236.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">vào chu trình Calvin</text><text x="380.0" y="290.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#3b4856" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Cây C₄ và CAM thích nghi nóng, hạn: có thêm bước sơ bộ cố định CO₂, giảm mất nước</text></svg>