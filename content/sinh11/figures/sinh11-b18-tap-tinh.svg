<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 248" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="380.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Phân loại tập tính</text><rect x="280.0" y="44.0" width="200.0" height="36.0" rx="8" fill="#eef1f4" stroke="#1d2733" stroke-width="2"/><text x="380.0" y="67.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2733">Tập tính</text><rect x="40.0" y="120.0" width="300.0" height="80.0" rx="8" fill="#fbf0c9" stroke="#1d2733" stroke-width="2"/><text x="190.0" y="148.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">Bẩm sinh</text><text x="190.0" y="163.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">sinh ra đã có, bền vững, do gene</text><text x="190.0" y="178.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">VD: nhện giăng tơ, chim non đòi ăn</text><rect x="420.0" y="120.0" width="300.0" height="80.0" rx="8" fill="#cfe8c2" stroke="#1d2733" stroke-width="2"/><text x="570.0" y="148.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">Học được</text><text x="570.0" y="163.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">hình thành qua học tập, rút kinh nghiệm</text><text x="570.0" y="178.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">VD: chó nghiệp vụ, thử và sai</text><line x1="340.0" y1="82.0" x2="190.0" y2="118.0" stroke="#1d2733" stroke-width="2.4" marker-end="url(#ar)"/><line x1="420.0" y1="82.0" x2="570.0" y2="118.0" stroke="#1d2733" stroke-width="2.4" marker-end="url(#ar)"/><text x="380.0" y="228.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#3b4856" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Nhiều tập tính có cả yếu tố bẩm sinh và học tập (làm tổ ở chim)</text></svg>