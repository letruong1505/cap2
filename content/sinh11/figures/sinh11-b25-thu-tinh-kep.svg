<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="380.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Thụ phấn và thụ tinh kép ở thực vật hạt kín</text><rect x="15.0" y="60.0" width="165.0" height="64.0" rx="8" fill="#fbf0c9" stroke="#1d2733" stroke-width="2"/><text x="97.5" y="88.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#1d2733">Hạt phấn rơi lên</text><text x="97.5" y="102.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#1d2733">núm nhuỵ</text><line x1="182.0" y1="92.0" x2="198.0" y2="92.0" stroke="#1d2733" stroke-width="2.4" marker-end="url(#ar)"/><rect x="200.0" y="60.0" width="165.0" height="64.0" rx="8" fill="#dbe7f3" stroke="#1d2733" stroke-width="2"/><text x="282.5" y="88.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#1d2733">Ống phấn mọc</text><text x="282.5" y="102.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#1d2733">qua vòi nhuỵ</text><line x1="367.0" y1="92.0" x2="383.0" y2="92.0" stroke="#1d2733" stroke-width="2.4" marker-end="url(#ar)"/><rect x="385.0" y="60.0" width="165.0" height="64.0" rx="8" fill="#cfe8c2" stroke="#1d2733" stroke-width="2"/><text x="467.5" y="88.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#1d2733">2 tinh tử vào</text><text x="467.5" y="102.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#1d2733">túi phôi</text><line x1="552.0" y1="92.0" x2="568.0" y2="92.0" stroke="#1d2733" stroke-width="2.4" marker-end="url(#ar)"/><rect x="570.0" y="60.0" width="165.0" height="64.0" rx="8" fill="#f7d4d4" stroke="#1d2733" stroke-width="2"/><text x="652.5" y="97.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#1d2733">Thụ tinh kép</text><rect x="40.0" y="160.0" width="330.0" height="60.0" rx="8" fill="#dfe9d5" stroke="#1d2733" stroke-width="2"/><text x="205.0" y="185.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">1 tinh tử + tế bào trứng (n)</text><text x="205.0" y="200.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">→ hợp tử (2n) → phôi</text><rect x="390.0" y="160.0" width="330.0" height="60.0" rx="8" fill="#fbf0c9" stroke="#1d2733" stroke-width="2"/><text x="555.0" y="185.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">1 tinh tử + nhân cực (2n)</text><text x="555.0" y="200.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">→ nhân tam bội (3n) → nội nhũ</text><text x="380.0" y="252.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#3b4856" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Sau thụ tinh: noãn → hạt, bầu nhuỵ → quả (bảo vệ và phát tán hạt)</text></svg>