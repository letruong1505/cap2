<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 276" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="380.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Các giai đoạn sinh trưởng, phát triển ở động vật</text><rect x="20.0" y="60.0" width="340.0" height="44.0" rx="8" fill="#fbf0c9" stroke="#1d2733" stroke-width="2"/><text x="190.0" y="87.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2733">Giai đoạn phôi (phôi thai)</text><rect x="400.0" y="60.0" width="340.0" height="44.0" rx="8" fill="#cfe8c2" stroke="#1d2733" stroke-width="2"/><text x="570.0" y="87.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2733">Giai đoạn hậu phôi (sau sinh)</text><rect x="20.0" y="110.0" width="340.0" height="66.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="2"/><text x="190.0" y="138.5" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">Hợp tử → phôi dâu → phôi nang →</text><text x="190.0" y="153.5" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">phôi vị → hình thành cơ quan</text><rect x="400.0" y="110.0" width="340.0" height="66.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="2"/><text x="570.0" y="138.5" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">Con non → sinh trưởng → trưởng thành</text><text x="570.0" y="153.5" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">→ sinh sản → già (có hoặc không biến thái)</text><line x1="362.0" y1="135.0" x2="398.0" y2="135.0" stroke="#1d2733" stroke-width="2.4" marker-end="url(#ar)"/><rect x="20.0" y="200.0" width="720.0" height="60.0" rx="8" fill="#eef1f4" stroke="#1d2733" stroke-width="2"/><text x="380.0" y="225.5" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">Đặc điểm: tốc độ không đều theo thời gian; các phần cơ thể không đều;</text><text x="380.0" y="240.5" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">cơ quan, hệ cơ quan phôi thai phát triển ở thời điểm khác nhau; kích thước tối đa khác nhau theo loài</text></svg>