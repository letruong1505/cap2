<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="380.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Bốn giai đoạn của quá trình dinh dưỡng ở động vật</text><rect x="20.0" y="70.0" width="160.0" height="110.0" rx="8" fill="#fbf0c9" stroke="#1d2733" stroke-width="2"/><text x="100.0" y="112.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">1. Lấy thức ăn</text><text x="100.0" y="128.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">ăn lọc, ăn hút,</text><text x="100.0" y="144.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">ăn thức ăn rắn</text><line x1="182.0" y1="125.0" x2="203.0" y2="125.0" stroke="#1d2733" stroke-width="2.4" marker-end="url(#ar)"/><rect x="205.0" y="70.0" width="160.0" height="110.0" rx="8" fill="#dbe7f3" stroke="#1d2733" stroke-width="2"/><text x="285.0" y="112.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">2. Tiêu hoá</text><text x="285.0" y="128.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">nội bào / ngoại bào</text><text x="285.0" y="144.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">cơ học + hoá học</text><line x1="367.0" y1="125.0" x2="388.0" y2="125.0" stroke="#1d2733" stroke-width="2.4" marker-end="url(#ar)"/><rect x="390.0" y="70.0" width="160.0" height="110.0" rx="8" fill="#cfe8c2" stroke="#1d2733" stroke-width="2"/><text x="470.0" y="112.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">3. Hấp thụ</text><text x="470.0" y="128.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">chất đơn giản vào</text><text x="470.0" y="144.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">máu, bạch huyết</text><line x1="552.0" y1="125.0" x2="573.0" y2="125.0" stroke="#1d2733" stroke-width="2.4" marker-end="url(#ar)"/><rect x="575.0" y="70.0" width="160.0" height="110.0" rx="8" fill="#f7d4d4" stroke="#1d2733" stroke-width="2"/><text x="655.0" y="112.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">4. Đồng hoá</text><text x="655.0" y="128.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">tạo chất sống,</text><text x="655.0" y="144.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">dự trữ, cung cấp NL</text><text x="380.0" y="220.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#3b4856" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Thức ăn → chất dinh dưỡng đơn giản → chất sống và năng lượng cho cơ thể</text></svg>