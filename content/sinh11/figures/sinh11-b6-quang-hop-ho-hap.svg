<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="360.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Mối quan hệ giữa quang hợp và hô hấp</text><rect x="240.0" y="50.0" width="240.0" height="70.0" rx="8" fill="#cfe8c2" stroke="#1d2733" stroke-width="2"/><text x="360.0" y="80.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">QUANG HỢP (lục lạp)</text><text x="360.0" y="96.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">CO₂ + H₂O → C₆H₁₂O₆ + O₂</text><rect x="240.0" y="210.0" width="240.0" height="70.0" rx="8" fill="#dbe7f3" stroke="#1d2733" stroke-width="2"/><text x="360.0" y="240.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">HÔ HẤP (ti thể)</text><text x="360.0" y="256.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">C₆H₁₂O₆ + O₂ → CO₂ + H₂O + ATP</text><line x1="520.0" y1="120.0" x2="520.0" y2="208.0" stroke="#f28e2b" stroke-width="2.4" marker-end="url(#ar)"/><line x1="480.0" y1="90.0" x2="520.0" y2="90.0" stroke="#1d2733" stroke-width="2.4"/><line x1="520.0" y1="90.0" x2="520.0" y2="208.0" stroke="#1d2733" stroke-width="2.4" marker-end="url(#ar)"/><text x="600.0" y="150.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">chất hữu cơ, O₂</text><line x1="240.0" y1="250.0" x2="200.0" y2="250.0" stroke="#1d2733" stroke-width="2.4"/><line x1="200.0" y1="250.0" x2="200.0" y2="122.0" stroke="#1d2733" stroke-width="2.4" marker-end="url(#ar)"/><line x1="200.0" y1="85.0" x2="238.0" y2="85.0" stroke="#1d2733" stroke-width="2.4"/><text x="110.0" y="170.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">CO₂, H₂O</text><rect x="560.0" y="245.0" width="150.0" height="36.0" rx="8" fill="#f7d4d4" stroke="#1d2733" stroke-width="2"/><text x="635.0" y="268.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#1d2733">ATP cho hoạt động sống</text></svg>