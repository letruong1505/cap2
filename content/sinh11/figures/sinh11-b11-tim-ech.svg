<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 308" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="360.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Thí nghiệm trên tim ếch</text><rect x="30.0" y="50.0" width="200.0" height="100.0" rx="8" fill="#fbf0c9" stroke="#1d2733" stroke-width="2"/><text x="130.0" y="88.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">Tính tự động của tim</text><text x="130.0" y="103.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">Tim tách rời vẫn co dãn</text><text x="130.0" y="118.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">nếu đủ chất, O₂, nhiệt độ</text><rect x="260.0" y="50.0" width="200.0" height="100.0" rx="8" fill="#dbe7f3" stroke="#1d2733" stroke-width="2"/><text x="360.0" y="80.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">Dây thần kinh hỗn hợp</text><text x="360.0" y="95.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">Kích thích dây giao cảm:</text><text x="360.0" y="110.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">tim đập nhanh, mạnh</text><text x="360.0" y="125.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">dây đối giao cảm: chậm, yếu</text><rect x="490.0" y="50.0" width="200.0" height="100.0" rx="8" fill="#f7d4d4" stroke="#1d2733" stroke-width="2"/><text x="590.0" y="80.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">Adrenalin</text><text x="590.0" y="95.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">Nhỏ dung dịch adrenalin:</text><text x="590.0" y="110.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">tim đập nhanh, mạnh hơn</text><text x="590.0" y="125.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">(tác động thể dịch)</text><ellipse cx="360.0" cy="230.0" rx="90.0" ry="40.0" fill="#c5e6b3" stroke="#1d2733" stroke-width="2"/><circle cx="360.0" cy="228.0" r="14.0" fill="#e05a5a" stroke="#1d2733" stroke-width="1.8"/><text x="360.0" y="290.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Ếch phá tuỷ, ghim ngửa trên khay mổ, mở lồng ngực lộ tim</text></svg>