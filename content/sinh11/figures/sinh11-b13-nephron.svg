<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="380.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Nephron: ba giai đoạn tạo nước tiểu</text><rect x="20.0" y="60.0" width="200.0" height="86.0" rx="8" fill="#dbe7f3" stroke="#1d2733" stroke-width="2"/><text x="120.0" y="91.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">1. LỌC Ở CẦU THẬN</text><text x="120.0" y="106.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">máu → dịch lọc (nước tiểu</text><text x="120.0" y="121.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">đầu), giữ lại tế bào, protein</text><rect x="280.0" y="60.0" width="200.0" height="86.0" rx="8" fill="#cfe8c2" stroke="#1d2733" stroke-width="2"/><text x="380.0" y="91.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">2. TÁI HẤP THỤ</text><text x="380.0" y="106.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">ống thận: glucose, amino acid,</text><text x="380.0" y="121.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">nước, ion trở về máu</text><rect x="540.0" y="60.0" width="200.0" height="86.0" rx="8" fill="#f7d4d4" stroke="#1d2733" stroke-width="2"/><text x="640.0" y="91.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">3. BÀI TIẾT TIẾP</text><text x="640.0" y="106.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">ống thận: H⁺, K⁺, thuốc, chất</text><text x="640.0" y="121.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">độc → dịch lọc</text><line x1="222.0" y1="103.0" x2="278.0" y2="103.0" stroke="#1d2733" stroke-width="2.4" marker-end="url(#ar)"/><line x1="482.0" y1="103.0" x2="538.0" y2="103.0" stroke="#1d2733" stroke-width="2.4" marker-end="url(#ar)"/><rect x="120.0" y="190.0" width="520.0" height="60.0" rx="8" fill="#fbf0c9" stroke="#1d2733" stroke-width="2"/><text x="380.0" y="215.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">Nước tiểu chính thức → ống góp (hấp thụ bớt nước) → bể thận</text><text x="380.0" y="230.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">→ niệu quản → bàng quang → niệu đạo → ra ngoài</text><line x1="380.0" y1="148.0" x2="380.0" y2="188.0" stroke="#1d2733" stroke-width="2.4" marker-end="url(#ar)"/></svg>