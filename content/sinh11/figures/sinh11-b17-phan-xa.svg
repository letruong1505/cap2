<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 262" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="380.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Phản xạ không điều kiện và có điều kiện</text><rect x="40.0" y="50.0" width="300.0" height="40.0" rx="8" fill="#fbf0c9" stroke="#1d2733" stroke-width="2"/><text x="190.0" y="75.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2733">Phản xạ không điều kiện</text><rect x="420.0" y="50.0" width="300.0" height="40.0" rx="8" fill="#dbe7f3" stroke="#1d2733" stroke-width="2"/><text x="570.0" y="75.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2733">Phản xạ có điều kiện</text><rect x="40.0" y="96.0" width="300.0" height="150.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="54.0" y="124.0" text-anchor="start" font-size="13" font-weight="normal" fill="#1d2733">Sinh ra đã có, di truyền</text><text x="54.0" y="152.0" text-anchor="start" font-size="13" font-weight="normal" fill="#1d2733">Bền vững, đặc trưng loài</text><text x="54.0" y="180.0" text-anchor="start" font-size="13" font-weight="normal" fill="#1d2733">Kích thích thích ứng</text><text x="54.0" y="208.0" text-anchor="start" font-size="13" font-weight="normal" fill="#1d2733">Trung ương: tuỷ, thân não</text><text x="54.0" y="236.0" text-anchor="start" font-size="13" font-weight="normal" fill="#1d2733">Ví dụ: rụt tay, hắt hơi, bú</text><rect x="420.0" y="96.0" width="300.0" height="150.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="434.0" y="124.0" text-anchor="start" font-size="13" font-weight="normal" fill="#1d2733">Hình thành trong đời sống</text><text x="434.0" y="152.0" text-anchor="start" font-size="13" font-weight="normal" fill="#1d2733">Dễ mất nếu không củng cố</text><text x="434.0" y="180.0" text-anchor="start" font-size="13" font-weight="normal" fill="#1d2733">Kích thích bất kì (chuông, đèn)</text><text x="434.0" y="208.0" text-anchor="start" font-size="13" font-weight="normal" fill="#1d2733">Trung ương: vỏ não</text><text x="434.0" y="236.0" text-anchor="start" font-size="13" font-weight="normal" fill="#1d2733">Ví dụ: dừng xe khi đèn đỏ</text></svg>