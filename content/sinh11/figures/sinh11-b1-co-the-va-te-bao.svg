<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="380.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Trao đổi chất và chuyển hoá năng lượng ở cấp cơ thể và tế bào</text><rect x="20.0" y="50.0" width="720.0" height="260.0" rx="12" fill="#f4f8fb" stroke="#9aa5b1" stroke-width="1.6"/><text x="90.0" y="72.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">MÔI TRƯỜNG</text><rect x="230.0" y="90.0" width="300.0" height="200.0" rx="40" fill="#f7d4d4" stroke="#1d2733" stroke-width="2"/><text x="380.0" y="112.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Cơ thể sinh vật</text><rect x="290.0" y="135.0" width="180.0" height="130.0" rx="60" fill="#fbf0c9" stroke="#1d2733" stroke-width="2"/><text x="380.0" y="158.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Tế bào</text><rect x="310.0" y="175.0" width="140.0" height="34.0" rx="8" fill="#cfe8c2" stroke="#1d2733" stroke-width="2"/><text x="380.0" y="197.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Đồng hoá</text><rect x="310.0" y="218.0" width="140.0" height="34.0" rx="8" fill="#dbe7f3" stroke="#1d2733" stroke-width="2"/><text x="380.0" y="240.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Dị hoá</text><line x1="380.0" y1="211.0" x2="380.0" y2="217.0" stroke="#9aa5b1" stroke-width="1.6" marker-end="url(#ar)"/><line x1="450.0" y1="235.0" x2="456.0" y2="192.0" stroke="#1d2