<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 346" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="380.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Ba giai đoạn trao đổi nước ở thực vật trên cạn</text><rect x="40.0" y="270.0" width="360.0" height="60.0" rx="0" fill="#e6d3b3" stroke="none" stroke-width="0"/><rect x="0.0" y="250.0" width="760.0" height="3.0" rx="0" fill="#9aa5b1" stroke="none" stroke-width="0"/><line x1="220.0" y1="270.0" x2="220.0" y2="80.0" stroke="#5a8f3c" stroke-width="5"/><ellipse cx="198.0" cy="213.0" rx="23.0" ry="10.0" fill="#6fbf5a" stroke="#1d2733" stroke-width="1.6" transform="rotate(25 198.0 213.0)"/><ellipse cx="242.0" cy="165.5" rx="23.0" ry="10.0" fill="#6fbf5a" stroke="#1d2733" stroke-width="1.6" transform="rotate(-25 242.0 165.5)"/><ellipse cx="198.0" cy="118.0" rx="23.0" ry="10.0" fill="#6fbf5a" stroke="#1d2733" stroke-width="1.6" transform="rotate(25 198.0 118.0)"/><ellipse cx="220.0" cy="72.0" rx="11.0" ry="20.0" fill="#6fbf5a" stroke="#1d2733" stroke-width="1.6" transform="rotate(0 220.0 72.0)"/><line x1="220.0" y1="270.0" x2="194.0" y2="323.8" stroke="#8a6d3b" stroke-width="3"/><line x1="220.0" y1="270.0" x2="210.0" y2="319.0" stroke="#8a6d3b" stroke-width="3"/><line x1="220.0" y1="270.0" x2="230.0" y2="319.0" stroke="#8a6d3b" stroke-width="3"/><line x1="220.0" y1="270.0" x2="246.0" y2="323.8" stroke="#8a6d3b" stroke-width="3"/><text x="220.0" y="320.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#7a5a2c" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">đất ẩm</text><line x1="120.0" y1="305.0" x2="180.0" y2="283.0" stroke="#4e79a7" stroke-width="3" marker-end="url(#ar)"/><line x1="224.0" y1="262.0" x2="224.0" y2="150.0" stroke="#4e79a7" stroke-width="3" marker-end="url(#ar)"/><line x1="250.0" y1="90.0" x2="312.0" y2="58.0" stroke="#4e79a7" stroke-width="3" stroke-dasharray="5 4" marker-end="url(#ar)"/><rect x="430.0" y="255.0" width="300.0" height="66.0" rx="8" fill="#dbe7f3" stroke="#1d2733" stroke-width="2"/><text x="580.0" y="283.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">1. Hấp thụ nước ở rễ</text><text x="580.0" y="299.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">lông hút, thẩm thấu</text><rect x="430.0" y="150.0" width="300.0" height="66.0" rx="8" fill="#dbe7f3" stroke="#1d2733" stroke-width="2"/><text x="580.0" y="178.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">2. Vận chuyển nước ở thân</text><text x="580.0" y="194.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">mạch gỗ (một chiều)</text><rect x="430.0" y="45.0" width="300.0" height="66.0" rx="8" fill="#dbe7f3" stroke="#1d2733" stroke-width="2"/><text x="580.0" y="73.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">3. Thoát hơi nước ở lá</text><text x="580.0" y="89.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">qua khí khổng và bề mặt lá</text><line x1="430.0" y1="288.0" x2="390.0" y2="288.0" stroke="#9aa5b1" stroke-width="1.6" marker-end="url(#ar)"/><line x1="430.0" y1="183.0" x2="270.0" y2="183.0" stroke="#9aa5b1" stroke-width="1.6" marker-end="url(#ar)"/><line x1="430.0" y1="78.0" x2="320.0" y2="78.0" stroke="#9aa5b1" stroke-width="1.6" marker-end="url(#ar)"/></svg>