<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="380.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Truyền tin qua synapse hoá học</text><rect x="40.0" y="60.0" width="250.0" height="120.0" rx="30" fill="#fbe3c9" stroke="#1d2733" stroke-width="2.4"/><text x="165.0" y="85.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Chuỳ synapse (màng trước)</text><circle cx="80.0" cy="130.0" r="14.0" fill="#fff" stroke="#1d2733" stroke-width="1.8"/><circle cx="80.0" cy="130.0" r="3.0" fill="#f28e2b" stroke="none" stroke-width="2"/><circle cx="125.0" cy="130.0" r="14.0" fill="#fff" stroke="#1d2733" stroke-width="1.8"/><circle cx="125.0" cy="130.0" r="3.0" fill="#f28e2b" stroke="none" stroke-width="2"/><circle cx="170.0" cy="130.0" r="14.0" fill="#fff" stroke="#1d2733" stroke-width="1.8"/><circle cx="170.0" cy="130.0" r="3.0" fill="#f28e2b" stroke="none" stroke-width="2"/><circle cx="215.0" cy="130.0" r="14.0" fill="#fff" stroke="#1d2733" stroke-width="1.8"/><circle cx="215.0" cy="130.0" r="3.0" fill="#f28e2b" stroke="none" stroke-width="2"/><rect x="290.0" y="60.0" width="40.0" height="120.0" rx="0" fill="#fff" stroke="#9aa5b1" stroke-width="1.6"/><text x="310.0" y="82.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Khe</text><text x="310.0" y="98.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">synapse</text><rect x="330.0" y="60.0" width="220.0" height="120.0" rx="30" fill="#d6eaf8" stroke="#1d2733" stroke-width="2.4"/><text x="445.0" y="85.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Màng sau synapse</text><rect x="334.0" y="110.0" width="14.0" height="14.0" rx="0" fill="#4b8bbe" stroke="#1d2733" stroke-width="1.4"/><rect x="334.0" y="132.0" width="14.0" height="14.0" rx="0" fill="#4b8bbe" stroke="#1d2733" stroke-width="1.4"/><rect x="334.0" y="154.0" width="14.0" height="14.0" rx="0" fill="#4b8bbe" stroke="#1d2733" stroke-width="1.4"/><rect x="40.0" y="210.0" width="160.0" height="56.0" rx="8" fill="#fbf0c9" stroke="#1d2733" stroke-width="2"/><text x="120.0" y="234.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#1d2733">1. Xung đến, Ca²⁺</text><text x="120.0" y="248.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#1d2733">đi vào chuỳ synapse</text><rect x="210.0" y="210.0" width="170.0" height="56.0" rx="8" fill="#fbf0c9" stroke="#1d2733" stroke-width="2"/><text x="295.0" y="234.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#1d2733">2. Túi chứa chất chuyển giao</text><text x="295.0" y="248.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#1d2733">(acetylcholine) vỡ, giải phóng</text><rect x="390.0" y="210.0" width="160.0" height="56.0" rx="8" fill="#dbe7f3" stroke="#1d2733" stroke-width="2"/><text x="470.0" y="234.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#1d2733">3. Gắn thụ thể, mở kênh</text><text x="470.0" y="248.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#1d2733">Na⁺ → điện thế hoạt động</text><rect x="560.0" y="210.0" width="180.0" height="56.0" rx="8" fill="#cfe8c2" stroke="#1d2733" stroke-width="2"/><text x="650.0" y="234.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#1d2733">4. Enzyme phân huỷ chất</text><text x="650.0" y="248.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#1d2733">chuyển giao; truyền một chiều</text></svg>