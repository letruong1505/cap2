<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="380.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Các phòng tuyến miễn dịch của cơ thể</text><rect x="255.0" y="40.0" width="250.0" height="36.0" rx="8" fill="#eef1f4" stroke="#1d2733" stroke-width="2"/><text x="380.0" y="63.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2733">Mầm bệnh xâm nhập</text><rect x="40.0" y="110.0" width="680.0" height="56.0" rx="8" fill="#fbf0c9" stroke="#1d2733" stroke-width="2"/><text x="380.0" y="133.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">MIỄN DỊCH KHÔNG ĐẶC HIỆU (có sẵn)</text><text x="380.0" y="148.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">Hàng rào vật lí, hoá học: da, nước bọt, dịch vị, lông rung, dịch nhày</text><rect x="40.0" y="190.0" width="680.0" height="70.0" rx="8" fill="#dbe7f3" stroke="#1d2733" stroke-width="2"/><text x="380.0" y="220.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">Đáp ứng không đặc hiệu: thực bào, viêm, sốt, interferon, bổ thể</text><text x="380.0" y="235.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">Đại thực bào, bạch cầu trung tính, tế bào giết tự nhiên</text><rect x="40.0" y="284.0" width="330.0" height="86.0" rx="8" fill="#cfe8c2" stroke="#1d2733" stroke-width="2"/><text x="205.0" y="315.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">MIỄN DỊCH DỊCH THỂ</text><text x="205.0" y="330.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">Tế bào B → tương bào → kháng thể</text><text x="205.0" y="345.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">diệt mầm bệnh trong máu</text><rect x="390.0" y="284.0" width="330.0" height="86.0" rx="8" fill="#f7d4d4" stroke="#1d2733" stroke-width="2"/><text x="555.0" y="315.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">MIỄN DỊCH TẾ BÀO</text><text x="555.0" y="330.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">Tế bào T độc tiêu diệt</text><text x="555.0" y="345.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">tế bào nhiễm mầm bệnh</text><line x1="380.0" y1="78.0" x2="380.0" y2="108.0" stroke="#1d2733" stroke-width="2.4" marker-end="url(#ar)"/><line x1="380.0" y1="168.0" x2="380.0" y2="188.0" stroke="#1d2733" stroke-width="2.4" marker-end="url(#ar)"/><line x1="380.0" y1="262.0" x2="205.0" y2="282.0" stroke="#1d2733" stroke-width="2.4" marker-end="url(#ar)"/><line x1="380.0" y1="262.0" x2="555.0" y2="282.0" stroke="#1d2733" stroke-width="2.4" marker-end="url(#ar)"/><text x="380.0" y="392.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#3b4856" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Miễn dịch đặc hiệu (chỉ có ở động vật có xương sống): tế bào nhớ cho đáp ứng thứ phát nhanh, mạnh</text></svg>