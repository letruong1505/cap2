<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 244" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="380.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Ba dạng hệ thần kinh ở động vật</text><rect x="15.0" y="50.0" width="230.0" height="40.0" rx="8" fill="#fbf0c9" stroke="#1d2733" stroke-width="2"/><text x="130.0" y="75.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2733">Dạng lưới</text><rect x="15.0" y="96.0" width="230.0" height="130.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="130.0" y="120.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Ruột khoang (thuỷ tức)</text><text x="130.0" y="150.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Tế bào thần kinh rải khắp</text><text x="130.0" y="170.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">cơ thể thành mạng lưới</text><text x="130.0" y="190.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Phản ứng lan toả, toàn thân</text><rect x="265.0" y="50.0" width="230.0" height="40.0" rx="8" fill="#dbe7f3" stroke="#1d2733" stroke-width="2"/><text x="380.0" y="75.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2733">Chuỗi hạch</text><rect x="265.0" y="96.0" width="230.0" height="130.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="380.0" y="120.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Giun dẹp, giun tròn, chân khớp</text><text x="380.0" y="150.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Hạch thần kinh nối thành</text><text x="380.0" y="170.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">chuỗi; mỗi hạch điều khiển</text><text x="380.0" y="190.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">một vùng; hạch não lớn nhất</text><rect x="515.0" y="50.0" width="230.0" height="40.0" rx="8" fill="#cfe8c2" stroke="#1d2733" stroke-width="2"/><text x="630.0" y="75.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2733">Dạng ống</text><rect x="515.0" y="96.0" width="230.0" height="130.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="630.0" y="120.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Cá, lưỡng cư, bò sát, chim, thú</text><text x="630.0" y="150.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Ống nằm ở lưng: TW (não,</text><text x="630.0" y="170.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">tuỷ sống) + ngoại biên</text><text x="630.0" y="190.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Phản ứng chính xác, phức tạp</text></svg>