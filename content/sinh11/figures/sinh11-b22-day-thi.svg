<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 254" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="380.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Những thay đổi ở tuổi dậy thì</text><rect x="15.0" y="50.0" width="230.0" height="40.0" rx="8" fill="#dfe9d5" stroke="#1d2733" stroke-width="2"/><text x="130.0" y="75.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2733">Thể chất</text><rect x="15.0" y="96.0" width="230.0" height="112.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="25.0" y="124.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">tăng nhanh chiều cao, cân nặng</text><text x="25.0" y="154.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">nam: vai rộng, mọc râu, vỡ giọng</text><text x="25.0" y="184.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">nữ: phát triển ngực, hông</text><rect x="265.0" y="50.0" width="230.0" height="40.0" rx="8" fill="#dbe7f3" stroke="#1d2733" stroke-width="2"/><text x="380.0" y="75.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2733">Sinh lí</text><rect x="265.0" y="96.0" width="230.0" height="112.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="275.0" y="124.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">nam: xuất tinh lần đầu</text><text x="275.0" y="154.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">nữ: hành kinh lần đầu</text><text x="275.0" y="184.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">cơ quan sinh dục trưởng thành</text><rect x="515.0" y="50.0" width="230.0" height="40.0" rx="8" fill="#fbf0c9" stroke="#1d2733" stroke-width="2"/><text x="630.0" y="75.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2733">Tâm lí, tình cảm</text><rect x="515.0" y="96.0" width="230.0" height="112.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="525.0" y="124.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">muốn khẳng định mình</text><text x="525.0" y="154.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">quan tâm bạn khác giới</text><text x="525.0" y="184.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">dễ thay đổi cảm xúc</text><text x="380.0" y="236.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#3b4856" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Dậy thì: nữ trung bình khoảng 11 tuổi (8–13), nam khoảng 12 tuổi (9–14), kéo dài ~5 năm</text></svg>