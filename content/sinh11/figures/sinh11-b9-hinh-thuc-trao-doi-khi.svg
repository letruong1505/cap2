<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 256" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="380.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Các hình thức trao đổi khí ở động vật</text><rect x="15.0" y="50.0" width="170.0" height="44.0" rx="8" fill="#fbf0c9" stroke="#1d2733" stroke-width="2"/><text x="100.0" y="77.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2733">Bề mặt cơ thể</text><rect x="15.0" y="100.0" width="170.0" height="96.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="100.0" y="128.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">thuỷ tức, giun đất, ếch</text><rect x="200.0" y="50.0" width="170.0" height="44.0" rx="8" fill="#dbe7f3" stroke="#1d2733" stroke-width="2"/><text x="285.0" y="77.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2733">Ống khí</text><rect x="200.0" y="100.0" width="170.0" height="96.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="285.0" y="128.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">côn trùng</text><rect x="385.0" y="50.0" width="170.0" height="44.0" rx="8" fill="#dbe7f3" stroke="#1d2733" stroke-width="2"/><text x="470.0" y="77.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2733">Mang</text><rect x="385.0" y="100.0" width="170.0" height="96.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="470.0" y="128.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">cá, tôm, thân mềm</text><rect x="570.0" y="50.0" width="170.0" height="44.0" rx="8" fill="#cfe8c2" stroke="#1d2733" stroke-width="2"/><text x="655.0" y="77.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2733">Phổi</text><rect x="570.0" y="100.0" width="170.0" height="96.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="655.0" y="128.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">bò sát, chim, thú, người</text><text x="100.0" y="158.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#3b4856" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">khuếch tán qua da</text><text x="100.0" y="176.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#3b4856" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">ẩm, mỏng</text><text x="285.0" y="158.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#3b4856" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">ống khí phân nhánh</text><text x="285.0" y="176.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#3b4856" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">lỗ thở có van</text><text x="470.0" y="158.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#3b4856" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">sợi, phiến mang</text><text x="470.0" y="176.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#3b4856" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">dòng nước-máu ngược chiều</text><text x="655.0" y="158.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#3b4856" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">phế nang, mao mạch</text><text x="655.0" y="176.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#3b4856" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">diện tích 100–120 m²</text><text x="380.0" y="232.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Chung: bề mặt trao đổi khí rộng, mỏng, ẩm, nhiều mao mạch, có thông khí</text></svg>