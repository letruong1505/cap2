<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 216" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="380.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Quá trình sinh sản hữu tính ở người</text><rect x="20.0" y="60.0" width="165.0" height="100.0" rx="8" fill="#fbf0c9" stroke="#1d2733" stroke-width="2"/><text x="102.5" y="98.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">Hình thành giao tử</text><text x="102.5" y="113.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">tinh trùng (tinh hoàn)</text><text x="102.5" y="128.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">trứng (buồng trứng)</text><line x1="187.0" y1="110.0" x2="203.0" y2="110.0" stroke="#1d2733" stroke-width="2.4" marker-end="url(#ar)"/><rect x="205.0" y="60.0" width="165.0" height="100.0" rx="8" fill="#dbe7f3" stroke="#1d2733" stroke-width="2"/><text x="287.5" y="98.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">Thụ tinh</text><text x="287.5" y="113.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">ống dẫn trứng</text><text x="287.5" y="128.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">tạo hợp tử (2n)</text><line x1="372.0" y1="110.0" x2="388.0" y2="110.0" stroke="#1d2733" stroke-width="2.4" marker-end="url(#ar)"/><rect x="390.0" y="60.0" width="165.0" height="100.0" rx="8" fill="#cfe8c2" stroke="#1d2733" stroke-width="2"/><text x="472.5" y="98.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">Phát triển phôi, thai</text><text x="472.5" y="113.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">làm tổ trong tử cung</text><text x="472.5" y="128.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">~9 tháng 10 ngày</text><line x1="557.0" y1="110.0" x2="573.0" y2="110.0" stroke="#1d2733" stroke-width="2.4" marker-end="url(#ar)"/><rect x="575.0" y="60.0" width="165.0" height="100.0" rx="8" fill="#f7d4d4" stroke="#1d2733" stroke-width="2"/><text x="657.5" y="98.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">Sinh con</text><text x="657.5" y="113.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">oxytocin, prostaglandin</text><text x="657.5" y="128.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">làm tử cung co bóp</text><text x="380.0" y="196.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#3b4856" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Nang trứng chín, trứng rụng khoảng 28 ngày/lần; thể vàng tiết estrogen, progesterone</text></svg>