<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 296" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="380.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Hệ tuần hoàn hở, kín (đơn) và kín (kép)</text><rect x="10.0" y="44.0" width="230.0" height="36.0" rx="8" fill="#fbf0c9" stroke="#1d2733" stroke-width="2"/><text x="125.0" y="67.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Hở (côn trùng, thân mềm)</text><rect x="10.0" y="86.0" width="230.0" height="190.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="20.0" y="112.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">Tim → động mạch (áp lực thấp)</text><text x="20.0" y="138.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">→ xoang cơ thể (máu + dịch mô)</text><text x="20.0" y="164.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">Máu trao đổi chất trực tiếp</text><text x="20.0" y="190.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">với tế bào → ống góp → tim</text><text x="20.0" y="216.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">Máu chảy chậm</text><rect x="265.0" y="44.0" width="230.0" height="36.0" rx="8" fill="#dbe7f3" stroke="#1d2733" stroke-width="2"/><text x="380.0" y="67.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Kín đơn (cá)</text><rect x="265.0" y="86.0" width="230.0" height="190.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="275.0" y="112.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">Tim 2 ngăn: 1 vòng tuần hoàn</text><text x="275.0" y="138.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">Tim → mang → cơ quan → tim</text><text x="275.0" y="164.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">Máu qua mang rồi đi nuôi cơ thể</text><text x="275.0" y="190.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">Áp lực trung bình</text><text x="275.0" y="216.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">Máu chảy nhanh hơn hở</text><rect x="520.0" y="44.0" width="230.0" height="36.0" rx="8" fill="#cfe8c2" stroke="#1d2733" stroke-width="2"/><text x="635.0" y="67.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Kín kép (lưỡng cư, bò sát, chim, thú)</text><rect x="520.0" y="86.0" width="230.0" height="190.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="530.0" y="112.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">2 vòng: phổi và cơ thể</text><text x="530.0" y="138.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">Tim → phổi → tim → cơ thể → tim</text><text x="530.0" y="164.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">Máu giàu O₂ và nghèo O₂</text><text x="530.0" y="190.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">(ở thú, chim) không pha trộn</text><text x="530.0" y="216.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">Áp lực cao, tốc độ nhanh</text></svg>