<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 372" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="380.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Tiêu hoá ở ống tiêu hoá người</text><rect x="20.0" y="50.0" width="150.0" height="62.0" rx="8" fill="#fbf0c9" stroke="#1d2733" stroke-width="2"/><text x="95.0" y="86.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2733">Khoang miệng</text><rect x="180.0" y="50.0" width="560.0" height="62.0" rx="8" fill="#ffffff" stroke="#1d2733" stroke-width="1.6"/><text x="195.0" y="76.0" text-anchor="start" font-size="13" font-weight="normal" fill="#1d2733">cơ học: nhai, trộn nước bọt</text><text x="195.0" y="100.0" text-anchor="start" font-size="13" font-weight="normal" fill="#1d2733">hoá học: amylase → maltose</text><line x1="95.0" y1="113.0" x2="95.0" y2="129.0" stroke="#1d2733" stroke-width="2" marker-end="url(#ar)"/><rect x="20.0" y="130.0" width="150.0" height="62.0" rx="8" fill="#dbe7f3" stroke="#1d2733" stroke-width="2"/><text x="95.0" y="166.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2733">Dạ dày</text><rect x="180.0" y="130.0" width="560.0" height="62.0" rx="8" fill="#ffffff" stroke="#1d2733" stroke-width="1.6"/><text x="195.0" y="156.0" text-anchor="start" font-size="13" font-weight="normal" fill="#1d2733">cơ học: co bóp, trộn dịch vị</text><text x="195.0" y="180.0" text-anchor="start" font-size="13" font-weight="normal" fill="#1d2733">hoá học: pepsin + HCl → peptide</text><line x1="95.0" y1="193.0" x2="95.0" y2="209.0" stroke="#1d2733" stroke-width="2" marker-end="url(#ar)"/><rect x="20.0" y="210.0" width="150.0" height="62.0" rx="8" fill="#cfe8c2" stroke="#1d2733" stroke-width="2"/><text x="95.0" y="246.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2733">Ruột non</text><rect x="180.0" y="210.0" width="560.0" height="62.0" rx="8" fill="#ffffff" stroke="#1d2733" stroke-width="1.6"/><text x="195.0" y="236.0" text-anchor="start" font-size="13" font-weight="normal" fill="#1d2733">cơ học: nhu động, trộn dịch</text><text x="195.0" y="260.0" text-anchor="start" font-size="13" font-weight="normal" fill="#1d2733">hoá học: dịch tuỵ, mật, ruột → đường đơn, amino acid, acid béo + glycerol</text><line x1="95.0" y1="273.0" x2="95.0" y2="289.0" stroke="#1d2733" stroke-width="2" marker-end="url(#ar)"/><rect x="20.0" y="290.0" width="150.0" height="62.0" rx="8" fill="#eef1f4" stroke="#1d2733" stroke-width="2"/><text x="95.0" y="326.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2733">Ruột già</text><rect x="180.0" y="290.0" width="560.0" height="62.0" rx="8" fill="#ffffff" stroke="#1d2733" stroke-width="1.6"/><text x="195.0" y="316.0" text-anchor="start" font-size="13" font-weight="normal" fill="#1d2733">hấp thụ nước, tạo phân</text><text x="195.0" y="340.0" text-anchor="start" font-size="13" font-weight="normal" fill="#1d2733">đẩy phân ra hậu môn</text></svg>