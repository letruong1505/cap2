<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 306" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="380.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Hormone thực vật</text><rect x="40.0" y="50.0" width="330.0" height="36.0" rx="8" fill="#cfe8c2" stroke="#1d2733" stroke-width="2"/><text x="205.0" y="73.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2733">Kích thích sinh trưởng</text><rect x="400.0" y="50.0" width="330.0" height="36.0" rx="8" fill="#f7d4d4" stroke="#1d2733" stroke-width="2"/><text x="565.0" y="73.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2733">Ức chế sinh trưởng</text><rect x="40.0" y="96.0" width="330.0" height="60.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="52.0" y="120.0" text-anchor="start" font-size="13" font-weight="bold" fill="#1d2733">Auxin (IAA)</text><text x="52.0" y="142.0" text-anchor="start" font-size="11" font-weight="normal" fill="#1d2733">chồi ngọn, lá non: phân bào, dãn dài, rễ phụ, ra rễ, hướng động</text><rect x="40.0" y="164.0" width="330.0" height="60.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="52.0" y="188.0" text-anchor="start" font-size="13" font-weight="bold" fill="#1d2733">Gibberellin</text><text x="52.0" y="210.0" text-anchor="start" font-size="11" font-weight="normal" fill="#1d2733">nảy mầm, kéo dài thân, tạo quả không hạt</text><rect x="40.0" y="232.0" width="330.0" height="60.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="52.0" y="256.0" text-anchor="start" font-size="13" font-weight="bold" fill="#1d2733">Cytokinin</text><text x="52.0" y="278.0" text-anchor="start" font-size="11" font-weight="normal" fill="#1d2733">rễ: phân chia tế bào, chồi bên, chậm già hoá</text><rect x="400.0" y="96.0" width="330.0" height="60.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="412.0" y="120.0" text-anchor="start" font-size="13" font-weight="bold" fill="#1d2733">Abscisic acid</text><text x="412.0" y="142.0" text-anchor="start" font-size="11" font-weight="normal" fill="#1d2733">ngủ hạt, đóng khí khổng khi hạn, rụng lá</text><rect x="400.0" y="164.0" width="330.0" height="60.0" rx="8" fill="#fff" stroke="#1d2733" stroke-width="1.5"/><text x="412.0" y="188.0" text-anchor="start" font-size="13" font-weight="bold" fill="#1d2733">Ethylene</text><text x="412.0" y="210.0" text-anchor="start" font-size="11" font-weight="normal" fill="#1d2733">chín quả, rụng lá, quả</text><rect x="400.0" y="232.0" width="330.0" height="52.0" rx="8" fill="#fbf0c9" stroke="#1d2733" stroke-width="2"/><text x="565.0" y="254.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1d2733">Tương quan: lúc non nhóm kích thích</text><text x="565.0" y="268.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1d2733">nhiều; già, sinh sản nhóm ức chế tăng</text></svg>