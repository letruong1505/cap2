<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 306" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="360.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Tính tuổi cây bằng vòng gỗ</text><circle cx="200.0" cy="170.0" r="110.0" fill="#ecd9b5" stroke="#1d2733" stroke-width="2.6"/><circle cx="200.0" cy="170.0" r="95.0" fill="none" stroke="#a37a3b" stroke-width="3"/><circle cx="200.0" cy="170.0" r="78.0" fill="none" stroke="#c9a46a" stroke-width="3"/><circle cx="200.0" cy="170.0" r="62.0" fill="none" stroke="#a37a3b" stroke-width="3"/><circle cx="200.0" cy="170.0" r="46.0" fill="none" stroke="#c9a46a" stroke-width="3"/><circle cx="200.0" cy="170.0" r="30.0" fill="none" stroke="#a37a3b" stroke-width="3"/><circle cx="200.0" cy="170.0" r="15.0" fill="none" stroke="#c9a46a" stroke-width="3"/><line x1="200.0" y1="170.0" x2="310.0" y2="170.0" stroke="#e15759" stroke-width="2" stroke-dasharray="4 3"/><rect x="400.0" y="70.0" width="290.0" height="60.0" rx="8" fill="#fbf0c9" stroke="#1d2733" stroke-width="2"/><text x="545.0" y="95.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">Mỗi năm một vòng gỗ gồm</text><text x="545.0" y="110.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">lớp sáng (mùa mưa) và lớp sẫm (mùa khô)</text><rect x="400.0" y="145.0" width="290.0" height="60.0" rx="8" fill="#cfe8c2" stroke="#1d2733" stroke-width="2"/><text x="545.0" y="170.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">Đếm số vòng gỗ trên thân chính</text><text x="545.0" y="185.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">sát gốc → tuổi cây</text><rect x="400.0" y="220.0" width="290.0" height="60.0" rx="8" fill="#dbe7f3" stroke="#1d2733" stro