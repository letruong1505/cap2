<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="360.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Kháng chiến chống Mỹ (1965 – 1975)</text><line x1="30.0" y1="173.0" x2="690.0" y2="173.0" stroke="#1d2733" stroke-width="3" marker-end="url(#ar)"/><circle cx="103.0" cy="173.0" r="7.0" fill="#e15759" stroke="#1d2733" stroke-width="1.6"/><line x1="103.0" y1="166.0" x2="103.0" y2="145.0" stroke="#9aa5b1" stroke-width="1.4"/><rect x="8.0" y="83.0" width="190.0" height="62.0" rx="8" fill="#e8f1fa" stroke="#1d2733" stroke-width="1.5"/><text x="103.0" y="103.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#e15759">1965 – 1968</text><text x="103.0" y="121.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1d2733">“Chiến tranh cục bộ”;</text><text x="103.0" y="137.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1d2733">Vạn Tường, Tết Mậu Thân 1968</text><circle cx="231.5" cy="173.0" r="7.0" fill="#e15759" stroke="#1d2733" stroke-width="1.6"/><line x1="231.5" y1="180.0" x2="231.5" y2="201.0" stroke="#9aa5b1" stroke-width="1.4"/><rect x="136.5" y="201.0" width="190.0" height="62.0" rx="8" fill="#fdf1e0" stroke="#1d2733" stroke-width="1.5"/><text x="231.5" y="221.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#e15759">1969 – 1973</text><text x="231.5" y="239.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1d2733">“Việt Nam hoá chiến tranh”;</text><text x="231.5" y="255.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1d2733">tiến công chiến lược 1972</text><circle cx="360.0" cy="173.0" r="7.0" fill="#e15759" stroke="#1d2733" stroke-width="1.6"/><line x1="360.0" y1="166.0" x2="360.0" y2="145.0" stroke="#9aa5b1" stroke-width="1.4"/><rect x="265.0" y="83.0" width="190.0" height="62.0" rx="8" fill="#e8f1fa" stroke="#1d2733" stroke-width="1.5"/><text x="360.0" y="103.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#e15759">27/1/1973</text><text x="360.0" y="121.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1d2733">Hiệp định Pa-ri,</text><text x="360.0" y="137.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1d2733">Mỹ rút quân</text><circle cx="488.5" cy="173.0" r="7.0" fill="#e15759" stroke="#1d2733" stroke-width="1.6"/><line x1="488.5" y1="180.0" x2="488.5" y2="201.0" stroke="#9aa5b1" stroke-width="1.4"/><rect x="393.5" y="201.0" width="190.0" height="62.0" rx="8" fill="#fdf1e0" stroke="#1d2733" stroke-width="1.5"/><text x="488.5" y="221.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#e15759">Mùa Xuân 1975</text><text x="488.5" y="239.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1d2733">Ba chiến dịch: Tây Nguyên,</text><text x="488.5" y="255.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1d2733">Huế – Đà Nẵng, Hồ Chí Minh</text><circle cx="617.0" cy="173.0" r="7.0" fill="#e15759" stroke="#1d2733" stroke-width="1.6"/><line x1="617.0" y1="166.0" x2="617.0" y2="145.0" stroke="#9aa5b1" stroke-width="1.4"/><rect x="522.0" y="83.0" width="190.0" height="62.0" rx="8" fill="#e8f1fa" stroke="#1d2733" stroke-width="1.5"/><text x="617.0" y="103.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#e15759">30/4/1975</text><text x="617.0" y="121.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1d2733">Miền Nam hoàn toàn</text><text x="617.0" y="137.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1d2733">giải phóng</text></svg>