<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="360.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Kháng chiến chống Pháp (1951 – 1954)</text><line x1="30.0" y1="158.0" x2="690.0" y2="158.0" stroke="#1d2733" stroke-width="3" marker-end="url(#ar)"/><circle cx="103.0" cy="158.0" r="7.0" fill="#e15759" stroke="#1d2733" stroke-width="1.6"/><line x1="103.0" y1="151.0" x2="103.0" y2="130.0" stroke="#9aa5b1" stroke-width="1.4"/><rect x="8.0" y="68.0" width="190.0" height="62.0" rx="8" fill="#e8f1fa" stroke="#1d2733" stroke-width="1.5"/><text x="103.0" y="88.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#e15759">Tháng 2/1951</text><text x="103.0" y="106.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1d2733">Đại hội II của Đảng,</text><text x="103.0" y="122.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1d2733">Đảng Lao động Việt Nam</text><circle cx="274.3" cy="158.0" r="7.0" fill="#e15759" stroke="#1d2733" stroke-width="1.6"/><line x1="274.3" y1="165.0" x2="274.3" y2="186.0" stroke="#9aa5b1" stroke-width="1.4"/><rect x="179.3" y="186.0" width="190.0" height="62.0" rx="8" fill="#fdf1e0" stroke="#1d2733" stroke-width="1.5"/><text x="274.3" y="206.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#e15759">Năm 1953</text><text x="274.3" y="224.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1d2733">Pháp đề ra kế hoạch Na-va;</text><text x="274.3" y="240.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1d2733">ta tiến công Đông – Xuân</text><circle cx="445.7" cy="158.0" r="7.0" fill="#e15759" stroke="#1d2733" stroke-width="1.6"/><line x1="445.7" y1="151.0" x2="445