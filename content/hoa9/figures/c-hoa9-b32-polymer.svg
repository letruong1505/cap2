<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="360.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Polymer và phân loại polymer</text><text x="180.0" y="56.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2733">n CH₂=CH₂  →  (–CH₂–CH₂–)ₙ</text><text x="180.0" y="78.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">Ethylene (monomer) → polyethylene (PE)</text><circle cx="40.0" cy="120.0" r="14.0" fill="#fbf0c9" stroke="#1d2733" stroke-width="1.5"/><line x1="54.0" y1="120.0" x2="66.0" y2="120.0" stroke="#1d2733" stroke-width="2"/><circle cx="80.0" cy="120.0" r="14.0" fill="#fbf0c9" stroke="#1d2733" stroke-width="1.5"/><line x1="94.0" y1="120.0" x2="106.0" y2="120.0" stroke="#1d2733" stroke-width="2"/><circle cx="120.0" cy="120.0" r="14.0" fill="#fbf0c9" stroke="#1d2733" stroke-width="1.5"/><line x1="134.0" y1="120.0" x2="146.0" y2="120.0" stroke="#1d2733" stroke-width="2"/><circle cx="160.0" cy="120.0" r="14.0" fill="#fbf0c9" stroke="#1d2733" stroke-width="1.5"/><line x1="174.0" y1="120.0" x2="186.0" y2="120.0" stroke="#1d2733" stroke-width="2"/><circle cx="200.0" cy="120.0" r="14.0" fill="#fbf0c9" stroke="#1d2733" stroke-width="1.5"/><line x1="214.0" y1="120.0" x2="226.0" y2="120.0" stroke="#1d2733" stroke-width="2"/><circle cx="240.0" cy="120.0" r="14.0" fill="#fbf0c9" stroke="#1d2733" stroke-width="1.5"/><line x1="254.0" y1="120.0" x2="266.0" y2="120.0" stroke="#1d2733" stroke-width="2"/><circle cx="280.0" cy="120.0" r="14.0" fill="#fbf0c9" stroke="#1d2733" stroke-width="1.5"/><text x="180.0" y="158.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">Mắt xích –CH₂–CH₂– lặp lại nhiều lần</text><rect x="370.0" y="50.0" width="170.0" height="36.0" rx="8" fill="#dfe9d5" stroke="#1d2733" stroke-width="2"/><text x="455.0" y="72.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Polymer thiên nhiên</text><text x="455.0" y="112.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">Tinh bột, cellulose,</text><text x="455.0" y="128.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">protein, cao su thiên nhiên</text><rect x="552.0" y="50.0" width="160.0" height="36.0" rx="8" fill="#dbe7f3" stroke="#1d2733" stroke-width="2"/><text x="632.0" y="72.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Polymer tổng hợp</text><text x="632.0" y="112.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">PE, PVC, nylon,</text><text x="632.0" y="128.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">cao su buna</text><text x="360.0" y="222.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#444">Polymer thường là chất rắn, không bay hơi, không tan trong nước.</text></svg>