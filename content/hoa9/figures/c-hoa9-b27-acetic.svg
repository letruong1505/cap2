 stroke-width="0"/><text x="57.0" y="91.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">H</text><rect x="120.5" y="37.0" width="21.0" height="24.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0"/><text x="131.0" y="55.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">O</text><rect x="158.5" y="91.0" width="21.0" height="24.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0"/><text x="169.0" y="109.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">O</text><rect x="192.5" y="91.0" width="21.0" height="24.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0"/><text x="203.0" y="109.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">H</text><text x="130.0" y="160.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2733">CH₃COOH</text><text x="130.0" y="184.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">Chất lỏng không màu, vị chua</text><text x="130.0" y="200.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">Giấm ăn: dung dịch 2–5%</text><rect x="300.0" y="54.0" width="400.0" height="160.0" rx="8" fill="#eef1f4" stroke="#1d2733" stroke-width="2"/><text x="500.0" y="82.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2733">Phản ứng ester hoá</text><text x="500.0" y="118.0" text-anchor="middle" font-size="15" font-weight="normal" fill="#1d2733">CH₃COOH + C₂H₅OH</text><text x="500.0" y="142.0" text-anchor="middle" font-size="15" font-weight="normal" fill="#1d2733">⇌ CH₃COOC₂H₅ + H₂O</text><text x="500.0" y="182.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">Xúc tác H₂SO₄ đặc, đun nóng</text><text x="500.0" y="198.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">Sản phẩm: ethyl acetate</text></svg>