<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 296" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="360.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Gang, thép và một số hợp kim thông dụng</text><text x="360.0" y="52.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2733">Hàm lượng carbon trong hợp kim của sắt</text><rect x="60.0" y="70.0" width="240.0" height="40.0" rx="0" fill="#cfd8e3" stroke="#1d2733" stroke-width="1.5"/><rect x="300.0" y="70.0" width="360.0" height="40.0" rx="0" fill="#8a97a6" stroke="#1d2733" stroke-width="1.5"/><text x="180.0" y="96.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2733">Thép: dưới 2% C</text><text x="480.0" y="96.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">Gang: 2% đến 5% C</text><line x1="60.0" y1="110.0" x2="60.0" y2="118.0" stroke="#1d2733" stroke-width="1.5"/><text x="60.0" y="134.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">0%</text><line x1="180.0" y1="110.0" x2="180.0" y2="118.0" stroke="#1d2733" stroke-width="1.5"/><text x="180.0" y="134.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">1%</text><line x1="300.0" y1="110.0" x2="300.0" y2="118.0" stroke="#1d2733" stroke-width="1.5"/><text x="300.0" y="134.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">2%</text><line x1="420.0" y1="110.0" x2="420.0" y2="118.0" stroke="#1d2733" stroke-width="1.5"/><text x="420.0" y="134.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">3%</text><line x1="540.0" y1="110.0" x2="540.0" y2="118.0" stroke="#1d2733" stroke-width="1.5"/><text x="540.0" y="134.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">4%</text><line x1="660.0" y1="110.0" x2="660.0" y2="118.0" stroke="#1d2733" stroke-width="1.5"/><text x="660.0" y="134.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">5%</text><rect x="120.0" y="170.0" width="220.0" height="80.0" rx="8" fill="#fbf0c9" stroke="#1d2733" stroke-width="2"/><text x="230.0" y="196.9" text-anchor="middle" font-size="14" font-weight="normal" fill="#1d2733">Inox</text><text x="230.0" y="214.9" text-anchor="middle" font-size="14" font-weight="normal" fill="#1d2733">Thép không gỉ,</text><text x="230.0" y="232.9" text-anchor="middle" font-size="14" font-weight="normal" fill="#1d2733">có Cr, Ni</text><rect x="370.0" y="170.0" width="220.0" height="80.0" rx="8" fill="#fbf0c9" stroke="#1d2733" stroke-width="2"/><text x="480.0" y="196.9" text-anchor="middle" font-size="14" font-weight="normal" fill="#1d2733">Duralumin</text><text x="480.0" y="214.9" text-anchor="middle" font-size="14" font-weight="normal" fill="#1d2733">Al, Cu, Mn, Mg;</text><text x="480.0" y="232.9" text-anchor="middle" font-size="14" font-weight="normal" fill="#1d2733">nhẹ, bền</text><text x="360.0" y="280.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#444">Hợp kim thường cứng hơn, bền hơn, ít bị ăn mòn hơn kim loại thành phần.</text></svg>