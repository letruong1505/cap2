<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 262" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="360.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Nguyên liệu của một số sản phẩm silicate</text><rect x="20.0" y="60.0" width="230.0" height="74.0" rx="8" fill="#e4dccb" stroke="#1d2733" stroke-width="2"/><text x="135.0" y="93.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#1d2733">Cát (SiO₂)</text><text x="135.0" y="110.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#1d2733">đá vôi, soda (Na₂CO₃)</text><line x1="256.0" y1="97.0" x2="340.0" y2="97.0" stroke="#1d2733" stroke-width="2" marker-end="url(#ar)"/><text x="298.0" y="87.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">Nấu chảy</text><rect x="346.0" y="74.0" width="130.0" height="46.0" rx="8" fill="#dbe7f3" stroke="#1d2733" stroke-width="2"/><text x="411.0" y="101.9" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2733">Thuỷ tinh</text><rect x="20.0" y="170.0" width="230.0" height="74.0" rx="8" fill="#e4dccb" stroke="#1d2733" stroke-width="2"/><text x="135.0" y="203.1" text-anchor="middle" font-size="13" font-weight="normal" fill="#1d2733">Đá vôi, đất sét</text><text x="135.0" y="220.1" text-anchor="middle" font-size="13" font-weight="normal" fill="#1d2733">(nghiền với thạch cao)</text><line x1="256.0" y1="207.0" x2="340.0" y2="207.0" stroke="#1d2733" stroke-width="2" marker-end="url(#ar)"/><text x="298.0" y="197.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">Nung</text><rect x="346.0" y="184.0" width="130.0" height="46.0" rx="8" fill="#eef1f4" stroke="#1d2733" stroke-width="2"/><text x="411.0" y="211.9" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2733">Xi măng</text><text x="600.0" y="98.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">Đồ gốm, sứ cũng thuộc</text><text x="600.0" y="114.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">công nghiệp silicate</text></svg>