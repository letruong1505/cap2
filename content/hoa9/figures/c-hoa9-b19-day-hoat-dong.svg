<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 336" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="360.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Dãy hoạt động hoá học của một số kim loại</text><rect x="36.0" y="56.0" width="52.0" height="46.0" rx="6" fill="#f3c6c6" stroke="#1d2733" stroke-width="2"/><text x="62.0" y="87.0" text-anchor="middle" font-size="19" font-weight="bold" fill="#1d2733">K</text><rect x="90.0" y="56.0" width="52.0" height="46.0" rx="6" fill="#f3c6c6" stroke="#1d2733" stroke-width="2"/><text x="116.0" y="87.0" text-anchor="middle" font-size="19" font-weight="bold" fill="#1d2733">Na</text><rect x="144.0" y="56.0" width="52.0" height="46.0" rx="6" fill="#f3c6c6" stroke="#1d2733" stroke-width="2"/><text x="170.0" y="87.0" text-anchor="middle" font-size="19" font-weight="bold" fill="#1d2733">Ca</text><rect x="198.0" y="56.0" width="52.0" height="46.0" rx="6" fill="#f7e3b5" stroke="#1d2733" stroke-width="2"/><text x="224.0" y="87.0" text-anchor="middle" font-size="19" font-weight="bold" fill="#1d2733">Mg</text><rect x="252.0" y="56.0" width="52.0" height="46.0" rx="6" fill="#f7e3b5" stroke="#1d2733" stroke-width="2"/><text x="278.0" y="87.0" text-anchor="middle" font-size="19" font-weight="bold" fill="#1d2733">Al</text><rect x="306.0" y="56.0" width="52.0" height="46.0" rx="6" fill="#f7e3b5" stroke="#1d2733" stroke-width="2"/><text x="332.0" y="87.0" text-anchor="middle" font-size="19" font-weight="bold" fill="#1d2733">Zn</text><rect x="360.0" y="56.0" width="52.0" height="46.0" rx="6" fill="#f7e3b5" stroke="#1d2733" stroke-width="2"/><text x="386.0" y="87.0" text-anchor="middle" font-size="19" font-weight="bold" fill="#1d2733">Fe</text><rect x="414.0" y="56.0" width="52.0" height="46.0" rx="6" fill="#f7e3b5" stroke="#1d2733" stroke-width="2"/><text x="440.0" y="87.0" text-anchor="middle" font-size="19" font-weight="bold" fill="#1d2733">Pb</text><rect x="468.0" y="56.0" width="52.0" height="46.0" rx="6" fill="#ffffff" stroke="#1d2733" stroke-width="2"/><text x="494.0" y="87.0" text-anchor="middle" font-size="19" font-weight="bold" fill="#1d2733">(H)</text><rect x="522.0" y="56.0" width="52.0" height="46.0" rx="6" fill="#d9eef0" stroke="#1d2733" stroke-width="2"/><text x="548.0" y="87.0" text-anchor="middle" font-size="19" font-weight="bold" fill="#1d2733">Cu</text><rect x="576.0" y="56.0" width="52.0" height="46.0" rx="6" fill="#d9eef0" stroke="#1d2733" stroke-width="2"/><text x="602.0" y="87.0" text-anchor="middle" font-size="19" font-weight="bold" fill="#1d2733">Ag</text><rect x="630.0" y="56.0" width="52.0" height="46.0" rx="6" fill="#d9eef0" stroke="#1d2733" stroke-width="2"/><text x="656.0" y="87.0" text-anchor="middle" font-size="19" font-weight="bold" fill="#1d2733">Au</text><line x1="40.0" y1="124.0" x2="680.0" y2="124.0" stroke="#1d2733" stroke-width="2" marker-end="url(#ar)"/><text x="360.0" y="144.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#1d2733">Mức độ hoạt động hoá học giảm dần</text><polyline points="38.0,168.0 38.0,176.0 194.0,176.0 194.0,168.0" fill="none" stroke="#1d2733" stroke-width="1.5" stroke-linejoin="round"/><text x="116.0" y="196.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">Phản ứng với nước ở</text><text x="116.0" y="212.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">nhiệt độ thường → base + H₂</text><polyline points="38.0,232.0 38.0,240.0 464.0,240.0 464.0,232.0" fill="none" stroke="#1d2733" stroke-width="1.5" stroke-linejoin="round"/><text x="251.0" y="260.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">Đứng trước H: phản ứng với HCl, H₂SO₄ loãng → muối + H₂</text><text x="251.0" y="276.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733"></text><polyline points="524.0,168.0 524.0,176.0 680.0,176.0 680.0,168.0" fill="none" stroke="#1d2733" stroke-width="1.5" stroke-linejoin="round"/><text x="602.0" y="196.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">Đứng sau H: không phản ứng</text><text x="602.0" y="212.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">với HCl, H₂SO₄ loãng</text><text x="360.0" y="300.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#444">Kim loại đứng trước (trừ K, Na, Ca) đẩy được kim loại đứng sau</text><text x="360.0" y="317.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#444">ra khỏi dung dịch muối.</text></svg>