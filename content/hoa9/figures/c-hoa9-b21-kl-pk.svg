<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 348" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="360.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">So sánh kim loại và phi kim</text><rect x="130.0" y="44.0" width="270.0" height="34.0" rx="8" fill="#d8dee6" stroke="#1d2733" stroke-width="2"/><text x="265.0" y="66.2" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2733">Kim loại</text><rect x="406.0" y="44.0" width="294.0" height="34.0" rx="8" fill="#dfe9d5" stroke="#1d2733" stroke-width="2"/><text x="553.0" y="66.2" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2733">Phi kim</text><rect x="10.0" y="84.0" width="114.0" height="52.0" rx="8" fill="#eef1f4" stroke="#1d2733" stroke-width="2"/><text x="67.0" y="114.2" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">Thể</text><rect x="130.0" y="84.0" width="270.0" height="52.0" rx="8" fill="#ffffff" stroke="#1d2733" stroke-width="2"/><text x="265.0" y="114.2" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">Thường rắn (trừ Hg)</text><rect x="406.0" y="84.0" width="294.0" height="52.0" rx="8" fill="#ffffff" stroke="#1d2733" stroke-width="2"/><text x="553.0" y="106.2" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">Cả ba thể: rắn (C, S, P), lỏng (Br₂),</text><text x="553.0" y="122.2" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">khí (O₂, N₂, Cl₂)</text><rect x="10.0" y="142.0" width="114.0" height="40.0" rx="8" fill="#eef1f4" stroke="#1d2733" stroke-width="2"/><text x="67.0" y="166.2" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">Ánh kim</text><rect x="130.0" y="142.0" width="270.0" height="40.0" rx="8" fill="#ffffff" stroke="#1d2733" stroke-width="2"/><text x="265.0" y="166.2" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">Có ánh kim</text><rect x="406.0" y="142.0" width="294.0" height="40.0" rx="8" fill="#ffffff" stroke="#1d2733" stroke-width="2"/><text x="553.0" y="166.2" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">Thường không có ánh kim</text><rect x="10.0" y="188.0" width="114.0" height="52.0" rx="8" fill="#eef1f4" stroke="#1d2733" stroke-width="2"/><text x="67.0" y="218.2" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">Dẫn điện, nhiệt</text><rect x="130.0" y="188.0" width="270.0" height="52.0" rx="8" fill="#ffffff" stroke="#1d2733" stroke-width="2"/><text x="265.0" y="218.2" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">Dẫn điện, dẫn nhiệt tốt</text><rect x="406.0" y="188.0" width="294.0" height="52.0" rx="8" fill="#ffffff" stroke="#1d2733" stroke-width="2"/><text x="553.0" y="210.2" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">Dẫn điện,</text><text x="553.0" y="226.2" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">nhiệt kém (trừ than chì dẫn điện)</text><rect x="10.0" y="246.0" width="114.0" height="40.0" rx="8" fill="#eef1f4" stroke="#1d2733" stroke-width="2"/><text x="67.0" y="270.2" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">Xu hướng</text><rect x="130.0" y="246.0" width="270.0" height="40.0" rx="8" fill="#ffffff" stroke="#1d2733" stroke-width="2"/><text x="265.0" y="270.2" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">Nhường electron → ion dương</text><rect x="406.0" y="246.0" width="294.0" height="40.0" rx="8" fill="#ffffff" stroke="#1d2733" stroke-width="2"/><text x="553.0" y="270.2" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">Nhận electron → ion âm</text><rect x="10.0" y="292.0" width="114.0" height="40.0" rx="8" fill="#eef1f4" stroke="#1d2733" stroke-width="2"/><text x="67.0" y="316.2" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">Oxide</text><rect x="130.0" y="292.0" width="270.0" height="40.0" rx="8" fill="#ffffff" stroke="#1d2733" stroke-width="2"/><text x="265.0" y="316.2" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">Thường là oxide base</text><rect x="406.0" y="292.0" width="294.0" height="40.0" rx="8" fill="#ffffff" stroke="#1d2733" stroke-width="2"/><text x="553.0" y="316.2" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">Thường là oxide acid</text></svg>