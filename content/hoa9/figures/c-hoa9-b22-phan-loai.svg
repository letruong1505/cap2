<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 268" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="360.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Phân loại hợp chất hữu cơ</text><rect x="250.0" y="40.0" width="220.0" height="38.0" rx="8" fill="#fbf0c9" stroke="#1d2733" stroke-width="2"/><text x="360.0" y="64.6" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d2733">Hợp chất hữu cơ</text><line x1="360.0" y1="78.0" x2="180.0" y2="110.0" stroke="#1d2733" stroke-width="1.5"/><rect x="30.0" y="110.0" width="300.0" height="110.0" rx="8" fill="#d9eef0" stroke="#1d2733" stroke-width="2"/><text x="180.0" y="138.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2733">Hydrocarbon</text><text x="180.0" y="164.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#1d2733">Chỉ chứa C và H</text><text x="180.0" y="196.0" text-anchor="middle" font-size="14" font-weight="normal" fill="#1d2733">Ví dụ: CH₄, C₂H₄</text><line x1="360.0" y1="78.0" x2="540.0" y2="110.0" stroke="#1d2733" stroke-width="1.5"/><rect x="390.0" y="110.0" width="300.0" height="110.0" rx="8" fill="#dfe9d5" stroke="#1d2733" stroke-width="2"/><text x="540.0" y="138.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2733">Dẫn xuất của hydrocarbon</text><text x="540.0" y="164.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#1d2733">Ngoài C, H còn có O, N, Cl…</text><text x="540.0" y="196.0" text-anchor="middle" font-size="14" font-weight="normal" fill="#1d2733">Ví dụ: C₂H₅OH, CH₃COOH</text><text x="360.0" y="250.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#444">Hoá trị trong hợp chất hữu cơ: C (IV), H (I), O (II).</text></svg>