<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 276" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="360.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Tính chất vật lí chung của kim loại</text><rect x="10.0" y="44.0" width="168.0" height="80.0" rx="8" fill="#d8dee6" stroke="#1d2733" stroke-width="2"/><text x="94.0" y="71.5" text-anchor="middle" font-size="13" font-weight="normal" fill="#1d2733">Tính dẻo</text><text x="94.0" y="88.5" text-anchor="middle" font-size="13" font-weight="normal" fill="#1d2733">Kéo thành sợi,</text><text x="94.0" y="105.5" text-anchor="middle" font-size="13" font-weight="normal" fill="#1d2733">dát mỏng</text><rect x="187.0" y="44.0" width="168.0" height="80.0" rx="8" fill="#d8dee6" stroke="#1d2733" stroke-width="2"/><text x="271.0" y="71.5" text-anchor="middle" font-size="13" font-weight="normal" fill="#1d2733">Dẫn điện</text><text x="271.0" y="88.5" text-anchor="middle" font-size="13" font-weight="normal" fill="#1d2733">Dẫn điện tốt</text><text x="271.0" y="105.5" text-anchor="middle" font-size="13" font-weight="normal" fill="#1d2733">nhất là Ag</text><rect x="364.0" y="44.0" width="168.0" height="80.0" rx="8" fill="#d8dee6" stroke="#1d2733" stroke-width="2"/><text x="448.0" y="71.5" text-anchor="middle" font-size="13" font-weight="normal" fill="#1d2733">Dẫn nhiệt</text><text x="448.0" y="88.5" text-anchor="middle" font-size="13" font-weight="normal" fill="#1d2733">Nồi, xoong</text><text x="448.0" y="105.5" text-anchor="middle" font-size="13" font-weight="normal" fill="#1d2733">làm bằng kim loại</text><rect x="541.0" y="44.0" width="168.0" height="80.0" rx="8" fill="#d8dee6" stroke="#1d2733" stroke-width="2"/><text x="625.0" y="71.5" text-anchor="middle" font-size="13" font-weight="normal" fill="#1d2733">Ánh kim</