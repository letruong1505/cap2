<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 250" font-family="Segoe UI, Arial, sans-serif"><rect x="30" y="60" width="120" height="110" rx="6" fill="#fbe3d6" stroke="#5b6775" stroke-width="1.4"/><text x="90.0" y="113.0" font-size="15" text-anchor="middle" fill="#1d2733" font-weight="bold">Nước nóng</text><text x="90.0" y="133.0" font-size="13" text-anchor="middle" fill="#5b6775">100 °C, m₁</text><rect x="290" y="60" width="120" height="110" rx="6" fill="#d6ebfb" stroke="#5b6775" stroke-width="1.4"/><text x="350.0" y="113.0" font-size="15" text-anchor="middle" fill="#1d2733" font-weight="bold">Nước lạnh</text><text x="350.0" y="133.0" font-size="13" text-anchor="middle" fill="#5b6775">20 °C, m₂</text><line x1="152.0" y1="115.0" x2="286.0" y2="115.0" stroke="#c0392b" stroke-width="2.2"/><polygon points="286.0,115.0 276.8,118.9 276.8,111.1" fill="#c0392b"/><text x="219" y="104" font-size="13" text-anchor="middle" fill="#c0392b">nhiệt truyền</text><text x="219" y="132" font-size="12" text-anchor="middle" fill="#5b6775">từ nóng sang lạnh</text><text x="210" y="200" font-size="15" text-anchor="middle" fill="#1d2733" font-weight="bold">Khi cân bằng nhiệt: t = 40 °C</text><text x="210" y="222" font-size="13" text-anchor="middle" fill="#5b6775">Q toả = Q thu  ⇒  m₁·c·(100 − 40) = m₂·c·(40 − 20)</text><text x="220.0" y="242" font-size="13" text-anchor="middle" fill="#5b6775">Hai khối nước trao đổi nhiệt đến khi cân bằng nhiệt</text></svg>
