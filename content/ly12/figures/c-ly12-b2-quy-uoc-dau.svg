<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 250" font-family="Segoe UI, Arial, sans-serif"><rect x="150" y="90" width="140" height="80" rx="10" fill="#e8f1fa" stroke="#4e79a7" stroke-width="1.6"/><text x="220" y="126" font-size="17" text-anchor="middle" fill="#1d2733" font-weight="bold">Vật</text><text x="220" y="146" font-size="12" text-anchor="middle" fill="#5b6775">(khí, chất lỏng…)</text><line x1="60.0" y1="70.0" x2="148.0" y2="116.0" stroke="#c0392b" stroke-width="2"/><polygon points="148.0,116.0 138.0,115.2 141.6,108.3" fill="#c0392b"/><text x="60" y="60" font-size="13" text-anchor="start" fill="#c0392b">Q &gt; 0: nhận nhiệt</text><line x1="60.0" y1="200.0" x2="148.0" y2="144.0" stroke="#2e8b57" stroke-width="2"/><polygon points="148.0,144.0 142.3,152.2 138.1,145.7" fill="#2e8b57"/><text x="60" y="222" font-size="13" text-anchor="start" fill="#2e8b57">A &gt; 0: nhận công</text><line x1="292.0" y1="116.0" x2="380.0" y2="70.0" stroke="#c0392b" stroke-width="2"/><polygon points="380.0,70.0 373.6,77.7 370.0,70.8" fill="#c0392b"/><text x="380" y="60" font-size="13" text-anchor="end" fill="#c0392b">Q &lt; 0: truyền nhiệt</text><line x1="292.0" y1="144.0" x2="380.0" y2="200.0" stroke="#2e8b57" stroke-width="2"/><polygon points="380.0,200.0 370.1,198.3 374.3,191.8" fill="#2e8b57"/><text x="380" y="222" font-size="13" text-anchor="end" fill="#2e8b57">A &lt; 0: thực hiện công</text><text x="220.0" y="242" font-size="13" text-anchor="middle" fill="#5b6775">Quy ước dấu của nhiệt lượng Q và công A đối với vật</text></svg>
