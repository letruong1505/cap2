<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="360.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Hình cầu và mặt phẳng cắt hình cầu</text><circle cx="170.0" cy="150.0" r="100.0" fill="#e6eef7" stroke="#1d2733" stroke-width="2.4"/><path d="M70.0,150.0 A100.0,30.0 0 0 0 270.0,150.0" fill="none" stroke="#4e79a7" stroke-width="2"/><path d="M70.0,150.0 A100.0,30.0 0 0 1 270.0,150.0" fill="none" stroke="#4e79a7" stroke-width="1.6" stroke-dasharray="5 4"/><line x1="170.0" y1="150.0" x2="270.0" y2="150.0" stroke="#e15759" stroke-width="2.2"/><circle cx="170.0" cy="150.0" r="4.5" fill="#e15759" stroke="#e15759" stroke-width="1"/><text x="162.0" y="142.0" text-anchor="end" font-size="16" font-weight="bold" fill="#1d2733">O</text><text x="220.0" y="143.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#e15759" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">R</text><text x="170.0" y="284.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2733">Hình cầu tâm O, bán kính R</text><text x="170.0" y="304.0" text-anchor="middle" font-size="14" font-weight="normal" fill="#1d2733">S = 4πR²;   V = (4/3)πR³</text><circle cx="520.0" cy="150.0" r="100.0" fill="#e6eef7" stroke="#1d2733" stroke-width="2.4"/><path d="M420.0,150.0 A100.0,30.0 0 0 0 620.0,150.0" fill="none" stroke="#9aa5b1" stroke-width="1.4" stroke-dasharray="4 4"/><ellipse cx="520.0" cy="100.0" rx="86.6" ry="26.0" fill="#fde3c7" fill-opacity="0.85" stroke="#f28e2b" stroke-width="2.2"/><line x1="520.0" y1="150.0" x2="520.0" y2="100.0" stroke="#e15759" stroke-width="2" stroke-dasharray="5 4"/><line x1="520.0" y1="100.0" x2="606.6" y2="100.0" stroke="#4e79a7" stroke-width="2.2"/><line x1="520.0" y1="150.0" x2="606.6" y2="100.0" stroke="#59a14f" stroke-width="2.2"/><polyline points="520.0,110.0 530.0,110.0 530.0,100.0" fill="none" stroke="#1d2733" stroke-width="1.5" stroke-linejoin="round"/><circle cx="520.0" cy="150.0" r="4.0" fill="#e15759" stroke="#e15759" stroke-width="1"/><circle cx="520.0" cy="100.0" r="4.0" fill="#e15759" stroke="#e15759" stroke-width="1"/><text x="512.0" y="168.0" text-anchor="end" font-size="15" font-weight="bold" fill="#1d2733">O</text><text x="512.0" y="92.0" text-anchor="end" font-size="15" font-weight="bold" fill="#1d2733">O′</text><text x="528.0" y="130.0" text-anchor="start" font-size="15" font-weight="bold" fill="#e15759" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">d</text><text x="563.3" y="92.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#4e79a7" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">r</text><text x="571.3" y="147.0" text-anchor="start" font-size="15" font-weight="bold" fill="#59a14f" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">R</text><text x="520.0" y="284.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2733">Mặt phẳng cắt hình cầu theo hình tròn</text><text x="520.0" y="304.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#1d2733">R² = d² + r²;  qua tâm (d = 0): hình tròn lớn, r = R</text></svg>