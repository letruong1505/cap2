<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="360.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Hình trụ và hình nón</text><path d="M55.0,70.0 L55.0,210.0 A65.0,20.0 0 0 0 185.0,210.0 L185.0,70.0 Z" fill="#dbe7f3" stroke="#1d2733" stroke-width="2.2" stroke-linejoin="round"/><ellipse cx="120.0" cy="70.0" rx="65.0" ry="20.0" fill="#d4e3f2" stroke="#1d2733" stroke-width="2.2"/><path d="M55.0,210.0 A65.0,20.0 0 0 1 185.0,210.0" fill="none" stroke="#1d2733" stroke-width="1.6" stroke-dasharray="5 4"/><line x1="120.0" y1="70.0" x2="120.0" y2="210.0" stroke="#e15759" stroke-width="1.8" stroke-dasharray="5 4"/><line x1="120.0" y1="70.0" x2="185.0" y2="70.0" stroke="#4e79a7" stroke-width="2.2"/><circle cx="120.0" cy="70.0" r="3.5" fill="#1d2733" stroke="#1d2733" stroke-width="1"/><circle cx="120.0" cy="210.0" r="3.5" fill="#1d2733" stroke="#1d2733" stroke-width="1"/><text x="152.5" y="63.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#4e79a7" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">r</text><text x="112.0" y="145.0" text-anchor="end" font-size="16" font-weight="bold" fill="#e15759" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">h</text><text x="120.0" y="260.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d2733">Hình trụ</text><path d="M350.0,50.0 L275.0,210.0 A75.0,22.0 0 0 0 425.0,210.0 Z" fill="#dfe9d5" stroke="#1d2733" stroke-width="2.2" stroke-linejoin="round"/><path d="M275.0,210.0 A75.0,22.0 0 0 1 425.0,210.0" fill="none" stroke="#1d2733" stroke-width="1.6" stroke-dasharray="5 4"/><line x1="350.0" y1="50.0" x2="350.0" y2="210.0" stroke="#e15759" stroke-width="1.8" stroke-dasharray="5 4"/><line x1="350.0" y1="210.0" x2="425.0" y2="210.0" stroke="#4e79a7" stroke-width="2.2"/><circle cx="350.0" cy="210.0" r="3.5" fill="#1d2733" stroke="#1d2733" stroke-width="1"/><circle cx="350.0" cy="50.0" r="3.5" fill="#1d2733" stroke="#1d2733" stroke-width="1"/><text x="387.5" y="203.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#4e79a7" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">r</text><text x="342.0" y="135.0" text-anchor="end" font-size="16" font-weight="bold" fill="#e15759" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">h</text><text x="397.5" y="126.0" text-anchor="start" font-size="16" font-weight="bold" fill="#59a14f" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">l</text><text x="350.0" y="260.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d2733">Hình nón</text><rect x="480.0" y="60.0" width="225.0" height="222.0" rx="8" fill="#eef1f4" stroke="#9aa5b1" stroke-width="1.2"/><text x="494.0" y="90.0" text-anchor="start" font-size="15" font-weight="normal" fill="#1d2733">Hình trụ:</text><text x="494.0" y="115.0" text-anchor="start" font-size="15" font-weight="normal" fill="#1d2733">  Sxq = 2πrh</text><text x="494.0" y="140.0" text-anchor="start" font-size="15" font-weight="normal" fill="#1d2733">  V = πr²h</text><text x="494.0" y="165.0" text-anchor="start" font-size="15" font-weight="normal" fill="#1d2733"></text><text x="494.0" y="190.0" text-anchor="start" font-size="15" font-weight="normal" fill="#1d2733">Hình nón (l: đường sinh):</text><text x="494.0" y="215.0" text-anchor="start" font-size="15" font-weight="normal" fill="#1d2733">  Sxq = πrl</text><text x="494.0" y="240.0" text-anchor="start" font-size="15" font-weight="normal" fill="#1d2733">  V = ⅓πr²h</text><text x="494.0" y="265.0" text-anchor="start" font-size="15" font-weight="normal" fill="#1d2733">  l² = r² + h²</text></svg>