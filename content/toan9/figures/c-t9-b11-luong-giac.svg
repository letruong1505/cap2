<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 345" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="360.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Tỉ số lượng giác của góc nhọn α</text><polygon points="80.0,300.0 400.0,300.0 400.0,60.0" fill="#dbe7f3" stroke="#1d2733" stroke-width="2.4" stroke-linejoin="round"/><polyline points="384.0,300.0 384.0,284.0 400.0,284.0" fill="none" stroke="#1d2733" stroke-width="1.5" stroke-linejoin="round"/><path d="M124.0,300.0 A44,44 0 0 0 115.2,273.6" fill="none" stroke="#e15759" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="146.0" y="292.0" text-anchor="middle" font-size="20" font-weight="bold" fill="#e15759">α</text><text x="66.0" y="306.0" text-anchor="end" font-size="17" font-weight="bold" fill="#1d2733">B</text><text x="412.0" y="306.0" text-anchor="start" font-size="17" font-weight="bold" fill="#1d2733">C</text><text x="412.0" y="66.0" text-anchor="start" font-size="17" font-weight="bold" fill="#1d2733">A</text><text x="222.0" y="226.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#59a14f" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">huyền</text><text x="414.0" y="180.0" text-anchor="start" font-size="16" font-weight="bold" fill="#f28e2b" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">đối</text><text x="414.0" y="199.0" text-anchor="start" font-size="13" font-weight="normal" fill="#9aa5b1">(đối diện α)</text><text x="240.0" y="326.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#4e79a7" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">kề α</text><rect x="480.0" y="70.0" width="235.0" height="222.0" rx="8" fill="#eef1f4" stroke="#9aa5b1" stroke-width="1.2"/><text x="494.0" y="100.0" text-anchor="start" font-size="15" font-weight="normal" fill="#1d2733">sin α = đối / huyền</text><text x="494.0" y="125.0" text-anchor="start" font-size="15" font-weight="normal" fill="#1d2733">cos α = kề / huyền</text><text x="494.0" y="150.0" text-anchor="start" font-size="15" font-weight="normal" fill="#1d2733">tan α = đối / kề</text><text x="494.0" y="175.0" text-anchor="start" font-size="15" font-weight="normal" fill="#1d2733">cot α = kề / đối</text><text x="494.0" y="200.0" text-anchor="start" font-size="15" font-weight="normal" fill="#1d2733"></text><text x="494.0" y="225.0" text-anchor="start" font-size="15" font-weight="normal" fill="#1d2733">Ví dụ: đối 3, kề 4, huyền 5</text><text x="494.0" y="250.0" text-anchor="start" font-size="15" font-weight="normal" fill="#1d2733">sin α = 3/5,  cos α = 4/5</text><text x="494.0" y="275.0" text-anchor="start" font-size="15" font-weight="normal" fill="#1d2733">tan α = 3/4,  cot α = 4/3</text></svg>