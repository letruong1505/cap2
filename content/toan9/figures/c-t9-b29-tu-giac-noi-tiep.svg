<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="360.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Tứ giác nội tiếp</text><circle cx="150.0" cy="165.0" r="100.0" fill="none" stroke="#9aa5b1" stroke-width="2"/><polygon points="56.0,199.2 150.0,265.0 236.6,115.0 115.8,71.0" fill="#dbe7f3" stroke="#1d2733" stroke-width="2.4" stroke-linejoin="round"/><path d="M65.3,179.3 A22,22 0 0 1 74.1,211.8" fill="none" stroke="#e15759" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><text x="98.5" y="192.8" text-anchor="middle" font-size="13" font-weight="bold" fill="#e15759" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">100°</text><text x="42.9" y="209.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d2733">A</text><path d="M130.3,251.2 A24,24 0 0 1 162.0,244.2" fill="none" stroke="#59a14f" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><text x="140.5" y="227.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#59a14f" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">85°</text><text x="150.0" y="284.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d2733">B</text><path d="M225.6,134.1 A22,22 0 0 1 215.9,107.5" fill="none" stroke="#e15759" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><text x="195.3" y="135.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#e15759" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">80°</text><text x="248.7" y="113.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d2733">C</text><path d="M136.5,78.6 A22,22 0 0 1 106.5,91.0" fill="none" stroke="#59a14f" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><text x="132.6" y="116.7" text-anchor="middle" font-size="13" font-weight="bold" fill="#59a14f" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">95°</text><text x="111.0" y="62.9" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d2733">D</text><text x="150.0" y="319.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">A + C = 100° + 80° = 180°;  B + D = 85° + 95° = 180°</text><text x="150.0" y="339.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">Tứ giác nội tiếp ⇒ tổng hai góc đối bằng 180°</text><circle cx="450.0" cy="150.0" r="68.0" fill="none" stroke="#9aa5b1" stroke-width="2"/><polygon points="502.1,106.3 397.9,106.3 397.9,193.7 502.1,193.7" fill="#dfe9d5" stroke="#1d2733" stroke-width="2.4" stroke-linejoin="round"/><line x1="502.1" y1="106.3" x2="397.9" y2="193.7" stroke="#e15759" stroke-width="1.5" stroke-dasharray="5 4"/><line x1="397.9" y1="106.3" x2="502.1" y2="193.7" stroke="#e15759" stroke-width="1.5" stroke-dasharray="5 4"/><circle cx="450.0" cy="150.0" r="4.0" fill="#e15759" stroke="#e15759" stroke-width="1"/><text x="454.0" y="168.0" text-anchor="start" font-size="14" font-weight="bold" fill="#e15759" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">O</text><text x="450.0" y="250.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2733">Hình chữ nhật</text><text x="450.0" y="270.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">tâm O = giao hai đường chéo</text><circle cx="615.0" cy="150.0" r="68.0" fill="none" stroke="#9aa5b1" stroke-width="2"/><polygon points="597.4,84.3 556.1,184.0 673.9,184.0 632.6,84.3" fill="#fbf0c9" stroke="#1d2733" stroke-width="2.4" stroke-linejoin="round"/><text x="615.0" y="250.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2733">Hình thang cân</text><text x="615.0" y="270.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">cũng nội tiếp được</text></svg>