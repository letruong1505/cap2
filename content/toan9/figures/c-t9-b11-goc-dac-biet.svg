<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 312" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="360.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Hai tam giác vuông đặc biệt</text><polygon points="60.0,230.0 241.9,230.0 241.9,125.0" fill="#dbe7f3" stroke="#1d2733" stroke-width="2.4" stroke-linejoin="round"/><polyline points="227.9,230.0 227.9,216.0 241.9,216.0" fill="none" stroke="#1d2733" stroke-width="1.5" stroke-linejoin="round"/><path d="M100.0,230.0 A40,40 0 0 0 94.6,210.0" fill="none" stroke="#e15759" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><text x="122.0" y="224.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#e15759" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">30°</text><path d="M219.3,138.0 A26,26 0 0 0 241.9,151.0" fill="none" stroke="#e15759" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><text x="219.9" y="177.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#e15759" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">60°</text><text x="150.9" y="254.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">√3</text><text x="259.9" y="182.5" text-anchor="start" font-size="17" font-weight="bold" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">1</text><text x="138.9" y="169.5" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">2</text><text x="180.0" y="275.0" text-anchor="middle" font-size="14" font-weight="normal" fill="#1d2733">sin 30° = 1/2;  cos 30° = √3/2;  tan 30° = √3/3</text><text x="180.0" y="296.0" text-anchor="middle" font-size="14" font-weight="normal" fill="#1d2733">sin 60° = √3/2;  cos 60° = 1/2;  tan 60° = √3</text><polygon points="440.0,230.0 590.0,230.0 590.0,80.0" fill="#dfe9d5" stroke="#1d2733" stroke-width="2.4" stroke-linejoin="round"/><polyline points="576.0,230.0 576.0,216.0 590.0,216.0" fill="none" stroke="#1d2733" stroke-width="1.5" stroke-linejoin="round"/><path d="M480.0,230.0 A40,40 0 0 0 468.3,201.7" fill="none" stroke="#e15759" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><text x="504.0" y="222.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#e15759" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">45°</text><path d="M566.0,104.0 A34,34 0 0 0 590.0,114.0" fill="none" stroke="#e15759" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><text x="570.0" y="132.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#e15759" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">45°</text><text x="515.0" y="254.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">1</text><text x="606.0" y="160.0" text-anchor="start" font-size="17" font-weight="bold" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">1</text><text x="501.0" y="147.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">√2</text><text x="530.0" y="275.0" text-anchor="middle" font-size="14" font-weight="normal" fill="#1d2733">sin 45° = cos 45° = √2/2</text><text x="530.0" y="296.0" text-anchor="middle" font-size="14" font-weight="normal" fill="#1d2733">tan 45° = 1</text></svg>