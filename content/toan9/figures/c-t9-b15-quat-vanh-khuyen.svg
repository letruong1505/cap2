<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="360.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Hình quạt tròn và hình vành khuyên</text><circle cx="170.0" cy="160.0" r="100.0" fill="white" stroke="#9aa5b1" stroke-width="2"/><path d="M170.0,160.0 L270.0,160.0 A100.0,100.0 0 0 0 220.0,73.4 Z" fill="#fbe3d0" stroke="#1d2733" stroke-width="2" stroke-linejoin="round"/><path d="M270.0,160.0 A100.0,100.0 0 0 0 220.0,73.4" fill="none" stroke="#e15759" stroke-width="5"/><path d="M204.0,160.0 A34,34 0 0 0 187.0,130.6" fill="none" stroke="#1d2733" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><text x="222.0" y="146.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d2733" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">n°</text><text x="220.0" y="178.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#4e79a7" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">R</text><text x="198.0" y="98.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#4e79a7" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">R</text><text x="277.9" y="100.0" text-anchor="start" font-size="17" font-weight="bold" fill="#e15759" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">l</text><circle cx="170.0" cy="160.0" r="4.0" fill="#1d2733" stroke="#1d2733" stroke-width="1"/><text x="162.0" y="180.0" text-anchor="end" font-size="16" font-weight="bold" fill="#1d2733">O</text><text x="170.0" y="300.0" text-anchor="middle" font-size="14" font-weight="normal" fill="#1d2733">l = πRn/180;   S quạt = πR²n/360</text><path d="M440.0,160.0 a100,100 0 1,0 200,0 a100,100 0 1,0 -200,0 Z M485.0,160.0 a55,55 0 1,0 110,0 a55,55 0 1,0 -110,0 Z" fill-rule="evenodd" fill="#dbe7f3" stroke="#1d2733" stroke-width="2.4"/><circle cx="540.0" cy="160.0" r="4.0" fill="#1d2733" stroke="#1d2733" stroke-width="1"/><text x="532.0" y="180.0" text-anchor="end" font-size="16" font-weight="bold" fill="#1d2733">O</text><line x1="540.0" y1="160.0" x2="616.6" y2="95.7" stroke="#4e79a7" stroke-width="2"/><line x1="540.0" y1="160.0" x2="497.9" y2="124.6" stroke="#e15759" stroke-width="2"/><text x="607.3" y="106.6" text-anchor="start" font-size="15" font-weight="bold" fill="#4e79a7" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">R</text><text x="513.0" y="136.7" text-anchor="end" font-size="15" font-weight="bold" fill="#e15759" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">r</text><text x="540.0" y="300.0" text-anchor="middle" font-size="14" font-weight="normal" fill="#1d2733">S = π(R² − r²)</text></svg>