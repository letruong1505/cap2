<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="360.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Nghiệm của hệ phương trình = giao điểm hai đường thẳng</text><line x1="85.0" y1="240.0" x2="367.0" y2="240.0" stroke="#1d2733" stroke-width="1.8" marker-end="url(#ar)"/><line x1="130.0" y1="330.0" x2="130.0" y2="48.0" stroke="#1d2733" stroke-width="1.8" marker-end="url(#ar)"/><text x="371.0" y="258.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2733">x</text><text x="144.0" y="52.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2733">y</text><text x="121.0" y="256.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#1d2733">O</text><line x1="175.0" y1="236.0" x2="175.0" y2="244.0" stroke="#1d2733" stroke-width="1.5"/><text x="175.0" y="258.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#1d2733">1</text><line x1="220.0" y1="236.0" x2="220.0" y2="244.0" stroke="#1d2733" stroke-width="1.5"/><text x="220.0" y="258.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#1d2733">2</text><line x1="265.0" y1="236.0" x2="265.0" y2="244.0" stroke="#1d2733" stroke-width="1.5"/><text x="265.0" y="258.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#1d2733">3</text><line x1="310.0" y1="236.0" x2="310.0" y2="244.0" stroke="#1d2733" stroke-width="1.5"/><text x="310.0" y="258.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#1d2733">4</text><line x1="126.0" y1="285.0" x2="134.0" y2="285.0" stroke="#1d2733" stroke-width="1.5"/><text x="121.0" y="290.0" text-anchor="end" font-size="13" font-weight="normal" fill="#1d2733">−1</text><line x1="126.0" y1="195.0" x2="134.0" y2="195.0" stroke="#1d2733" stroke-width="1.5"/><text x="121.0" y="200.0" text-anchor="end" font-size="13" font-weight="normal" fill="#1d2733">1</text><line x1="126.0" y1="150.0" x2="134.0" y2="150.0" stroke="#1d2733" stroke-width="1.5"/><text x="121.0" y="155.0" text-anchor="end" font-size="13" font-weight="normal" fill="#1d2733">2</text><line x1="126.0" y1="105.0" x2="134.0" y2="105.0" stroke="#1d2733" stroke-width="1.5"/><text x="121.0" y="110.0" text-anchor="end" font-size="13" font-weight="normal" fill="#1d2733">3</text><line x1="85.0" y1="60.0" x2="310.0" y2="285.0" stroke="#4e79a7" stroke-width="2.6"/><line x1="85.0" y1="330.0" x2="355.0" y2="60.0" stroke="#f28e2b" stroke-width="2.6"/><text x="318.0" y="289.0" text-anchor="start" font-size="15" font-weight="bold" fill="#4e79a7">x + y = 3</text><text x="363.0" y="64.0" text-anchor="start" font-size="15" font-weight="bold" fill="#f28e2b">x − y = 1</text><line x1="220.0" y1="195.0" x2="220.0" y2="240.0" stroke="#9aa5b1" stroke-width="1.2" stroke-dasharray="5 4"/><line x1="220.0" y1="195.0" x2="130.0" y2="195.0" stroke="#9aa5b1" stroke-width="1.2" stroke-dasharray="5 4"/><circle cx="220.0" cy="195.0" r="5.0" fill="#e15759" stroke="#e15759" stroke-width="1"/><text x="220.0" y="181.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#e15759" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">M(2; 1)</text><rect x="430.0" y="80.0" width="270.0" height="256.0" rx="8" fill="#eef1f4" stroke="#9aa5b1" stroke-width="1.2"/><text x="444.0" y="110.0" text-anchor="start" font-size="16" font-weight="normal" fill="#1d2733">Hệ phương trình:</text><text x="444.0" y="136.0" text-anchor="start" font-size="16" font-weight="normal" fill="#1d2733">x + y = 3  và  x − y = 1</text><text x="444.0" y="162.0" text-anchor="start" font-size="16" font-weight="normal" fill="#1d2733"></text><text x="444.0" y="188.0" text-anchor="start" font-size="16" font-weight="normal" fill="#1d2733">Hai đường thẳng cắt nhau</text><text x="444.0" y="214.0" text-anchor="start" font-size="16" font-weight="normal" fill="#1d2733">tại M(2; 1) nên hệ có</text><text x="444.0" y="240.0" text-anchor="start" font-size="16" font-weight="normal" fill="#1d2733">nghiệm duy nhất (2; 1).</text><text x="444.0" y="266.0" text-anchor="start" font-size="16" font-weight="normal" fill="#1d2733"></text><text x="444.0" y="292.0" text-anchor="start" font-size="16" font-weight="normal" fill="#1d2733">Thử lại: 2 + 1 = 3 ✓</text><text x="444.0" y="318.0" text-anchor="start" font-size="16" font-weight="normal" fill="#1d2733">              2 − 1 = 1 ✓</text></svg>