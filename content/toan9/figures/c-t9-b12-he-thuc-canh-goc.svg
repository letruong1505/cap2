<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="360.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Hệ thức giữa cạnh và góc trong tam giác vuông</text><polygon points="110.0,280.0 430.0,280.0 110.0,40.0" fill="#dbe7f3" stroke="#1d2733" stroke-width="2.4" stroke-linejoin="round"/><polyline points="126.0,280.0 126.0,264.0 110.0,264.0" fill="none" stroke="#1d2733" stroke-width="1.5" stroke-linejoin="round"/><path d="M393.2,252.4 A46,46 0 0 0 384.0,280.0" fill="none" stroke="#e15759" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="368.0" y="272.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#e15759" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">B</text><path d="M110.0,74.0 A34,34 0 0 0 137.2,60.4" fill="none" stroke="#e15759" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="120.0" y="90.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#e15759" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">C</text><text x="96.0" y="288.0" text-anchor="end" font-size="17" font-weight="bold" fill="#1d2733">A</text><text x="442.0" y="286.0" text-anchor="start" font-size="17" font-weight="bold" fill="#1d2733">B</text><text x="96.0" y="44.0" text-anchor="end" font-size="17" font-weight="bold" fill="#1d2733">C</text><text x="92.0" y="160.0" text-anchor="end" font-size="19" font-weight="bold" fill="#f28e2b" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">b</text><text x="270.0" y="306.0" text-anchor="middle" font-size="19" font-weight="bold" fill="#4e79a7" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">c</text><text x="290.0" y="148.0" text-anchor="middle" font-size="19" font-weight="bold" fill="#59a14f" stroke="white" stroke-width="4" paint-order="stroke" stroke-linejoin="round">a</text><rect x="500.0" y="50.0" width="210.0" height="190.0" rx="8" fill="#eef1f4" stroke="#9aa5b1" stroke-width="1.2"/><text x="514.0" y="80.0" text-anchor="start" font-size="14" font-weight="normal" fill="#1d2733">a: cạnh huyền BC</text><text x="514.0" y="104.0" text-anchor="start" font-size="14" font-weight="normal" fill="#1d2733">b = AC,  c = AB</text><text x="514.0" y="128.0" text-anchor="start" font-size="14" font-weight="normal" fill="#1d2733"></text><text x="514.0" y="152.0" text-anchor="start" font-size="14" font-weight="normal" fill="#1d2733">b = a·sin B = a·cos C</text><text x="514.0" y="176.0" text-anchor="start" font-size="14" font-weight="normal" fill="#1d2733">c = a·sin C = a·cos B</text><text x="514.0" y="200.0" text-anchor="start" font-size="14" font-weight="normal" fill="#1d2733">b = c·tan B = c·cot C</text><text x="514.0" y="224.0" text-anchor="start" font-size="14" font-weight="normal" fill="#1d2733">c = b·tan C = b·cot B</text></svg>