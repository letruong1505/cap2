<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 279" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="360.0" y="26.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Ấn Độ dưới thời các vương triều (thế kỉ IV – giữa thế kỉ XIX)</text><line x1="40.0" y1="159.0" x2="680.0" y2="159.0" stroke="#1d2733" stroke-width="3" marker-end="url(#ar)"/><circle cx="127.5" cy="159.0" r="7.0" fill="#4e79a7" stroke="#4e79a7" stroke-width="2"/><line x1="127.5" y1="159.0" x2="127.5" y2="123.0" stroke="#9aa5b1" stroke-width="1.2"/><text x="127.5" y="115.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#4e79a7">Đầu thế kỉ IV</text><text x="127.5" y="65.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">Vương triều Gúp-ta, thời</text><text x="127.5" y="80.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">hoàng kim; thống nhất</text><text x="127.5" y="95.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">lưu vực sông Hằng</text><circle cx="282.5" cy="159.0" r="7.0" fill="#f28e2b" stroke="#f28e2b" stroke-width="2"/><line x1="282.5" y1="159.0" x2="282.5" y2="195.0" stroke="#9aa5b1" stroke-width="1.2"/><text x="282.5" y="215.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#f28e2b">1206</text><text x="282.5" y="233.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">Vương triều Hồi giáo</text><text x="282.5" y="248.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">Đê-li được thành lập</text><circle cx="437.5" cy="159.0" r="7.0" fill="#59a14f" stroke="#59a14f" stroke-width="2"/><line x1="437.5" y1="159.0" x2="437.5" y2="123.0" stroke="#9aa5b1" stroke-width="1.2"/><text x="437.5" y="115.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#59a14f">Đầu thế kỉ XVI</text><text x="437.5" y="65.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">Vương triều Mô-gôn lật</text><text x="437.5" y="80.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">đổ Đê-li; thịnh vượng</text><text x="437.5" y="95.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">dưới thời vua A-cơ-ba</text><circle cx="592.5" cy="159.0" r="7.0" fill="#e15759" stroke="#e15759" stroke-width="2"/><line x1="592.5" y1="159.0" x2="592.5" y2="195.0" stroke="#9aa5b1" stroke-width="1.2"/><text x="592.5" y="215.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#e15759">Giữa thế kỉ XIX</text><text x="592.5" y="233.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">Mô-gôn suy yếu, Ấn Độ bị</text><text x="592.5" y="248.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">thực dân Anh xâm lược</text></svg>