<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="360.0" y="24.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d2733">Sự hình thành hai giai cấp cơ bản ở Tây Âu thời phong kiến</text><rect x="40.0" y="60.0" width="180.0" height="56.0" rx="8" fill="#fdf0e0" stroke="#f28e2b" stroke-width="1.5" opacity="1"/><text x="130.0" y="93.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#1d2733">Quý tộc thị tộc Giéc-man</text><rect x="40.0" y="130.0" width="180.0" height="56.0" rx="8" fill="#fdf0e0" stroke="#f28e2b" stroke-width="1.5" opacity="1"/><text x="130.0" y="163.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#1d2733">Quý tộc La Mã quy thuận</text><rect x="280.0" y="85.0" width="160.0" height="76.0" rx="8" fill="#f9d9d9" stroke="#e15759" stroke-width="1.5" opacity="1"/><text x="360.0" y="128.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Lãnh chúa phong kiến</text><line x1="220.0" y1="88.0" x2="280.0" y2="110.0" stroke="#1d2733" stroke-width="2" marker-end="url(#ar)"/><line x1="220.0" y1="158.0" x2="280.0" y2="136.0" stroke="#1d2733" stroke-width="2" marker-end="url(#ar)"/><rect x="40.0" y="250.0" width="180.0" height="56.0" rx="8" fill="#e5f3e1" stroke="#59a14f" stroke-width="1.5" opacity="1"/><text x="130.0" y="275.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#1d2733">Nông dân tự do bị mất</text><text x="130.0" y="291.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#1d2733">ruộng đất</text><rect x="40.0" y="320.0" width="180.0" height="56.0" rx="8" fill="#e5f3e1" stroke="#59a14f" stroke-width="1.5" opacity="1"/><text x="130.0" y="353.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#1d2733">Nô lệ được giải phóng</text><rect x="280.0" y="275.0" width="160.0" height="76.0" rx="8" fill="#d8ecd3" stroke="#59a14f" stroke-width="1.5" opacity="1"/><text x="360.0" y="318.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Nông nô</text><line x1="220.0" y1="278.0" x2="280.0" y2="300.0" stroke="#1d2733" stroke-width="2" marker-end="url(#ar)"/><line x1="220.0" y1="348.0" x2="280.0" y2="326.0" stroke="#1d2733" stroke-width="2" marker-end="url(#ar)"/><line x1="360.0" y1="161.0" x2="360.0" y2="275.0" stroke="#e15759" stroke-width="2.5" marker-end="url(#ar)"/><line x1="360.0" y1="275.0" x2="360.0" y2="161.0" stroke="#59a14f" stroke-width="2.5" marker-end="url(#ar)"/><text x="520.0" y="205.0" text-anchor="start" font-size="13" font-weight="normal" fill="#1d2733">Lãnh chúa bóc lột nông nô</text><text x="520.0" y="221.0" text-anchor="start" font-size="13" font-weight="normal" fill="#1d2733">bằng tô, thuế và chi phối</text><text x="520.0" y="237.0" text-anchor="start" font-size="13" font-weight="normal" fill="#1d2733">đời sống của họ</text><text x="520.0" y="250.0" text-anchor="start" font-size="13" font-weight="normal" fill="#1d2733">Nông nô nhận ruộng đất,</text><text x="520.0" y="266.0" text-anchor="start" font-size="13" font-weight="normal" fill="#1d2733">nộp tô, thuế cho lãnh chúa</text></svg>