<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="360.0" y="24.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d2733">Một số nội dung cải cách của Hồ Quý Ly</text><rect x="30.0" y="50.0" width="210.0" height="36.0" rx="6" fill="#4e79a7" stroke="none" stroke-width="2" opacity="1"/><text x="135.0" y="74.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Chính trị, quân sự</text><rect x="30.0" y="98.0" width="210.0" height="48.0" rx="8" fill="#f5f8fb" stroke="#4e79a7" stroke-width="1.5" opacity="1"/><text x="135.0" y="127.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#1d2733">Củng cố quân chủ tập quyền</text><rect x="30.0" y="156.0" width="210.0" height="48.0" rx="8" fill="#f5f8fb" stroke="#4e79a7" stroke-width="1.5" opacity="1"/><text x="135.0" y="185.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#1d2733">Xây thành luỹ (Tây Đô)</text><rect x="30.0" y="214.0" width="210.0" height="48.0" rx="8" fill="#f5f8fb" stroke="#4e79a7" stroke-width="1.5" opacity="1"/><text x="135.0" y="243.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#1d2733">Chế tạo súng thần cơ</text><rect x="255.0" y="50.0" width="210.0" height="36.0" rx="6" fill="#f28e2b" stroke="none" stroke-width="2" opacity="1"/><text x="360.0" y="74.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Kinh tế, xã hội</text><rect x="255.0" y="98.0" width="210.0" height="48.0" rx="8" fill="#f5f8fb" stroke="#f28e2b" stroke-width="1.5" opacity="1"/><text x="360.0" y="127.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#1d2733">Hạn điền, hạn nô</text><rect x="255.0" y="156.0" width="210.0" height="48.0" rx="8" fill="#f5f8fb" stroke="#f28e2b" stroke-w