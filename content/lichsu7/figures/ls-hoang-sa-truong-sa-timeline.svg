<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 354" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="360.0" y="26.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Việt Nam xác lập và thực thi chủ quyền ở Hoàng Sa, Trường Sa</text><line x1="40.0" y1="189.0" x2="680.0" y2="189.0" stroke="#1d2733" stroke-width="3" marker-end="url(#ar)"/><circle cx="112.0" cy="189.0" r="7.0" fill="#4e79a7" stroke="#4e79a7" stroke-width="2"/><line x1="112.0" y1="189.0" x2="112.0" y2="153.0" stroke="#9aa5b1" stroke-width="1.2"/><text x="112.0" y="145.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#4e79a7">Thế kỉ XVII</text><text x="112.0" y="80.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">Chúa Nguyễn lập đội</text><text x="112.0" y="95.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">Hoàng Sa (kiêm quản</text><text x="112.0" y="110.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">đội Bắc Hải) ra</text><text x="112.0" y="125.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">khai thác, đo đạc</text><circle cx="236.0" cy="189.0" r="7.0" fill="#f28e2b" stroke="#f28e2b" stroke-width="2"/><line x1="236.0" y1="189.0" x2="236.0" y2="225.0" stroke="#9aa5b1" stroke-width="1.2"/><text x="236.0" y="245.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#f28e2b">1776</text><text x="236.0" y="263.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">Lê Quý Đôn ghi chép</text><text x="236.0" y="278.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">về Hoàng Sa trong</text><text x="236.0" y="293.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">"Phủ biên tạp lục"</text><circle cx="360.0" cy="189.0" r="7.0" fill="#59a14f" stroke="#59a14f" stroke-width="2"/><line x1="360.0" y1="189.0" x2="360.0" y2="153.0" stroke="#9aa5b1" stroke-width="1.2"/><text x="360.0" y="145.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#59a14f">1816</text><text x="360.0" y="65.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">Vua Gia Long sai</text><text x="360.0" y="80.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">thuỷ quân cùng đội</text><text x="360.0" y="95.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">Hoàng Sa ra Hoàng</text><text x="360.0" y="110.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">Sa, cắm cờ, đo đạc</text><text x="360.0" y="125.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">thuỷ trình</text><circle cx="484.0" cy="189.0" r="7.0" fill="#e15759" stroke="#e15759" stroke-width="2"/><line x1="484.0" y1="189.0" x2="484.0" y2="225.0" stroke="#9aa5b1" stroke-width="1.2"/><text x="484.0" y="245.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#e15759">1833 – 1836</text><text x="484.0" y="263.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">Vua Minh Mạng sai</text><text x="484.0" y="278.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">dựng miếu, lập bia,</text><text x="484.0" y="293.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">trồng cây, vẽ bản</text><text x="484.0" y="308.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">đồ, cắm mốc chủ</text><text x="484.0" y="323.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">quyền</text><circle cx="608.0" cy="189.0" r="7.0" fill="#76b7b2" stroke="#76b7b2" stroke-width="2"/><line x1="608.0" y1="189.0" x2="608.0" y2="153.0" stroke="#9aa5b1" stroke-width="1.2"/><text x="608.0" y="145.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#76b7b2">2012</text><text x="608.0" y="80.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">Quốc hội thông qua</text><text x="608.0" y="95.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">Luật Biển Việt Nam,</text><text x="608.0" y="110.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">khẳng định chủ</text><text x="608.0" y="125.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">quyền</text></svg>