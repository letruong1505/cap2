<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 309" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="360.0" y="26.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Đất nước buổi đầu độc lập (939 – 1009)</text><line x1="40.0" y1="174.0" x2="680.0" y2="174.0" stroke="#1d2733" stroke-width="3" marker-end="url(#ar)"/><circle cx="112.0" cy="174.0" r="7.0" fill="#4e79a7" stroke="#4e79a7" stroke-width="2"/><line x1="112.0" y1="174.0" x2="112.0" y2="138.0" stroke="#9aa5b1" stroke-width="1.2"/><text x="112.0" y="130.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#4e79a7">939</text><text x="112.0" y="80.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">Ngô Quyền xưng</text><text x="112.0" y="95.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">vương, đóng đô ở Cổ</text><text x="112.0" y="110.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">Loa</text><circle cx="236.0" cy="174.0" r="7.0" fill="#f28e2b" stroke="#f28e2b" stroke-width="2"/><line x1="236.0" y1="174.0" x2="236.0" y2="210.0" stroke="#9aa5b1" stroke-width="1.2"/><text x="236.0" y="230.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#f28e2b">944</text><text x="236.0" y="248.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">Ngô Quyền mất; đất</text><text x="236.0" y="263.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">nước loạn 12 sứ</text><text x="236.0" y="278.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">quân</text><circle cx="360.0" cy="174.0" r="7.0" fill="#59a14f" stroke="#59a14f" stroke-width="2"/><line x1="360.0" y1="174.0" x2="360.0" y2="138.0" stroke="#9aa5b1" stroke-width="1.2"/><text x="360.0" y="130.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#59a14f">968</text><text x="360.0" y="65.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">Đinh Bộ Lĩnh dẹp</text><text x="360.0" y="80.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">loạn, lên ngôi, đặt</text><text x="360.0" y="95.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">tên nước Đại Cồ</text><text x="360.0" y="110.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">Việt</text><circle cx="484.0" cy="174.0" r="7.0" fill="#e15759" stroke="#e15759" stroke-width="2"/><line x1="484.0" y1="174.0" x2="484.0" y2="210.0" stroke="#9aa5b1" stroke-width="1.2"/><text x="484.0" y="230.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#e15759">981</text><text x="484.0" y="248.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">Lê Hoàn đại phá</text><text x="484.0" y="263.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">quân Tống</text><circle cx="608.0" cy="174.0" r="7.0" fill="#76b7b2" stroke="#76b7b2" stroke-width="2"/><line x1="608.0" y1="174.0" x2="608.0" y2="138.0" stroke="#9aa5b1" stroke-width="1.2"/><text x="608.0" y="130.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#76b7b2">1009</text><text x="608.0" y="80.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">Nhà Tiền Lê kết</text><text x="608.0" y="95.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">thúc, Lý Công Uẩn</text><text x="608.0" y="110.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">lên ngôi</text></svg>