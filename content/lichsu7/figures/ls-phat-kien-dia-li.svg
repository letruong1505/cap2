<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 294" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="360.0" y="26.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Các cuộc phát kiến địa lí lớn cuối thế kỉ XV – đầu thế kỉ XVI</text><line x1="40.0" y1="159.0" x2="680.0" y2="159.0" stroke="#1d2733" stroke-width="3" marker-end="url(#ar)"/><circle cx="127.5" cy="159.0" r="7.0" fill="#4e79a7" stroke="#4e79a7" stroke-width="2"/><line x1="127.5" y1="159.0" x2="127.5" y2="123.0" stroke="#9aa5b1" stroke-width="1.2"/><text x="127.5" y="115.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#4e79a7">1487</text><text x="127.5" y="80.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">B. Đi-a-xơ đến mũi Hảo</text><text x="127.5" y="95.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">Vọng (cực Nam châu Phi)</text><circle cx="282.5" cy="159.0" r="7.0" fill="#f28e2b" stroke="#f28e2b" stroke-width="2"/><line x1="282.5" y1="159.0" x2="282.5" y2="195.0" stroke="#9aa5b1" stroke-width="1.2"/><text x="282.5" y="215.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#f28e2b">1492</text><text x="282.5" y="233.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">C. Cô-lôm-bô vượt Đại</text><text x="282.5" y="248.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">Tây Dương, tìm ra châu</text><text x="282.5" y="263.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">Mỹ</text><circle cx="437.5" cy="159.0" r="7.0" fill="#59a14f" stroke="#59a14f" stroke-width="2"/><line x1="437.5" y1="159.0" x2="437.5" y2="123.0" stroke="#9aa5b1" stroke-width="1.2"/><text x="437.5" y="115.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#59a14f">1497</text><text x="437.5" y="65.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">V. Ga-ma vòng qua cực</text><text x="437.5" y="80.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">Nam châu Phi, cập bến</text><text x="437.5" y="95.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">Ca-li-cút (Ấn Độ)</text><circle cx="592.5" cy="159.0" r="7.0" fill="#e15759" stroke="#e15759" stroke-width="2"/><line x1="592.5" y1="159.0" x2="592.5" y2="195.0" stroke="#9aa5b1" stroke-width="1.2"/><text x="592.5" y="215.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#e15759">1519 – 1522</text><text x="592.5" y="233.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">Ph. Ma-gien-lăng (đoàn</text><text x="592.5" y="248.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">thám hiểm) đi vòng quanh</text><text x="592.5" y="263.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">thế giới bằng đường biển</text></svg>