<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 324" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="360.0" y="26.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Các mốc chính của khởi nghĩa Lam Sơn</text><line x1="40.0" y1="174.0" x2="680.0" y2="174.0" stroke="#1d2733" stroke-width="3" marker-end="url(#ar)"/><circle cx="101.7" cy="174.0" r="7.0" fill="#4e79a7" stroke="#4e79a7" stroke-width="2"/><line x1="101.7" y1="174.0" x2="101.7" y2="138.0" stroke="#9aa5b1" stroke-width="1.2"/><text x="101.7" y="130.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#4e79a7">1416</text><text x="101.7" y="65.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">Hội thề Lũng</text><text x="101.7" y="80.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">Nhai (Lê Lợi</text><text x="101.7" y="95.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">cùng 18 hào</text><text x="101.7" y="110.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">kiệt)</text><circle cx="205.0" cy="174.0" r="7.0" fill="#f28e2b" stroke="#f28e2b" stroke-width="2"/><line x1="205.0" y1="174.0" x2="205.0" y2="210.0" stroke="#9aa5b1" stroke-width="1.2"/><text x="205.0" y="230.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#f28e2b">1418</text><text x="205.0" y="248.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">Lê Lợi dựng cờ</text><text x="205.0" y="263.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">khởi nghĩa, xưng</text><text x="205.0" y="278.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">Bình Định Vương</text><circle cx="308.3" cy="174.0" r="7.0" fill="#59a14f" stroke="#59a14f" stroke-width="2"/><line x1="308.3" y1="174.0" x2="308.3" y2="138.0" stroke="#9aa5b1" stroke-width="1.2"/><text x="308.3" y="130.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#59a14f">1424</text><text x="308.3" y="80.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">Giải phóng Nghệ</text><text x="308.3" y="95.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">An, mở rộng đến</text><text x="308.3" y="110.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">đèo Hải Vân</text><circle cx="411.7" cy="174.0" r="7.0" fill="#e15759" stroke="#e15759" stroke-width="2"/><line x1="411.7" y1="174.0" x2="411.7" y2="210.0" stroke="#9aa5b1" stroke-width="1.2"/><text x="411.7" y="230.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#e15759">Cuối 1426</text><text x="411.7" y="248.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">Thắng Tốt Động –</text><text x="411.7" y="263.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">Chúc Động</text><circle cx="515.0" cy="174.0" r="7.0" fill="#76b7b2" stroke="#76b7b2" stroke-width="2"/><line x1="515.0" y1="174.0" x2="515.0" y2="138.0" stroke="#9aa5b1" stroke-width="1.2"/><text x="515.0" y="130.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#76b7b2">Cuối 1427</text><text x="515.0" y="65.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">Thắng Chi Lăng –</text><text x="515.0" y="80.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">Xương Giang;</text><text x="515.0" y="95.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">Liễu Thăng bị</text><text x="515.0" y="110.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">giết</text><circle cx="618.3" cy="174.0" r="7.0" fill="#b07aa1" stroke="#b07aa1" stroke-width="2"/><line x1="618.3" y1="174.0" x2="618.3" y2="210.0" stroke="#9aa5b1" stroke-width="1.2"/><text x