<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 212" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="360.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Thành tựu Văn hoá Phục hưng</text><rect x="14.0" y="44.0" width="221.3" height="124.5" rx="8" fill="#e8f1fa" stroke="#4e79a7" stroke-width="2"/><path d="M14.0,44.0 h0.0 v0.0 h-0.0 z" fill="#4e79a7" opacity="0"/><rect x="14.0" y="44.0" width="221.3" height="36.0" rx="8" fill="#4e79a7" stroke="#4e79a7" stroke-width="2"/><text x="124.7" y="67.0" text-anchor="middle" font-size="14" font-weight="bold" fill="white">Văn học</text><text x="26.0" y="102.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">• Xéc-van-tét (Đôn Ki-hô-tê)</text><text x="26.0" y="123.5" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">• Sếch-xpia (Rô-mê-ô và Giu-li-</text><text x="26.0" y="141.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">  ét, Hăm-lét)</text><rect x="249.3" y="44.0" width="221.3" height="124.5" rx="8" fill="#fdf1e0" stroke="#f28e2b" stroke-width="2"/><path d="M249.3,44.0 h0.0 v0.0 h-0.0 z" fill="#f28e2b" opacity="0"/><rect x="249.3" y="44.0" width="221.3" height="36.0" rx="8" fill="#f28e2b" stroke="#f28e2b" stroke-width="2"/><text x="360.0" y="67.0" text-anchor="middle" font-size="14" font-weight="bold" fill="white">Hội hoạ, điêu khắc</text><text x="261.3" y="102.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">• Lê-ô-na đơ Vanh-xi (Bữa tiệc</text><text x="261.3" y="119.5" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">  cuối cùng, Nàng Mô-na Li-da)</text><text x="261.3" y="141.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">• Mi-ken-lăng-giơ (Tượng Đa-vít)</text><rect x="484.7" y="44.0" width="221.3" height="124.5" rx="8" fill="#e6f0df" stroke="#59a14f" stroke-width="2"/><path d="M484.7,44.0 h0.0 v0.0 h-0.0 z" fill="#59a14f" opacity="0"/><rect x="484.7" y="44.0" width="221.3" height="36.0" rx="8" fill="#59a14f" stroke="#59a14f" stroke-width="2"/><text x="595.3" y="67.0" text-anchor="middle" font-size="14" font-weight="bold" fill="white">Khoa học</text><text x="496.7" y="102.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">• Cô-péc-ních</text><text x="496.7" y="123.5" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">• Bru-nô</text><text x="496.7" y="145.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">• Ga-li-lê</text><text x="360.0" y="192.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a56a0">Đề cao con người, tự do cá nhân và tinh thần khoa học.</text></svg>