<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="360.0" y="24.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d2733">Các vương quốc phong kiến Đông Nam Á tiêu biểu</text><rect x="40.0" y="44.0" width="640.0" height="30.0" rx="4" fill="#4e79a7" stroke="none" stroke-width="2" opacity="1"/><text x="240.0" y="65.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Vương quốc</text><text x="540.0" y="65.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Khu vực / thời gian</text><rect x="40.0" y="78.0" width="640.0" height="38.0" rx="0" fill="#ffffff" stroke="#d6e0ea" stroke-width="1" opacity="1"/><text x="50.0" y="102.0" text-anchor="start" font-size="13" font-weight="normal" fill="#1d2733">Vương quốc Pa-gan → Mi-an-ma</text><text x="670.0" y="102.0" text-anchor="end" font-size="13" font-weight="normal" fill="#1d2733">lưu vực sông I-ra-oa-đi</text><rect x="40.0" y="118.0" width="640.0" height="38.0" rx="0" fill="#f5f8fb" stroke="#d6e0ea" stroke-width="1" opacity="1"/><text x="50.0" y="142.0" text-anchor="start" font-size="13" font-weight="normal" fill="#1d2733">Vương quốc Ha-ri-pun-giay-a</text><text x="670.0" y="142.0" text-anchor="end" font-size="13" font-weight="normal" fill="#1d2733">lưu vực sông Chao Phray-a</text><rect x="40.0" y="158.0" width="640.0" height="38.0" rx="0" fill="#ffffff" stroke="#d6e0ea" stroke-width="1" opacity="1"/><text x="50.0" y="182.0" text-anchor="start" font-size="13" font-weight="normal" fill="#1d2733">Đại Việt, Chăm-pa, Cam-pu-chia</text><text x="670.0" y="182.0" text-anchor="end" font-size="13" font-weight="normal" fill="#1d2733">bán đảo Đông Dương</text><rect x="40.0" y="198.0" width="640.0" height="38.0" rx="0" fill="#f5f8fb" stroke="#d6e0ea" stroke-width="1" opacity="1"/><text x="50.0" y="222.0" text-anchor="start" font-size="13" font-weight="normal" fill="#1d2733">Vương quốc Sri Vi-giay-a</text><text x="670.0" y="222.0" text-anchor="end" font-size="13" font-weight="normal" fill="#1d2733">đảo Xu-ma-tra</text><rect x="40.0" y="238.0" width="640.0" height="38.0" rx="0" fill="#ffffff" stroke="#d6e0ea" stroke-width="1" opacity="1"/><text x="50.0" y="262.0" text-anchor="start" font-size="13" font-weight="normal" fill="#1d2733">Vương triều Mô-giô-pa-hít</text><text x="670.0" y="262.0" text-anchor="end" font-size="13" font-weight="normal" fill="#1d2733">đảo Gia-va (thế kỉ XIII)</text><rect x="40.0" y="278.0" width="640.0" height="38.0" rx="0" fill="#f5f8fb" stroke="#d6e0ea" stroke-width="1" opacity="1"/><text x="50.0" y="302.0" text-anchor="start" font-size="13" font-weight="normal" fill="#1d2733">A-út-thay-a (người Thái), Lan Xang (người Lào), Ma-lắc-ca</text><text x="670.0" y="302.0" text-anchor="end" font-size="13" font-weight="normal" fill="#1d2733">thế kỉ XIII – XV</text></svg>