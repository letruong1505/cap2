<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="360.0" y="24.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d2733">Sơ đồ cuộc kháng chiến chống Tống (1077) – minh họa</text><rect x="40.0" y="50.0" width="640.0" height="80.0" rx="0" fill="#f3e0e0" stroke="none" stroke-width="2" opacity="1"/><text x="120.0" y="80.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#a63a3d">Đất Tống</text><rect x="40.0" y="260.0" width="640.0" height="100.0" rx="0" fill="#e6f1df" stroke="none" stroke-width="2" opacity="1"/><text x="120.0" y="330.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#3b7a31">Đại Việt</text><polyline points="40.0,205.0 200.0,195.0 360.0,215.0 520.0,200.0 680.0,210.0" fill="none" stroke="#4e79a7" stroke-width="8" stroke-linejoin="round"/><text x="80.0" y="188.0" text-anchor="start" font-size="13" font-weight="bold" fill="#4e79a7">Sông Như Nguyệt</text><line x1="320.0" y1="130.0" x2="320.0" y2="190.0" stroke="#a63a3d" stroke-width="3" marker-end="url(#ar)"/><text x="270.0" y="160.0" text-anchor="end" font-size="13" font-weight="normal" fill="#a63a3d">Quân bộ nhà Tống</text><line x1="560.0" y1="140.0" x2="600.0" y2="190.0" stroke="#a63a3d" stroke-width="3" stroke-dasharray="6 4" marker-end="url(#ar)"/><text x="670.0" y="130.0" text-anchor="end" font-size="12" font-weight="normal" fill="#a63a3d">Thuỷ binh Tống bị chặn ở ven biển</text><rect x="250.0" y="225.0" width="150.0" height="12.0" rx="0" fill="#59a14f" stroke="none" stroke-width="2" opacity="1"/><text x="325.0" y="252.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#3b7a31">Phòng tuyến của Lý Thường Kiệt</text><line x1="450.0" y1="300.0" x2="450.0" y2="225.0" stroke="#59a14f" stroke-width="3" marker-end="url(#ar)"/><text x="460.0" y="300.0" text-anchor="start" font-size="12" font-weight="normal" fill="#3b7a31">Phản công đêm</text><text x="360.0" y="385.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">Năm 1075: Lý Thường Kiệt chủ động đánh Ung Châu ("tiến công trước để tự vệ"); năm 1077:</text><text x="360.0" y="401.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">chặn giặc ở sông Như Nguyệt.</text></svg>