<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="360.0" y="24.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d2733">Sơ đồ một lãnh địa phong kiến ở Tây Âu (minh họa)</text><rect x="40.0" y="50.0" width="640.0" height="320.0" rx="14" fill="#eef5e6" stroke="#59a14f" stroke-width="2" opacity="1"/><rect x="70.0" y="80.0" width="230.0" height="150.0" rx="8" fill="#f7e9d4" stroke="#b07a3a" stroke-width="2" opacity="1"/><polygon points="110.0,150.0 110.0,110.0 130.0,110.0 130.0,120.0 150.0,120.0 150.0,110.0 170.0,110.0 170.0,150.0" fill="#b9a18a" stroke="#1d2733" stroke-width="1" opacity="1"/><text x="140.0" y="175.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2733">Lâu đài</text><rect x="200.0" y="120.0" width="40.0" height="40.0" rx="0" fill="#c9d3dd" stroke="#1d2733" stroke-width="1.5" opacity="1"/><polygon points="200.0,120.0 220.0,98.0 240.0,120.0" fill="#8d7b6a" stroke="#1d2733" stroke-width="1" opacity="1"/><text x="220.0" y="175.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#1d2733">Nhà thờ</text><text x="185.0" y="210.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1d2733">Khu ở của lãnh chúa có hào nước bao quanh</text><rect x="340.0" y="80.0" width="150.0" height="90.0" rx="6" fill="#f6e7b0" stroke="#c9a227" stroke-width="1.5" opacity="1"/><text x="415.0" y="130.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Đất của lãnh chúa</text><rect x="510.0" y="80.0" width="150.0" height="90.0" rx="6" fill="#dcecc4" stroke="#59a14f" stroke-width="1.5" opacity="1"/><text x="585.0" y="120.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Đất khẩu phần</text><text x="585.0" y="136.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">của nông nô</text><rect x="340.0" y="200.0" width="150.0" height="70.0" rx="6" fill="#e6d3c0" stroke="#8d6b4a" stroke-width="1.5" opacity="1"/><text x="415.0" y="230.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">Nhà ở của nông nô,</text><text x="415.0" y="246.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">chuồng trại, nhà kho</text><rect x="510.0" y="200.0" width="150.0" height="70.0" rx="6" fill="#cfe6f5" stroke="#4e79a7" stroke-width="1.5" opacity="1"/><text x="585.0" y="232.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#1d2733">Đồng cỏ, rừng, ao</text><text x="585.0" y="248.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#1d2733">hồ</text><text x="360.0" y="320.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#1d2733">Mỗi lãnh địa có quân đội, luật pháp, toà án, thuế khoá, tiền tệ riêng;</text><text x="360.0" y="336.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#1d2733">kinh tế tự cấp tự túc.</text></svg>