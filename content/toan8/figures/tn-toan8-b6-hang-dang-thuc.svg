<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 548" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="360.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Hằng đẳng thức bằng hình diện tích</text><text x="190.0" y="58.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2733">Bình phương của một tổng</text><text x="190.0" y="80.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a56a0">(A + B)² = A² + 2AB + B²</text><rect x="100.0" y="116.0" width="112.0" height="112.0" fill="#dbe7f3" fill-opacity="1.0" stroke="#1d2733" stroke-width="1.5"/><text x="156.0" y="178.0" text-anchor="middle" font-size="18" font-weight="bold" fill="#1d2733">A²</text><rect x="212.0" y="116.0" width="52.0" height="112.0" fill="#fde3bd" fill-opacity="1.0" stroke="#1d2733" stroke-width="1.5"/><text x="238.0" y="177.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2733">AB</text><rect x="100.0" y="228.0" width="112.0" height="52.0" fill="#fde3bd" fill-opacity="1.0" stroke="#1d2733" stroke-width="1.5"/><text x="156.0" y="259.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2733">AB</text><rect x="212.0" y="228.0" width="52.0" height="52.0" fill="#dfe9d5" fill-opacity="1.0" stroke="#1d2733" stroke-width="1.5"/><text x="238.0" y="259.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2733">B²</text><text x="156.0" y="109.0" text-anchor="middle" font-size="14" font-weight="normal" fill="#1d2733">A</text><text x="238.0" y="109.0" text-anchor="middle" font-size="14" font-weight="normal" fill="#1d2733">B</text><text x="91.0" y="177.0" text-anchor="end" font-size="14" font-weight="normal" fill="#1d2733">A</text><text x="91.0" y="259.0" text-anchor="end" font-size="14" font-weight="normal" fill="#1d2733">B</text><text x="540.0" y="58.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2733">Bình phương của một hiệu</text><text x="540.0" y="80.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a56a0">(A − B)² = A² − 2AB + B²</text><rect x="462.0" y="116.0" width="164.0" height="164.0" fill="#ffffff" fill-opacity="1.0" stroke="#1d2733" stroke-width="1.5"/><rect x="462.0" y="116.0" width="116.0" height="116.0" fill="#dbe7f3" fill-opacity="1.0" stroke="#1d2733" stroke-width="1.5"/><text x="520.0" y="180.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d2733">(A − B)²</text><rect x="578.0" y="116.0" width="48.0" height="164.0" fill="#f28e2b" fill-opacity="0.45" stroke="#1d2733" stroke-width="1.5"/><rect x="462.0" y="232.0" width="164.0" height="48.0" fill="#f28e2b" fill-opacity="0.45" stroke="#1d2733" stroke-width="1.5"/><text x="602.0" y="179.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2733">AB</text><text x="520.0" y="261.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2733">AB</text><text x="602.0" y="261.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">B²</text><rect x="462.0" y="116.0" width="164.0" height="164.0" fill="none" fill-opacity="1" stroke="#1d2733" stroke-width="2"/><text x="520.0" y="109.0" text-anchor="middle" font-size="14" font-weight="normal" fill="#1d2733">A − B</text><text x="602.0" y="109.0" text-anchor="middle" font-size="14" font-weight="normal" fill="#1d2733">B</text><text x="453.0" y="179.0" text-anchor="end" font-size="14" font-weight="normal" fill="#1d2733">A − B</text><text x="453.0" y="261.0" text-anchor="end" font-size="14" font-weight="normal" fill="#1d2733">B</text><text x="540.0" y="306.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#5b6773">Bỏ hai dải AB khỏi A²:</text><text x="540.0" y="323.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#5b6773">góc B² bị bỏ hai lần nên cộng lại một lần</text><text x="360.0" y="344.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a56a0">Hiệu hai bình phương:  A² − B² = (A − B)(A + B)</text><rect x="60.0" y="396.0" width="112.0" height="68.0" fill="#dbe7f3" fill-opacity="1.0" stroke="#1d2733" stroke-width="1.5"/><rect x="60.0" y="464.0" width="68.0" height="44.0" fill="#fde3bd" fill-opacity="1.0" stroke="#1d2733" stroke-width="1.5"/><rect x="128.0" y="464.0" width="44" height="44" fill="none" stroke="#9aa5b1" stroke-width="1.5" stroke-dasharray="5 3"/><text x="150.0" y="491.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#9aa5b1">B²</text><text x="116.0" y="389.0" text-anchor="middle" font-size="14" font-weight="normal" fill="#1d2733">A</text><text x="51.0" y="435.0" text-anchor="end" font-size="14" font-weight="normal" fill="#1d2733">A − B</text><text x="51.0" y="491.0" text-anchor="end" font-size="14" font-weight="normal" fill="#1d2733">B</text><text x="160.0" y="532.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#5b6773">Hình chữ L có diện tích A² − B²</text><line x1="240.0" y1="432.0" x2="322.0" y2="432.0" stroke="#1d2733" stroke-width="2" marker-end="url(#ar)"/><text x="281.0" y="422.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">ghép lại</text><rect x="360.0" y="396.0" width="112.0" height="68.0" fill="#dbe7f3" fill-opacity="1.0" stroke="#1d2733" stroke-width="1.5"/><rect x="472.0" y="396.0" width="44.0" height="68.0" fill="#fde3bd" fill-opacity="1.0" stroke="#1d2733" stroke-width="1.5"/><text x="438.0" y="389.0" text-anchor="middle" font-size="14" font-weight="normal" fill="#1d2733">A + B</text><text x="525.0" y="435.0" text-anchor="start" font-size="14" font-weight="normal" fill="#1d2733">A − B</text><text x="438.0" y="488.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#5b6773">Hình chữ nhật (A − B)(A + B)</text></svg>