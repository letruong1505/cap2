<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 345" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="360.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Đơn thức thu gọn và đơn thức đồng dạng</text><rect x="14.0" y="52.0" width="250.0" height="92.0" rx="8" fill="#e8f1fa" stroke="#4e79a7" stroke-width="2"/><text x="139.0" y="80.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2733">Đơn thức thu gọn</text><text x="139.0" y="103.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#1d2733">tích của một số với các biến;</text><text x="139.0" y="124.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#1d2733">mỗi biến chỉ xuất hiện một lần</text><text x="358.0" y="114.0" text-anchor="end" font-size="52" font-weight="bold" fill="#4e79a7">7</text><text x="366.0" y="114.0" text-anchor="start" font-size="52" font-weight="bold" fill="#f28e2b">x²y</text><line x1="322.0" y1="130.0" x2="358.0" y2="130.0" stroke="#4e79a7" stroke-width="2.5"/><text x="340.0" y="152.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#4e79a7">hệ số</text><line x1="366.0" y1="130.0" x2="452.0" y2="130.0" stroke="#f28e2b" stroke-width="2.5"/><text x="409.0" y="152.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#b3601a">phần biến</text><line x1="462.0" y1="96.0" x2="528.0" y2="96.0" stroke="#1d2733" stroke-width="2" marker-end="url(#ar)"/><rect x="532.0" y="62.0" width="172.0" height="66.0" rx="8" fill="#e6f0df" stroke="#59a14f" stroke-width="2"/><text x="618.0" y="88.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#1d2733">Bậc của đơn thức</text><text x="618.0" y="110.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#1d2733">là tổng số mũ: 2 + 1 = 3</text><text x="360.0" y="200.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2733">Hai đơn thức đồng dạng: hệ số khác 0 và cùng phần biến</text><rect x="60.0" y="218.0" width="120.0" height="52.0" rx="8" fill="#eef1f4" stroke="#1d2733" stroke-width="2"/><text x="120.0" y="252.0" text-anchor="middle" font-size="22" font-weight="bold" fill="#1d2733">3x²y</text><rect x="230.0" y="218.0" width="120.0" height="52.0" rx="8" fill="#eef1f4" stroke="#1d2733" stroke-width="2"/><text x="290.0" y="252.0" text-anchor="middle" font-size="22" font-weight="bold" fill="#1d2733">5x²y</text><rect x="400.0" y="218.0" width="120.0" height="52.0" rx="8" fill="#eef1f4" stroke="#1d2733" stroke-width="2"/><text x="460.0" y="252.0" text-anchor="middle" font-size="22" font-weight="bold" fill="#1d2733">x²y</text><text x="205.0" y="252.0" text-anchor="middle" font-size="26" font-weight="bold" fill="#1d2733">+</text><text x="375.0" y="252.0" text-anchor="middle" font-size="26" font-weight="bold" fill="#1d2733">−</text><line x1="60.0" y1="288.0" x2="520.0" y2="288.0" stroke="#f28e2b" stroke-width="2.5"/><line x1="60.0" y1="282.0" x2="60.0" y2="294.0" stroke="#f28e2b" stroke-width="2.5"/><line x1="520.0" y1="282.0" x2="520.0" y2="294.0" stroke="#f28e2b" stroke-width="2.5"/><text x="290.0" y="312.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#b3601a">cùng phần biến x²y</text><text x="542.0" y="252.0" text-anchor="middle" font-size="26" font-weight="bold" fill="#1d2733">=</text><rect x="560.0" y="214.0" width="148.0" height="60.0" rx="8" fill="#fdf1e0" stroke="#f28e2b" stroke-width="2"/><text x="634.0" y="240.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2733">(3 + 5 − 1)x²y</text><text x="634.0" y="264.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2733">= 7x²y</text><text x="634.0" y="296.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#5b6773">cộng (trừ) hệ số,</text><text x="634.0" y="312.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#5b6773">giữ nguyên phần biến</text></svg>