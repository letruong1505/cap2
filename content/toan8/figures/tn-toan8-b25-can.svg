<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 345" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="360.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Giải phương trình bằng cân thăng bằng</text><text x="170.0" y="62.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a56a0">3x − 12 = 0  ⇒  chuyển vế:  3x = 12</text><polygon points="170.0,130.0 144.0,228.0 196.0,228.0" fill="#cdd5dd" stroke="#1d2733" stroke-width="2" stroke-linejoin="round"/><line x1="65.0" y1="130.0" x2="275.0" y2="130.0" stroke="#1d2733" stroke-width="5"/><circle cx="170.0" cy="130.0" r="6.0" fill="#1d2733" stroke="#1d2733" stroke-width="2"/><line x1="65.0" y1="130.0" x2="15.0" y2="194.0" stroke="#1d2733" stroke-width="1.4"/><line x1="65.0" y1="130.0" x2="115.0" y2="194.0" stroke="#1d2733" stroke-width="1.4"/><path d="M13,194 Q65,228 117,194" fill="#e8edf2" stroke="#1d2733" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><rect x="16.0" y="160.0" width="30.0" height="34.0" rx="4" fill="#f7c98b" stroke="#1d2733" stroke-width="1.8"/><text x="31.0" y="183.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">x</text><rect x="50.0" y="160.0" width="30.0" height="34.0" rx="4" fill="#f7c98b" stroke="#1d2733" stroke-width="1.8"/><text x="65.0" y="183.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">x</text><rect x="84.0" y="160.0" width="30.0" height="34.0" rx="4" fill="#f7c98b" stroke="#1d2733" stroke-width="1.8"/><text x="99.0" y="183.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">x</text><line x1="275.0" y1="130.0" x2="225.0" y2="194.0" stroke="#1d2733" stroke-width="1.4"/><line x1="275.0" y1="130.0" x2="325.0" y2="194.0" stroke="#1d2733" stroke-width="1.4"/><path d="M223,194 Q275,228 327,194" fill="#e8edf2" stroke="#1d2733" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><rect x="240.0" y="160.0" width="70.0" height="34.0" rx="4" fill="#cdd5dd" stroke="#1d2733" stroke-width="1.8"/><text x="275.0" y="183.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">12</text><line x1="334.0" y1="150.0" x2="386.0" y2="150.0" stroke="#1d2733" stroke-width="2" marker-end="url(#ar)"/><text x="360.0" y="130.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">chia hai vế</text><text x="360.0" y="176.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">cho 3</text><text x="550.0" y="62.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a56a0">x = 12 : 3 = 4</text><polygon points="550.0,130.0 524.0,228.0 576.0,228.0" fill="#cdd5dd" stroke="#1d2733" stroke-width="2" stroke-linejoin="round"/><line x1="445.0" y1="130.0" x2="655.0" y2="130.0" stroke="#1d2733" stroke-width="5"/><circle cx="550.0" cy="130.0" r="6.0" fill="#1d2733" stroke="#1d2733" stroke-width="2"/><line x1="445.0" y1="130.0" x2="395.0" y2="194.0" stroke="#1d2733" stroke-width="1.4"/><line x1="445.0" y1="130.0" x2="495.0" y2="194.0" stroke="#1d2733" stroke-width="1.4"/><path d="M393,194 Q445,228 497,194" fill="#e8edf2" stroke="#1d2733" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><rect x="430.0" y="160.0" width="30.0" height="34.0" rx="4" fill="#f7c98b" stroke="#1d2733" stroke-width="1.8"/><text x="445.0" y="183.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">x</text><line x1="655.0" y1="130.0" x2="605.0" y2="194.0" stroke="#1d2733" stroke-width="1.4"/><line x1="655.0" y1="130.0" x2="705.0" y2="194.0" stroke="#1d2733" stroke-width="1.4"/><path d="M603,194 Q655,228 707,194" fill="#e8edf2" stroke="#1d2733" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><rect x="640.0" y="160.0" width="30.0" height="34.0" rx="4" fill="#cdd5dd" stroke="#1d2733" stroke-width="1.8"/><text x="655.0" y="183.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">4</text><text x="360.0" y="276.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#5b6773">Chia (hoặc nhân) cả hai vế với cùng một số khác 0: cân vẫn thăng bằng.</text><text x="360.0" y="302.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2733">Tổng quát: ax + b = 0 (a ≠ 0) ⇔ ax = −b ⇔ x = −b/a</text><text x="360.0" y="328.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#5b6773">Hình minh hoạ cho ví dụ 3x − 12 = 0; x là ẩn, số 12 là tổng khối lượng ở đĩa phải.</text></svg>