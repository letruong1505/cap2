<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 392" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="390.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Phân loại dữ liệu</text><rect x="310.0" y="44.0" width="160.0" height="40.0" rx="8" fill="#efe6f3" stroke="#b07aa1" stroke-width="2"/><text x="390.0" y="69.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2733">Dữ liệu</text><line x1="390.0" y1="84.0" x2="200.0" y2="124.0" stroke="#9aa5b1" stroke-width="2"/><line x1="390.0" y1="84.0" x2="570.0" y2="124.0" stroke="#9aa5b1" stroke-width="2"/><rect x="65.0" y="124.0" width="270.0" height="82.0" rx="8" fill="#e8f1fa" stroke="#4e79a7" stroke-width="2"/><text x="200.0" y="151.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Dữ liệu định tính</text><text x="200.0" y="170.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#1d2733">không phải là số</text><text x="200.0" y="189.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#1d2733">vd: màu sắc, môn học yêu thích</text><rect x="435.0" y="124.0" width="270.0" height="82.0" rx="8" fill="#fdf1e0" stroke="#f28e2b" stroke-width="2"/><text x="570.0" y="151.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Dữ liệu định lượng</text><text x="570.0" y="170.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#1d2733">là số</text><text x="570.0" y="189.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#1d2733">vd: chiều cao, số anh chị em</text><line x1="570.0" y1="206.0" x2="455.0" y2="246.0" stroke="#9aa5b1" stroke-width="2"/><line x1="570.0" y1="206.0" x2="672.0" y2="246.0" stroke="#9aa5b1" stroke-width="2"/><rect x="352.0" y="246.0" width="206.0" height="82.0" rx="8" fill="#e6f0df" stroke="#59a14f" stroke-width="2"/><text x="455.0" y="273.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">Số liệu rời rạc</text><text x="455.0" y="292.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">đếm được</text><text x="455.0" y="311.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">vd: số học sinh, số bàn thắng</text><rect x="569.0" y="246.0" width="206.0" height="82.0" rx="8" fill="#e6f0df" stroke="#59a14f" stroke-width="2"/><text x="672.0" y="273.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">Số liệu liên tục</text><text x="672.0" y="292.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">thu được từ đo lường</text><text x="672.0" y="311.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">vd: chiều cao, cân nặng</text><rect x="14.0" y="246.0" width="300.0" height="96.0" rx="8" fill="#efe6f3" stroke="#b07aa1" stroke-width="2"/><text x="164.0" y="270.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">Cách thu thập dữ liệu</text><text x="164.0" y="289.5" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">Trực tiếp: quan sát, phỏng vấn,</text><text x="164.0" y="308.5" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">lập phiếu hỏi, làm thí nghiệm</text><text x="164.0" y="327.5" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">Gián tiếp: sách, báo, tài liệu, internet</text><text x="390.0" y="372.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#5b6773">Dữ liệu phải hợp lí: tuổi một học sinh lớp 8 là 100, hay số học sinh nam là 20,5, là dữ liệu không hợp lí.</text></svg>