<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="360.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Hiệu hai lập phương: A³ − B³ = (A − B)(A² + AB + B²)</text><text x="170.0" y="62.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Khối A³ khuyết một góc B³</text><polygon points="204.0,300.0 247.7,256.3 247.7,206.3 204.0,250.0" fill="#718aa5" stroke="#1d2733" stroke-width="1.4" stroke-linejoin="round"/><polygon points="100.0,250.0 204.0,250.0 247.7,206.3 143.7,206.3" fill="#bfd6ee" stroke="#1d2733" stroke-width="1.4" stroke-linejoin="round"/><polygon points="100.0,300.0 204.0,300.0 204.0,250.0 100.0,250.0" fill="#9ec1e6" stroke="#1d2733" stroke-width="1.4" stroke-linejoin="round"/><polygon points="226.7,227.3 247.7,206.3 247.7,152.3 226.7,173.3" fill="#b19064" stroke="#1d2733" stroke-width="1.4" stroke-linejoin="round"/><polygon points="122.7,173.3 226.7,173.3 247.7,152.3 143.7,152.3" fill="#f9dbb3" stroke="#1d2733" stroke-width="1.4" stroke-linejoin="round"/><polygon points="122.7,227.3 226.7,227.3 226.7,173.3 122.7,173.3" fill="#f7c98b" stroke="#1d2733" stroke-width="1.4" stroke-linejoin="round"/><polygon points="150.0,250.0 172.7,227.3 172.7,173.3 150.0,196.0" fill="#9783a0" stroke="#1d2733" stroke-width="1.4" stroke-linejoin="round"/><polygon points="100.0,196.0 150.0,196.0 172.7,173.3 122.7,173.3" fill="#e2cfea" stroke="#1d2733" stroke-width="1.4" stroke-linejoin="round"/><polygon points="100.0,250.0 150.0,250.0 150.0,196.0 100.0,196.0" fill="#d3b6df" stroke="#1d2733" stroke-width="1.4" stroke-linejoin="round"/><text x="152.0" y="322.0" text-anchor="middle" font-size="14" font-weight="normal" fill="#1d2733">A</text><text x="88.0" y="280.0" text-anchor="end" font-size="13" font-weight="normal" fill="#1d2733">A − B</text><text x="530.0" y="62.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Ba khối cùng dày A − B</text><polygon points="484.0,170.0 527.7,126.3 527.7,76.3 484.0,120.0" fill="#718aa5" stroke="#1d2733" stroke-width="1.4" stroke-linejoin="round"/><polygon points="380.0,120.0 484.0,120.0 527.7,76.3 423.7,76.3" fill="#bfd6ee" stroke="#1d2733" stroke-width="1.4" stroke-linejoin="round"/><polygon points="380.0,170.0 484.0,170.0 484.0,120.0 380.0,120.0" fill="#9ec1e6" stroke="#1d2733" stroke-width="1.4" stroke-linejoin="round"/><text x="444.0" y="194.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2733">A²(A − B)</text><polygon points="484.0,300.0 505.0,279.0 505.0,225.0 484.0,246.0" fill="#b19064" stroke="#1d2733" stroke-width="1.4" stroke-linejoin="round"/><polygon points="380.0,246.0 484.0,246.0 505.0,225.0 401.0,225.0" fill="#f9dbb3" stroke="#1d2733" stroke-width="1.4" stroke-linejoin="round"/><polygon points="380.0,300.0 484.0,300.0 484.0,246.0 380.0,246.0" fill="#f7c98b" stroke="#1d2733" stroke-width="1.4" stroke-linejoin="round"/><text x="444.0" y="324.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2733">AB(A − B)</text><polygon points="640.0,300.0 662.7,277.3 662.7,223.3 640.0,246.0" fill="#9783a0" stroke="#1d2733" stroke-width="1.4" stroke-linejoin="round"/><polygon points="590.0,246.0 640.0,246.0 662.7,223.3 612.7,223.3" fill="#e2cfea" stroke="#1d2733" stroke-width="1.4" stroke-linejoin="round"/><polygon points="590.0,300.0 640.0,300.0 640.0,246.0 590.0,246.0" fill="#d3b6df" stroke="#1d2733" stroke-width="1.4" stroke-linejoin="round"/><text x="627.0" y="324.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2733">B²(A − B)</text><text x="360.0" y="342.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#5b6773">A² + AB + B² là diện tích ba đáy; chiều dày chung là A − B.</text></svg>