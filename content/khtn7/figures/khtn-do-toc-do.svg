<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="360.0" y="28.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Đo tốc độ: đo quãng đường s và thời gian t</text><line x1="60.0" y1="150.0" x2="660.0" y2="150.0" stroke="#1d2733" stroke-width="3"/><line x1="90.0" y1="110.0" x2="90.0" y2="190.0" stroke="#e15759" stroke-width="3"/><text x="90.0" y="98.0" text-anchor="middle" font-size="14" font-weight="normal" fill="#e15759">Vạch xuất phát</text><line x1="600.0" y1="110.0" x2="600.0" y2="190.0" stroke="#59a14f" stroke-width="3"/><text x="600.0" y="98.0" text-anchor="middle" font-size="14" font-weight="normal" fill="#59a14f">Vạch đích</text><rect x="150.0" y="128.0" width="52.0" height="22.0" rx="6" fill="#f28e2b" stroke="#1d2733" stroke-width="2" opacity="1"/><circle cx="165.0" cy="152.0" r="6.0" fill="#1d2733" stroke="#1d2733" stroke-width="2"/><circle cx="190.0" cy="152.0" r="6.0" fill="#1d2733" stroke="#1d2733" stroke-width="2"/><line x1="90.0" y1="215.0" x2="600.0" y2="215.0" stroke="#1d2733" stroke-width="1.5" marker-end="url(#ar)"/><text x="345.0" y="240.0" text-anchor="middle" font-size="15" font-weight="normal" fill="#1d2733">s: quãng đường đo bằng thước (m)</text><text x="360.0" y="275.0" text-anchor="middle" font-size="15" font-weight="normal" fill="#1d2733">t: thời gian đo bằng đồng hồ bấm giây hoặc cổng quang điện (s)</text><text x="600.0" y="255.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d2733">v = s / t</text></svg>