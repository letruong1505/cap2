<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="360.0" y="22.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Khí khổng mở và đóng ở lá</text><ellipse cx="179.0" cy="150.0" rx="22" ry="26" fill="#8fc471" stroke="#1d2733" stroke-width="2"/><ellipse cx="221.0" cy="150.0" rx="22" ry="26" fill="#8fc471" stroke="#1d2733" stroke-width="2"/><polygon points="195.0,140.0 205.0,140.0 205.0,160.0 195.0,160.0" fill="#ffffff" stroke="none" stroke-width="1" opacity="1"/><text x="200.0" y="225.0" text-anchor="middle" font-size="15" font-weight="normal" fill="#1d2733">Mở (cây đủ nước)</text><ellipse cx="506.0" cy="150.0" rx="22" ry="26" fill="#8fc471" stroke="#1d2733" stroke-width="2"/><ellipse cx="534.0" cy="150.0" rx="22" ry="26" fill="#8fc471" stroke="#1d2733" stroke-width="2"/><text x="520.0" y="225.0" text-anchor="middle" font-size="15" font-weight="normal" fill="#1d2733">Đóng (cây thiếu nước)</text><text x="360.0" y="275.0" text-anchor="middle" font-size="14" font-weight="normal" fill="#1d2733">Tế bào hình hạt đậu: khi trương nước thì khe mở ra, thoát hơi nước và trao đổi khí</text></svg>