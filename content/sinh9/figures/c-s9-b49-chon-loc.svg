<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 288" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="360.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Chọn lọc nhân tạo và chọn lọc tự nhiên</text><text x="30.0" y="58.0" text-anchor="start" font-size="14" font-weight="bold" fill="#1d2733">Chọn lọc nhân tạo</text><rect x="30.0" y="66.0" width="190.0" height="56.0" rx="8" fill="#e3f1de" stroke="#1d2733" stroke-width="1.8"/><text x="125.0" y="91.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">Biến dị ở vật nuôi,</text><text x="125.0" y="107.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">cây trồng</text><line x1="222.0" y1="94.0" x2="256.0" y2="94.0" stroke="#1d2733" stroke-width="2.4" marker-end="url(#ar)"/><rect x="260.0" y="66.0" width="190.0" height="56.0" rx="8" fill="#e3f1de" stroke="#1d2733" stroke-width="1.8"/><text x="355.0" y="91.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">Con người giữ lại biến dị</text><text x="355.0" y="107.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">có lợi cho mình</text><line x1="452.0" y1="94.0" x2="486.0" y2="94.0" stroke="#1d2733" stroke-width="2.4" marker-end="url(#ar)"/><rect x="490.0" y="66.0" width="190.0" height="56.0" rx="8" fill="#e3f1de" stroke="#1d2733" stroke-width="1.8"/><text x="585.0" y="91.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">Giống vật nuôi,</text><text x="585.0" y="107.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">cây trồng mới</text><text x="30.0" y="168.0" text-anchor="start" font-size="14" font-weight="bold" fill="#1d2733">Chọn lọc tự nhiên</text><rect x="30.0" y="176.0" width="190.0" height="56.0" rx="8" fill="#dfe9f7" stroke="#1d2733" stroke-width="1.8"/><text x="125.0" y="201.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">Biến dị trong</text><text x="125.0" y="217.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">quần thể</text><line x1="222.0" y1="204.0" x2="256.0" y2="204.0" stroke="#1d2733" stroke-width="2.4" marker-end="url(#ar)"/><rect x="260.0" y="176.0" width="190.0" height="56.0" rx="8" fill="#dfe9f7" stroke="#1d2733" stroke-width="1.8"/><text x="355.0" y="201.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">Môi trường: cá thể thích nghi</text><text x="355.0" y="217.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">sống sót, sinh sản nhiều</text><line x1="452.0" y1="204.0" x2="486.0" y2="204.0" stroke="#1d2733" stroke-width="2.4" marker-end="url(#ar)"/><rect x="490.0" y="176.0" width="190.0" height="56.0" rx="8" fill="#dfe9f7" stroke="#1d2733" stroke-width="1.8"/><text x="585.0" y="201.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">Đặc điểm thích nghi,</text><text x="585.0" y="217.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d2733">loài mới</text><text x="360.0" y="270.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#9aa5b1">Điểm khác: nhân tố chọn lọc là con người (nhân tạo) hay điều kiện môi trường (tự nhiên)</text></svg>