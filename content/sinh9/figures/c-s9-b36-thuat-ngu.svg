" font-size="12" font-weight="normal" fill="#1d2733">đồng hợp (trội)</text><rect x="501.0" y="82.0" width="14.0" height="70.0" rx="7.0" fill="#e9e1f2" stroke="#1d2733" stroke-width="2"/><rect x="502.0" y="107.0" width="12.0" height="7.0" rx="0" fill="#c0392b" stroke="none" stroke-width="0"/><line x1="501.0" y1="117.0" x2="515.0" y2="117.0" stroke="#1d2733" stroke-width="1"/><rect x="525.0" y="82.0" width="14.0" height="70.0" rx="7.0" fill="#e9e1f2" stroke="#1d2733" stroke-width="2"/><rect x="526.0" y="107.0" width="12.0" height="7.0" rx="0" fill="#2b6cb0" stroke="none" stroke-width="0"/><line x1="525.0" y1="117.0" x2="539.0" y2="117.0" stroke="#1d2733" stroke-width="1"/><text x="520.0" y="178.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Aa</text><text x="520.0" y="197.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">dị hợp</text><rect x="601.0" y="82.0" width="14.0" height="70.0" rx="7.0" fill="#e9e1f2" stroke="#1d2733" stroke-width="2"/><rect x="602.0" y="107.0" width="12.0" height="7.0" rx="0" fill="#2b6cb0" stroke="none" stroke-width="0"/><line x1="601.0" y1="117.0" x2="615.0" y2="117.0" stroke="#1d2733" stroke-width="1"/><rect x="625.0" y="82.0" width="14.0" height="70.0" rx="7.0" fill="#e9e1f2" stroke="#1d2733" stroke-width="2"/><rect x="626.0" y="107.0" width="12.0" height="7.0" rx="0" fill="#2b6cb0" stroke="none" stroke-width="0"/><line x1="625.0" y1="117.0" x2="639.0" y2="117.0" stroke="#1d2733" stroke-width="1"/><text x="620.0" y="178.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">aa</text><text x="620.0" y="197.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">đồng hợp (lặn)</text><text x="520.0" y="222.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#9aa5b1">Mỗi NST của cặp mang một allele ở cùng một vị trí (locus)</text><text x="360.0" y="280.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#3b4856">Kiểu gene: tổ hợp