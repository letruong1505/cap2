<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 312" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="360.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Kí hiệu và thuật ngữ cơ bản của di truyền học</text><rect x="20.0" y="52.0" width="80.0" height="34.0" rx="6" fill="#dbe7f3" stroke="#1d2733" stroke-width="1.8"/><text x="60.0" y="76.0" text-anchor="middle" font-size="18" font-weight="bold" fill="#1d2733">P</text><rect x="100.0" y="52.0" width="220.0" height="34.0" rx="6" fill="white" stroke="#1d2733" stroke-width="1.8"/><text x="210.0" y="75.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#1d2733">bố mẹ (thế hệ xuất phát)</text><rect x="20.0" y="92.0" width="80.0" height="34.0" rx="6" fill="#dbe7f3" stroke="#1d2733" stroke-width="1.8"/><text x="60.0" y="116.0" text-anchor="middle" font-size="18" font-weight="bold" fill="#1d2733">F₁, F₂</text><rect x="100.0" y="92.0" width="220.0" height="34.0" rx="6" fill="white" stroke="#1d2733" stroke-width="1.8"/><text x="210.0" y="115.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#1d2733">thế hệ con thứ nhất, thứ hai</text><rect x="20.0" y="132.0" width="80.0" height="34.0" rx="6" fill="#dbe7f3" stroke="#1d2733" stroke-width="1.8"/><text x="60.0" y="156.0" text-anchor="middle" font-size="18" font-weight="bold" fill="#1d2733">G</text><rect x="100.0" y="132.0" width="220.0" height="34.0" rx="6" fill="white" stroke="#1d2733" stroke-width="1.8"/><text x="210.0" y="155.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#1d2733">giao tử</text><rect x="20.0" y="172.0" width="80.0" height="34.0" rx="6" fill="#dbe7f3" stroke="#1d2733" stroke-width="1.8"/><text x="60.0" y="196.0" text-anchor="middle" font-size="18" font-weight="bol