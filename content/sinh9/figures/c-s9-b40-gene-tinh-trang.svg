<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 215" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="360.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Mối quan hệ gene → mRNA → protein → tính trạng</text><rect x="30.0" y="80.0" width="125.0" height="56.0" rx="10" fill="#dbe7f3" stroke="#1d2733" stroke-width="2"/><text x="92.0" y="114.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2733">Gene (DNA)</text><line x1="158.0" y1="108.0" x2="200.0" y2="108.0" stroke="#1d2733" stroke-width="2.6" marker-end="url(#ar)"/><text x="179.0" y="98.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#3b4856">phiên mã</text><rect x="205.0" y="80.0" width="125.0" height="56.0" rx="10" fill="#efe6fa" stroke="#1d2733" stroke-width="2"/><text x="267.0" y="114.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2733">mRNA</text><line x1="333.0" y1="108.0" x2="375.0" y2="108.0" stroke="#1d2733" stroke-width="2.6" marker-end="url(#ar)"/><text x="354.0" y="98.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#3b4856">dịch mã</text><rect x="380.0" y="80.0" width="125.0" height="56.0" rx="10" fill="#fbf0c9" stroke="#1d2733" stroke-width="2"/><text x="442.0" y="114.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2733">Protein</text><line x1="508.0" y1="108.0" x2="550.0" y2="108.0" stroke="#1d2733" stroke-width="2.6" marker-end="url(#ar)"/><text x="529.0" y="98.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#3b4856">biểu hiện</text><rect x="555.0" y="80.0" width="125.0" height="56.0" rx="10" fill="#dfe9d5" stroke="#1d2733" stroke-width="2"/><text x="617.0" y="114.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2733">Tính trạng</text><text x="360.0" y="190.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#9aa5b1">Ví dụ: gene quy định hemoglobin → mRNA → hemoglobin → hồng cầu bình thường</text></svg>