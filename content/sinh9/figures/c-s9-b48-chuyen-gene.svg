<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 276" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="360.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Chuyển gene người vào vi khuẩn để sản xuất insulin</text><text x="90.0" y="54.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">1. Chuẩn bị</text><text x="270.0" y="54.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">2. Tạo DNA tái tổ hợp</text><text x="450.0" y="54.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">3. Đưa vào vi khuẩn</text><text x="630.0" y="54.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">4. Nuôi cấy</text><circle cx="60.0" cy="130.0" r="28.0" fill="none" stroke="#2b6cb0" stroke-width="5"/><text x="60.0" y="176.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1d2733">plasmid</text><rect x="104.0" y="110.0" width="56.0" height="18.0" rx="4" fill="#f2a33a" stroke="#1d2733" stroke-width="1.4"/><text x="132.0" y="152.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1d2733">gene insulin</text><text x="132.0" y="166.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1d2733">(từ DNA người)</text><circle cx="270.0" cy="130.0" r="30.0" fill="none" stroke="#2b6cb0" stroke-width="5"/><rect x="250.0" y="94.0" width="40.0" height="14.0" rx="4" fill="#f2a33a" stroke="#1d2733" stroke-width="1.4"/><text x="270.0" y="178.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1d2733">DNA tái tổ hợp</text><line x1="185.0" y1="130.0" x2="218.0" y2="130.0" stroke="#1d2733" stroke-width="2.4" marker-end="url(#ar)"/><text x="202.0" y="120.0" text-anchor="middle" font-size="10" font-weight="normal" fill="#9aa5b1">enzyme</text><rect x="405.0" y="100.0" width="90.0" height="56.0" rx="28" fill="#e3f1de" stroke="#1d2733" stroke-width="2"/><circle cx="450.0" cy="128.0" r="14.0" fill="none" stroke="#2b6cb0" stroke-width="3"/><rect x="442.0" y="108.0" width="16.0" height="7.0" rx="2" fill="#f2a33a" stroke="#1d2733" stroke-width="1"/><line x1="310.0" y1="130.0" x2="400.0" y2="130.0" stroke="#1d2733" stroke-width="2.4" marker-end="url(#ar)"/><text x="450.0" y="178.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1d2733">vi khuẩn (E. coli)</text><rect x="584.0" y="107.0" width="40.0" height="18.0" rx="9" fill="#e3f1de" stroke="#1d2733" stroke-width="1.4"/><rect x="624.0" y="101.0" width="40.0" height="18.0" rx="9" fill="#e3f1de" stroke="#1d2733" stroke-width="1.4"/><rect x="602.0" y="139.0" width="40.0" height="18.0" rx="9" fill="#e3f1de" stroke="#1d2733" stroke-width="1.4"/><rect x="640.0" y="135.0" width="40.0" height="18.0" rx="9" fill="#e3f1de" stroke="#1d2733" stroke-width="1.4"/><line x1="500.0" y1="130.0" x2="580.0" y2="130.0" stroke="#1d2733" stroke-width="2.4" marker-end="url(#ar)"/><text x="630.0" y="178.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#1d2733">sinh sản nhanh, tạo insulin</text><rect x="80.0" y="214.0" width="560.0" height="40.0" rx="8" fill="#fbf0c9" stroke="#1d2733" stroke-width="1.6"/><text x="360.0" y="240.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">Sản phẩm: insulin chữa bệnh đái tháo đường (quy mô công nghiệp)</text></svg>