<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="320.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Phân tử nước (H₂O)</text><line x1="250.0" y1="130.0" x2="163.3" y2="197.7" stroke="#1d2733" stroke-width="5"/><line x1="250.0" y1="130.0" x2="336.7" y2="197.7" stroke="#1d2733" stroke-width="5"/><circle cx="250.0" cy="130.0" r="30.0" fill="#f6c3c3" stroke="#e15759" stroke-width="2.5"/><text x="250.0" y="136.0" text-anchor="middle" font-size="20" font-weight="bold" fill="#1d2733">O</text><circle cx="163.3" cy="197.7" r="20.0" fill="#dbe7f3" stroke="#4e79a7" stroke-width="2.5"/><text x="163.3" y="203.7" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d2733">H</text><circle cx="336.7" cy="197.7" r="20.0" fill="#dbe7f3" stroke="#4e79a7" stroke-width="2.5"/><text x="336.7" y="203.7" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d2733">H</text><text x="250.0" y="88.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#e15759">δ−</text><text x="157.3" y="237.7" text-anchor="middle" font-size="16" font-weight="bold" fill="#4e79a7">δ+</text><text x="342.7" y="237.7" text-anchor="middle" font-size="16" font-weight="bold" fill="#4e79a7">δ+</text><text x="470.0" y="100.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#1d2733">Một nguyên tử oxygen liên kết</text><text x="470.0" y="120.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#1d2733">với hai nguyên tử hydrogen</text><text x="470.0" y="140.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#1d2733">bằng liên kết cộng hoá trị.</text><text x="470.0" y="190.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#1d2733">Cặp electron bị lệch về phía</text><text x="470.0" y="210.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#1d2733">oxygen nên nước có tính phân cực,</text><text x="470.0" y="230.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#1d2733">là dung môi hoà tan nhiều chất.</text><text x="320.0" y="312.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#55606d">Sơ đồ minh họa; góc liên kết không phải số đo chính xác.</text></svg>