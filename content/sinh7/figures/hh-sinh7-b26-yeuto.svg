<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 278" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="360.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Một số yếu tố ảnh hưởng đến hô hấp tế bào</text><rect x="14.0" y="44.0" width="162.5" height="173.0" rx="8" fill="#e8f1fa" stroke="#4e79a7" stroke-width="2"/><path d="M14.0,44.0 h0.0 v0.0 h-0.0 z" fill="#4e79a7" opacity="0"/><rect x="14.0" y="44.0" width="162.5" height="36.0" rx="8" fill="#4e79a7" stroke="#4e79a7" stroke-width="2"/><text x="95.2" y="67.0" text-anchor="middle" font-size="14" font-weight="bold" fill="white">Nước</text><text x="26.0" y="102.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">• Là dung môi, môi</text><text x="26.0" y="119.5" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">  trường của phản ứng</text><text x="26.0" y="137.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">  hô hấp</text><text x="26.0" y="158.5" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">• Hàm lượng nước trong</text><text x="26.0" y="176.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">  hạt tăng thì cường độ</text><text x="26.0" y="193.5" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">  hô hấp tăng mạnh</text><rect x="190.5" y="44.0" width="162.5" height="173.0" rx="8" fill="#fdf1e0" stroke="#f28e2b" stroke-width="2"/><path d="M190.5,44.0 h0.0 v0.0 h-0.0 z" fill="#f28e2b" opacity="0"/><rect x="190.5" y="44.0" width="162.5" height="36.0" rx="8" fill="#f28e2b" stroke="#f28e2b" stroke-width="2"/><text x="271.8" y="67.0" text-anchor="middle" font-size="14" font-weight="bold" fill="white">Khí oxygen</text><text x="202.5" y="102.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">• Là nguyên liệu của hô</text><text x="202.5" y="119.5" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">  hấp</text><text x="202.5" y="141.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">• Nồng độ O₂ ngoài môi</text><text x="202.5" y="158.5" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">  trường dưới 5% thì</text><text x="202.5" y="176.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">  cường độ hô hấp giảm</text><rect x="367.0" y="44.0" width="162.5" height="173.0" rx="8" fill="#e6f0df" stroke="#59a14f" stroke-width="2"/><path d="M367.0,44.0 h0.0 v0.0 h-0.0 z" fill="#59a14f" opacity="0"/><rect x="367.0" y="44.0" width="162.5" height="36.0" rx="8" fill="#59a14f" stroke="#59a14f" stroke-width="2"/><text x="448.2" y="67.0" text-anchor="middle" font-size="14" font-weight="bold" fill="white">Khí CO₂</text><text x="379.0" y="102.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">• Nồng độ 3% đến 5% đã</text><text x="379.0" y="119.5" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">  gây ức chế hô hấp</text><rect x="543.5" y="44.0" width="162.5" height="173.0" rx="8" fill="#efe6f3" stroke="#b07aa1" stroke-width="2"/><path d="M543.5,44.0 h0.0 v0.0 h-0.0 z" fill="#b07aa1" opacity="0"/><rect x="543.5" y="44.0" width="162.5" height="36.0" rx="8" fill="#b07aa1" stroke="#b07aa1" stroke-width="2"/><text x="624.8" y="67.0" text-anchor="middle" font-size="14" font-weight="bold" fill="white">Nhiệt độ</text><text x="555.5" y="102.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">• Quá cao hoặc quá thấp</text><text x="555.5" y="119.5" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">  đều ảnh hưởng</text><text x="555.5" y="141.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">• Ở người, trên 40 °C</text><text x="555.5" y="158.5" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">  hô hấp tế bào gặp khó</text><text x="555.5" y="176.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">  khăn</text><text x="360.0" y="241.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a56a0">Bảo quản nông sản: phơi/sấy khô (độ ẩm hạt khoảng 13% đến 16%), bảo quản lạnh (khoai tây 4 °C,</text><text x="360.0" y="258.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a56a0">cam 6 °C).</text></svg>