<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="450.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Thí nghiệm chứng minh tinh bột được tạo thành trong quang hợp</text><rect x="14.0" y="48.0" width="195.5" height="110.0" rx="10" fill="#e8f1fa" stroke="#4e79a7" stroke-width="2.5"/><text x="111.8" y="72.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#4e79a7">Bước 1</text><text x="111.8" y="96.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">Đặt cây trong</text><text x="111.8" y="114.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">bóng tối 2 ngày</text><line x1="213.5" y1="103.0" x2="235.5" y2="103.0" stroke="#1d2733" stroke-width="3" marker-end="url(#ar)"/><rect x="239.5" y="48.0" width="195.5" height="110.0" rx="10" fill="#fdf1e0" stroke="#f28e2b" stroke-width="2.5"/><text x="337.2" y="72.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#f28e2b">Bước 2</text><text x="337.2" y="96.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">Che một phần lá bằng</text><text x="337.2" y="114.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">giấy đen, đưa ra ánh sáng</text><text x="337.2" y="132.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">4 – 6 giờ</text><line x1="439.0" y1="103.0" x2="461.0" y2="103.0" stroke="#1d2733" stroke-width="3" marker-end="url(#ar)"/><rect x="465.0" y="48.0" width="195.5" height="110.0" rx="10" fill="#e6f0df" stroke="#59a14f" stroke-width="2.5"/><text x="562.8" y="72.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#59a14f">Bước 3</text><text x="562.8" y="96.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">Ngắt lá, đun trong</text><text x="562.8" y="114.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">cồn 90° để tẩy</text><text x="562.8" y="132.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">diệp lục</text><line x1="664.5" y1="103.0" x2="686.5" y2="103.0" stroke="#1d2733" stroke-width="3" marker-end="url(#ar)"/><rect x="690.5" y="48.0" width="195.5" height="110.0" rx="10" fill="#efe6f3" stroke="#b07aa1" stroke-width="2.5"/><text x="788.2" y="72.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#b07aa1">Bước 4</text><text x="788.2" y="96.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">Rửa trong nước ấm,</text><text x="788.2" y="114.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">nhúng vào dung dịch</text><text x="788.2" y="132.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1d2733">iodine</text><line x1="450.0" y1="160.0" x2="450.0" y2="190.0" stroke="#1d2733" stroke-width="3" marker-end="url(#ar)"/><rect x="120.0" y="192.0" width="300.0" height="100.0" rx="10" fill="#e3dcf2" stroke="#6c4aa8" stroke-width="2.5"/><rect x="480.0" y="192.0" width="300.0" height="100.0" rx="10" fill="#eaf3e0" stroke="#59a14f" stroke-width="2.5"/><text x="270.0" y="224.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2733">Phần lá không che</text><text x="270.0" y="250.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#1d2733">Bị nhuộm màu xanh tím</text><text x="270.0" y="272.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#55606d">(có tinh bột)</text><text x="630.0" y="224.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2733">Phần lá bị che</text><text x="630.0" y="250.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#1d2733">Không đổi màu</text><text x="630.0" y="272.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#55606d">(không có tinh bột)</text><text x="450.0" y="316.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a56a0">Kết luận: tinh bột được tạo thành trong quang hợp ở phần lá có ánh sáng.</text></svg>