<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 296" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="360.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Ba khối có cùng thể tích 1 m³ nhưng khối lượng khác nhau</text><polygon points="90.0,186.0 186.0,186.0 186.0,90.0 90.0,90.0" fill="#bcd9f0" stroke="#1d2733" stroke-width="2" stroke-linejoin="round"/><polygon points="90.0,90.0 186.0,90.0 220.0,64.0 124.0,64.0" fill="#bcd9f0" stroke="#1d2733" stroke-width="2" stroke-linejoin="round"/><polygon points="186.0,186.0 220.0,160.0 220.0,64.0 186.0,90.0" fill="#bcd9f0" stroke="#1d2733" stroke-width="2" stroke-linejoin="round"/><text x="153.0" y="56.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d2733">Nước</text><text x="153.0" y="222.0" text-anchor="middle" font-size="14" font-weight="normal" fill="#1d2733">V = 1 m³,  m = 1 000 kg</text><text x="153.0" y="244.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#4e79a7">D = 1 000 kg/m³</text><polygon points="300.0,186.0 396.0,186.0 396.0,90.0 300.0,90.0" fill="#cfd5db" stroke="#1d2733" stroke-width="2" stroke-linejoin="round"/><polygon points="300.0,90.0 396.0,90.0 430.0,64.0 334.0,64.0" fill="#cfd5db" stroke="#1d2733" stroke-width="2" stroke-linejoin="round"/><polygon points="396.0,186.0 430.0,160.0 430.0,64.0 396.0,90.0" fill="#cfd5db" stroke="#1d2733" stroke-width="2" stroke-linejoin="round"/><text x="363.0" y="56.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d2733">Nhôm</text><text x="363.0" y="222.0" text-anchor="middle" font-size="14" font-weight="normal" fill="#1d2733">V = 1 m³,  m = 2 700 kg</text><text x="363.0" y="244.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#4e79a7">D = 2 700 kg/m³</text><polygon points="510.0,186.0 606.0,186.0 606.0,90.0 510.0,90.0" fill="#8d98a5" stroke="#1d2733" stroke-width="2" stroke-linejoin="round"/><polygon points="510.0,90.0 606.0,90.0 640.0,64.0 544.0,64.0" fill="#8d98a5" stroke="#1d2733" stroke-width="2" stroke-linejoin="round"/><polygon points="606.0,186.0 640.0,160.0 640.0,64.0 606.0,90.0" fill="#8d98a5" stroke="#1d2733" stroke-width="2" stroke-linejoin="round"/><text x="573.0" y="56.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d2733">Sắt</text><text x="573.0" y="222.0" text-anchor="middle" font-size="14" font-weight="normal" fill="#1d2733">V = 1 m³,  m = 7 800 kg</text><text x="573.0" y="244.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#4e79a7">D = 7 800 kg/m³</text><text x="360.0" y="280.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#9aa5b1">D = m / V:  cùng thể tích, khối lượng càng lớn thì khối lượng riêng càng lớn</text></svg>