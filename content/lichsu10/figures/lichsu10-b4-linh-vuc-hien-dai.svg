<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 160" font-family="Arial,sans-serif" font-size="13"><defs><pattern id="grid-lichsu10b4linhvuchiendai" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#cbd5e1" stroke-width="0.8"/></pattern></defs><rect width="480" height="160" fill="#f8fafc"/><rect width="480" height="160" fill="url(#grid-lichsu10b4linhvuchiendai)"/><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#6b7280"/></marker></defs><text x="240" y="20" fill="#111" font-size="12" text-anchor="middle" font-weight="bold">Sử học và các lĩnh vực hiện đại</text><rect x="12" y="40" width="146" height="50" rx="8" fill="#dbeafe" stroke="#374151"/><text x="85.0" y="69.0" fill="#111" font-size="11" text-anchor="middle" font-weight="bold">Bảo tồn &amp; phát huy di sản</text><line x1="158" y1="65" x2="172" y2="65" stroke="#6b7280" stroke-width="2" marker-end="url(#ar)"/><rect x="172" y="40" width="146" height="50" rx="8" fill="#dcfce7" stroke="#374151"/><text x="245.0" y="69.0" fill="#111" font-size="11" text-anchor="middle" font-weight="bold">Công nghiệp văn hoá</text><line x1="318" y1="65" x2="332" y2="65" stroke="#6b7280" stroke-width="2" marker-end="url(#ar)"/><rect x="332" y="40" width="146" height="50" rx="8" fill="#fbcfe8" stroke="#374151"/><text x="405.0" y="69.0" fill="#111" font-size="11" text-anchor="middle" font-weight="bold">Du lịch văn hoá</text><text x="240" y="118" fill="#111" font-size="10" text-anchor="middle">Tác động qua lại: du lịch thúc đẩy bảo tồn; doanh thu tái đầu tư cho nghiên cứu, bảo tồn</text><text x="240" y="140" fill="#111" font-size="10" text-anchor="middle">Sử học cung cấp cơ sở khoa học cho xác định giá trị và phát huy di sản bền vững</text></svg>