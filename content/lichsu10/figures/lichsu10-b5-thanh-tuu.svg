<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" font-family="Arial,sans-serif" font-size="13"><defs><pattern id="grid-lichsu10b5thanhtuu" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#cbd5e1" stroke-width="0.8"/></pattern></defs><rect width="480" height="200" fill="#f8fafc"/><rect width="480" height="200" fill="url(#grid-lichsu10b5thanhtuu)"/><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#6b7280"/></marker></defs><text x="240" y="20" fill="#111" font-size="12" text-anchor="middle" font-weight="bold">Thành tựu nổi bật của văn minh phương Đông</text><rect x="40" y="40" width="400" height="36" rx="8" fill="#fde68a" stroke="#374151"/><text x="240.0" y="62.0" fill="#111" font-size="11" text-anchor="middle" font-weight="bold">Ai Cập: chữ tượng hình, kim tự tháp, lịch</text><rect x="40" y="86" width="400" height="36" rx="8" fill="#bbf7d0" stroke="#374151"/><text x="240.0" y="108.0" fill="#111" font-size="11" text-anchor="middle" font-weight="bold">Ấn Độ: 10 chữ số, số pi, thuyết nguyên tử</text><rect x="40" y="132" width="400" height="36" rx="8" fill="#bfdbfe" stroke="#374151"/><text x="240.0" y="154.0" fill="#111" font-size="11" text-anchor="middle" font-weight="bold">Trung Hoa: giấy, in, thuốc súng, la bàn</text><text x="240" y="190" fill="#111" font-size="11" text-anchor="middle">Các thành tựu đã lan toả ra thế giới, trong đó có Việt Nam</text></svg>