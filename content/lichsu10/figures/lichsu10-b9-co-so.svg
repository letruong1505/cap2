<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" font-family="Arial,sans-serif" font-size="13"><defs><pattern id="grid-lichsu10b9coso" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#cbd5e1" stroke-width="0.8"/></pattern></defs><rect width="480" height="200" fill="#f8fafc"/><rect width="480" height="200" fill="url(#grid-lichsu10b9coso)"/><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#6b7280"/></marker></defs><text x="240" y="20" fill="#111" font-size="12" text-anchor="middle" font-weight="bold">Các cơ sở hình thành văn minh Đông Nam Á</text><rect x="60" y="40" width="360" height="36" rx="8" fill="#dcfce7" stroke="#374151"/><text x="240.0" y="62.0" fill="#111" font-size="11" text-anchor="middle" font-weight="bold">Tự nhiên: lúa nước, sông, biển, gió mùa</text><rect x="60" y="86" width="360" height="36" rx="8" fill="#fde68a" stroke="#374151"/><text x="240.0" y="108.0" fill="#111" font-size="11" text-anchor="middle" font-weight="bold">Xã hội: đa tộc người, làng</text><rect x="60" y="132" width="360" height="36" rx="8" fill="#dbeafe" stroke="#374151"/><text x="240.0" y="154.0" fill="#111" font-size="11" text-anchor="middle" font-weight="bold">Tiếp thu: Ấn Độ, Trung Hoa</text><text x="240" y="186" fill="#111" font-size="11" text-anchor="middle">Văn minh bản địa là nền tảng, được tiếp thu có chọn lọc</text></svg>