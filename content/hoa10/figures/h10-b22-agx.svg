<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" font-family="Arial,sans-serif" font-size="13"><rect width="400" height="240" fill="#fff"/><text x="10" y="22" fill="#111" font-size="12" text-anchor="start" font-weight="bold">Nhận biết ion halide bằng AgNO₃</text><rect x="35" y="40" width="40" height="120" rx="6" fill="#e0f2fe" stroke="#374151"/><rect x="35" y="120" width="40" height="40" fill="#f9fafb" stroke="#374151"/><text x="55" y="180" fill="#111" font-size="13" text-anchor="middle" font-weight="bold">Cl⁻</text><text x="55" y="198" fill="#111" font-size="10" text-anchor="middle">AgCl trắng</text><rect x="130" y="40" width="40" height="120" rx="6" fill="#e0f2fe" stroke="#374151"/><rect x="130" y="120" width="40" height="40" fill="#fef3c7" stroke="#374151"/><text x="150" y="180" fill="#111" font-size="13" text-anchor="middle" font-weight="bold">Br⁻</text><text x="150" y="198" fill="#111" font-size="10" text-anchor="middle">AgBr vàng nhạt</text><rect x="225" y="40" width="40" height="120" rx="6" fill="#e0f2fe" stroke="#374151"/><rect x="225" y="120" width="40" height="40" fill="#fde047" stroke="#374151"/><text x="245" y="180" fill="#111" font-size="13" text-anchor="middle" font-weight="bold">I⁻</text><text x="245" y="198" fill="#111" font-size="10" text-anchor="middle">AgI vàng</text><rect x="320" y="40" width="40" height="120" rx="6" fill="#e0f2fe" stroke="#374151"/><rect x="320" y="120" width="40" height="40" fill="#e0f2fe" stroke="#374151"/><text x="340" y="180" fill="#111" font-size="13" text-anchor="middle" font-weight="bold">F⁻</text><text x="340" y="198" fill="#111" font-size="10" text-anchor="middle">không kết tủa</text><text x="20" y="226" fill="#111" font-size="12" text-anchor="start">Ag⁺ + X⁻ → AgX↓ (X = Cl, Br, I)</text></svg>