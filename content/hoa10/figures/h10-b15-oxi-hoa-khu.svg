<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 220" font-family="Arial,sans-serif" font-size="13"><rect width="420" height="220" fill="#fff"/><text x="20" y="30" fill="#111" font-size="13" text-anchor="start" font-weight="bold">Phản ứng: Fe₂O₃ + 3CO → 2Fe + 3CO₂</text><rect x="20" y="50" width="170" height="70" rx="8" fill="#fecaca" stroke="#b91c1c"/><text x="105" y="72" fill="#b91c1c" font-size="12" text-anchor="middle" font-weight="bold">Chất khử: CO</text><text x="105" y="92" fill="#111" font-size="12" text-anchor="middle">C⁺² → C⁺⁴ + 2e</text><text x="105" y="110" fill="#111" font-size="11" text-anchor="middle">nhường e, bị oxi hoá</text><rect x="210" y="50" width="190" height="70" rx="8" fill="#bfdbfe" stroke="#1d4ed8"/><text x="305" y="72" fill="#1d4ed8" font-size="12" text-anchor="middle" font-weight="bold">Chất oxi hoá: Fe₂O₃</text><text x="305" y="92" fill="#111" font-size="12" text-anchor="middle">Fe⁺³ + 3e → Fe⁰</text><text x="305" y="110" fill="#111" font-size="11" text-anchor="middle">nhận e, bị khử</text><text x="20" y="150" fill="#111" font-size="12" text-anchor="start" font-weight="bold">"Khử cho – O nhận": chất khử cho e, chất oxi hoá nhận e</text><text x="20" y="175" fill="#111" font-size="12" text-anchor="start">Số oxi hoá: chất khử tăng, chất oxi hoá giảm</text><text x="20" y="200" fill="#111" font-size="12" text-anchor="start">Tổng e nhường = tổng e nhận (cơ sở cân bằng)</text></svg>