<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" font-family="Arial,sans-serif" font-size="13"><rect width="400" height="240" fill="#fff"/><circle cx="140" cy="120" r="95" fill="#eff6ff" stroke="#93c5fd" stroke-dasharray="4 3"/><circle cx="140" cy="120" r="60" fill="none" stroke="#93c5fd" stroke-dasharray="4 3"/><circle cx="134" cy="114" r="7" fill="#b91c1c"/><circle cx="146" cy="114" r="7" fill="#9ca3af"/><circle cx="134" cy="126" r="7" fill="#9ca3af"/><circle cx="146" cy="126" r="7" fill="#b91c1c"/><circle cx="192.0" cy="150.0" r="5" fill="#1d4ed8"/><circle cx="83.6" cy="99.5" r="5" fill="#1d4ed8"/><circle cx="107.5" cy="209.3" r="5" fill="#1d4ed8"/><circle cx="187.5" cy="37.7" r="5" fill="#1d4ed8"/><text x="250" y="60" fill="#b91c1c" font-size="11" text-anchor="start">● proton (p, +1)</text><text x="250" y="80" fill="#6b7280" font-size="11" text-anchor="start">● neutron (n, 0)</text><text x="250" y="100" fill="#1d4ed8" font-size="11" text-anchor="start">● electron (e, −1)</text><text x="250" y="130" fill="#111" font-size="11" text-anchor="start" font-weight="bold">Hạt nhân: p + n</text><text x="250" y="148" fill="#111" font-size="11" text-anchor="start" font-weight="bold">Vỏ: các electron</text><text x="20" y="232" fill="#111" font-size="12" text-anchor="start">Nguyên tử trung hoà điện: số p = số e</text></svg>