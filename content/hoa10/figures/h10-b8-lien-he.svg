<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 220" font-family="Arial,sans-serif" font-size="13"><rect width="500" height="220" fill="#fff"/><rect x="15" y="50" width="135" height="110" rx="10" fill="#bfdbfe" stroke="#374151"/><text x="82" y="74" fill="#111" font-size="13" text-anchor="middle" font-weight="bold">Vị trí</text><text x="27" y="100" fill="#111" font-size="11" text-anchor="start">• ô (Z)</text><text x="27" y="120" fill="#111" font-size="11" text-anchor="start">• chu kì</text><text x="27" y="140" fill="#111" font-size="11" text-anchor="start">• nhóm</text><line x1="152" y1="105" x2="173" y2="105" stroke="#111" stroke-width="2"/><polygon points="173,105 165,100 165,110" fill="#111"/><polygon points="152,105 160,100 160,110" fill="#111"/><rect x="175" y="50" width="135" height="110" rx="10" fill="#bbf7d0" stroke="#374151"/><text x="242" y="74" fill="#111" font-size="13" text-anchor="middle" font-weight="bold">Cấu tạo nguyên tử</text><text x="187" y="100" fill="#111" font-size="11" text-anchor="start">• số p, số e</text><text x="187" y="120" fill="#111" font-size="11" text-anchor="start">• số lớp e</text><text x="187" y="140" fill="#111" font-size="11" text-anchor="start">• số e lớp ngoài cùng</text><line x1="312" y1="105" x2="333" y2="105" stroke="#111" stroke-width="2"/><polygon points="333,105 325,100 325,110" fill="#111"/><polygon points="312,105 320,100 320,110" fill="#111"/><rect x="335" y="50" width="135" height="110" rx="10" fill="#fecaca" stroke="#374151"/><text x="402" y="74" fill="#111" font-size="13" text-anchor="middle" font-weight="bold">Tính chất</text><text x="347" y="100" fill="#111" font-size="11" text-anchor="start">• kim loại / phi kim</text><text x="347" y="120" fill="#111" font-size="11" text-anchor="start">• hoá trị, oxide</text><text x="347" y="140" fill="#111" font-size="11" text-anchor="start">• hydroxide (acid/base)</text><text x="15" y="30" fill="#111" font-size="13" text-anchor="start" font-weight="bold">Mối liên hệ vị trí – cấu tạo – tính chất</text><text x="15" y="200" fill="#111" font-size="12" text-anchor="start">Biết một yếu tố có thể suy ra hai yếu tố còn lại</text></svg>