<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260" font-family="Arial,sans-serif" font-size="13"><rect width="480" height="260" fill="#fff"/><line x1="240.0" y1="130.0" x2="110" y2="47.0" stroke="#9ca3af" stroke-width="2"/><line x1="240.0" y1="130.0" x2="370" y2="39.0" stroke="#9ca3af" stroke-width="2"/><line x1="240.0" y1="130.0" x2="110" y2="207.0" stroke="#9ca3af" stroke-width="2"/><line x1="240.0" y1="130.0" x2="370" y2="207.0" stroke="#9ca3af" stroke-width="2"/><rect x="150.0" y="108.0" width="180" height="44" rx="10" fill="#1e3a8a"/><text x="240.0" y="135.0" fill="#fff" font-size="13" text-anchor="middle" font-weight="bold">TỐC ĐỘ PHẢN ỨNG</text><rect x="20" y="20" width="180" height="54" rx="8" fill="#bfdbfe" stroke="#374151"/><text x="110" y="36" fill="#111" font-size="12" text-anchor="middle" font-weight="bold">Định nghĩa</text><text x="28" y="52" fill="#111" font-size="11" text-anchor="start">v = ΔC/Δt (chia hệ số)</text><text x="28" y="68" fill="#111" font-size="11" text-anchor="start">mol/(L·s)</text><rect x="280" y="20" width="180" height="38" rx="8" fill="#fecaca" stroke="#374151"/><text x="370" y="36" fill="#111" font-size="12" text-anchor="middle" font-weight="bold">Định luật TDKL</text><text x="288" y="52" fill="#111" font-size="11" text-anchor="start">v = k·C_A^a·C_B^b</text><rect x="20" y="180" width="180" height="54" rx="8" fill="#bbf7d0" stroke="#374151"/><text x="110" y="196" fill="#111" font-size="12" text-anchor="middle" font-weight="bold">Yếu tố</text><text x="28" y="212" fill="#111" font-size="11" text-anchor="start">nồng độ, áp suất</text><text x="28" y="228" fill="#111" font-size="11" text-anchor="start">nhiệt độ, bề mặt, xúc tác</text><rect x="280" y="180" width="180" height="54" rx="8" fill="#fde68a" stroke="#374151"/><text x="370" y="196" fill="#111" font-size="12" text-anchor="middle" font-weight="bold">Van’t Hoff</text><text x="288" y="212" fill="#111" font-size="11" text-anchor="start">v₂/v₁ = γ^(ΔT/10)</text><text x="288" y="228" fill="#111" font-size="11" text-anchor="start">γ = 2 – 4</text></svg>