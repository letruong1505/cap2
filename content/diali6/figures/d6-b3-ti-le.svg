<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 312" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="360.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Tỉ lệ bản đồ 1 : 100 000</text><rect x="120.0" y="100.0" width="160.0" height="20.0" rx="0" fill="#444" stroke="#1d2733" stroke-width="1.8"/><rect x="280.0" y="100.0" width="160.0" height="20.0" rx="0" fill="white" stroke="#1d2733" stroke-width="1.8"/><line x1="120.0" y1="120.0" x2="120.0" y2="130.0" stroke="#1d2733" stroke-width="1.6"/><text x="120.0" y="148.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">0</text><line x1="280.0" y1="120.0" x2="280.0" y2="130.0" stroke="#1d2733" stroke-width="1.6"/><text x="280.0" y="148.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">1 cm</text><line x1="440.0" y1="120.0" x2="440.0" y2="130.0" stroke="#1d2733" stroke-width="1.6"/><text x="440.0" y="148.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2733">2 cm</text><text x="360.0" y="74.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#9aa5b1">Trên bản đồ</text><line x1="120.0" y1="200.0" x2="440.0" y2="200.0" stroke="#1a56a0" stroke-width="2"/><line x1="120.0" y1="194.0" x2="120.0" y2="206.0" stroke="#1a56a0" stroke-width="2"/><text x="120.0" y="226.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a56a0">0</text><line x1="280.0" y1="194.0" x2="280.0" y2="206.0" stroke="#1a56a0" stroke-width="2"/><text x="280.0" y="226.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a56a0">1 km</text><line x1="440.0" y1="194.0" x2="440.0" y2="206.0" stroke="#1a56a0" stroke-width="2"/><text x="440.0" y="226.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a56a0">2 km</text><text x="360.0" y="176.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#9aa5b1">Ngoài thực tế</text><text x="360.0" y="266.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a56a0">1 cm trên bản đồ ứng với 100 000 cm = 1 km ngoài thực tế</text><text x="360.0" y="290.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#3b4856">Khoảng cách thực tế = khoảng cách trên bản đồ × mẫu số tỉ lệ</text></svg>