<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 247" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs><text x="360.0" y="24.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#1d2733">Quá trình nội sinh và ngoại sinh</text><rect x="14.0" y="44.0" width="339.0" height="159.5" rx="8" fill="#e8f1fa" stroke="#4e79a7" stroke-width="2"/><path d="M14.0,44.0 h0.0 v0.0 h-0.0 z" fill="#4e79a7" opacity="0"/><rect x="14.0" y="44.0" width="339.0" height="36.0" rx="8" fill="#4e79a7" stroke="#4e79a7" stroke-width="2"/><text x="183.5" y="67.0" text-anchor="middle" font-size="14" font-weight="bold" fill="white">Nội sinh</text><text x="26.0" y="102.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">• Xảy ra trong lòng Trái Đất, do năng lượng bên</text><text x="26.0" y="119.5" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">  trong</text><text x="26.0" y="141.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">• Làm di chuyển các mảng kiến tạo, uốn nếp, đứt</text><text x="26.0" y="158.5" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">  gãy, động đất, núi lửa</text><text x="26.0" y="180.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">• Tạo ra các dạng địa hình lớn: núi, cao nguyên</text><rect x="367.0" y="44.0" width="339.0" height="159.5" rx="8" fill="#fdf1e0" stroke="#f28e2b" stroke-width="2"/><path d="M367.0,44.0 h0.0 v0.0 h-0.0 z" fill="#f28e2b" opacity="0"/><rect x="367.0" y="44.0" width="339.0" height="36.0" rx="8" fill="#f28e2b" stroke="#f28e2b" stroke-width="2"/><text x="536.5" y="67.0" text-anchor="middle" font-size="14" font-weight="bold" fill="white">Ngoại sinh</text><text x="379.0" y="102.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">• Xảy ra trên bề mặt Trái Đất, do năng lượng Mặt</text><text x="379.0" y="119.5" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">  Trời, gió, nước chảy, sinh vật, con người</text><text x="379.0" y="141.0" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">• Phá huỷ, san bằng địa hình: phong hoá, bóc mòn,</text><text x="379.0" y="158.5" text-anchor="start" font-size="12" font-weight="normal" fill="#1d2733">  vận chuyển, bồi tụ</text><text x="360.0" y="227.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a56a0">Hai quá trình xảy ra đồng thời và có tác động trái ngược nhau.</text></svg>